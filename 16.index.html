َكِنَّهُ لَيْسَ إِلَى حَدِّ اللِّوَاطِ بِغَيْرِ امْرَأَتِهِ قَالَ رَسُولُ اللَّهِ ﷺ لا يَنْظُرُ اللَّهُ إلى رَجُلٍ أَتَى امرَأَتَهُ فى دُبُرِهَا، أَىْ لا يُكْرِمُهُ بَلْ يُهِينُهُ يَوْمَ الْقِيَامَةِ. وَاخْتَلَفَ الْعُلَمَاءُ فِى حَدِّ اللَّائِطِ وَالْمَلُوطِ بِهِ فَقِيلَ حَدُّ الْفَاعِلِ حَدُّ الزِّنَى وَأَمَّا الْمَفْعُولُ بِهِ فَحَدُّهُ جَلْدُ مِائَةٍ وَتَغْرِيبُ عَامٍ إِنْ كَانَ حُرًّا وَهَذَا هُوَ الْمُعْتَمَدُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(592) مَا حُكْمُ جِمَاعِ الزَّوْجَةِ فِى حَالِ الْحَيْضِ أَوِ النِّفَاسِ.</p><p class=\"answer\">يَحْرُمُ عَلَى الزَّوْجِ جِمَاعُ زَوْجَتِهِ وَلَوْ بِحَائِلٍ فِى حَالِ الْحَيْضِ أَوِ النِّفَاسِ وَهُوَ مِنَ كَبَائِرِ الذُّنُوبِ وَلا يَجُوزُ جِمَاعُهَا إِلَّا بَعْدَ الْغُسْلِ. وَمَنِ اسْتَحَلَّ جِمَاعَهَا فِى حَالِ الْحَيْضِ كَفَرَ وَالْعِيَاذُ بِاللَّهِ. وَيَجُوزُ الِاسْتِمْتَاعُ بِهَا بِغَيْرِ الْجِمَاعِ لِقَوْلِهِ ﷺ اصْنَعُوا كُلَّ شَىْءٍ إِلَّا النِّكَاحَ (أَىِ الْجِمَاعَ) رَوَاهُ مُسْلِمٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(593) مَا حُكْمُ إِتْيَانِ الْبَهَائِمِ.</p><p class=\"answer\">يَحْرُمُ إِتْيَانُ الْبَهَائِمِ أَىْ جِمَاعُهَا وَهُوَ مِنَ الْكَبَائِرِ لِقَوْلِهِ ﷺ لَعَنَ اللَّهُ مَنْ أَتَى بَهِيمَةً رَوَاهُ التِّرْمِذِىُّ وَقَوْلِهِ تَعَالَى ﴿وَالَّذِينَ هُمْ لِفُرُوجِهِمْ حَافِظُونَ إِلَّا عَلَى أَزْوَاجِهِمْ أَوْ مَا مَلَكَتْ أَيْمَانُهُمْ فَإِنَّهُمْ غَيْرُ مَلُومِينَ فَمَنِ ابْتَغَى وَرَاءَ ذَلِكَ فَأُوْلَئِكَ هُمُ الْعَادُونَ﴾ فَيُفْهَمُ مِنْ قَوْلِهِ تَعَالَى ﴿فَمَنِ ابْتَغَى وَرَاءَ ذَلِكَ فَأُوْلَئِكَ هُمُ الْعَادُونَ﴾ تَحْرِيمُ إِتْيَانِ الْبَهَائِمِ وَسِحَاقِ النِّسَاءِ فِيمَا بَيْنَهُنَّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(594) مَا حُكْمُ الِاسْتِمْنَاءِ.</p><p class=\"answer\">يَحْرُمُ الِاسْتِمْنَاءُ أَىِ اسْتِخْرَاجُ الْمَنِىِّ بِغَيْرِ جِمَاعٍ بِنَحْوِ الْيَدِ وَتَحْرِيمُ ذَلِكَ يُفْهَمُ مِنْ قَوْلِ اللَّهِ تَعَالَى ﴿فَمَنِ ابْتَغَى وَرَاءَ ذَلِكَ فَأُوْلَئِكَ هُمُ الْعَادُونَ﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(595) مَا حُكْمُ مَا يُسَمَّى تَأْجِيرَ الأَرْحَامِ.</p><p class=\"answer\">اعْلَمْ أَنَّ مَا يُسَمَّى تَأْجِيرَ الأَرْحَامِ بِإِدْخَالِ مَنِىِّ رَجُلٍ فِى رَحِمِ امْرَأَةٍ لا تَحِلُّ لَهُ حَرَامٌ بَيِّنٌ لا يَشُكُّ فِيهِ إِلَّا جَاهِلٌ لِمَا فِيهِ مِنْ تَضْيِيعِ الأَنْسَابِ وَكَشْفٍ لِلْفُرُوجِ عِنْدَ الأَطِبَّاءِ لِغَيْرِ ضَرُورَةٍ شَرْعِيَّةٍ وَارْتِكَابِ غَيْرِ ذَلِكَ مِنَ الْمُحَرَّمَاتِ وَلا تَفْعَلُ ذَلِكَ إِلَّا عَاصِيَةٌ جَاهِلَةٌ أَوْ فَاجِرَةٌ كَافِرَةٌ اسْتَحَلَّتْ مَا حَرَّمَ اللَّهُ. أَمَّا الدَّلِيلُ عَلَى تَحْرِيمِ مَا يُسَمَّى تَأْجِيرَ الأَرْحَامِ فَهُوَ قَوْلُهُ تَعَالَى ﴿وَقُلْ لِلْمُؤْمِنَاتِ يَغْضُضْنَ مِنْ أَبْصَارِهِنَّ وَيَحْفَظْنَ فُرُوجَهُنَّ﴾ أَىْ عَمَّا لا يَحِلُّ كَمَا قَالَ الإِمَامُ الْمُفَسِّرُ الْبَغَوِىُّ الشَّافِعِىُّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(596) مَا حُكْمُ اسْتِقْبَالِ الْقِبْلَةِ أَوِ اسْتِدْبَارِهَا بِبَوْلٍ أَوْ غَائِطٍ.</p><p class=\"answer\">يَحْرُمُ اسْتِقْبَالُ الْقِبْلَةِ أَوِ اسْتِدْبَارُهَا بِبَوْلٍ أَوْ غَائِطٍ فِى غَيْرِ الْمَكَانِ الْمُعَدِّ لِقَضَاءِ الْحَاجَةِ مِنْ غَيْرِ حَائِلٍ بَيْنَهُ وَبَيْنَ الْقِبْلَةِ أَوْ بِحَائِلٍ يَبْعُدُ عَنْهُ أَكْثَرَ مِنْ ثَلاثَةِ أَذْرُعٍ أَوْ كَانَ ارْتِفَاعُهُ أَقَلَّ مِنْ ثُلُثَىْ ذِرَاعٍ لِحَدِيثِ الْبُخَارِىِّ وَمُسْلِمٍ لا تَسْتَقْبِلُوا الْقِبْلَةَ وَلا تَسْتَدْبِرُوهَا بِغَائِطٍ وَلا بَوْلٍ وَلَكِنْ شَرِّقُوا أَوْ غَرِّبُوا. أَمَّا فِى بَيْتِ الْخَلاءِ فَيَجُوزُ اسْتِقْبَالُ الْقِبْلَةِ أَوِ اسْتِدْبَارُهَا بِلا كَرَاهَةٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(597) مَا حُكْمُ التَّبَوُّلِ أَوِ التَّغَوُّطِ عَلَى قَبْرِ الْمُسْلِمِ.</p><p class=\"answer\">يَحْرُمُ التَّبَوُّلُ أَوِ التَّغَوُّطُ عَلَى قَبْرِ الْمُسْلِمِ لِقَوْلِهِ ﷺ لَأَنْ يَجْلِسَ أَحَدُكُمْ عَلَى جَمْرَةٍ فَتُحْرِقَ ثِيَابَهُ وَتَخْلُصَ إِلَى جِلْدِهِ خَيْرٌ لَهُ مِنْ أَنْ يَجْلِسَ عَلَى قَبْرٍ رَوَاهُ مُسْلِمٌ. وَالْمُرَادُ بِالْجُلُوسِ عَلَى الْقَبْرِ الْمَنْهِىِّ عَنْهُ الْجُلُوسُ لِلْبَوْلِ أَوِ الْغَائِطِ أَمَّا الْجُلُوسُ عَلَى الْقَبْرِ لِغَيْرِ ذَلِكَ وَكَذَا الدَّوْسُ عَلَيْهِ فَلا يَحْرُمُ إِنْ لَمْ يَكُنْ عَلَيْهِ كَلامٌ مُعَظَّمٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(598) مَا حُكْمُ تَرْكِ الْخِتَانِ لِلْبَالِغِ.</p><p class=\"answer\">يَجِبُ الْخِتَانُ عِنْدَ الشَّافِعِىِّ وَيَحْرُمُ تَرْكُهُ بَعْدَ الْبُلُوغِ وَيُسَنُّ عِنْدَ مَالِكٍ. وَالْخِتَانُ يُسَاعِدُ عَلَى رَفْعِ الْجَنَابَةِ لِأَنَّ الْجِلْدَ إِذَا كَانَ مُغَطِيًّا لِرَأْسِ الذَّكَرِ لا يَصِلُ الْمَاءُ إِلَيْهِ بِسُهُولَةٍ.</p></div>", "wordCount": 569, "paraCount": 19}, {"id": "maasi_rijl", "title": "فصل في معاصي الرجل", "icon": "fa-shoe-prints", "desc": "معاصي الرجل من المشي في المعصية والفرار", "content": "<p>فَصْلٌ فِى مَعَاصِى الرِّجْلِ</p>\n<div class=\"qa-item\"><p class=\"question\">(599) مَا حُكْمُ الْمَشْىِ فِى مَعْصِيَةٍ.</p><p class=\"answer\">يَحْرُمُ الْمَشْىُ فِى مَعْصِيَةٍ كَالْمَشْىِ فِى سِعَايَةٍ بِمُسْلِمٍ أَىْ لِلإِضْرَارِ بِهِ بِغَيْرِ حَقٍّ كَالَّذِى يَتَجَسَّسُ عَلَى النَّاسِ فَيَأْخُذُ الأَخْبَارَ إِلَى الْحَاكِمِ لِيَضُرَّهُمْ قَالَ رَسُولُ اللَّهِ ﷺ وَلا تَذْهَبُوا بِبَرِىءٍ إِلَى ذِى سُلْطَانٍ لِيَقْتُلَهُ رَوَاهُ التِّرْمِذِىُّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(600) مَا حُكْمُ هُرُوبِ الْعَبْدِ وَالزَّوْجَةِ وَمَنْ عَلَيْهِ حَقٌّ يَلْزَمُهُ.</p><p class=\"answer\">هُرُوبُ الْعَبْدِ الْمَمْلُوكِ مِنْ سَيِّدِهِ وَهُرُوبُ الزَّوْجَةِ مِنْ زَوْجِهَا بِغَيْرِ عُذْرٍ شَرْعِىٍّ مِنَ كَبَائِرِ الذُّنُوبِ قَالَ رَسُولُ اللَّهِ ﷺ الْعَبْدُ الآبِقُ لا يَقْبَلُ اللَّهُ مِنْهُ صَلاتَهُ حَتَّى يَرْجِعَ إِلَى مَوَالِيهِ (أَىْ لا يُثَابُ عَلَيْهَا حَتَّى يَرْجِعَ إِلَى سَيِّدِهِ) رَوَاهُ أَبُو دَاوُدَ. وَيَحْرُمُ الْهَرَبُ مِنْ أَدَاءِ الْحَقِّ الْوَاجِبِ كَنَفَقَةِ الزَّوْجَةِ وَالأَوْلادِ الصِّغَارِ وَالْوَالِدَيْنِ الْفَقِيرَيْنِ الْمُسْلِمَيْنِ لِحَدِيثِ أَبِى دَاوُدَ كَفَى بِالْمَرْءِ إِثْمًا أَنْ يُضَيِّعَ مَنْ يَقُوتُ، أَىْ مَنْ تَجِبُ عَلَيْهِ نَفَقَتُهُ وَفِى هَذَا بَيَانٌ أَنَّهُ مِنْ كَبَائِرِ الذُّنُوبِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(601) مَا حُكْمُ التَّبَخْتُرِ فِى الْمَشْىِ.</p><p class=\"answer\">التَّبَخْتُرُ فِى الْمَشْىِ مِنْ كَبَائِرِ الذُّنُوبِ وَهُوَ أَنْ يَمْشِىَ مِشْيَةَ الْفَخْرِ وَالْكِبْرِ قَالَ اللَّهُ تَعَالَى ﴿وَلا تُصَعِّرْ خَدَّكَ لِلنَّاسِ وَلا تَمْشِ فِى الأَرْضِ مَرَحًا﴾ أَىْ لا تُعْرِضْ عَنْهُمْ مُتَكَبِّرًا بَلْ أَقْبِلْ عَلَى النَّاسِ بِوَجْهِكَ مُتَوَاضِعًا وَلا تُوَلِّهِمْ شِقَّ وَجْهِكَ كَمَا يَفْعَلُ الْمُتَكَبِّرُونَ وَلا تَمْشِ مِشْيَةَ الْفَخْرِ وَالْكِبْرِ. وَقَدْ وَرَدَ فِى الْحَدِيثِ الَّذِى رَوَاهُ الْبُخَارِىُّ فِى الأَدَبِ الْمُفْرَدِ أَنَّ الْمُتَكَبِّرِينَ يُحْشَرُونَ يَوْمَ الْقِيَامَةِ كَأَمْثَالِ الذَّرِّ أَىْ بِحَجْمِ النَّمْلِ الأَحْمَرِ الصَّغِيرِ وَصُورَةِ بَنِى ءَادَمَ يَطَؤُهُمُ النَّاسُ بِأَقْدَامِهِمْ إِهَانَةً لَهُمْ وَلا يَمُوتُونَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(602) مَا حُكْمُ تَخَطِّى الرِّقَابِ أَثْنَاءَ خُطْبَةِ الْجُمُعَةِ.</p><p class=\"answer\">يَحْرُمُ تَخَطِّى الرِّقَابِ أَىْ رَفْعُ الرِّجْلِ فَوْقَ أَكْتَافِ الْجَالِسِينَ لِلْمُرُورِ بَيْنَهُمْ عَلَى وَجْهِ الإِيذَاءِ لَهُمْ. أَمَّا التَّخَطِّى مِنْ غَيْرِ إِيذَاءٍ فَمَكْرُوهٌ إِلَّا إِذَا كَانَ التَّخَطِّى لِأَجْلِ سَدِّ فُرْجَةٍ لا يَصِلُهَا بِغَيْرِ تَخَطٍّ وَكَذَلِكَ تَخَطِّى الإِمَامِ إِنْ لَمْ يَجِدْ طَرِيقًا لِلْوُصُولِ إِلَى الْمِنْبَرِ أَوِ الْمِحْرَابِ إِلَّا بِالتَّخَطِّى.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(603) مَا حُكْمُ الْمُرُورِ بَيْنَ يَدَىِ الْمُصَلِّى إِذَا كَمَلَتْ شُرُوطُ السُّتْرَةِ.</p><p class=\"answer\">يَحْرُمُ الْمُرُورُ بَيْنَ يَدَىِ الْمُصَلِّى أَىِ الْمُرُورُ بَيْنَهُ وَبَيْنَ السُّتْرَةِ إِذَا كَانَتْ مُرْتَفِعَةً قَدْرَ ثُلُثَىْ ذِرَاعٍ فَأَكْثَرَ وَقَرِيبَةً مِنْهُ ثَلاثَةَ أَذْرُعٍ فَأَقَلّ وَهُوَ مِنَ الْكَبَائِرِ. وَيَحْرُمُ الْمُرُورُ بَيْنَ صُفُوفِ الْمُصَلِّينَ إِذَا كَانَ مَا بَيْنَ الصَّفَيْنِ ثَلاثَةَ أَذْرُعٍ أَوْ أَقَلَّ. وَتُعَدُّ سَجَّادَةُ الصَّلاةِ سُتْرَةً لِلْمُصَلِّى إِنْ لَمْ يَزِدْ طُولُهَا عَلَى ثَلاثَةِ أَذْرُعٍ وَلا يُعَدُّ الشَّخْصُ الْقَاعِدُ أَمَامَ الْمُصَلِّى سُتْرَةً لَهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(604) مَا حُكْمُ الْوُقُوفِ عَلَى سَجَّادَةِ الصَّلاةِ الَّتِى عَلَيْهَا صُورَةُ الْكَعْبَةِ أَوِ الْمَسْجِدِ النَّبَوِىِّ.</p><p class=\"answer\">يَجُوزُ الْوُقُوفُ عَلَى جِسْمِ الْكَعْبَةِ الْحَقِيقِىِّ وَالْمَسْجِدِ الْحَقِيقِىِّ وَيَجُوزُ الْوُقُوفُ بِالْقَدَمِ النَّظِيفَةِ الطَّاهِرَةِ عَلَى سَجَّادَةٍ عَلَيْهَا صُورَةُ الْكَعْبَةِ أَوِ الْمَسْجِدِ النَّبَوِىِّ إِنْ لَمْ يَكُنْ عَلَيْهَا اسْمٌ مُعَظَّمٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(605) مَا حُكْمُ مَدِّ الرِّجْلِ إِلَى الْمُصْحَفِ.</p><p class=\"answer\">يَحْرُمُ مَدُّ الرِّجْلِ إِلَى الْمُصْحَفِ إِذَا كَانَ قَرِيبًا وَغَيْرَ مُرْتَفِعٍ لِأَنَّ فِى ذَلِكَ إِهَانَةً لَهُ أَمَّا إِذَا كَانَ بَعِيدًا فَلا يَحْرُمُ وَالْمَسَافَةُ الْبَعِيدَةُ نَحْوُ ثَلاثِينَ مِتْرًا. وَإِذَا جَلَسَ مُتَرَبِّعًا وَكَانَ الْمُصْحَفُ بِاتِّجَاهِ رِجْلِهِ قَرِيبًا مِنْهَا فَلَيْسَ حَرَامًا. وَلا يَحْرُمُ مَدُّ الرِّجْلِ إِلَى الْقِبْلَةِ بَلْ هُوَ جَائِزٌ بِالإِجْمَاعِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(606) مَا حُكْمُ الْمَشْىِ إِلَى مَا فِيهِ إِضَاعَةُ وَاجِبٍ.</p><p class=\"answer\">يَحْرُمُ الْمَشْىُ إِلَى مَا فِيهِ إِضَاعَةُ وَاجِبٍ كَأَنْ يَمْشِىَ مَشْيًا يَحْصُلُ بِهِ إِخْرَاجُ الصَّلاةِ عَنْ وَقْتِهَا.</p></div>", "wordCount": 460, "paraCount": 17}, {"id": "maasi_badan", "title": "فصل في معاصي البدن", "icon": "fa-user", "desc": "معاصي البدن من عقوق الوالدين والوشم والتشبه", "content": "<p>فَصْلٌ فِى مَعَاصِى الْبَدَنِ</p>\n<div class=\"qa-item\"><p class=\"question\">(607) تَكَلَّمْ عَنْ عُقُوقِ الْوَالِدَيْنِ.</p><p class=\"answer\">عُقُوقُ الْوَالِدَيْنِ مِنْ كَبَائِرِ الذُّنُوبِ وَهُوَ أَنْ يُؤْذِىَ الْمُسْلِمُ أَحَدَ وَالِدَيْهِ أَوْ كِلَيْهِمَا أَذًى شَدِيدًا. وَمِنْ عُقُوقِ الْوَالِدَيْنِ ضَرْبُهُمَا أَوْ شَتْمُهُمَا أَوْ تَرْكُ الإِنْفَاقِ عَلَيْهِمَا إِنْ كَانَا فَقِيرَيْنِ فَيَجِبُ عَلَى الأَبْنَاءِ الذُّكُورِ وَالإِنَاثِ الإِنْفَاقُ عَلَى الْوَالِدَيْنِ الْمُسْلِمَيْنِ الْمُحْتَاجَيْنِ وَهَذَا مِنْ بِرِّ الْوَالِدَيْنِ. وَيُسَنُّ لِلْوَلَدِ أَنْ يُطِيعَ وَالِدَيْهِ الْمُسْلِمَيْنِ فِى الْمُبَاحِ وَالْمَكْرُوهِ إِلَّا فِى مَعْصِيَةِ اللَّهِ وَيَجِبُ عَلَيْهِ أَنْ يَسْتَغْفِرَ لَهُمَا فِى الْعُمُرِ مَرَّةً وَلَيْسَ شَرْطًا بَعْدَ وَفَاتِهِمَا. وَإِذَا طَلَبَ الأَبُ أَوِ الأُمُّ مِنَ الِابْنِ شَيْئًا مُبَاحًا كَغَسْلِ الصُّحُونِ أَوْ تَرْتِيبِ الْغُرْفَةِ أَوْ تَسْخِينِ الطَّعَامِ أَوْ عَمَلِ الشَّاىِ وَمَا أَشْبَهَ ذَلِكَ وَلَمْ يَفْعَلْ فَإِنْ كَانَ يَغْتَمُّ قَلْبُ الْوَالِدِ أَوِ الْوَالِدَةِ فَعَلَيْهِ مَعْصِيَةٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(608) تَكَلَّمْ عَنِ الْفِرَارِ مِنَ الزَّحْفِ.</p><p class=\"answer\">الْفِرَارُ مِنَ الزَّحْفِ مِنْ كَبَائِرِ الذُّنُوبِ وَهُوَ الْهُرُوبُ مِنْ أَرْضِ الْمَعْرَكَةِ بِغَيْرِ عُذْرٍ فَلا يَجُوزُ لِلْمُسْلِمِ أَنْ يَهْرُبَ مِنْ أَرْضِ الْمَعْرَكَةِ إِذَا كَانَ عَدَدُ الْكُفَّارِ ضِعْفَ عَدَدِ الْمُسْلِمِينَ أَوْ أَقَلَّ إلا لِعُذْرٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(609) مَا حُكْمُ قَطِيعَةِ الرَّحِمِ.</p><p class=\"answer\">قَطِيعَةُ الرَّحِمِ مِنْ كَبَائِرِ الذُّنُوبِ لِقَوْلِهِ ﷺ لا يَدْخُلُ الْجَنَّةَ قَاطِعٌ، أَىْ لا يَدْخُلُها مَعَ الأَوَّلِينَ إِنَّمَا يَدْخُلُهَا بَعْدَ سَبْقِ عَذَابٍ إِنْ لَمْ يَعْفُ اللَّهُ عَنْهُ. وَالأَرْحَامُ هُمْ كَالأُمِّ وَالأَبِ وَالإِخْوَةِ وَالأَخَوَاتِ وَالأَقَارِبِ كَالْجَدَّاتِ وَالأَجْدَادِ وَالْخَالاتِ وَالْعَمَّاتِ وَأَوْلادِهِنَّ وَالأَخْوَالِ وَالأَعْمَامِ وَأَوْلادِهِمْ. وَقَطِيعَةُ الرَّحِمِ تَحْصُلُ بِتَرْكِ زِيَارَتِهِمْ بِلا عُذْرٍ أَوْ تَرْكِ الإِحْسَانِ إِلَيْهِمْ بِالْمَالِ فِى حَالِ الْحَاجَةِ النَّازِلَةِ بِهِمْ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(610) مَا حُكْمُ إِيذَاءِ الْجَارِ.</p><p class=\"answer\">لا يَجُوزُ إِيذَاءُ الْجَارِ بِالضَّرْبِ أَوِ الشَّتْمِ وَنَحْوِ ذَلِكَ بَلْ يَنْبَغِى الإِحْسَانُ إِلَيْهِ وَالصَّبْرُ عَلَى أَذَاهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(611) مَا حُكْمُ خَضْبِ الشَّعَرِ بِالسَّوَادِ.</p><p class=\"answer\">يَحْرُمُ عَلَى الرَّجُلِ وَالْمَرْأَةِ صَبْغُ الشَّعَرِ بِالسَّوَادِ وَأَجَازَهُ بَعْضُ الشَّافِعِيَّةِ لِلْمَرْأَةِ بِإِذْنِ زَوْجِهَا. وَأَمَّا صَبْغُ الشَّعَرِ بِالأَصْفَرِ وَالأَحْمَرِ فَهُوَ جَائِزٌ لِلرَّجُلِ وَفِيهِ ثَوَابٌ وَكَذَلِكَ لِلْمَرْأَةِ الْمُتَزَوِّجَةِ إِذَا أَمَرَهَا زَوْجُهَا بِذَلِكَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(612) مَا حُكْمُ تَشَبُّهِ الرِّجَالِ بِالنِّسَاءِ وَالنِّسَاءِ بِالرِّجَالِ.</p><p class=\"answer\">يَحْرُمُ تَشَبُّهُ الرِّجَالِ بِالنِّسَاءِ وَالنِّسَاءِ بِالرِّجَالِ فِى الْمَلْبَسِ وَالْكَلامِ وَالْمَشْىِ وَهُوَ مِنَ الْكَبَائِرِ لِحَدِيثِ الْبُخَارِىِّ لَعَنَ رَسُولُ اللَّهِ ﷺ الْمُتَشَبِّهِينَ مِنَ الرِّجَالِ بِالنِّسَاءِ وَالْمُتَشَبِّهَاتِ مِنَ النِّسَاءِ بِالرِّجَالِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(613) مَا حُكْمُ التَّشَبُّهِ بِالْكُفَّارِ.</p><p class=\"answer\">يَحْرُمُ التَّشَبُّهُ بِالْكُفَّارِ فِى الزِّينَةِ وَاللِّبَاسِ وَنَحْوِ ذَلِكَ كَوَضْعِ الْحَلَقِ فِى السُّرَّةِ وَاللِّسَانِ وَثَقْبِ الأَنْفِ لِوَضْعِ الْحَلَقِ وَأَكْثَرِ مِنْ ثَقْبٍ فِى الأُذُنِ وَهُوَ مِنَ الْكَبَائِرِ لِقَوْلِهِ ﷺ مَنْ تَشَبَّهَ بِقَوْمٍ فَهُوَ مِنْهُمْ (أَىْ كَأَنَّهُ مِنْهُمْ) رَوَاهُ أَبُو دَاوُدَ وَابْنُ مَاجَهْ. فَإِذَا عَمِلَ الْكُفَّارُ زِيًّا مِنَ الثِّيَابِ وَشَاعَ بَيْنَهُمْ فَيَحْرُمُ عَلَى الْمُسْلِمِينَ لُبْسُهُ أَمَّا مَا عَمِلَهُ الْكُفَّارُ وَشَاعَ بَيْنَهُمْ وَبَيْنَ الْمُسْلِمِينَ ابْتِدَاءً فَلا يَحْرُمُ عَلَى الْمُسْلِمِينَ لُبْسُهُ. وَلا يَجُوزُ الِاحْتِفَالُ بِأَعْيَادِ الْكُفَّارِ أَوْ تَعْظِيمُهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(614) مَا حُكْمُ تَرْقِيقِ الْحَاجِبَيْنِ.</p><p class=\"answer\">تَرْقِيقُ الْحَاجِبَيْنِ بِإِذْنِ الزَّوْجِ جَائِزٌ أَمَّا نَتْفُ الشَّعَرِ الَّذِى بَيْنَ الْحَاجِبَيْنِ فَحَرَامٌ فَمَنْ كَانَ حَاجِبَاهَا مُتَّصِلَيْنِ لا يَجُوزُ لَهَا فَتْحُهُمَا بِالنَّتْفِ. وَيَحْرُمُ نَتْفُ شَعَرِ الْحَاجِبِ كُلِّهِ ثُمَّ رَسْمُهُ بِنَوْعٍ مِنَ الأَلْوَانِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(615) مَا حُكْمُ اسْتِعْمَالِ الْحِنَّاءِ لِلْمَرْأَةِ فِى الْيَدَيْنِ.</p><p class=\"answer\">يُسَنُّ لِلْمَرْأَةِ اسْتِعْمَالُ الْحِنَّاءِ فِى الْيَدَيْنِ لِلإِحْرَامِ بِلا نَقْشٍ وَلا تَطْرِيفٍ وَيُسَنُّ لِغَيْرِ الْمُحْرِمَةِ إِنْ كَانَتْ مُتَزَوِّجَةً وَإِلَّا كُرِهَ. أَمَّا النَّقْشُ وَالتَّطْرِيفُ فَمَكْرُوهٌ. وَالنَّقْشُ بِالْحِنَّاءِ هُوَ التَّنْقِيطُ بِدُونِ غَرْزِ الْجِلْدِ بِالإِبْرَةِ بِخِلافِ الْوَشْمِ أَمَّا التَّطْرِيفُ فَهُوَ وَضْعُ الْحِنَّاءِ عَلَى أَطْرَافِ الأَصَابِعِ فَقَطْ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(616) مَا حُكْمُ إِحْدَادِ الْمَرْأَةِ عَلَى زَوْجِهَا الْمُتَوَفَّى.</p><p class=\"answer\">يَجِبُ عَلَى الْمَرْأَةِ الإِحْدَادُ عَلَى زَوْجِهَا الْمُتَوَفَّى وَمَعْنَى الإِحْدَادِ تَرْكُ الزِّينَةِ وَالطِّيبِ وَتَرْكُ الْخُرُوجِ بِلا حَاجَةٍ إِلَى انْتِهَاءِ الْعِدَّةِ وَهِىَ أَرْبَعَةُ أَشْهُرٍ وَعَشَرَةُ أَيَّامٍ لِغَيْرِ الْحَامِلِ أَمَّا الْحَامِلُ فَعِدَّتُهَا تَنْتَهِى بِوَضْعِ الْحَمْلِ. وَلا يَخْتَصُّ الإِحْدَادُ بِلَوْنٍ وَاحِدٍ مِنَ الثِّيَابِ بَلْ يَجُوزُ غَيْرُ الأَسْوَدِ كَالأَبْيَضِ وَالأَصْفَرِ إِنْ لَمْ تَكُنْ ثِيَابَ زِينَةٍ وَيَحْرُمُ مِنَ الأَسْوَدِ مَا كَانَ ثِيَابَ زِينَةٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(617) هَلْ يَجُوزُ لِلْمَرْأَةِ الْمُتَوَفَّى عَنْهَا زَوْجُهَا أَنْ تُكَلِّمَ الرِّجَالَ الأَجَانِبَ أَىْ غَيْرَ الْمَحَارِمِ وَأَنْ تَجْلِسَ فِى شُرْفَةِ الْبَيْتِ.</p><p class=\"answer\">يَجُوزُ لِلْمَرْأَةِ الْمُتَوَفَّى عَنْهَا زَوْجُهَا أَنْ تُكَلِّمَ الأَجَانِبَ وَتَكْشِفَ وَجْهَهَا أَمَامَهُمْ وَتَجْلِسَ فِى شُرْفَةِ الْبَيْتِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(618) مَا حُكْمُ الإِحْدَادِ عَلَى غَيْرِ الزَّوْجِ.</p><p class=\"answer\">لا يَجُوزُ الإِحْدَادُ عَلَى غَيْرِ الزَّوْجِ فَوْقَ ثَلاثَةِ أَيَّامٍ. ثَلاثَةُ أَيَّامٍ رُخْصَةٌ وَمَا زَادَ ذَنْبٌ قَالَ رَسُولُ اللَّهِ ﷺ لا تُحِدُّ امْرَأَةٌ عَلَى مَيِّتٍ فَوْقَ ثَلاثٍ إِلَّا عَلَى زَوْجٍ أَرْبَعَةَ أَشْهُرٍ وَعَشْرًا رَوَاهُ مُسْلِمٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(619) مَا حُكْمُ تَرْكِ الزَّوْجَةِ الْمُتَوَفَّى عَنْهَا زَوْجُهَا الْمَبِيتَ فِى بَيْتِهَا.</p><p class=\"answer\">يَحْرُمُ عَلَى الزَّوْجَةِ الْمُتَوَفَّى عَنْهَا زَوْجُهَا أَنْ تَبِيتَ خَارِجَ بَيْتِهَا أَثْنَاءَ الْعِدَّةِ وَيَجُوزُ لَهَا الْخُرُوجُ لِحَاجَةٍ كَشِرَاءِ طَعَامٍ إِنْ لَمْ تَجِدْ مَنْ يَقْضِى لَهَا حَاجَتَهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(620) مَا حُكْمُ إِسْبَالِ الثَّوْبِ لِلرَّجُلِ.</p><p class=\"answer\">يَحْرُمُ عَلَى الرَّجُلِ إِسْبَالُ ثَوْبِهِ أَىْ إِنْزَالُهُ إِلَى مَا تَحْتَ الْكَعْبَيْنِ لِلْفَخْرِ وَالْكِبْرِ وَهُوَ مِنْ كَبَائِرِ الذُّنُوبِ لِحَدِيثِ الْبُخَارِىِّ وَمُسْلِمٍ لا يَنْظُرُ اللَّهُ إِلَى مَنْ جَرَّ ثَوْبَهُ خُيَلاء، أَىْ لا يُكْرِمُهُ بَلْ يُهِينُهُ يَوْمَ الْقِيَامَةِ وَلَيْسَ الْمُرَادُ النَّظَرَ بِالْجَارِحَةِ لِأَنَّ الرُّؤْيَةَ بِالْجَارِحَةِ مِنْ صِفَاتِ الْخَلْقِ. أَمَّا إِنْزَالُ الثَّوْبِ إِلَى مَا تَحْتَ الْكَعْبَيْنِ لِغَيْرِ الْفَخْرِ وَالْكِبْرِ فَمَكْرُوهٌ لِلرِّجَالِ وَالسُّنَّةُ أَنْ يَكُونَ إِلَى نِصْفِ السَّاقَيْنِ لِقَوْلِهِ ﷺ إِزْرَةُ الْمُؤْمِنِ إِلَى أَنْصَافِ سَاقَيْهِ رَوَاهُ أَبُو دَاوُدَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(621) مَا حُكْمُ اسْتِعْمَالِ الْحِنَّاءِ لِلرَّجُلِ.</p><p class=\"answer\">يَحْرُمُ عَلَى الرَّجُلِ اسْتِعْمَالُ الْحِنَّاءِ فِى الْيَدَيْنِ وَالرِّجْلَيْنِ بِلا حَاجَةٍ لِمَا فِيهِ مِنَ التَّشَبُّهِ بِالنِّسَاءِ أَمَّا إِنْ كَانَ لِحَاجَةٍ كَأَنْ فَعَلَ ذَلِكَ لِلتَّدَاوِى اعْتِمَادًا عَلَى قَوْلِ طَبِيبٍ ثِقَةٍ فَيَجُوزُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(622) مَا حُكْمُ لُبْسِ الذَّهَبِ وَالْفِضَّةِ وَالْحَرِيرِ لِلرَّجُلِ.</p><p class=\"answer\">يَحْرُمُ عَلَى الرَّجُلِ لُبْسُ الْفِضَّةِ غَيْرِ الْخَاتَمِ مِنْهَا وَالذَّهَبِ مُطْلَقًا وَلُبْسُ الْحَرِيرِ الْخَالِصِ أَوْ مَا أَكْثَرُهُ وَزْنًا مِنْهُ قَالَ رَسُولُ اللَّهِ ﷺ أُحِلَّ الذَّهَبُ وَالْحَرِيرُ لِإِنَاثِ أُمَّتِى وَحُرِّمَ عَلَى ذُكُورِهَا رَوَاهُ التِّرْمِذِىُّ. وَيَجُوزُ إِلْبَاسُ الذَّهَبِ وَالْفِضَّةِ لِلصَّبِىِّ ذَكَرَ ذَلِكَ النَّوَوِىُّ فِى الْمَجْمُوعِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(623) مَا حُكْمُ قَطْعِ الْفَرْضِ أَوِ النَّفْلِ مِنْ صَلاةٍ أَوْ صَوْمٍ.</p><p class=\"answer\">يَحْرُمُ قَطْعُ الْفَرْضِ مِنْ صَلاةٍ أَوْ صَوْمٍ أَوْ حَجٍّ بِلا عُذْرٍ. وَيَجُوزُ قَطْعُ النَّفْلِ مِنْ صَلاةٍ أَوْ صَوْمٍ قَالَ رَسُولُ اللَّهِ ﷺ الصَّائِمُ الْمُتَطَوِّعُ أَمِيرُ نَفْسِهِ إِنْ شَاءَ صَامَ وَإِنْ شَاءَ أَفْطَرَ رَوَاهُ الْبَيْهَقِىُّ. أَمَّا نَفْلُ الْحَجِّ وَالْعُمْرَةِ فَيَحْرُمُ قَطْعُهُ لِأَنَّهُ بِالشُّرُوعِ فِيهِ يَصِيرُ إِتْمَامُهُ وَاجِبًا وَقَطْعُهُ مِنَ الْكَبَائِرِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(624) مَا حُكْمُ مُحَاكَاةِ الْمُؤْمِنِ اسْتِهْزَاءً بِهِ.</p><p class=\"answer\">يَحْرُمُ مُحَاكَاةُ الْمُؤْمِنِ أَىْ تَقْلِيدُهُ فِى قَوْلٍ أَوْ فِعْلٍ عَلَى وَجْهِ الِاسْتِهْزَاءِ بِهِ وَهُوَ مِنْ كَبَائِرِ الذُّنُوبِ قَالَ اللَّهُ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا لا يَسْخَرْ قَوْمٌ مِنْ قَوْمٍ﴾. وَقَدْ تَكُونُ الْمُحَاكَاةُ بِالضَّحِكِ عَلَى كَلامِهِ إِذَا تَخَبَّطَ فِيهِ وَغَلِطَ أَوْ عَلَى صَنْعَتِهِ أَوْ قُبْحِ صُورَتِهِ أَوْ عَلَى مَشْيِهِ إِنْ كَانَ بِهِ عَرَجٌ فَتَقْلِيدُهُ فِى ذَلِكَ لِإِضْحَاكِ النَّاسِ عَلَيْهِ حَرَامٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(625) مَا حُكْمُ تَتَبُّعِ عَوْرَاتِ الْمُسْلِمِينَ.</p><p class=\"answer\">يَحْرُمُ التَّجَسُّسُ عَلَى عَوْرَاتِ الْمُسْلِمِينَ أَىِ الْبَحْثُ عَنْ عُيُوبِهِمْ وَمَسَاوِئِهِمْ قَالَ تَعَالَى ﴿وَلا تَجَسَّسُوا﴾ أَىْ لا يَبْحَثْ أَحَدُكُمْ عَنْ عَيْبِ أَخِيهِ لِيَطَّلِعَ عَلَيْهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(626) مَا حُكْمُ الْوَشْمِ.</p><p class=\"answer\">الْوَشْمُ حَرَامٌ مِنَ الْكَبَائِرِ لِحَدِيثِ الْبُخَارِىِّ وَمُسْلِمٍ لَعَنَ رَسُولُ اللَّهِ ﷺ الْوَاشِمَةَ وَالْمُسْتَوْشِمَةَ. وَالْوَشْمُ هُوَ غَرْزُ الْجِلْدِ بِالإِبْرَةِ حَتَّى يَخْرُجَ الدَّمُ ثُمَّ يُذَرُّ عَلَيْهِ الْكُحْلُ الأَسْوَدُ أَوْ شَىْءٌ أَخْضَرُ فَيَخْتَلِطُ بِالدَّمِ وَيَبْقَى لَوْنُهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(627) مَا حُكْمُ هَجْرِ الْمُسْلِمِ.</p><p class=\"answer\">مَنْ هَجَرَ أَخَاهُ الْمُسْلِمَ أَىْ تَرَكَ تَكْلِيمَهُ بِغَيْرِ عُذْرٍ شَرْعِىٍّ إِلَى ثَلاثَةِ أَيَّامٍ لا يُكْتَبُ عَلَيْهِ ذَنْبٌ أَمَّا بَعْدَ ثَلاثَةِ أَيَّامٍ فَيُكْتَبُ عَلَيْهِ قَالَ رَسُولُ اللَّهِ ﷺ لا يَحِلُّ لِمُسْلِمٍ أَنْ يَهْجُرَ أَخَاهُ فَوْقَ ثَلاثِ لَيَالٍ يَلْتَقِيَانِ فَيُعْرِضُ هَذَا وَيُعْرِضُ هَذَا وَخَيْرُهُمَا الَّذِى يَبْدَأُ بِالسَّلامِ رَوَاهُ مُسْلِمٌ. أَمَّا هَجْرُهُ لِعُذْرٍ شَرْعِىٍّ كَأَنْ كَانَ شَارِبَ خَمْرٍ أَوْ تَارِكًا لِلصَّلاةِ فَيَجُوزُ إِلَى أَنْ يَتُوبَ بَعْدَ إِعْلامِهِ بِسَبَبِ الْهَجْرِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(628) مَا حُكْمُ مُجَالَسَةِ الْمُبْتَدِعِ أَوِ الْفَاسِقِ لِلإِينَاسِ لَهُ عَلَى فِسْقِهِ.</p><p class=\"answer\">يَحْرُمُ مُجَالَسَةُ الْمُبْتَدِعِ أَوِ الْفَاسِقِ لِلإِينَاسِ لَهُ عَلَى فِعْلِهِ الْمُنْكَرَ. وَالْمُرَادُ بِالْمُبْتَدِعِ الْمُبْتَدِعُ فِى الِاعْتِقَادِ وَهُوَ إِمَّا كَافِرٌ كَالْمُشَبِّهِ وَإِمَّا مُسْلِمٌ عَاصٍ كَالَّذِى يَعْتَقِدُ أَنَّ أَبَا بَكْرٍ وَعُمَرَ وَعُثْمَانَ ظَلَمُوا عَلِيًّا بِالتَّقَدُّمِ فِى الْخِلافَةِ وَأَمَّا الْفَاسِقُ فَهُوَ مُرْتَكِبُ الْكَبِيرَةِ كَشَارِبِ الْخَمْرِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(629) مَا حُكْمُ خَلْوَةِ الرَّجُلِ بِالْمَرْأَةِ الأَجْنَبِيَّةِ.</p><p class=\"answer\">مِنَ الأَحْكَامِ الَّتِى قَرَّرَهَا رَسُولُ اللَّهِ ﷺ تَحْرِيمُ خَلْوَةِ الرَّجُلِ بِالْمَرْأَةِ الأَجْنَبِيَّةِ أَىْ غَيْرِ زَوْجَتِهِ وَأَمَتِهِ وَمَحْرَمِهِ بِحَيْثُ لا يَرَاهُمَا مُسْلِمٌ بَصِيرٌ ثِقَةٌ أَوْ مَحْرَمٌ مُمَيِّزٌ يُسْتَحَى مِنْهُ كَابْنِ تِسْعِ سِنِينَ لِقَوْلِهِ ﷺ لا يَدْخُلَنَّ أَحَدُكُمْ عَلَى مُغِيبَةٍ إِلَّا وَمَعَهُ رَجُلٌ أَوْ رَجُلانِ، وَالْمُغِيبَةُ هِىَ الْمَرْأَةُ الَّتِى زَوْجُهَا غَائِبٌ. وَلا يَجُوزُ لِلْمَرْأَةِ أَنْ تَخْتَلِىَ بِالأَجْنَبِىِّ الْمُرَاهِقِ وَهُوَ فِى عُرْفِ الشَّرْعِ مَنْ قَارَبَ الْبُلُوغَ كَابْنِ أَرْبَعَ عَشْرَةَ سَنَةً وَيَجُوزُ لَهَا أَنْ تَخْتَلِىَ بِالصَّبِىِّ الْمُمَيِّزِ غَيْرِ الْمُرَاهِقِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(630) مَا حُكْمُ سَفَرِ الْمَرْأَةِ بِغَيْرِ مَحْرَمٍ.</p><p class=\"answer\">يَحْرُمُ سَفَرُ الْمَرْأَةِ بِغَيْرِ مَحْرَمٍ كَأَخٍ أَوْ نَحْوِ مَحْرَمٍ كَزَوْجٍ وَلَوْ سَفَرًا قَصِيرًا كَنَحْوِ عِشْرِينَ كِيلُو مِتْرًا لِغَيْرِ ضَرُورَةٍ. وَأَمَّا إِذَا كَانَ سَفَرُهَا لِضَرُورَةٍ فَيَجُوزُ كَأَنْ كَانَتْ مُهَاجِرَةً مِنْ دَارِ الْكُفْرِ إِلَى دَارِ الإِسْلامِ أَوْ كَانَ سَفَرُهَا لِحَجِّ الْفَرْضِ أَوْ عُمْرَةِ الْفَرْضِ. وَأَجَازَ الإِمَامُ أَبُو حَنِيفَةَ رَحِمَهُ اللَّهُ أَنْ تُسَافِرَ الْمَرْأَةُ مَسِيرَةَ أَقَلَّ مِنْ يَوْمٍ بِدُونِ مَحْرَمٍ وَأَجَازَ الإِمَامُ أَحْمَدُ سَفَرَ الْمَرْأَةِ بِدُونِ مَحْرَمٍ إِذَا كَانَ سَفَرُهَا مَعَ جَمْعٍ مِنَ النِّسْوَةِ الثِّقَاتِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(631) مَا حُكْمُ خُرُوجِ الْمَرْأَةِ مِنْ بَيْتِهَا بِقَصْدِ التَّعَرُّضِ لِلرِّجَالِ.</p><p class=\"answer\">إِذَا خَرَجَتْ بِقَصْدِ التَّعَرُّضِ لِلرِّجَالِ أَىِ اسْتِمَالَتِهِمْ لِلْمَعْصِيَةِ عَصَتِ اللَّهَ تَعَالَى وَلَوْ كَانَتْ سَاتِرَةً لِلْعَوْرَةِ. أَمَّا إِذَا خَرَجَتْ مُتَعَطِّرَةً أَوْ مُتَزَيِّنَةً وَكَانَتْ سَاتِرَةً لِلْعَوْرَةِ وَلَمْ يَكُنْ قَصْدُهَا فِتْنَةَ الرِّجَالِ فَمَكْرُوهٌ فَقَطْ وَلَيْسَ حَرَامًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(632) مَا حُكْمُ اسْتِخْدَامِ الْحُرِّ كُرْهًا.</p><p class=\"answer\">يَحْرُمُ اسْتِخْدَامُ الْحُرِّ كُرْهًا أَىْ لا يَجُوزُ قَهْرُهُ عَلَى عَمَلٍ لا يَرْضَاهُ كَالْعَمَلِ فِى الْبِنَاءِ أَوْ حِرَاثَةِ الأَرْضِ. أَمَّا الْعَبْدُ الْمَمْلُوكُ فَيَجُوزُ لِسَيِّدِهِ أَنْ يَقْهَرَهُ عَلَى الْعَمَلِ الَّذِى يُطِيقُهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(633) مَا حُكْمُ مُعَادَاةِ الْوَلِىِّ.</p><p class=\"answer\">يَحْرُمُ مُعَادَاةُ الْوَلِىِّ أَىِ اتِّخَاذُهُ عَدُوًّا وَمُحَارَبَتُهُ كَأَبِى بَكْرٍ وَعُمَرَ وَعُثْمَانَ وَعَلِىٍّ قَالَ اللَّهُ تَعَالَى فِى الْحَدِيثِ الْقُدْسِىِّ مَنْ عَادَى لِى وَلِيًّا فَقَدْ ءَاذَنْتُهُ بِالْحَرْبِ رَوَاهُ الْبُخَارِىُّ، مَعْنَاهُ مَنْ عَادَى الْوَلِىَّ فَقَدْ أَعْلَمَهُ اللَّهُ أَنَّهُ مُحَارِبُهُ وَمَنْ كَانَ اللَّهُ مُحَارِبَهُ هَلَكَ. وَالْوَلِىُّ هُوَ مَنْ أَدَّى جَمِيعَ الْوَاجِبَاتِ وَاجْتَنَبَ جَمِيعَ الْمُحَرَّمَاتِ وَأَكْثَرَ مِنَ نَوَافِلِ الطَّاعَاتِ.</p></div>", "wordCount": 1420, "paraCount": 55}];

</script>
  <script>
    // ===== State =====
    const STORE_KEY = 'maqasid_prefs';
    let prefs = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    let currentSection = null;
    let favorites = prefs.favorites || [];
    let fontSize = prefs.fontSize || 18;
    let fontFamily = prefs.fontFamily || 'Cairo';
    let theme = prefs.theme || 'light';
    let lastSection = prefs.lastSection || null;
    let lastScroll = prefs.lastScroll || 0;

    // ===== Init =====
    function savePrefs() {
      prefs = { favorites, fontSize, fontFamily, theme, lastSection, lastScroll };
      localStorage.setItem(STORE_KEY, JSON.stringify(prefs));
    }

    function applyTheme() {
      document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
      document.getElementById('themeToggle').classList.toggle('on', theme === 'dark');
    }

    function applyFont() {
      document.documentElement.style.setProperty('--font', fontFamily + ', sans-serif');
      document.documentElement.style.setProperty('--font-size', fontSize + 'px');
      document.getElementById('fontSizeLabel').textContent = fontSize;
      document.getElementById('fontSizeRange').value = fontSize;
      document.getElementById('fontSelect').value = fontFamily;
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    // ===== Navigation =====
    function showPage(name) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + name).classList.add('active');
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.page === name);
      });
      window.scrollTo(0, 0);
      if (name === 'favorites') renderFavorites();
      if (name === 'home') renderCards();
    }

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => showPage(btn.dataset.page));
    });

    // ===== Cards =====
    function renderCards() {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = SECTIONS.map(s => {
        const isFav = favorites.includes(s.id);
        return `<div class="card" data-id="${s.id}">
          ${isFav ? '<i class="fas fa-star fav-badge"></i>' : ''}
          <div class="card-icon"><i class="fas ${s.icon}"></i></div>
          <h3>${s.title}</h3>
          <p class="desc">${s.desc}</p>
          <div class="meta"><i class="fas fa-paragraph"></i> ${s.paraCount} فقرة · ${s.wordCount} كلمة</div>
        </div>`;
      }).join('');
      grid.querySelectorAll('.card').forEach(c => {
        c.addEventListener('click', () => openSection(c.dataset.id));
      });
    }

    // ===== Open Section =====
    function openSection(id) {
      const s = SECTIONS.find(x => x.id === id);
      if (!s) return;
      currentSection = s;
      lastSection = id;
      savePrefs();
      document.getElementById('secTitle').textContent = s.title;
      document.getElementById('secWords').textContent = s.wordCount.toLocaleString('ar-EG');
      document.getElementById('secTime').textContent = Math.max(1, Math.ceil(s.wordCount / 200));
      document.getElementById('secContent').innerHTML = s.content;
      updateFavBtn();
      showPage('section');
      // restore scroll if same section
      setTimeout(() => {
        if (prefs.lastSection === id && prefs.lastScroll) {
          window.scrollTo(0, prefs.lastScroll);
        }
      }, 50);
    }

    function updateFavBtn() {
      const btn = document.getElementById('btnFav');
      const isFav = favorites.includes(currentSection.id);
      btn.innerHTML = isFav
        ? '<i class="fas fa-star"></i> إزالة من المفضلة'
        : '<i class="far fa-star"></i> إضافة للمفضلة';
      btn.classList.toggle('active', isFav);
    }

    // ===== Tools =====
    document.getElementById('btnCopy').addEventListener('click', () => {
      const text = document.getElementById('secContent').innerText;
      navigator.clipboard.writeText(text).then(() => toast('تم نسخ المحتوى'));
    });

    document.getElementById('btnShare').addEventListener('click', () => {
      const title = currentSection.title;
      const text = document.getElementById('secContent').innerText.slice(0, 200) + '...';
      if (navigator.share) {
        navigator.share({ title, text }).catch(() => {});
      } else {
        navigator.clipboard.writeText(title + '\n\n' + text).then(() => toast('تم نسخ النص للمشاركة'));
      }
    });

    document.getElementById('btnFav').addEventListener('click', () => {
      const id = currentSection.id;
      if (favorites.includes(id)) {
        favorites = favorites.filter(f => f !== id);
        toast('تمت الإزالة من المفضلة');
      } else {
        favorites.push(id);
        toast('تمت الإضافة إلى المفضلة');
      }
      savePrefs();
      updateFavBtn();
    });

    document.getElementById('btnFontUp').addEventListener('click', () => {
      fontSize = Math.min(28, fontSize + 1);
      applyFont(); savePrefs();
    });
    document.getElementById('btnFontDown').addEventListener('click', () => {
      fontSize = Math.max(14, fontSize - 1);
      applyFont(); savePrefs();
    });
    document.getElementById('btnBackHome').addEventListener('click', () => showPage('home'));

    // ===== Favorites page =====
    function renderFavorites() {
      const el = document.getElementById('favList');
      if (!favorites.length) {
        el.innerHTML = '<div class="empty-state"><i class="far fa-star"></i><p>لا توجد أقسام في المفضلة بعد</p></div>';
        return;
      }
      el.innerHTML = '<div class="cards-grid" style="padding:0">' + favorites.map(id => {
        const s = SECTIONS.find(x => x.id === id);
        if (!s) return '';
        return `<div class="card" data-id="${s.id}">
          <div class="card-icon"><i class="fas ${s.icon}"></i></div>
          <h3>${s.title}</h3>
          <p class="desc">${s.desc}</p>
          <div class="meta">${s.paraCount} فقرة</div>
        </div>`;
      }).join('') + '</div>';
      el.querySelectorAll('.card').forEach(c => {
        c.addEventListener('click', () => openSection(c.dataset.id));
      });
    }

    // ===== Settings =====
    document.getElementById('themeToggle').addEventListener('click', () => {
      theme = theme === 'dark' ? 'light' : 'dark';
      applyTheme(); savePrefs();
    });
    document.getElementById('fontSelect').addEventListener('change', e => {
      fontFamily = e.target.value;
      applyFont(); savePrefs();
    });
    document.getElementById('fontSizeRange').addEventListener('input', e => {
      fontSize = +e.target.value;
      applyFont(); savePrefs();
    });
    document.getElementById('btnReset').addEventListener('click', () => {
      if (confirm('هل تريد إعادة ضبط جميع الإعدادات؟')) {
        favorites = []; fontSize = 18; fontFamily = 'Cairo'; theme = 'light';
        lastSection = null; lastScroll = 0;
        savePrefs(); applyTheme(); applyFont();
        toast('تم إعادة الضبط');
        showPage('home');
      }
    });

    // ===== Search =====
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      if (q.length < 2) { searchResults.classList.remove('show'); return; }
      const results = [];
      SECTIONS.forEach(s => {
        if (s.title.includes(q) || s.desc.includes(q)) {
          results.push({ id: s.id, title: s.title, snip: s.desc });
        } else {
          const plain = s.content.replace(/<[^>]+>/g, ' ');
          const idx = plain.toLowerCase().indexOf(q);
          if (idx !== -1) {
            const snip = plain.slice(Math.max(0, idx - 30), idx + 60).trim();
            results.push({ id: s.id, title: s.title, snip: '...' + snip + '...' });
          }
        }
      });
      if (!results.length) {
        searchResults.innerHTML = '<div class="search-item">لا توجد نتائج</div>';
      } else {
        searchResults.innerHTML = results.slice(0, 12).map(r =>
          `<div class="search-item" data-id="${r.id}">
            <div class="s-title">${r.title}</div>
            <div class="s-snip">${r.snip}</div>
          </div>`
        ).join('');
        searchResults.querySelectorAll('.search-item[data-id]').forEach(item => {
          item.addEventListener('click', () => {
            searchResults.classList.remove('show');
            searchInput.value = '';
            openSection(item.dataset.id);
          });
        });
      }
      searchResults.classList.add('show');
    });
    document.addEventListener('click', e => {
      if (!e.target.closest('.search-bar')) searchResults.classList.remove('show');
    });

    // ===== Progress & Back-to-top =====
    window.addEventListener('scroll', () => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      const pct = h > 0 ? (window.scrollY / h) * 100 : 0;
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('backTop').classList.toggle('show', window.scrollY > 400);
      if (currentSection && document.getElementById('page-section').classList.contains('active')) {
        lastScroll = window.scrollY;
        savePrefs();
      }
    });
    document.getElementById('backTop').addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ===== Boot =====
    applyTheme();
    applyFont();
    renderCards();
    // optional: reopen last section
    // if (lastSection) openSection(lastSection);
  </script>
</body>
</html>
