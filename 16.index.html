ةً عِنْدَ اللَّهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(161) مَا حُكْمُ مَنْ صَحَّحَ دِينًا غَيْرَ الإِسْلامِ أَوْ قَالَ أَنَا أَحْتَرِمُ كُلَّ الأَدْيَانِ.</p><p class=\"answer\">مَنْ صَحَّحَ دِينًا غَيْرَ دِينِ الإِسْلامِ أَوْ قَالَ أَنَا أَحْتَرِمُ كُلَّ الأَدْيَانِ الإِسْلامَ وَغَيْرَهُ كَفَرَ وَالْعِيَاذُ بِاللَّهِ. (162) مَا حُكْمُ مَنِ اعْتَقَدَ أَنَّ نَبِيًّا مِنَ الأَنْبِيَاءِ دَعَا إِلَى غَيْرِ الإِسْلامِ أَوْ عَلَّمَ دِينًا غَيْرَ الإِسْلامِ.</p></div>\n<p>مَنِ اعْتَقَدَ أَنَّ نَبِيًّا مِنَ الأَنْبِيَاءِ دَعَا إِلَى غَيْرِ الإِسْلامِ أَوْ عَلَّمَ دِينًا غَيْرَ الإِسْلامِ فَهُوَ كَافِرٌ.</p>\n<div class=\"qa-item\"><p class=\"question\">(163) مَا حُكْمُ مَنْ شَكَّ فِى كُفْرِ مَنْ دَانَ بِغَيْرِ دِينِ الإِسْلامِ أَوْ تَوَقَّفَ فِى تَكْفِيرِهِ.</p><p class=\"answer\">مَنْ شَكَّ فِى كُفْرِ مَنْ دَانَ بِغَيْرِ دِينِ الإِسْلامِ كَأَنْ قَالَ لَعَلَّهُ كَافِرٌ وَلَعَلَّهُ غَيْرُ كَافِرٍ كَفَرَ وَكَذَا مَنْ تَوَقَّفَ فِى تَكْفِيرِهِ كَأَنْ قَالَ أَنَا لا أَقُولُ إِنَّهُ كَافِرٌ وَلا أَقُولُ إِنَّهُ غَيْرُ كَافِرٍ لِتَكْذِيبِهِ قَوْلَ اللَّهِ تَعَالَى ﴿وَمَنْ يَبْتَغِ غَيْرَ الإِسْلامِ دِينًا فَلَنْ يُقْبَلَ مِنْهُ وَهُوَ فِى الآخِرَةِ مِنَ الْخَاسِرِينَ﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(164) مَا هِىَ عَقِيدَةُ الْحُلُولِ وَالْوَحْدَةِ الْمُطْلَقَةِ.</p><p class=\"answer\">اعْلَمْ أَنَّ أَشَدَّ الْكُفْرِ عَلَى الإِطْلاقِ هُوَ نَفْىُ وُجُودِ اللَّهِ وَقَوْلُ أَهْلِ الْوَحْدَةِ الْمُطْلَقَةِ إِنَّ اللَّهَ هُوَ الْعَالَمُ وَإِنَّ أَفْرَادَ الْعَالَمِ أَجْزَاءٌ مِنْهُ تَعَالَى كَسَيِّد قُطُب زَعِيمِ حِزْبِ الإِخْوَانِ وَجَمَاعَةِ سَحَر حَلَبِى وَقَوْلُ أَهْلِ الْحُلُولِ إِنَّ اللَّهَ يَحُلُّ فِى غَيْرِهِ كَالشَّاذِلِيَّةِ الْيَشْرُطِيَّةِ الْقَائِلِينَ بِأَنَّ اللَّهَ يَدْخُلُ فِى كُلِّ شَخْصٍ ذَكَرٍ أَوْ أُنْثَى.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(165) مَا حُكْمُ الِاعْتِرَاضِ عَلَى اللَّهِ.</p><p class=\"answer\">اعْلَمْ أَنَّ الِاعْتِرَاضَ عَلَى اللَّهِ هُوَ نِسْبَةُ الظُّلْمِ أَوِ السَّفَهِ أَىْ عَدَمِ الْحِكْمَةِ إِلَى اللَّهِ وَهُوَ كُفْرٌ. أَمَّا الظُّلْمُ فَهُوَ مُخَالَفَةُ أَمْرِ وَنَهْىِ مَنْ لَهُ الأَمْرُ وَالنَّهْىُ وَاللَّهُ تَعَالَى لَيْسَ لَهُ ءَامِرٌ وَلا نَاهٍ فَلا يَجُوزُ عَلَيْهِ الظُّلْمُ وَهُوَ تَبَارَكَ وَتَعَالَى مُنَزَّهٌ عَنِ السَّفَهِ لِأَنَّهُ حَكِيمٌ فِى فِعْلِهِ، خَلَقَ كُلَّ شَىْءٍ بِحِكْمَةٍ فَلا يُعْتَرَضُ عَلَيْهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(166) مَا حُكْمُ مَنْ نَفَى صِفَةً مِنْ صِفَاتِ اللَّهِ الثَّلاثَ عَشْرَةَ الْوَاجِبَةِ لَهُ إِجْمَاعًا.</p><p class=\"answer\">مَنْ أَنْكَرَ صِفَةً مِنْ صِفَاتِ اللَّهِ الثَّلاثَ عَشْرَةَ الْوَاجِبَةِ لَهُ إِجْمَاعًا كَكَوْنِهِ عَالِمًا أَوْ قَادِرًا أَوْ سَمِيعًا أَوْ بَصِيرًا كَفَرَ وَلا يُعْذَرُ الْجَاهِلُ فِى ذَلِكَ لِأَنَّ الْعَقْلَ يَدُلُّ عَلَيْهَا فَمَنْ قَالَ اللَّهُ لا يَتَحَمَّلُ فُلانًا كَفَرَ لِأَنَّ هَذَا فِيهِ نِسْبَةُ الْعَجْزِ إِلَى اللَّهِ أَوْ أَنَّ اللَّهَ يَنْزَعِجُ مِنْهُ أَمَّا إِذَا كَانَ يَفْهَمُ مِنْهُ أَنَّ اللَّهَ لا يُحِبُّهُ بَلْ يَكْرَهُهُ لِفِسْقِهِ فَلا يَكْفُرُ لَكِنْ يَجِبُ نَهْيُهُ عَنْهَا</p></div>\n<div class=\"qa-item\"><p class=\"question\">(167) مَا حُكْمُ مَنْ نَسَبَ إِلَى اللَّهِ تَعَالَى صِفَةً مِنْ صِفَاتِ الْمَخْلُوقِينَ.</p><p class=\"answer\">مَنْ نَسَبَ إِلَى اللَّهِ صِفَةً مِنْ صِفَاتِ الْمَخْلُوقِينَ كَالْحَرَكَةِ وَالسُّكُونِ وَالْقِيَامِ وَالْقُعُودِ وَالِاتِّصَالِ وَالِانْفِصَالِ وَالْجُلُوسِ وَالِاسْتِقْرَارِ كَفَرَ قَالَ اللَّهُ تَعَالَى ﴿فَلا تَضْرِبُوا لِلَّهِ الأَمْثَالَ﴾ أَىْ لا تُشَبِّهُوهُ بِخَلْقِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(168) مَا حُكْمُ مَنْ يَقُولُ الْعَالَمُ أَزَلِىٌّ لا بِدَايَةَ لِوُجُودِهِ.</p><p class=\"answer\">اعْلَمْ أَنَّ اللَّهَ تَعَالَى هُوَ وَحْدَهُ الأَزَلِىُّ الَّذِى لا ابْتِدَاءَ لِوُجُودِهِ وَلا أَزَلِىَّ سِوَاهُ وَخَالَفَتِ الْفَلاسِفَةُ فِى ذَلِكَ فَقَالَ قِسْمٌ مِنْهُمْ الْعَالَمُ أَزَلِىٌّ بِنَوْعِهِ حَادِثٌ بِأَفْرَادِهِ وَهُوَ كُفْرٌ بِالإِجْمَاعِ لِأَنَّ الْقَوْلَ بِأَزَلِيَّةِ الْعَالَمِ نَفْىٌ لِخَالِقِيَّةِ اللَّهِ. وَتَبِعَ الْفَلاسِفَةَ فِى هَذِهِ الْمَقَالَةِ الْفَاسِدَةِ أَحْمَدُ بنُ تَيْمِيَةَ الْحَرَّانِىُّ ذَكَرَ ذَلِكَ فِى سَبْعَةٍ مِنْ كُتُبِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(169) مَا حُكْمُ مَنْ قَالَ لِمُسْلِمٍ يلْعَنْ دِينَكَ.</p><p class=\"answer\">مَنْ قَالَ لِمُسْلِمٍ يلْعَنْ دِينَكَ بِمَعْنَى أَلْعَنُ دِينَكَ يَقْصِدُ بِذَلِكَ دِينَ الإِسْلامِ كَفَرَ أَمَّا إِنْ قَصَدَ لَعْنَ سِيرَتِهِ أَىْ عَادَاتِهِ وَأَخْلاقِهِ الْخَبِيثَةِ فَلا يَكْفُرُ. وَأَمَّا إِنْ أَطْلَقَ أَىْ إِنْ لَمْ يَقْصِدْ سِيرَتَهُ وَلا قَصَدَ دِينَ الإِسْلامِ فَإِنَّهُ يَكْفُرُ لِأَنَّ الإِطْلاقَ يُحْمَلُ عِنْدَ فَقْدِ الْقَرِينَةِ أَىِ الدَّلِيلِ عَلَى الْمَعْنَى الْمُتَبَادِرِ الأَكْثَرِ اسْتِعْمَالًا وَهُوَ الِاعْتِقَادُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(170) مَا حُكْمُ مَنْ يَقُولُ إِنَّ الْكَافِرَ أَفْضَلُ مِنَ الْمُسْلِمِ.</p><p class=\"answer\">مَنْ قَالَ إِنَّ الْكَافِرَ أَفْضَلُ مِنَ الْمُسْلِمِ أَوْ لا فَرْقَ بَيْنَ الْمُسْلِمِ وَالْكَافِرِ فَقَدْ كَذَّبَ اللَّهَ وَرَسُولَهُ قَالَ اللَّهُ تَعَالَى ﴿أَفَمَنْ كَانَ مُؤْمِنًا كَمَنْ كَانَ فَاسِقًا لا يَسْتَوُونَ﴾ وَالْفَاسِقُ هُنَا هُوَ الْكَافِرُ وَقَالَ تَعَالَى ﴿أَفَنَجْعَلُ الْمُسْلِمِينَ كَالْمُجْرِمِينَ مَا لَكُمْ كَيْفَ تَحْكُمُونَ﴾ وَقَالَ رَسُولُ اللَّهِ ﷺ الْمُؤْمِنُ أَعْظَمُ حُرْمَةً مِنَ الْكَعْبَةِ رَوَاهُ التِّرْمِذِىُّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(171) مَا حُكْمُ مَنْ يَقُولُ إِنَّ اللَّهَ يُحِبُّ كُلَّ عِبَادِهِ الْمُؤْمِنِينَ وَالْكَافِرِينَ.</p><p class=\"answer\">مَنْ قَالَ إِنَّ اللَّهَ يُحِبُّ كُلَّ عِبَادِهِ فَهُوَ كَافِرٌ مُكَذِّبٌ لِلَّهِ وَرَسُولِهِ ﷺ قَالَ اللَّهُ تَعَالَى ﴿قُلْ أَطِيعُوا اللَّهَ وَالرَّسُولَ فَإِنْ تَوَلَّوْا فَإِنَّ اللَّهَ لا يُحِبُّ الْكَافِرِينَ﴾ أَىْ لا يُحِبُّهُمُ اللَّهُ لِكُفْرِهِمْ وَلَوْ أَحَبَّهُمْ أَىْ لَوْ أَرَادَ لَهُمُ الْخَيْرَ فِى الآخِرَةِ لَرَزَقَهُمُ الإِيمَانَ بِاللَّهِ وَرَسُولِهِ وَقَالَ رَسُولُ اللَّهِ ﷺ إِنَّ اللَّهَ يُعْطِى الْمَالَ لِمَنْ يُحِبُّ وَلِمَنْ لا يُحِبُّ وَلا يُعْطِى الإِيمَانَ إِلَّا لِمَنْ يُحِبُّ رَوَاهُ الْحَاكِمُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(172) مَا حُكْمُ مَنْ يَقُولُ الْعَرَبُ جَرَبٌ.</p><p class=\"answer\">اعْلَمْ أَنَّ مَنْ يَقُولُ الْعَرَبُ جَرَبٌ أَىْ أَنَّ كُلَّ الْعَرَبِ لا خَيْرَ فِيهِمْ فَهُوَ كَافِرٌ لِأَنَّ الْعَرَبَ فِيهِمْ أَنْبِيَاءُ وَفِيهِمْ أَوْلِيَاءُ إِلَّا إِذَا خَصَّصَ كَلامَهُ بِقَرِينَةِ الْحَالِ كَقَوْلِهِ الْيَوْمَ الْعَرَبُ فَسَدُوا ثُمَّ قَالَ الْعَرَبُ جَرَبٌ مُرِيدًا هَؤُلاءِ الَّذِينَ يَعْتَقِدُهُمْ فَاسِدِينَ فَلا يَكْفُرُ لَكِنَّهُ لا يَسْلَمُ مِنَ الْمَعْصِيَةِ لِأَنَّهُ لَيْسَ كُلُّ الْعَرَبِ الْيَوْمَ فَاسِدِينَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(173) مَا حُكْمُ مَنْ أَنْكَرَ الْقَدَرَ.</p><p class=\"answer\">الْقَدَرُ الَّذِى هُوَ صِفَةٌ لِلَّهِ هُوَ إِيجَادُ اللَّهِ الأَشْيَاءَ عَلَى حَسَبِ عِلْمِهِ وَمَشِيئَتِهِ الأَزَلِيَيْنِ فَيَجِبُ اعْتِقَادُ أَنَّ كُلَّ مَا دَخَلَ فِى الْوُجُودِ مِنْ خَيْرٍ أَوْ شَرٍّ فَهُوَ بِتَقْدِيرِ اللَّهِ الأَزَلِىِّ أَمَّا مَنْ أَنْكَرَ الْقَدَرَ فَهُوَ كَافِرٌ كَالْقَدَرِيَّةِ وَهُمُ الْمُعْتَزِلَةُ وَتَبِعَهُمْ فِى ذَلِكَ مُحَمَّد رَاتِب النَّابُلُسِى فَقَالَ إِنَّ أَعْمَالَ الْعِبَادِ لَيْسَتْ مِنْ قَضَاءِ اللَّهِ وَقَدَرِهِ فَكَذَّبَ قَوْلَ اللَّهِ تَعَالَى ﴿إِنَّا كُلَّ شَىْءٍ خَلَقْنَاهُ بقَدَرٍ﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(174) مَا حُكْمُ الِاسْتِهْزَاءِ بِفِعْلٍ مِنْ أَفْعَالِ الرَّسُولِ ﷺ أَوْ بِأَمْرٍ مِنْ أَوَامِرِهِ.</p><p class=\"answer\">يَكْفُرُ مَنْ يَسْتَهْزِئُ بِفِعْلٍ مِنْ أَفْعَالِ الرَّسُولِ ﷺ أَوْ بِأَمْرٍ مِنْ أَوَامِرِهِ كَالَّذِى يَسْتَهْزِئُ بِلُبْسِ الْعِمَامَةِ أَوِ الْقَمِيصِ الطَّوِيلِ الَّذِى يُعْرَفُ عِنْدَ كَثِيرٍ مِنَ النَّاسِ الْيَوْمَ بِالْجَلَّابِيَّةِ أَوِ الدِّشْدَاشَةِ أَوْ يَسْتَهْزِئُ بِالأَكْلِ بِالأَصَابِعِ الثَّلاثَةِ الإِبْهَامِ وَالسَّبَّابَةِ وَالْوُسْطَى، وَكَذَا يَكْفُرُ مَنْ يَسْتَهْزِئُ بِاسْتِعْمَالِ السِّوَاكِ أَوْ إِعْفَاءِ اللِّحْيَةِ أَوْ نَتْفِ الإِبْطِ أَوِ الِاسْتِحْدَادِ أَىْ حَلْقِ الْعَانَةِ وَنَحْوِ ذَلِكَ مَعَ عِلْمِهِ أَنَّ الرَّسُولَ ﷺ فَعَلَ ذَلِكَ أَوْ مَدَحَهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(175) اذْكُرْ بَعْضَ الْحَالاتِ الْمُسْتَثْنَاةِ مِنَ الْكُفْرِ اللَّفْظِىِّ.</p><p class=\"answer\">يُسْتَثْنَى مِنَ الْكُفْرِ اللَّفْظِىِّ حَالاتٌ لا يَكْفُرُ فِيهَا قَائِلُهُ حَالَةُ سَبْقِ اللِّسَانِ وَحَالَةُ غَيْبُوبَةِ الْعَقْلِ وَحَالَةُ الإِكْرَاهِ وَحَالَةُ الْحِكَايَةِ لِكُفْرِ الْغَيْرِ عَلَى غَيْرِ وَجْهِ الرِّضَى وَالِاسْتِحْسَانِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(176) مَا هُوَ سَبْقُ اللِّسَانِ.</p><p class=\"answer\">سَبْقُ اللِّسَانِ هُوَ أَنْ يَتَكَلَّمَ الشَّخْصُ بِشَىْءٍ مِنْ غَيْرِ إِرَادَةٍ كَأَنْ أَرَادَ أَنْ يَتَكَلَّمَ بِكَلامٍ غَيْرِ كُفْرِىٍّ فَسَبَقَ لِسَانُهُ فَقَالَ كَلِمَةً كُفْرِيَّةً مِنْ غَيْرِ إِرَادَةٍ وَلَمْ يَقْصِدْ أَنْ يَقُولَهَا بِالْمَرَّةِ كَأَنْ أَرَادَ أَنْ يَقُولَ وَمَا أَنَا مِنَ الْمُشْرِكِينَ فَسَبَقَ لِسَانُهُ فَقَالَ وَمَا أَنَا مِنَ الْمُسْلِمِينَ فَإِنَّهُ لا مُؤَاخَذَةَ عَلَيْهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(177) مَا مَعْنَى غَيْبُوبَةِ الْعَقْلِ.</p><p class=\"answer\">مَعْنَى غَيْبُوبَةِ الْعَقْلِ عَدَمُ صَحْوِ الْعَقْلِ فَمَنْ غَابَ عَقْلُهُ فَنَطَقَ بِكَلامٍ كُفْرِىٍّ لا يُحْكَمُ عَلَيْهِ بِالْكُفْرِ لِارْتِفَاعِ التَّكْلِيفِ عَنْهُ وَيَشْمَلُ هَذَا الْحُكْمُ النَّائِمَ وَالْمَجْنُونَ وَنَحْوَهُمَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(178) مَا هِىَ حَالَةُ الإِكْرَاهِ.</p><p class=\"answer\">حَالَةُ الإِكْرَاهِ هِىَ أَنْ يَنْطِقَ بِالْكُفْرِ بِلِسَانِهِ مُكْرَهًا بِالْقَتْلِ فَمَنْ نَطَقَ بِالْكُفْرِ بِلِسَانِهِ مُكْرَهًا بِالْقَتْلِ وَقَلْبُهُ مُطْمَئِنٌّ بِالإِيمَانِ فَلا يَكْفُرُ وَلا مَعْصِيَةَ عَلَيْهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(179) مَا هِىَ حَالَةُ الْحِكَايَةِ لِكُفْرِ الْغَيْرِ عَلَى غَيْرِ وَجْهِ الرِّضَى وَالِاسْتِحْسَانِ.</p><p class=\"answer\">حَالَةُ الْحِكَايَةِ لِكُفْرِ الْغَيْرِ عَلَى غَيْرِ وَجْهِ الرِّضَى وَالِاسْتِحْسَانِ هِىَ أَنْ يَنْقُلَ الشَّخْصُ عَنْ غَيْرِهِ كُفْرِيَّةً مِنْ غَيْرِ أَنْ يَكُونَ النَّاقِلُ رَاضِيًا بِالْكُفْرِ وَلا مُسْتَحْسِنًا لَهُ مَعَ الإِتْيَانِ بِأَدَاةِ الْحِكَايَةِ الْمَانِعَةِ لِلْكُفْرِ كَأَنْ يَقُولَ قَالَ فُلانٌ وَيَذْكُرَ كُفْرَهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(180) مَا الدَّلِيلُ عَلَى أَنَّ الْجَاهِلَ فِى أُصُولِ الدِّينِ لا يُعْذَرُ.</p><p class=\"answer\">لا يُعْفَى الْجَاهِلُ فِى أُصُولِ الدِّينِ وَلا يُعْذَرُ فِيمَا يَقَعُ مِنْهُ مِنَ الْكُفْرِ لِعَدَمِ اهْتِمَامِهِ بِالدِّينِ فَإِنَّ اللَّهَ عَزَّ وَجَلَّ فَرَضَ عَلَيْهِ أَنْ يَتَعَلَّمَ قَدْرًا مِنْ عِلْمِ الدِّينِ يُصَحِّحُ بِهِ عَقِيدَتَهُ وَيَحْفَظُ بِهِ إِسْلامَهُ عَمَّا يُفْسِدُهُ وَيُبْطِلُهُ فَلَوْ كَانَ الْجَهْلُ يُسْقِطُ الْعُقُوبَةَ فِى الآخِرَةِ لَكَانَ الْجَهْلُ خَيْرًا لِلنَّاسِ مِنَ الْعِلْمِ وَهَذَا خِلافُ قَوْلِهِ تَعَالَى ﴿قُلْ هَلْ يَسْتَوِى الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لا يَعْلَمُونَ﴾</p></div>\n<div class=\"qa-item\"><p class=\"question\">(181) مَاذَا يَجِبُ عَلَى مَنْ وَقَعَتْ مِنْهُ رِدَّةٌ.</p><p class=\"answer\">يَجِبُ عَلَى مَنْ وَقَعَتْ مِنْهُ رِدَّةٌ أَىْ كُفْرٌ الْعَوْدُ فَوْرًا إِلَى الإِسْلامِ بِالنُّطْقِ بِالشَّهَادَتَيْنِ بِحَيْثُ يُسْمِعُ نَفْسَهُ وَلا يَكْفِى أَنْ يُجْرِىَ اللَّفْظَ بِقَلْبِهِ. وَيَجِبُ عَلَيْهِ أَنْ يَنْدَمَ لِأَجْلِ أَنَّهُ وَقَعَ فِى الْكُفْرِ وَيَعْزِمَ بِقَلْبِهِ عَلَى أَنْ لا يَعُودَ إِلَيْهِ وَذَلِكَ شَأْنُ كُلِّ مَعْصِيَةٍ. وَلا يَرْجِعُ إِلَى الإِسْلامِ بِقَوْلِ أَسْتَغْفِرُ اللَّهَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(182) اذْكُرْ بَعْضَ الأَحْكَامِ الَّتِى تَتَعَلَّقُ بِالرِّدَّةِ.</p><p class=\"answer\">مَنِ ارْتَدَّ عَنِ الإِسْلامِ بَطَلَ صَوْمُهُ وَتَيَمُّمُهُ وَيَحْرُمُ أَكْلُ ذَبِيحَتِهِ وَلا يَرِثُ مَنْ مَاتَ مِنْ أَقَارِبِهِ الْمُسْلِمِينَ وَلا تَجُوزُ الصَّلاةُ عَلَيْهِ إذا مَاتَ وَلا يَجُوزُ دَفْنُهُ فِى مَقَابِرِ الْمُسْلِمِينَ وَلا يَرِثُهُ قَرِيبُهُ بَعْدَ مَوْتِهِ وَلا يَجُوزُ التَّرَحُّمُ عَلَيْهِ وَلا الِاسْتِغْفَارُ لَهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(183) مَا حُكْمُ مَنْ يَأْتِى بِنَوْعٍ مِنْ أَنْوَاعِ الْكُفْرِ.</p><p class=\"answer\">إِذَا حَصَلَ مِنْ مُسْلِمٍ كُفْرٌ فَإِنَّهُ يَخْسَرُ حَسَنَاتِهِ السَّابِقَةَ كُلَّهَا وَلا تَرْجِعُ إِلَيْهِ حَسَنَاتُهُ الَّتِى خَسِرَهَا بَعْدَ رُجُوعِهِ إِلَى الإِسْلامِ وَأَمَّا ذُنُوبُهُ الَّتِى عَمِلَهَا أَثْنَاءَ الرِّدَّةِ وَقَبْلَ ذَلِكَ فَلا تُمْحَى عَنْهُ بِرُجُوعِهِ إِلَى الإِسْلامِ إِنَّمَا الَّذِى يُغْفَرُ لَهُ بِذَلِكَ هُوَ الْكُفْرُ فَقَطْ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(184) مَا حُكْمُ نِكَاحِ مَنِ ارْتَدَّ عَنِ الإِسْلامِ.</p><p class=\"answer\">مَنِ ارْتَدَّ عَنِ الإِسْلامِ قَبْلَ الدُّخُولِ بِالزَّوْجَةِ بَطَلَ نِكَاحُهُ وَلا تَحِلُّ لَهُ وَلَوْ عَادَ إِلَى الإِسْلامِ إِلَّا بِنِكَاحٍ جَدِيدٍ وَكَذَا يَبْطُلُ نِكَاحُهُ إِنِ ارْتَدَّ عَنِ الإِسْلامِ بَعْدَ الدُّخُولِ بِالزَّوْجَةِ وَلَمْ يَعُدْ إِلَى الإِسْلامِ فِى مُدَّةِ الْعِدَّةِ، فَإِنْ عَادَ إِلَى الإِسْلامِ قَبْلَ انْتِهَاءِ الْعِدَّةِ فَلا يَحْتَاجُ إِلَى تَجْدِيدِ الْعَقْدِ عِنْدَ الشَّافِعِىِّ. وَمُدَّةُ الْعِدَّةِ ثَلاثَةُ أَطْهَارٍ لِمَنْ تَحِيضُ وَثَلاثَةُ أَشْهُرٍ قَمَرِيَّةٍ لِمَنْ لا تَحِيضُ وَأَمَّا الْحَامِلُ فَعِدَّتُهَا تَنْتَهِى بِوَضْعِ الْحَمْلِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(185) كَيْفَ يُعَامَلُ الْمُرْتَدُّ.</p><p class=\"answer\">اعْلَمْ أَنَّهُ لا يَجُوزُ لِلْمُسْلِمِ أَنْ يَفْعَلَ شَيْئًا يَتَوَهَّمُ مِنْهُ الْمُرْتَدُّ أَنَّهُ مُسْلِمٌ أَوْ أَنَّ عَمَلَهُ مَقْبُولٌ عِنْدَ اللَّهِ فَلا يُؤْمَرُ الْمُرْتَدُّ بِالصَّلاةِ وَلا يُدْعَى إِلَى الْمُشَارَكَةِ فِى الذِّكْرِ الْجَمَاعِىِّ وَلا يُدَلُّ عَلَى مَكَانِ الْوُضُوءِ لِيَتَوَضَّأَ وَلا يُعْطَى سَجَّادَةَ الصَّلاةِ وَلا يُجِيبُهُ الْمُسْلِمُ إِذَا سَأَلَ عَنْ وَقْتِ دُخُولِ الصَّلاةِ أَوِ اتِّجَاهِ الْقِبْلَةِ لِأَنَّ الْكَافِرَ الْمُرْتَدَّ الَّذِى يَعْمَلُ صُورَةَ الطَّاعَةِ وَيَعْتَقِدُ أَنَّهُ يُكْتَبُ لَهُ ثَوَابٌ بِذَلِكَ يَكْفُرُ فَلا يَجُوزُ إِعَانَتُهُ عَلَى الْكُفْرِ. أَمَّا إِذَا سَأَلَ الْمُرْتَدُّ عَنْ كَيْفِيَّةِ الدُّخُولِ فِى الإِسْلامِ فَيُجِيبُهُ لِيَدْخُلَ فِى الإِسْلامِ فَوْرًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(186) هَلْ يُحْكَمُ عَلَى الشَّخْصِ بِالرِّدَّةِ لِمُجَرَّدِ شَهَادَةِ وَاحِدٍ عَلَيْهِ بِذَلِكَ.</p><p class=\"answer\">لا يُحْكَمُ عَلَيْهِ بِالرِّدَّةِ بِشَهَادَةِ وَاحِدٍ وَلَوْ كَانَ ثِقَةً أَىْ عَدْلًا وَلا بِشَهَادَةِ امْرَأَتَيْنِ. أَمَّا لَوْ أَخْبَرَ ثِقَتَانِ أَنَّ فُلانًا ارْتَدَّ فَيَجُوزُ الأَخْذُ بِقَوْلِهِمَا وَلا يَجِبُ. وَالْعَدْلُ هُوَ الْمُسْلِمُ الْمُجْتَنِبُ لِكَبَائِرِ الذُّنُوبِ وَلا يُكْثِرُ مِنَ الذُّنُوبِ الصَّغِيرَةِ بِحَيْثُ تَزِيدُ عَلَى طَاعَاتِهِ الْمُجْتَنِبُ لِمَا يُخِلُّ بِمُرُوءَتِهِ كَتَطْيِيرِ الْحَمَامِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(187) هَلْ يَجِبُ عَلَى الْمُرْتَدِّ إِذَا أَسْلَمَ أَنْ يَقْضِىَ مَا فَاتَهُ مِنْ صَلاةٍ أَوْ صِيَامٍ فِى أَيَّامِ رِدَّتِهِ.</p><p class=\"answer\">يَجِبُ عَلَى الْمُرْتَدِّ إِذَا أَسْلَمَ أَنْ يَقْضِىَ مَا فَاتَهُ مِنْ صَلاةٍ أَوْ صِيَامٍ فِى أَيَّامِ رِدَّتِهِ عِنْدَ الإِمَامِ الشَّافِعِىِّ وَلا يَجِبُ عِنْدَ الأَئِمَّةِ الثَّلاثَةِ أَبِى حَنِيفَةَ وَمَالِكٍ وَأَحْمَدَ.</p></div>", "wordCount": 2761, "paraCount": 98}, {"id": "taharah", "title": "كتاب الطهارة", "icon": "fa-tint", "desc": "أحكام الطهارة والوضوء والغسل والنجاسات", "content": "<p>كِتَابُ الطَّهَارَةِ</p>\n<div class=\"qa-item\"><p class=\"question\">(188) مَا هِىَ الطَّهَارَةُ.</p><p class=\"answer\">الطَّهَارَةُ هِىَ فِعْلُ مَا تُسْتَبَاحُ بِهِ الصَّلاةُ مِنْ وُضُوءٍ وَغُسْلٍ وَتَيَمُّمٍ وَإِزَالَةِ نَجَاسَةٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(189) مَا هِىَ الْمِيَاهُ الَّتِى يَصِحُّ التَّطْهِيرُ بِهَا.</p><p class=\"answer\">الْمِيَاهُ الَّتِى يَصِحُّ التَّطْهِيرُ بِهَا سَبْعٌ مَاءُ الْمَطَرِ وَمَاءُ الْبَحْرِ وَمَاءُ النَّهْرِ وَمَاءُ الْبِئْرِ وَمَاءُ الْعَيْنِ وَمَاءُ الثَّلْجِ وَمَاءُ الْبَرَدِ أَىِ الْمَاءُ الْحَاصِلُ مِنْ ذَوَبَانِ الثَّلْجِ وَالْبَرَدِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(190) مَا هُوَ الْوُضُوءُ.</p><p class=\"answer\">الْوُضُوءُ هُوَ اسْتِعْمَالُ الْمَاءِ فِى أَعْضَاءٍ مَخْصُوصَةٍ مُفْتَتَحًا بِالنِّيَّةِ وَهُوَ شَرْطٌ لِصِحَّةِ الصَّلاةِ لِقَوْلِهِ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا إِذَا قُمْتُمْ إِلَى الصَّلاةِ فَاغْسِلُوا وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى الْمَرَافِقِ وَامْسَحُوا بِرُؤُوسِكُمْ وَأَرْجُلَكُمْ إِلَى الْكَعْبَيْنِ﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(191) اذْكُرْ حَدِيثًا فِى فَضْلِ الْوُضُوءِ.</p><p class=\"answer\">رَوَى النَّسَائِىُّ فِى سُنَنِهِ أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ مَنْ تَوَضَّأَ كَمَا أُمِرَ وَصَلَّى كَمَا أُمِرَ غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ، أَىْ تُغْفَرُ لَهُ صَغَائِرُ الذُّنُوبِ وَلَوْ كَانَتْ ءَالافًا مُؤَلَّفَةً وَهَذَا لِمَنْ يَتَوَضَّأُ وُضُوءًا مُوَافِقًا لِوُضُوءِ رَسُولِ اللَّهِ ﷺ فَلا يُسْرِفُ فِى الْمَاءِ الْمُسْتَعْمَلِ فِى الْوُضُوءِ وَلا يَتَكَلَّمُ فِى أَثْنَاءِ وُضُوئهِ إِلَّا بِخَيْرٍ وَيَنْبَغِى أَنْ يُسَمِّىَ اللَّهَ تَعَالَى فِى ابْتِدَاءِ وُضُوئِهِ وَأَنْ يَغْسِلَ الأَعْضَاءَ مَعَ الدَّلْكِ فِى الْجَمِيعِ وَأَنْ يَمْسَحَ كُلَّ رَأْسِهِ وَأَنْ تَكُونَ نِيَّتُهُ لِوَجْهِ اللَّهِ كَأَنْ يَقُولَ فِى قَلْبِهِ أَتَوَضَّأُ تَقَرُّبًا إِلَى اللَّهِ وَأَنْ يَكُونَ الْمَاءُ حَلالًا يَجُوزُ لَهُ التَّصَرُّفُ فِيهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(192) مَا هِىَ الأَحْكَامُ فِى الشَّرْعِ.</p><p class=\"answer\">الأَحْكَامُ فِى الشَّرْعِ خَمْسَةٌ الْوَاجِبُ وَهُوَ مَا يُثَابُ الْعَبْدُ عَلَى فِعْلِهِ وَيُعَاقَبُ عَلَى تَرْكِهِ وَالْمَنْدُوبُ أَىِ الْمَسْنُونُ وَهُوَ مَا يُثَابُ عَلَى فِعْلِهِ وَلا يُعَاقَبُ عَلَى تَرْكِهِ، وَالْمُبَاحُ وَهُوَ مَا لا يُثَابُ عَلَى فِعْلِهِ وَلا يُعَاقَبُ عَلَى تَرْكِهِ وَالْحَرَامُ وَهُوَ مَا يُثَابُ عَلَى تَرْكِهِ امْتِثَالًا لِأَمْرِ اللَّهِ وَيُعَاقَبُ عَلَى فِعْلِهِ، وَالْمَكْرُوهُ وَهُوَ مَا يُثَابُ عَلَى تَرْكِهِ ابْتِغَاءَ مَرْضَاةِ اللَّهِ وَلا يُعَاقَبُ عَلَى فِعْلِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(193) اذْكُرْ أَرْكَانَ الْوُضُوءِ.</p><p class=\"answer\">أَرْكَانُ الْوُضُوءِ أَىْ فُرُوضُهُ سِتَّةٌ النِّيَّةُ وَغَسْلُ الْوَجْهِ وَغَسْلُ الْيَدَيْنِ إِلَى الْمِرْفَقَيْنِ وَمَسْحُ بَعْضِ الرَّأْسِ وَغَسْلُ الرِّجْلَيْنِ إِلَى الْكَعْبَيْنِ وَالتَّرْتِيبُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(194) اذْكُرْ بَعْضَ سُنَنِ الْوُضُوءِ.</p><p class=\"answer\">مِنْ سُنَنِ الْوُضُوءِ التَّسْمِيَةُ أَىْ قَوْلُ بِسْمِ اللَّهِ عِنْدَ غَسْلِ الْكَفَّيْنِ وَغَسْلُ الْكَفَّيْنِ ثَلاثًا وَاسْتِعْمَالُ السِّوَاكِ وَالْمَضْمَضَةُ وَالِاسْتِنْشَاقُ وَغَسْلُ الأَعْضَاءِ ثَلاثًا ثَلاثًا وَتَقْدِيمُ الْيُمْنَى عَلَى الْيُسْرَى مِنَ الْيَدَيْنِ وَالرِّجْلَيْنِ وَتَخْلِيلُ أَصَابِعِ الْيَدَيْنِ وَالرِّجْلَيْنِ وَمَسْحُ الأُذُنَيْنِ ظَاهِرِهِمَا وَبَاطِنِهِمَا وَمَسْحُ جَمِيعِ الرَّأْسِ وَالتَّقْلِيلُ مِنَ الْمَاءِ وَالدَّلْكُ وَالْمُوَالاةُ وَهِىَ غَسْلُ الْعُضْوِ قَبْلَ أَنْ يَجِفَّ الْعُضْوُ الَّذِى قَبْلَهُ وَالْغُرَّةُ وَهِىَ أَنْ يَزِيدَ فِى غَسْلِ الْوَجْهِ عَلَى الْقَدْرِ الْوَاجِبِ مِنْ جَمِيعِ جَوَانِبِهِ وَالتَّحْجِيلُ وَهُوَ أَنْ يَزِيدَ فِى غَسْلِ الْيَدَيْنِ وَالرِّجْلَيْنِ عَلَى الْقَدْرِ الْوَاجِبِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(195) اذْكُرْ بَعْضَ مَكْرُوهَاتِ الْوُضُوءِ.</p><p class=\"answer\">الْمَكْرُوهُ عِنْدَ الشَّافِعِيَّةِ هُوَ مَا يُسْتَحَبُّ تَرْكُهُ وَلا مَعْصِيَةَ فِيهِ وَالْمَكْرُوهُ إِمَّا أَنْ يُذْهِبَ أَجْرَ الْعَمَلِ كُلَّهُ أَوْ يُنْقِصَ شَيْئًا مِنْهُ. وَمِنْ مَكْرُوهَاتِ الْوُضُوءِ تَرْكُ التَّسْمِيَةِ فَمَنْ تَرَكَ التَّسْمِيَةَ عَمْدًا فِى الْوُضُوءِ يَقِلُّ ثَوَابُ وُضُوئِهِ وصَلاتِهِ كَثِيرًا. وَمِنَ الْمَكْرُوهَاتِ الْكَلامُ الَّذِى لا خَيْرَ فِيهِ أَثْنَاءَ الْوُضُوءِ وَالإِسْرَافُ فِى الْمَاءِ الْمُسْتَعْمَلِ فِى الْوُضُوءِ وَتَقْدِيمُ الْيُسْرَى عَلَى الْيُمْنَى مِنَ الْيَدَيْنِ وَالرِّجْلَيْنِ وَتَرْكُ التَّثْلِيثِ فِى غَسْلِ الْوَجْهِ وَالْيَدَيْنِ وَالرِّجْلَيْنِ إِلَّا لِعُذْرٍ كَقِلَّةِ الْمَاءِ أَوْ ضِيقِ الْوَقْتِ. وَلا يُكْرَهُ مَسْحُ الرَّأْسِ وَالأُذُنَيْنِ مَرَّةً مَرَّةً.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(196) هَلْ يُؤَثِّرُ الإِسْرَافُ فِى الْمَاءِ الْمُسْتَعْمَلِ فِى الْوُضُوءِ عَلَى ثَوَابِ الصَّلاةِ.</p><p class=\"answer\">الإِسْرَافُ فِى مَاءِ الْوُضُوءِ مَكْرُوهٌ يُذْهِبُ ثَوَابَ الْوُضُوءِ وَيُؤَثِّرُ عَلَى ثَوَابِ الصَّلاةِ. أَمَّا مَا كَانَ مِنَ الْمَاءِ مِقْدَارَ مُدٍّ وَاحِدٍ وَمَا زَادَ عَلَيْهِ إِلَى سِتَّةِ أَمْدَادٍ فَهُوَ مُوَافِقٌ لِفِعْلِ الرَّسُولِ ﷺ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(197) مَا حُكْمُ ذِكْرِ اللَّهِ فِى بَيْتِ الْخَلاءِ.</p><p class=\"answer\">ذِكْرُ اللَّهِ تَعَالَى بِاللِّسَانِ فِى بَيْتِ الْخَلاءِ مَكْرُوهٌ أَمَّا الذِّكْرُ الْقَلْبِىُّ وَهُوَ اسْتِحْضَارُ الْخَوْفِ مِنَ اللَّهِ بِالْقَلْبِ خَوْفَ الإِجْلالِ وَالتَّعْظِيمِ وَاسْتِحْضَارُ مَحَبَّتِهِ فَلَيْسَ مَكْرُوهًا بَلْ فِيهِ ثَوَابٌ فِى كُلِّ الأَحْوَالِ. وَأَمَّا ذِكْرُ اللَّهِ فِى الْحَمَّامِ الَّذِى لا خَلاءَ فِيهِ وَلا يُسْتَعْمَلُ إِلَّا لِلْغُسْلِ فَلَيْسَ مَكْرُوهًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(198) اذْكُرْ بَعْضَ فَوَائِدِ السِّوَاكِ.</p><p class=\"answer\">السِّوَاكُ سُنَّةٌ لِلرَّجُلِ وَالْمَرْأَةِ فِى الْوُضُوءِ وَعِنْدَ الْقِيَامِ لِلصَّلاةِ. وَمِنْ فَوَائِدِ السِّوَاكِ أَنَّهُ يُزِيلُ الرَّائِحَةَ الْكَرِيهَةَ مِنَ الْفَمِ وَيَشُدُّ اللِّثَةَ وَيُبَيِّضُ الأَسْنَانَ وَيُضَاعِفُ الأَجْرَ وَيُسَاعِدُ فِى إِخْرَاجِ الْحُرُوفِ مِنْ مَخَارِجِهَا وَيُذَكِّرُ بِالشَّهَادَةِ عِنْدَ الْمَوْتِ وَيُسَاعِدُ عَلَى خُرُوجِ الرُّوحِ وَيُقَوِّى الذَّكَاءَ وَالْبَصَرَ وَهُوَ سَبَبٌ لِتَكْثِيرِ الرِّزْقِ بِإِذْنِ اللَّهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(199) مَاذَا يُسَنُّ أَنْ يُقَالَ عَقِبَ الْوُضُوءِ.</p><p class=\"answer\">يُسَنُّ لِلْمُسْلِمِ بَعْدَ الِانْتِهَاءِ مِنَ الْوُضُوءِ أَنْ يَتَّجِهَ إِلَى الْقِبْلَةِ وَيَرْفَعَ بَصَرَهُ وَيَقُولَ أَشْهَدُ أَنْ لا إِلَـهَ إِلَّا اللَّهُ وَحْدَهُ لا شَرِيكَ لَهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ ثُمَّ يَخْفِضَ بَصَرَهُ وَيَقُولَ اللَّهُمَّ اجْعَلْنِى مِنَ التَّوَّابِينَ وَاجْعَلْنِى مِنَ الْمُتَطَهِّرِينَ سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ أَشْهَدُ أَنْ لا إِلَهَ إِلَّا أَنْتَ أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(200) مَا هِىَ شُرُوطُ الْمَسْحِ عَلَى الْخُفَّيْنِ.</p><p class=\"answer\">يَجُوزُ الْمَسْحُ عَلَى الْخُفَّيْنِ فِى الْوُضُوءِ بَدَلًا عَنْ غَسْلِ الرِّجْلَيْنِ بِخَمْسَةِ شُرُوطٍ وَهِىَ أَنْ يَكُونَ الْخُفُّ طَاهِرًا وَسَاتِرًا لِجَمِيعِ الْقَدَمِ مَعَ الْكَعْبَيْنِ مِنْ كُلِّ الْجَوَانِبِ غَيْرِ الأَعْلَى وَيُمْكِنُ الْمَشْىُ بِهِ بِلا نَعْلٍ لِتَرَدُّدِ مُسَافِرٍ فِى حَوَائِجِهِ وَأَنْ يَكُونَ مَانِعًا لِنُفُوذِ الْمَاءِ وَأَنْ يَبْتَدِئَ لُبْسَهُمَا بَعْدَ كَمَالِ الطَّهَارَةِ أَىْ بَعْدَ تَمَامِ الْوُضُوءِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(201) مَا هِىَ الْكَيْفِيَّةُ الْمُسْتَحَبَّةُ فِى مَسْحِ الْخُفِّ.</p><p class=\"answer\">السُّنَّةُ فِى مَسْحِ الْخُفِّ أَنْ يَمْسَحَ أَعْلَى الْخُفِّ وَأَسْفَلَهُ بِالْمَاءِ مَرَّةً بِأَنْ يَضَعَ يَدَهُ الْيُمْنَى عَلَى مَوْضِعِ الأَصَابِعِ وَالْيُسْرَى تَحْتَ عَقِبِهِ أَىْ مُؤَخَّرِ قَدَمِهِ وَيُمِرَّ يَدَهُ الْيُمْنَى إِلَى سَاقِهِ وَالْيُسْرَى إِلَى مَوْضِعِ الأَصَابِعِ مِنْ أَسْفَلَ وَيُفَرِّجَ بَيْنَ أَصَابِعِ يَدَيْهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(202) مَا هِىَ مُدَّةُ الْمَسْحِ عَلَى الْخُفَّيْنِ.</p><p class=\"answer\">يَمْسَحُ الْمُسَافِرُ سَفَرَ قَصْرٍ ثَلاثَةَ أَيَّامٍ وَلَيَالِيهِنَّ وَالْمُقِيمُ يَوْمًا وَلَيْلَةً، وَالْعَاصِى بِسَفَرِهِ كَالْمُقِيمِ. وَابْتِدَاءُ الْمُدَّةِ مِنْ حِينِ يُحْدِثُ بَعْدَ لُبْسِ الْخُفِّ لا مِنْ وَقْتِ اللُّبْسِ أَوِ الْمَسْحِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(203) اذْكُرْ نَوَاقِضَ الْوُضُوءِ.</p><p class=\"answer\">يَنْقُضُ الْوُضُوءَ مَا خَرَجَ مِنَ الْقُبُلِ أَوِ الدُّبُرِ غَيْرَ الْمَنِىِّ وَمَسُّ قُبُلِ الآدَمِىِّ أَوْ حَلْقَةِ دُبُرِهِ بِبَطْنِ الْكَفِّ بِلا حَائِلٍ. وَالنَّاقِضُ مِنْ قُبُلِ الْمَرْأَةِ مُلْتَقَى شُفْرَيْهَا عَلَى الْمَنْفَذِ الْمُحِيطَيْنِ بِهِ وَالْمُرَادُ بِالْمَنْفَذِ مَخْرَجُ الْبَوْلِ وَمَدْخَلُ الذَّكَرِ. وَالنَّاقِضُ مِنَ الدُّبُرِ مُلْتَقَى الْمَنْفَذِ فَقَطْ فَلا يَنْقُضُ مَسُّ الأَلْيَةِ. وَيَنْقُضُ الْوُضُوءَ مَسُّ بَشَرَةِ الأُنْثَى الأَجْنَبِيَّةِ أَىْ غَيْرِ الْمَحْرَمِ الَّتِى تُشْتَهَى بِغَيْرِ حَائِلٍ. وَيَنْقُضُ الْوُضُوءَ زَوَالُ الْعَقْلِ أَىِ التَّمْيِيزِ بِنَحْوِ جُنُونٍ أَوْ نَوْمٍ إِلَّا نَوْمَ قَاعِدٍ مُمَكِّنٍ مَقْعَدَتَهُ مِنْ مَقَرِّهِ كَأَرْضٍ أَوْ ظَهْرِ دَابَّةٍ. وَلا يَنْقُضُ الْوُضُوءَ وُقُوعُ النَّجَاسَةِ عَلَى الْبَدَنِ بِإِجْمَاعِ الْفُقَهَاءِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(204) مَا حُكْمُ مَنْ تَيَقَّنَ أَنَّهُ تَوَضَّأَ وَشَكَّ هَلِ انْتَقَضَ وُضُوؤُهُ أَمْ لا.</p><p class=\"answer\">إِنْ تَيَقَّنَ أَنَّهُ تَوَضَّأَ وَشَكَّ هَلِ انْتَقَضَ وُضُوؤُهُ أَمْ لا فَإِنَّهُ يَعْتَبِرُ نَفْسَهُ مُتَوَضِّئًا أَمَّا لَوْ تَيَقَّنَ أَنَّهُ مُحْدِثٌ وَشَكَّ هَلْ تَوَضَّأَ بَعْدَ ذَلِكَ أَمْ لا فَلا يَعْتَبِرُ نَفْسَهُ مُتَوَضِّئًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(205) تَكَلَّمْ عَنِ الِاسْتِنْجَاءِ.</p><p class=\"answer\">الِاسْتِنْجَاءُ هُوَ إِزَالَةُ النَّجَاسَةِ عَنِ الْقُبُلِ أَوِ الدُّبُرِ بَعْدَ نَحْوِ قَضَاءِ الْحَاجَةِ. وَيَجِبُ الِاسْتِنْجَاءُ مِنْ كُلِّ نَجِسٍ رَطْبٍ خَارِجٍ مِنَ الْقُبُلِ أَوِ الدُّبُرِ، بِالْمَاءِ أَوْ بِقَالِعٍ طَاهِرٍ جَامِدٍ غَيْرِ مُحْتَرَمٍ كَحَجَرٍ أَوْ مِنْدِيلِ وَرَقٍ أَوْ قُمَاشٍ. وَالِاسْتِنْجَاءُ بِالْمَاءِ يَكُونُ بِصَبِّ الْمَاءِ إِلَى أَنْ يَطْهُرَ الْمَحَلُّ أَمَّا الِاسْتِنْجَاءُ بِالْحَجَرِ وَنَحْوِهِ فَبِمَسْحِ الْمَحَلِّ ثَلاثَ مَسَحَاتٍ أَوْ أَكْثَرَ إِلَى أَنْ يَنْقَى الْمَحَلُّ وَإِنْ بَقِىَ الأَثَرُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(206) اذْكُرْ بَعْضَ السُّنَنِ وَالْمَكْرُوهَاتِ فِى الِاسْتِنْجَاءِ.</p><p class=\"answer\">يُسَنُّ لِلشَّخْصِ أَنْ يَنْصِبَ رِجْلَهُ الْيُمْنَى وَيَتَّكِئَ عَلَى الْيُسْرَى عِنْدَ الْقُعُودِ وَيُسَنُّ الِاسْتِبْرَاءُ وَهُوَ إِخْرَاجُ بَقِيَّةِ الْبَوْلِ بَعْدَ انْقِطَاعِهِ إِنْ كَانَ لا يَخْشَى نُزُولَهُ بِتَنَحْنُحٍ أَوْ نَحْوِهِ وَإِلَّا وَجَبَ وَيُسَنُّ أَنْ يَنْتُرَ ذَكَرَهُ ثَلاثًا وَلا يَبُولُ وَاقِفًا لِأَنَّهُ مَكْرُوهٌ إِلَّا لِعُذْرٍ وَلا يَسْتَنْجِى بِيَدِهِ الْيُمْنَى وَلا يَتَكَلَّمُ أَثْنَاءَ خُرُوجِ الْبَوْلِ أَوِ الْغَائِطِ وَلا يَذْكُرُ اللَّهَ فِى بَيْتِ الْخَلاءِ بِلِسَانِهِ لِأَنَّهُ مَكْرُوهٌ. وَيَنْبَغِى أَنْ يَنْوِىَ أَنَّهُ يَفْعَلُ السُّنَنَ وَيَتْرُكُ الْمَكْرُوهَاتِ وَيَسْتَنْجِى ابْتِغَاءَ الأَجْرِ مِنَ اللَّهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(207) مَاذَا يُسَنُّ لِلْمُسْلِمِ أَنْ يَقُولَ عِنْدَ الدُّخُولِ إِلَى بَيْتِ الْخَلاءِ وَعِنْدَ الْخُرُوجِ مِنْهُ.</p><p class=\"answer\">يُسَنُّ الدُّخُولُ إِلَى بَيْتِ الْخَلاءِ بِالرِّجْلِ الْيُسْرَى وَالْخُرُوجُ مِنْهُ بِالْيُمْنَى وَيُسَنُّ لِمَنْ أَرَادَ الدُّخُولَ إِلَى بَيْتِ الْخَلاءِ أَنْ يَقُولَ بِسْمِ اللَّهِ اللَّهُمَّ إِنِّى أَعُوذُ بِكَ مِنَ الْخُبْثِ وَالْخَبَائِثِ أَىْ أَطْلُبُ مِنَ اللَّهِ أَنْ يَحْفَظَنِى مِنْ أَذَى الشَّيَاطِينِ ذُكُورِهِمْ وَإِنَاثِهِمْ. وَيُسَنُّ لَهُ أَنْ يَقُولَ إِذَا خَرَجَ غُفْرَانَكَ الْحَمْدُ لِلَّهِ الَّذِى أَذْهَبَ عَنِّىَ الأَذَى وَعَافَانِى أَىْ أَحْمَدُهُ تَعَالَى أَنَّهُ أَخْرَجَ مِنِّى مَا لَوْ بَقِىَ فِى جَوْفِى يُؤْذِينِى وَأَبْقَى عَلَىَّ الْعَافِيَةَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(208) مَا هُوَ الْغُسْلُ وَمَا هِىَ فُرُوضُهُ.</p><p class=\"answer\">الْغُسْلُ هُوَ سَيَلانُ الْمَاءِ عَلَى جَـمِيعِ الْبَدَنِ بِنِيَّةٍ مَـخْصُوصَةٍ. وَفُرُوضُ الْغُسْلِ اثْنَانِ النِيَّةُ بِالْقَلْبِ كَأَنْ يَنْوِىَ فَرْضَ الْغُسْلِ أَوِ الْغُسْلَ الْوَاجِبَ وَتَعْمِيمُ جَمِيعِ الْبَدَنِ بِالْمَاءِ الْمُطَهِّرِ. وَمِمَّا يَجِبُ إِيصَالُ الْمَاءِ إِلَيْهِ فِى الْغُسْلِ مَا يَظْهَرُ مِنَ الدُّبُرِ عِنْدَ الْجُلُوسِ وَمَا يَظْهَرُ مِنْ فَرْجِ الْمَرْأَةِ عِنْدَ قُعُودِهَا لِقَضَاءِ الْحَاجَةِ. وَيَجِبُ إِيصَالُ الْمَاءِ إِلَى الثُّقْبِ الَّذِى تَفْعَلُهُ النِّسَاءُ فِى ءَاذَانِهِنَّ لِوَضْعِ الْحَلَقِ وَيَجِبُ حَلُّ الضَّفَائِرِ إِنْ لَمْ يَصِلِ الْمَاءُ إِلَى بَاطِنِهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(209) إِذَا اجْتَمَعَ عَلَى الرَّجُلِ غُسْلُ جَنَابَةٍ وَغُسْلُ الْجُمُعَةِ هَلْ يَكْفِيهِ أَنْ يَغْتَسِلَ غُسْلًا وَاحِدًا بِنِيَّةِ فَرْضِ الْغُسْلِ وَغُسْلِ الْجُمُعَةِ مَعًا.</p><p class=\"answer\">الْقَوْلُ الْمُعْتَمَدُ أَنَّهُ إِنِ اغْتَسَلَ وَنَوَى بِهِ فَرْضَ الْغُسْلِ وَغُسْلَ الْجُمُعَةِ أَجْزَأَهُ عَنْهُمَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(210) مَا الَّذِى يُوجِبُ الْغُسْلَ.</p><p class=\"answer\">الَّذِى يُوجِبُ الْغُسْلَ خَمْسَةُ أَشْيَاءَ خُرُوجُ الْمَنِىِّ وَالْجِمَاعُ وَالْحَيْضُ وَالنِّفَاسُ وَالْوِلادَةُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(211) مَا هِىَ عَلامَاتُ الْمَنِىِّ.</p><p class=\"answer\">خُرُوجُهُ بِلَذَّةٍ وَخُرُوجُهُ بِتَدَفُّقٍ وَلَهُ رَائِحَةُ الْعَجِينِ حَالَ كَوْنِهِ رَطْبًا وَرَائِحَةُ بَيَاضِ الْبَيْضِ حَالَ كَوْنِهِ جَافًّا وَهِىَ عَلامَاتٌ مُشْتَرَكَةٌ بَيْنَ الرِّجَالِ وَالنِّسَاءِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(212) هَلْ يَجِبُ عَلَى الْمَرْأَةِ الَّتِى وَلَدَتْ بِشَقِّ الْبَطْنِ أَنْ تَغْتَسِلَ.</p><p class=\"answer\">إِنْ وَلَدَتْ بِشَقِّ الْبَطْنِ وَلَمْ يَنْزِلْ مِنْهَا دَمُ نِفَاسٍ لا يَجِبُ عَلَيْهَا الْغُسْلُ أَمَّا إِذَا خَرَجَ مِنْهَا الدَّمُ فَيَجِبُ عَلَيْهَا الْغُسْلُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(213) مَا هُوَ الْحَيْضُ وَمَا هُوَ أَقَلُّ سِنٍّ تَحِيضُ فِيهِ الْمَرْأَةُ.</p><p class=\"answer\">الْحَيْضُ هُوَ الدَّمُ الْخَارِجُ مِنْ فَرْجِ الْمَرْأَةِ عَلَى سَبِيلِ الصِّحَّةِ مِنْ غَيْرِ سَبَبِ الْوِلادَةِ. وَأَقَلُّ الْحَيْضِ يَوْمٌ وَلَيْلَةٌ أَىْ مِقْدَارُ أَرْبَعٍ وَعِشْرِينَ سَاعَةً سَوَاءٌ كَانَ مُتَّصِلًا أَوْ مُتَقَطِّعًا ضِمْنَ خَمْسَةَ عَشَرَ يَوْمًا وَغَالِبُهُ سِتٌّ أَوْ سَبْعٌ وَأَكْثَرُهُ خَمْسَةَ عَشَرَ يَوْمًا وَالْمُوجِبُ لِلْغُسْلِ مِنَ الْحَيْضِ هُوَ انْقِطَاعُ الدَّمِ. وَأَقَلُّ سِنٍّ تَحِيضُ فِيهِ الْمَرْأَةُ تِسْعُ سِنِينَ قَمَرِيَّةً إِلَّا أَقَلَّ مِنْ سِتَّةَ عَشَرَ يَوْمًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(214) إِذَا دَخَلَ وَقْتُ الصَّلاةِ وَطَرَأَ عَلَى الْمَرْأَةِ مَانِعٌ يَمْنَعُ مِنْ وُجُوبِ الصَّلاةِ عَلَيْهَا كَحَيْضٍ وَلَمْ تُصَلِّ فِى أَوَّلِ وَقْتِهَا هَلْ يَلْزَمُهَا قَضَاءُ هَذِهِ الصَّلاةِ بَعْدَ زَوَالِ الْمَانِعِ.</p><p class=\"answer\">إِذَا دَخَلَ وَقْتُ الصَّلاةِ وَلَمْ تَكُنِ الْمَرْأَةُ فِى حَالِ الْحَيْضِ ثُمَّ مَضَى مِنْ الْوَقْتِ مَا يَسَعُ الصَّلاةَ أَىْ لَوْ أَرَادَتْ أَنْ تُصَلِّىَ لَكَفَاهَا الْوَقْتُ فَطَرَأَ عَلَيْهَا الْحَيْضُ وَجَبَ عَلَيْهَا أَنْ تَقْضِىَ هَذِهِ الصَّلاةَ بَعْدَ انْتِهَاءِ الْحَيْضِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(215) الْمَرْأَةُ إِذَا انْقَطَعَ عَنْهَا دَمُ الْحَيْضِ أَثْنَاءَ وَقْتِ الْعَصْرِ وَبَقِىَ مِنْ الْوَقْتِ مَا يَسَعُ قَدْرَ تَكْبِيرَةٍ أَوْ أَكْثَرَ فَهَلْ يَجِبُ عَلَيْهَا أَدَاءُ هَذِهِ الصَّلاةِ.</p><p class=\"answer\">يَجِبُ عَلَيْهَا أَنْ تَغْتَسِلَ وَتُصَلِّىَ الْعَصْرَ وَكَذَا الصَّلاةَ الَّتِى قَبْلَهَا وَهِىَ الظُّهْرُ لِأَنَّ الظُّهْرَ تُجْمَعُ مَعَ الْعَصْرِ فِى حَالِ الْعُذْرِ كَالسَّفَرِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(216) مَا حُكْمُ الدَّمِ الَّذِى تَرَاهُ الْحَامِلُ.</p><p class=\"answer\">اخْتَلَفَ الْفُقَهَاءُ فِيهِ وَالْقَوْلُ الرَّاجِحُ أَنَّهُ إِذَا بَلَغَ يَوْمًا وَلَيْلَةً ضِمْنَ خَمْسَةَ عَشَرَ يَوْمًا فَهُوَ حَيْضٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(217) مَا حُكْمُ الدَّمِ الَّذِى يَخْرُجُ مِنَ الْمَرْأَةِ إِذَا أَجْهَضَتْ.</p><p class=\"answer\">إِنْ أَجْهَضَتِ الْمَرْأَةُ وَكَانَ الَّذِى سَقَطَ مِنْهَا ظَهَرَتْ فِيهِ خِلْقَةُ ءَادَمِىٍّ فَالدَّمُ الْخَارِجُ مِنْهَا نِفَاسٌ أَمَّا إِذَا لَمْ يَكُنْ فِيهِ خِلْقَةُ ءَادَمِىٍّ فَالدَّمُ الْخَارِجُ مِنْهَا يُعْتَبَرُ حَيْضًا إِذَا بَلَغَ يَوْمًا وَلَيْلَةً وَإِلَّا فَهُوَ دَمُ عِلَّةٍ أَىْ دَمُ اسْتِحَاضَةٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(218) مَا حُكْمُ الإِجْهَاضِ.</p><p class=\"answer\">قَالَ بَعْضُ الْعُلَمَاءِ يَجُوزُ الإِجْهَاضُ قَبْلَ الشَّهْرِ الرَّابِعِ بِاسْتِعْمَالِ الدَّوَاءِ لا بِكَشْفِ الْعَوْرَةِ لِأَنَّ كَشْفَ الْعَوْرَةِ بِلا عُذْرٍ حَرَامٌ بِلا خِلافٍ. أَمَّا الإِجْهَاضُ بَعْدَ الشَّهْرِ الرَّابِعِ فَحَرَامٌ عِنْدَ الْجَمِيعِ لِأَنَّ الرُّوحَ يُنْفَخُ فِى الْجَنِينِ فَيُعَدُّ الإِجْهَاضُ حِينَئِذٍ قَتْلَ نَفْسٍ بِغَيْرِ حَقٍّ قَالَ اللَّهُ تَعَالَى ﴿وَلا تَقْتُلُوا النَّفْسَ الَّتِى حَرَّمَ اللَّهُ إِلَّا بِالْحَقِّ﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(219) مَا هُوَ النِّفَاسُ.</p><p class=\"answer\">النِّفَاسُ هُوَ الدَّمُ الْخَارِجُ بَعْدَ خُرُوجِ الْوَلَدِ وَأَقَلُّهُ قَدْرُ بَزْقَةٍ وَأَكْثَرُهُ سِتُّونَ يَوْمًا وَغَالِبُهُ أَرْبَعُونَ وَالْمُوجِبُ لِلْغُسْلِ مِنَ النِّفَاسِ هُوَ انْقِطَاعُ الدَّمِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(220) مَا مَعْنَى الِاسْتِحَاضَةِ.</p><p class=\"answer\">الِاسْتِحَاضَةُ هُوَ الدَّمُ الْخَارِجُ فِى غَيْرِ أَيَّامِ الْحَيْضِ وَالنِّفَاسِ. وَالِاسْتِحَاضَةُ قَدْ تَأْتِى بَعْدَ أَكْثَرِ الْحَيْضِ أَوْ بَعْدَ أَكْثَرِ النِّفَاسِ وَلا تَمْنَعُ الِاسْتِحَاضَةُ صِحَّةَ الصَّلاةِ وَالصَّوْمِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(221) مَاذَا تَفْعَلُ الْمُسْتَحَاضَةُ إِذَا أَرَادَتِ الصَّلاةَ.</p><p class=\"answer\">تَغْسِلُ الْمُسْتَحَاضَةُ فَرْجَهَا وَتَعْصِبُهُ بِخِرْقَةٍ بَعْدَ حَشْوِهِ إِلَّا إِذَا كَانَتْ صَائِمَةً أَوْ تَتَأَذَّى بِذَلِكَ وَتَتَوَضَّأُ بِنِيَّةِ اسْتِبَاحَةِ فَرْضِ الصَّلاةِ بَعْدَ دُخُولِ الْوَقْتِ لا قَبْلَهُ ثُمَّ تَشْتَغِلُ بِأَسْبَابِ الصَّلاةِ مِنْ سَتْرِ الْعَوْرَةِ وَغَيْرِهِ مِنْ غَيْرِ تَأْخِيرٍ وَتُصَلِّى. وَيَجِبُ الْوُضُوءُ لِكُلِّ فَرْضٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(222) اذْكُرْ بَعْضَ سُنَنِ الْغُسْلِ.</p><p class=\"answer\">مِنْ سُنَنِ الْغُسْلِ التَّسْمِيَةُ وَهِىَ قَوْلُ بِسْمِ اللَّهِ فَلَوْ تَرَكَهَا عَمْدًا كُرِهَ، وَغَسْلُ الْكَفَّيْنِ ثَلاثًا وَالْوُضُوءُ قَبْلَ الْغُسْلِ وَلا يُكْرَهُ تَرْكُهُ وَالتَّقْلِيلُ مِنَ الْمَاءِ. وَيُسَنُّ لِمَنْ يَغْتَسِلُ عَارِيًا أَنْ يَقُولَ عِنْدَ نَزْعِ ثِيَابِهِ بِسْمِ اللَّهِ الَّذِى لا إِلَهَ إِلَّا هُوَ فَإِنَّهُ سَتْرٌ عَنْ أَعْيُنِ الْجِنِّ. وَيُسَنُّ تَخْلِيلُ الشَّعَرِ ثَلاثًا بِأَنْ يُدْخِلَ أَصَابِعَهُ الْعَشَرَةَ فِى الْمَاءِ ثُمَّ فِى شَعَرِهِ وَيُسَنُّ أَوَّلًا إِفَاضَةُ الْمَاءِ عَلَى رَأْسِهِ ثُمَّ عَلَى شِقِّهِ الأَيْمَنِ مَا أَقْبَلَ مِنْهُ ثُمَّ مَا أَدْبَرَ مِنْهُ ثُمَّ عَلَى شِقِّهِ الأَيْسَرِ مَا أَقْبَلَ مِنْهُ ثُمَّ مَا أَدْبَرَ مِنْهُ وَيُسَنُّ أَنْ يَكُونَ كُلُّ ذَلِكَ ثَلاثًا. وَيُسَنُّ الدَّلْكُ وَالْمُوَالاةُ وَالدَّلْكُ هُوَ إِمْرَارُ الْيَدِ عَلَى الْجَسَدِ وَالْمُوَالاةُ هِىَ أَنْ يَغْسِلَ الْعُضْوَ قَبْلَ أَنْ يَجِفَّ الْعُضْوُ الَّذِى قَبْلَهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(223) مَا هِىَ شُرُوطُ الطَّهَارَةِ.</p><p class=\"answer\">شُرُوطُ الطَّهَارَةِ مِنْ وُضُوءٍ وَغُسْلٍ خَمْسَةٌ الإِسْلامُ وَالتَّمْيِيزُ وَعَدَمُ وُجُودِ مَانِعٍ مِنْ وُصُولِ الْمَاءِ إِلَى الْعُضْوِ الْمَغْسُولِ أَوِ الْمَمْسُوحِ كَصُبْغِ الأَظَافِرِ الْمُسَمَّى مَنَكِير وَالسَّيَلانُ وَهُوَ أَنْ يَجْرِىَ الْمَاءُ عَلَى الْجِلْدِ بِطَبْعِهِ وَلَوْ بِوَاسِطَةِ إِمْرَارِ الْيَدِ وَأَنْ يَكُونَ الْمَاءُ الْمُسْتَعْمَلُ طَاهِرًا فِى نَفْسِهِ مُطَهِّرًا لِغَيْرِهِ أَىْ يَصِحُّ التَّطْهِيرُ بِهِ كَمَاءِ الْمَطَرِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(224) مَا حُكْمُ طِلاءِ الأَظَافِرِ وَهَلْ يُؤَثِّرُ عَلَى صِحَّةِ الْوُضُوءِ وَالْغُسْلِ.</p><p class=\"answer\">يَحْرُمُ طِلاءُ الأَظَافِرِ الْمُسَمَّى مَنَكِير لِأَنَّهُ مِنْ عَادَاتِ الْكَافِرَاتِ الْخَاصَّةِ بِهِنَّ. الْكُفَّارُ إِذَا فَعَلُوا شَيْئًا وَاخْتَصُّوا بِهِ وَفَشَى بَيْنَهُمْ أَىْ صَارَ مِنْ عَادَتِهِمْ لا يَجُوزُ لِلْمُسْلِمِينَ أَنْ يُقَلِّدُوهُمْ فِى ذَلِكَ. وَلا يَصِحُّ الْوُضُوءُ وَالْغُسْلُ مِنَ الْجَنَابَةِ وَالْحَيْضِ وَالنِّفَاسِ مَعَ وُجُودِ هَذَا الطِّلاءِ لِأَنَّ مِنْ شُرُوطِ الطَّهَارَةِ عَدَمَ وُجُودِ مَانِعٍ مِنْ وُصُولِ الْمَاءِ إِلَى الْعُضْوِ الْمَغْسُولِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(225) مَا هِىَ أَقْسَامُ الْمِيَاهِ.</p><p class=\"answer\">أَقْسَامُ الْمِيَاهِ ثَلاثَةٌ مَاءٌ طَاهِرٌ مُطَهِّرٌ وَهُوَ الْمَاءُ الطَّاهِرُ فِى نَفْسِهِ الْمُطَهِّرُ لِغَيْرِهِ أَىْ يَصِحُّ التَّطْهِيرُ بِهِ كَمَاءِ النَّهْرِ، وَمَاءٌ طَاهِرٌ غَيْرُ مُطَهِّرٍ وَهُوَ الْمَاءُ الطَّاهِرُ فِى نَفْسِهِ غَيْرُ الْمُطَهِّرِ لِغَيْرِهِ كَالْمَاءِ الْمُسْتَعْمَلِ فِى رَفْعِ حَدَثٍ وَالْمَاءِ الْمُتَغَيِّرِ كَثِيرًا بِشَىْءٍ خَالَطَهُ مِنَ الطَّاهِرَاتِ، وَمَاءٌ نَجِسٌ وَهُوَ الْمَاءُ الْقَلِيلُ الَّذِى سَقَطَتْ فِيهِ نَجَاسَةٌ غَيْرُ مَعْفُوٍّ عَنْهَا وَكَذَا الْمَاءُ الْكَثِيرُ الْمُتَغَيِّرُ بِالنَّجَاسَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(226) مَا هُوَ الْمَاءُ الْقَلِيلُ وَالْمَاءُ الْكَثِيرُ.</p><p class=\"answer\">الْمَاءُ الْقَلِيلُ هُوَ الْمَاءُ الَّذِى دُونَ الْقُلَّتَيْنِ أَمَّا الْكَثِيرُ فَهُوَ قُلَّتَانِ أَوْ أَكْثَر. وَمِقْدَارُ الْقُلَّتَيْنِ مَا يَمْلَأُ حُفْرَةً مُرَبَّعَةً طُولُهَا ذِرَاعٌ وَرُبْعٌ وَكَذَلِكَ عَرْضُهَا وَعُمْقُهَا وَهُمَا نَحْوُ مِائَتَىْ لِيتْرٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(227) مَا هِىَ النَّجَاسَةُ غَيْرُ الْمَعْفُوِّ عَنْهَا.</p><p class=\"answer\">النَّجَاسَةُ غَيْرُ الْمَعْفُوِّ عَنْهَا هِىَ النَّجَاسَةُ الَّتِى لا يُسَامَحُ فِيهَا كَالْبَوْلِ وَالْغَائِطِ وَالدَّمِ وَالْقَيْحِ وَالْقَىْءِ وَالْمَذْىِ وَالْوَدْىِ. وَالْمَذْىُ هُوَ مَاءٌ أَبْيَضُ رَقِيقٌ يَخْرُجُ عِنْدَ ثَوَرَانِ الشَّهْوَةِ أَمَّا الْوَدْىُ فَهُوَ مَاءٌ أَبْيَضُ ثَخِينٌ يَخْرُجُ عَقِبَ الْبَوْلِ أَوْ عِنْدَ حَمْلِ شَىْءٍ ثَقِيلٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(228) مَا هِىَ أَقْسَامُ النَّجَاسَةِ.</p><p class=\"answer\">النَّجَاسَةُ قِسْمَانِ نَجَاسَةٌ عَيْنِيَّةٌ وَنَجَاسَةٌ حُكْمِيَّةٌ. وَالنَّجَاسَةُ الْعَيْنِيَّةُ هِىَ الَّتِى لَهَا لَوْنٌ أَوْ طَعْمٌ أَوْ رِيحٌ كَنُقْطَةِ دَمٍ عَلَى ثَوْبٍ وَتُزَالُ بِصَبِّ الْمَاءِ عَلَيْهَا إِلَى أَنْ يَذْهَبَ حَجْمُهَا وَأَوْصَافُهَا. وَالنَّجَاسَةُ الْحُكْمِيَةُ هِىَ الَّتِى لَيْسَ لَهَا لَوْنٌ وَلا طَعْمٌ وَلا رِيحٌ كَبَوْلٍ جَفَّ وَذَهَبَتْ أَوْصَافُهُ وَتُزَالُ بِصَبِّ الْمَاءِ عَلَيْهَا مَرَّةً وَاحِدَةً. أَمَّا النَّجَاسَةُ الْكَلْبِيَّةُ أَوِ الْخِنْزِيرِيَّةُ كَرِيقِ كَلْبٍ أَوْ خِنْزِيرٍ فَتُزَالُ بِغَسْلِهَا سَبْعًا إِحْدَاهُنَّ مَمْزُوجَةٌ بِالتُّرَابِ الطَّهُورِ. وَالْغَسَلاتُ الَّتِى يُزَالُ بِهَا الْحَجْمُ مَعَ الْوَصْفِ تُعَدُّ غَسْلَةً وَاحِدَةً.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(229) مَا هُوَ التَّيَمُّمُ وَبِمَ يَكُونُ.</p><p class=\"answer\">التَّيَمُّمُ هُوَ إِيصَالُ التُّرَابِ إِلَى الْوَجْهِ وَالْيَدَيْنِ بِنِيَّةِ مَخْصُوصَةٍ وَيَكُونُ بِتُرَابٍ خَالِصٍ طَهُورٍ لَهُ غُبَارٌ. وَيَجُوزُ التَّيَمُّمُ لِمَنْ لَمْ يَجِدِ الْمَاءَ أَوْ كَانَ يَضُرُّهُ الْمَاءُ. وَيَصِحُّ التَّيَمُّمُ مَعَ وُجُودِ الْمَاءِ إِنْ كَانَ يَحُولُ بَيْنَهُ وَبَيْنَ الْمَاءِ سَبُعٌ أَوْ عَدُوٌّ أَوْ كَانَ عِنْدَهُ مَاءٌ قَلِيلٌ يَحْتَاجُ إِلَيْهِ لِشُرْبِهِ أَوْ لِشُرْبِ حَيَوَانٍ مُحْتَرَمٍ وَهُوَ الَّذِى لا يَجُوزُ قَتْلُهُ كَالْحِصَانِ. وَلا يَصِحُّ التَّيَمُّمُ لِلصَّلاةِ الْمَكْتُوبَةِ إِلَّا بَعْدَ دُخُولِ وَقْتِهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(230) كَيْفَ يَتَيَمَّمُ مَنْ أَرَادَ الصَّلاةَ.</p><p class=\"answer\">يَضْرِبُ بِكَفَّيْهِ عَلَى التُّرَابِ ضَرْبَةً مُفَرِّقًا أَصَابِعَهُ يَمْسَحُ بِهَا وَجْهَهُ مِنْ أَعْلاهُ إِلَى أَسْفَلِهِ بِنِيَّةِ اسْتِبَاحَةِ فَرْضِ الصَّلاةِ لا بِنِيَّةِ التَّيَمُّمِ وَيَقْرِنُ النِّيَّةَ بِنَقْلِ التُّرَابِ وَيَسْتَدِيمُ النِّيَّةَ إِلَى أَنْ يَمْسَحَ جُزْءًا مِنَ الْوَجْهِ ثُمَّ يَضْرِبُ ضَرْبَةً ثَانِيَةً يَمْسَحُ بِهَا يَدَيْهِ مَعَ الْمِرْفَقَيْنِ فَيَمْسَحُ بِيَدِهِ الْيُسْرَى يَدَهُ الْيُمْنَى ثُمَّ يَمْسَحُ بِيَدِهِ الْيُمْنَى يَدَهُ الْيُسْرَى ثُمَّ يَمْسَحُ إِحْدَى الرَّاحَتَيْنِ عَلَى الأُخْرَى وَيُخَلِّلُ بَيْنَ أَصَابِعِهِمَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(231) مَا هِىَ مُبْطِلاتُ التَّيَمُّمِ.</p><p class=\"answer\">يَبْطُلُ التَّيَمُّمُ بِالرِّدَّةِ أَىِ الْكُفْرِ وَبِمَا يَبْطُلُ بِهِ الْوُضُوءُ وَبِرُؤْيَةِ الْمَاءِ فِى غَيْرِ وَقْتِ الصَّلاةِ أَمَّا لَوْ رَأَى الْمَاءَ وَهُوَ فِى الصَّلاةِ فَإِنْ كَانَ تَيَمَّمَ لِفَقْدِ الْمَاءِ فِى مَكَانٍ يَكْثُرُ فِيهِ وُجُودُ الْمَاءِ بَطَلَ تَيَمُّمُهُ وَإِلَّا فَلا. وَمَنْ تَيَمَّمَ لِفَقْدِ الْمَاءِ فِى مَكَانٍ يَنْدُرُ فِيهِ فَقْدُ الْمَاءِ فَعَلَيْهِ إِعَادَةُ كُلِّ صَلاةٍ صَلَّاهَا بِهَذَا التَّيَمُّمِ أَمَّا إِنْ تَيَمَّمَ لِفَقْدِ الْمَاءِ فِى مَكَانٍ يَكْثُرُ فِيهِ فَقْدُ الْمَاءِ فَلا تَجِبُ عَلَيْهِ الإِعَادَةُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(232) مَاذَا يَحْرُمُ عَلَى الْمُحْدِثِ حَدَثًا أَصْغَرَ.</p><p class=\"answer\">يَحْرُمُ عَلَى الْمُحْدِثِ حَدَثًا أَصْغَرَ الصَّلاةُ وَالطَّوَافُ بِالْكَعْبَةِ وَحَمْلُ الْمُصْحَفِ وَمَسُّهُ أَىْ مَسُّ وَرَقِهِ وَجِلْدِهِ الْمُتَّصِلِ بِهِ وَحَوَاشِيهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(233) مَاذَا يَحْرُمُ عَلَى الْجُنُبِ.</p><p class=\"answer\">يَحْرُمُ عَلَى الْجُنُبِ الصَّلاةُ وَالطَّوَافُ وَحَمْلُ الْمُصْحَفِ وَمَسُّهُ وَقِرَاءَةُ الْقُرْءَانِ بِاللِّسَانِ وَالْمُكْثُ فِى الْمَسْجِدِ. وَالْمَسْجِدُ هُوَ الْمَكَانُ الْمَوْقُوفُ لِلصَّلاةِ وَتُصَلَّى فِيهِ صَلاةُ الْجَمَاعَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(234) مَاذَا يَحْرُمُ عَلَى الْحَائِضِ وَالنُّفَسَاءِ.</p><p class=\"answer\">يَحْرُمُ عَلَى الْمَرْأَةِ فِى حَالِ الْحَيْضِ أَوِ النِّفَاسِ الصَّلاةُ وَالطَّوَافُ وَحَمْلُ الْمُصْحَفِ وَمَسُّهُ وَقِرَاءَةُ الْقُرْءَانِ بِاللِّسَانِ وَالْمُكْثُ فِى الْمَسْجِدِ وَالصِّيَامُ قَبْلَ انْقِطَاعِ الدَّمِ وَالْجِمَاعُ.</p></div>", "wordCount": 2521, "paraCount": 95}, {"id": "salah", "title": "كتاب الصلاة", "icon": "fa-pray", "desc": "أحكام الصلاة وشروطها وأركانها وسننها", "content": "<p>كِتَابُ الصَّلاةِ</p>\n<div class=\"qa-item\"><p class=\"question\">(235) مَا هِىَ الصَّلاةُ وَكَمْ صَلاةً تَجِبُ فِى الْيَوْمِ وَاللَّيْلَةِ.</p><p class=\"answer\">الصَّلاةُ هِىَ أَقْوَالٌ وَأَفْعَالٌ مُفْتَتَحَةٌ بِالتَّكْبِيرِ مُخْتَتَمَةٌ بِالتَّسْلِيمِ. وَالْوَاجِبُ فِى الْيَوْمِ وَاللَّيْلَةِ خَمْسُ صَلَوَاتٍ وَهِىَ الظُّهْرُ وَالْعَصْرُ وَالْمَغْرِبُ وَالْعِشَاءُ وَالصُّبْحُ. وَمَعْرِفَةُ أَوْقَاتِ هَذِهِ الصَّلَوَاتِ فَرْضٌ عَلَى كُلِّ مُكَلَّفٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(236) مَا هِىَ رَوَاتِبُ الْفَرَائِضِ الْخَمْسِ.</p><p class=\"answer\">الرَّوَاتِبُ هِىَ السُّنَنُ كَسُنَّةِ الصُّبْحِ وَسُنَّةِ الظُّهْرِ وَسُنَّةِ الْعَصْرِ وَسُنَّةِ الْمَغْرِبِ وَسُنَّةِ الْعِشَاءِ. وَسُنَّةُ الصَّبْحِ رَكْعَتَانِ قَبْلَ الصُّبْحِ وَسُنَّةُ الظُّهْرِ أَرْبَعٌ قَبْلَ الظُّهْرِ وَرَكْعَتَانِ بَعْدَهَا وَسُنَّةُ الْعَصْرِ أَرْبَعٌ قَبْلَ الْعَصْرِ وَسُنَّةُ الْمَغْرِبِ رَكْعَتَانِ بَعْدَ الْمَغْرِبِ وَسُنَّةُ الْعِشَاءِ رَكْعَتَانِ بَعْدَ الْعِشَاءِ. أَمَّا قَبْلِيَّةُ وَبَعْدِيَّةُ الْجُمُعَةِ فَهِىَ أَرْبَعٌ قَبْلَ الْجُمُعَةِ وَأَرْبَعٌ بَعْدَ الْجُمُعَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(237) مَا هِىَ صَلاةُ الضُّحَى.</p><p class=\"answer\">صَلاةُ الضُّحَى مِنَ النَّوَافِلِ أَىِ السُّنَنِ وَوَقْتُهَا مِنَ ارْتِفَاعِ الشَّمْسِ قَدْرَ رُمْحٍ وَهُوَ سَبْعَةُ أَذْرُعٍ تَقْرِيبًا إِلَى الزَّوَالِ أَىْ زَوَالِ الشَّمْسِ عَنْ وَسَطِ السَّمَاءِ إِلَى جِهَةِ الْمَغْرِبِ. وَأَدْنَاهَا رَكْعَتَانِ وَأَدْنَى الْكَمَالِ أَرْبَعٌ وَأَكْثَرُهَا ثَمَانِى رَكَعَاتٍ وَقِيلَ اثْنَتَا عَشْرَةَ رَكْعَةً يُسَلِّمُ مِنْ كُلِّ رَكْعَتَيْنِ. وَيَنْوِى فِى كُلِّ رَكْعَتَيْنِ أَنَّهُ يُصَلِّى رَكْعَتَيْنِ مِنَ الضُّحَى.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(238) مَا هِىَ أَفْضَلُ الصَّلاةِ بَعْدَ الْفَرِيضَةِ.</p><p class=\"answer\">أَفْضَلُ الصَّلاةِ بَعْدَ الْفَرِيضَةِ هِىَ صَلاةُ اللَّيْلِ. وَقِيَامُ اللَّيْلِ سُنَّةٌ مُؤَكَّدَةٌ وَاظَبَ عَلَيْهَا النَّبِىُّ ﷺ وَالصَّالِحُونَ مِنْ أُمَّتِهِ. وَالأَفْضَلُ فِى قِيَامِ اللَّيْلِ أَنْ يُسَلِّمَ مِنْ كُلِّ رَكْعَتَيْنِ وَيُوتِرَ بِرَكْعَةٍ ءَاخِرًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(239) مَا هِىَ صَلاةُ الْوِتْرِ.</p><p class=\"answer\">صَلاةُ الْوِتْرِ سُنَّةٌ غَيْرُ وَاجِبَةٍ. وَوَقْتُ الْوِتْرِ مَا بَيْنَ صَلاةِ الْعِشَاءِ وَطُلُوعِ الْفَجْرِ وَيُسَنُّ تَأْخِيرُهُ إِلَى ءَاخِرِ اللَّيْلِ وَأَقَلُّهُ رَكْعَةٌ وَأَكْثَرُهُ إِحْدَى عَشْرَةَ رَكْعَةً يُسَلِّمُ مِنْ كُلِّ رَكْعَتَيْنِ وَأَدْنَى الْكَمَالِ ثَلاثُ رَكَعَاتٍ بِتَسْلِيمَتَيْنِ فَيَنْوِى فِى الرَّكْعَتَيْنِ الأُولَيَيْنِ مُقَدِّمَةَ الْوِتْرِ وَفِى الأَخِيرَةِ الْوِتْرَ. وَلا يُصَلَّى وِتْرَانِ فِى لَيْلَةٍ وَاحِدَةٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(240) مَا هُوَ دُعَاءُ الْقُنُوتِ.</p><p class=\"answer\">الْقُنُوتُ هُوَ الدُّعَاءُ بِخَيْرٍ وَدُعَاءُ الْقُنُوتِ مِنْ سُنَنِ الصَّلاةِ وَيُقْرَأُ فِى اعْتِدَالِ الرَّكْعَةِ الثَّانِيَةِ مِنْ صَلاةِ الصُّبْحِ وَفِى اعْتِدَالِ الرَّكْعَةِ الأَخِيرَةِ مِنْ صَلاةِ الْوِتْرِ فِى النِّصْفِ الأَخِيرِ مِنْ رَمَضَانَ وَفِى اعْتِدَالِ ءَاخِرِ رَكْعَةٍ مِنَ الصَّلاةِ الْمَكْتُوبَةِ عِنْدَ نُزُولِ الْبَلاءِ وَهُوَ اللَّهُمَّ اهْدِنِى فِيمَنْ هَدَيْتَ وَعَافِنِى فِيمَنْ عَافَيْتَ وَتَوَلَّنِى فِيمَنْ تَوَلَّيْتَ وَبَارِكْ لِى فِيمَا أَعْطَيْتَ وَقِنِى شَرَّ مَا قَضَيْتَ فَإِنَّكَ تَقْضِى وَلا يُقْضَى عَلَيْكَ وَإِنَّهُ لا يَذِلُّ مَنْ وَالَيْتَ وَلا يَعِزُّ مَنْ عَادَيْتَ تَبَارَكْتَ رَبَّنَا وَتَعَالَيْتَ فَلَكَ الْحَمْدُ عَلَى مَا قَضَيْتَ أَسْتَغْفِرُكَ اللَّهُمَّ وَأَتُوبُ إِلَيْكَ. وَيَقُولُ فِى ءَاخِرِهِ وَصَلِّ اللَّهُمَّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى ءَالِهِ وَصَحْبِهِ وَسَلِّم. وَالإِمَامُ يَأْتِى بِهِ بِلَفْظِ الْجَمْعِ وَيَجْهَرُ بِهِ بِخِلافِ الْمُنْفَرِدِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(241) مَاذَا يُسْتَحَبُّ لِلْمَأْمُومِ أَنْ يَقُولَ عِنْدَ قِرَاءَةِ الإِمَامِ لِدُعَاءِ الْقُنُوتِ.</p><p class=\"answer\">يُؤَمِّنُ الْمَأْمُومُ سِرًّا أَىْ يَقُولُ ءَامِين عَلَى الدُّعَاءِ فِيهِ وَيُشَارِكُ الإِمَامَ فِى الثَّنَاءِ عَلَى اللَّهِ وَأَوَّلُهُ فَإِنَّكَ تَقْضِى وَلا يُقْضَى عَلَيْكَ. وَيُسْتَحَبُّ لِلْمَأْمُومِ أَنْ يُؤَمِّنَ بَعْدَ صَلاةِ الإِمَامِ عَلَى النَّبِىِّ ﷺ لِأَنَّهُ دُعَاءٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(242) مَتَى يَبْدَأُ وَقْتُ الظُّهْرِ وَمَتَى يَنْتَهِى.</p><p class=\"answer\">يَبْدَأُ وَقْتُ الظُّهْرِ بِزَوَالِ الشَّمْسِ أَىْ مَيْلِهَا عَنْ وَسَطِ السَّمَاءِ إِلَى جِهَةِ الْمَغْرِبِ وَيَنْتَهِى إِذَا صَارَ ظِلُّ كُلِّ شَىْءٍ بِقَدْرِ طُولِ الشَّىْءِ زَائِدًا عَلَى ظِلِّ الِاسْتِوَاءِ وَهُوَ ظِلُّ الشَّىْءِ حِينَ تَكُونُ الشَّمْسُ فِى وَسَطِ السَّمَاءِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(243) مَتَى يَبْدَأُ وَقْتُ الْعَصْرِ وَمَتَى يَنْتَهِى.</p><p class=\"answer\">يَبْدَأُ وَقْتُ الْعَصْرِ بِانْتِهَاءِ وَقْتِ الظُّهْرِ وَيَنْتَهِى بِمَغِيبِ كَامِلِ قُرْصِ الشَّمْسِ. وَيُكْرَهُ تَأْخِيرُ الصَّلاةِ إِلَى وَقْتِ الْكَرَاهَةِ بِلا عُذْرٍ وَهُوَ مِقْدَارُ نِصْفِ سَاعَةٍ تَقْرِيبًا قَبْلَ غُرُوبِ الشَّمْسِ، فَمَنْ أَخَّرَهَا إِلَى هَذَا الْوَقْتِ فَلا ثَوَابَ لَهُ فِى صَلاتِهِ وَقِيلَ يَبْقَى لَهُ شَىْءٌ قَلِيلٌ مِنَ الثَّوَابِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(244) مَتَى يَبْدَأُ وَقْتُ الْمَغْرِبِ وَمَتَى يَنْتَهِى.</p><p class=\"answer\">يَبْدَأُ وَقْتُ الْمَغْرِبِ بِمَغِيبِ كَامِلِ قُرْصِ الشَّمْسِ وَيَنْتَهِى بِمَغِيبِ الشَّفَقِ الأَحْمَرِ. وَالشَّفَقُ هُوَ حُمْرَةٌ تَظْهَرُ فِى جِهَةِ الْمَغْرِبِ بَعْدَ غُرُوبِ الشَّمْسِ</p></div>\n<div class=\"qa-item\"><p class=\"question\">(245) مَتَى يَدْخُلُ وَقْتُ صَلاةِ الْعِشَاءِ وَمَتَى يَنْتَهِى.</p><p class=\"answer\">يَدْخُلُ وَقْتُ الْعِشَاءِ بِمَغِيبِ الشَّفَقِ الأَحْمَرِ وَيَبْقَى وَقْتُهُ إِلَى طُلُوعِ الْفَجْرِ الصَّادِقِ بِلا كَرَاهَةٍ. وَالْفَجْرُ الصَّادِقُ هُوَ بَيَاضٌ مُعْتَرِضٌ فِى الأُفُقِ الشَّرْقِىِّ مُخْتَلِطٌ بِحُمْرَةٍ خَفِيفَةٍ يَبْدُو دَقِيقًا ثُمَّ يَنْتَشِرُ وَيَتَوَسَّعُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(246) مَتَى يَدْخُلُ وَقْتُ الصُّبْحِ وَمَتَى يَنْتَهِى.</p><p class=\"answer\">يَدْخُلُ وَقْتُ الصُّبْحِ بِطُلُوعِ الْفَجْرِ الصَّادِقِ وَيَنْتَهِى بِطُلُوعِ أَوَّلِ جُزْءٍ مِنَ الشَّمْسِ. وَيُكْرَهُ تَأْخِيرُ صَّلاةِ الصبح إِلَى وَقْتِ الْكَرَاهَةِ بِلا عُذْرٍ وَهُوَ مِقْدَارُ ثُلُثِ سَاعَةٍ تَقْرِيبًا قَبْلَ طُلُوعِ الشَّمْسِ فَمَنْ أَخَّرَهَا إِلَى هَذَا الْوَقْتِ فَلا ثَوَابَ لَهُ فِى صَلاتِهِ وَقِيلَ يَبْقَى لَهُ شَىْءٌ قَلِيلٌ مِنَ الثَّوَابِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(247) مَا حُكْمُ مَنْ أَخَّرَ الصَّلاةَ إِلَى ءَاخِرِ وَقْتِهَا.</p><p class=\"answer\">إِذَا أَخَّرَ الصَّلاةَ عَمْدًا بِحَيْثُ لا يُدْرِكُهَا فِى الْوَقْتِ فَعَلَيْهِ مَعْصِيَةٌ أَمَّا الَّذِى يُصَلِّى فِى ءَاخِرِ الْوَقْتِ بِحَيْثُ تَكُونُ صَلاتُهُ ضِمْنَ الْوَقْتِ فَلَيْسَ عَلَيْهِ مَعْصِيَةٌ. وَأَمَّا الَّذِى دَخَلَ فِى الصَّلاةِ وَكَانَ الْوَقْتُ يَسَعُ أَرْكَانَ الصَّلاةِ لَكِنَّهُ أَطَالَ فِى الْقِرَاءَةِ فَدَخَلَ وَقْتُ الصَّلاةِ الأُخْرَى صَحَّتْ صَلاتُهُ وَلا إِثْمَ عَلَيْهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(248) إِنْ نَامَ الشَّخْصُ عَنْ صَلاةِ الصُّبْحِ هَلْ يَجِبُ عَلَيْهِ أَنْ يَقْضِيَهَا فَوْرًا بَعْدَ اسْتِيقَاظِهِ وَهَلْ يَجُوزُ لَهُ أَنْ يُؤَخِّرَهَا إِلَى مَا بَعْدَ الزَّوَالِ.</p><p class=\"answer\">إِنْ نَامَ بَعْدَ دُخُولِ وَقْتِ الصُّبْحِ عَمْدًا وَهُوَ يَعْلَمُ أَنَّهُ لا يَسْتَيْقِظُ إِلَّا بَعْدَ خُرُوجِ الْوَقْتِ فَعَلَيْهِ ذَنْبٌ وَيَلْزَمُهُ الْقَضَاءُ فَوْرًا. أَمَّا إِنْ نَامَ قَبْلَ دُخُولِ وَقْتِ الصُّبْحِ وَاسْتَيْقَظَ بَعْدَ خُرُوجِهِ فَلَيْسَ عَلَيْهِ ذَنْبٌ وَلا يَلْزَمُهُ أَنْ يُصَلِّيَهَا فَوْرًا لَكِنْ لا بُدَّ مِنْ قَضَائِهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(249) إِذَا اسْتَيْقَظَ الشَّخْصُ فِى ءَاخِرِ وَقْتِ الصَّلاةِ مَاذَا يَلْزَمُهُ.</p><p class=\"answer\">مَنِ اسْتَيْقَظَ فِى ءَاخِرِ وَقْتِ الصَّلاةِ عَلَيْهِ أَنْ يُسْرِعَ لِإِدْرَاكِ الصَّلاةِ فِى وَقْتِهَا. وَلا يَجُوزُ لَهُ أَنْ يَفْعَلَ سُنَنَ الْوُضُوءِ إِذَا كَانَ الْوَقْتُ يَخْرُجُ بِفِعْلِهَا بَلْ يَقْتَصِرُ عَلَى الْفَرَائِضِ مَرَّةً مَرَّةً. ثُمَّ بَعْدَ دُخُولِهِ فِى الصَّلاةِ لَهُ أَنْ يُطِيلَ فِى الصَّلاةِ مَا شَاءَ حَتَّى لَوْ خَرَجَ الْوَقْتُ، لَيْسَ عَلَيْهِ ذَنْبٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(250) اذْكُرْ عُذْرًا مِنَ الأَعْذَارِ الَّتِى تُبِيحُ الْجَمْعَ بَيْنَ صَلاتَيْنِ تَقْدِيمًا أَوْ تَأْخِيرًا.</p><p class=\"answer\">يَجُوزُ تَقْدِيمُ الصَّلاةِ عَلَى وَقْتِهَا وَتَأْخِيرُهَا عَنْهُ لِعُذْرٍ كَالسَّفَرِ فَيَجُوزُ لِلْمُسَافِرِ سَفَرًا طَوِيلًا فِى غَيْرِ مَعْصِيَةٍ أَنْ يَجْمَعَ بَيْنَ صَلاتَىِ الظُّهْرِ وَالْعَصْرِ وَبَيْنَ صَلاتَىِ الْمَغْرِبِ وَالْعِشَاءِ تَقْدِيمًا أَوْ تَأْخِيرًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(251) مَا هِىَ شُرُوطُ جَمْعِ التَّقْدِيمِ.</p><p class=\"answer\">يُشْتَرَطُ لِجَمْعِ التَّقْدِيمِ أَنْ يَبْدَأَ بِالظُّهْرِ قَبْلَ الْعَصْرِ وَبِالْمَغْرِبِ قَبْلَ الْعِشَاءِ وَأَنْ يَنْوِىَ تَقْدِيمَ الْعَصْرِ إِلَى الظُّهْرِ أَثْنَاءَ صَلاةِ الظُّهْرِ أَوْ تَقْدِيمَ الْعِشَاءِ إِلَى الْمَغْرِبِ أَثْنَاءَ صَلاةِ الْمَغْرِبِ وَالْمُوَالاةُ بَيْنَ الصَّلاتَيْنِ أَىْ بَيْنَ الظُّهْرِ وَالْعَصْرِ أَوْ بَيْنَ الْمَغْرِبِ وَالْعِشَاءِ بِأَنْ لا يَفْصِلَ بَيْنَهُمَا بِفَاصِلٍ طَوِيلٍ. وَالْفَاصِلُ الطَّوِيلُ هُوَ مَا يَسَعُ رَكْعَتَيْنِ خَفِيفَتَيْنِ مِنَ الزَّمَنِ أَوْ أَكْثَرَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(252) مَنْ أَرَادَ أَنْ يُقَدِّمَ فَرْضَ الْعَصْرِ إِلَى الظُّهْرِ فَصَلَّى الظُّهْرَ وَنَسِىَ أَنْ يَنْوِىَ تَقْدِيمَ الْعَصْرِ إِلَى الظُّهْرِ هَلْ يَجُوزُ لَهُ أَنْ يَنْوِىَ تَقْدِيمَ الْعَصْرِ إِلَى الظُّهْرِ بَعْدَ الِانْتِهَاءِ مِنْ صَلاةِ الظُّهْرِ وَيُصَلِّىَ الْعَصْرَ فِى وَقْتِ الظُّهْرِ.</p><p class=\"answer\">لَيْسَ لَهُ أَنْ يُقَدِّمَ الْعَصْرَ إِلَى الظُّهْرِ بَلْ يُصَلِّى الْعَصْرَ فِى وَقْتِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(253) مَا هِىَ شُرُوطُ جَمْعِ التَّأْخِيرِ.</p><p class=\"answer\">يُشْتَرَطُ لِجَمْعِ التَّأْخِيرِ أَنْ يَنْوِىَ تَأْخِيرَ الظُّهْرِ إِلَى الْعَصْرِ فِى وَقْتِ الظُّهْرِ وَأَنْ يَنْوِىَ تَأْخِيرَ الْمَغْرِبِ إِلَى الْعِشَاءِ فِى وَقْتِ الْمَغْرِبِ وَلا يَجِبُ التَّرْتِيبُ بَيْنَ الصَّلاتَيْنِ وَلا الْمُوَالاةُ بَيْنَهُمَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(254) مَتَى يَجُوزُ قَصْرُ الصَّلاةِ الرُّبَاعِيَّةِ إِلَى رَكْعَتَيْنِ.</p><p class=\"answer\">مَنْ سَافَرَ فِى غَيْرِ مَعْصِيَةٍ سَفَرَ قَصْرٍ يَجُوزُ لَهُ أَنْ يَقْصُرَ الصَّلاةَ الرُّبَاعِيَّةَ إِلَى رَكْعَتَيْنِ إِذَا فَارَقَ بُنْيَانَ الْبَلَدِ الَّذِى يَعِيشُ فِيهِ وَلا بُدَّ أَنْ يَنْوِىَ الْقَصْرَ أَثْنَاءَ التَّكْبِيرِ أَىْ تَكْبِيرَةِ الإِحْرَامِ. وَمَسَافَةُ الْقَصْرِ ثَمَانِيَةٌ وَأَرْبَعُونَ مِيلًا أَىْ نَحْوُ خَمْسَةٍ وَأَرْبَعِينَ كِيلُو مِتْرًا. وَالْمُسَافِرُ هُوَ مَنْ نَوَى الإِقَامَةَ فِى بَلَدٍ أَقَلَّ مِنْ أَرْبَعَةِ أَيَّامٍ غَيْرَ يَوْمَىِ الدُّخُولِ إِلَى هَذَا الْبَلَدِ وَالْخُرُوجِ مِنْهُ. وَلا يَقْتَدِى مَنْ يُصَلِّى قَصْرًا بِمَنْ يُصَلِّى صَلاةً تَامَّةً وَيَصِحُّ الْعَكْسُ</p></div>\n<div class=\"qa-item\"><p class=\"question\">(255) إِذَا صَلَّى الشَّخْصُ الْجُمُعَةَ وَكَانَ مُسَافِرًا هَلْ يَسْتَطِيعُ أَنْ يُقَدِّمَ فَرْضَ الْعَصْرِ إِلَى الظُّهْرِ وَيُصَلِّيَهُ قَصْرًا.</p><p class=\"answer\">يَجُوزُ لَهُ ذَلِكَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(256) مَا هُوَ الْفَرْضُ الأَوَّلُ فِى حَقِّ الأَهْلِ.</p><p class=\"answer\">الْفَرْضُ الأَوَّلُ فِى حَقِّ الأَهْلِ كَالأَوْلادِ تَعْلِيمُهُمْ أُصُولَ الْعَقِيدَةِ كَيْلا يَقَعُوا فِى الْكُفْرِ بِسَبَبِ الْجَهْلِ فَإِنَّ الأَوْلادَ إِنْ تُرِكُوا بِلا تَعْلِيمٍ قَدْ يَعْتَقِدُونَ أَنَّ اللَّهَ يَسْكُنُ السَّمَاءَ أَوِ الْكَعْبَةَ أَوْ أَنَّهُ جِسْمٌ قَاعِدٌ فَوْقَ الْعَرْشِ فَإِنِ اعْتَقَدُوا ذَلِكَ وَاسْتَمَرُّوا عَلَيْهِ بَعْدَ الْبُلُوغِ إِلَى الْمَمَاتِ فَإِنَّهُمْ يُخَلَّدُونَ فِى نَارِ جَهَنَّمَ أَعَاذَنَا اللَّهُ مِنْهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(257) مَتَى يَجِبُ عَلَى وَلِىِّ الصَّبِىِّ وَالصَّبِيَّةِ أَنْ يَأْمُرَهُمَا بِالصَّلاةِ.</p><p class=\"answer\">يَجِبُ عَلَى وَلِىِّ الصَّبِىِّ وَالصَّبِيَّةِ الْمُمَيِّزَيْنِ أَنْ يَأْمُرَهُمَا بِالصَّلاةِ بَعْدَ تَمَامِ سَبْعِ سِنِينَ قَمَرِيَّةٍ. وَيَكُونُ الأَمْرُ بِالصَّلاةِ بَعْدَ تَعْلِيمِ أَحْكَامِهَا. وَيَجُوزُ أَمْرُهُمَا بِالصَّلاةِ إِنْ حَصَلَ التَّمْيِيزُ قَبْلَ بُلُوغِ سَبْعِ سِنِينَ وَلا يَجِبُ وَلا يُؤْمَرُ الْوَلَدُ بِالصَّلاةِ إِنْ لَمْ يَكُنْ مُمَيِّزًا لِأَنَّ الصَّلاةَ لا تَصِحُّ مِنْهُ. وَالتَّمْيِيزُ هُوَ أَنْ يَفْهَمَ الْوَلَدُ السُّؤَالَ وَيَرُدَّ الْجَوَابَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(258) هَلْ يَجِبُ عَلَى الْوَلِىِّ أَنْ يَأْمُرَ الصَّبِىَّ الْمُمَيِّزَ بِصَلاةِ الْجَمَاعَةِ وَالْجُمُعَةِ.</p><p class=\"answer\">يَجِبُ عَلَى الْوَلِىِّ أَنْ يَأْمُرَ الصَّبِىَّ الْمُمَيِّزَ بِصَلاةِ الْجَمَاعَةِ وَالْجُمُعَةِ وَلَيْسَ شَرْطًا أَنْ يَأْخُذَهُ لِكُلِّ جَمَاعَةٍ لَكِنْ يَأْخُذُهُ لِكُلِّ جُمُعَةٍ وَيَجِبُ عَلَيْهِ أَنْ يُوقِظَهُ فِى بَعْضِ الأَيَّامِ لِلصَّلاةِ إِنْ نَامَ قَبْلَ دُخُولِ الْوَقْتِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(259) مَا هِىَ شُرُوطُ وُجُوبِ الصَّلاةِ.</p><p class=\"answer\">شُرُوطُ وُجُوبِ الصَّلاةِ أَرْبَعَةٌ الإِسْلامُ وَالْبُلُوغُ وَالْعَقْلُ وَالطَّهَارَةُ مِنَ الْحَيْضِ وَالنِّفَاسِ فَتَجِبُ الصَّلاةُ عَلَى الطَّاهِرِ وَلا تَجِبُ عَلَى الْحَائِضِ وَالنُّفَسَاءِ</p></div>\n<div class=\"qa-item\"><p class=\"question\">(260) مَا هِىَ شُرُوطُ صِحَّةِ الصَّلاةِ.</p><p class=\"answer\">مِنْ شُرُوطِ صِحَّةِ الصَّلاةِ الإِسْلامُ وَالتَّمْيِيزُ وَمَعْرِفَةُ دُخُولِ وَقْتِ الصَّلاةِ وَاسْتِقْبَالُ الْقِبْلَةِ وَسَتْرُ الْعَوْرَةِ وَالْعِلْمُ بِفَرْضِيَّتِهَا إِنْ كَانَتِ الصَّلاةُ فَرْضًا وَأَنْ لا يَعْتَقِدَ فَرْضًا مِنْ فُرُوضِهَا سُنَّةً وَالطَّهَارَةُ عَنِ الْحَدَثَيْنِ الأَصْغَرِ وَالأَكْبَرِ وَعَنِ النَّجَاسَةِ غَيْرِ الْمَعْفُوِّ عَنْهَا فِى الْبَدَنِ وَالثَّوْبِ وَالْمَكَانِ وَالْمَحْمُولِ لَهُ كَالشَّىْءِ الَّذِى يَحْمِلُهُ فِى جَيْبِهِ كَقِنِّينَةٍ أَوْ وَرَقَةٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(261) تَكَلَّمْ عَنْ سَتْرِ الْعَوْرَةِ فِى الصَّلاةِ.</p><p class=\"answer\">مِنْ شُرُوطِ صِحَّةِ الصَّلاةِ سَتْرُ الْعَوْرَةِ وَيَكُونُ السَّتْرُ بِمَا يَسْتُرُ لَوْنَ الْبَشَرَةِ وَالشَّعَرِ. وَعَوْرَةُ الذَّكَرِ مَا بَيْنَ سُرَّتِهِ وَرُكْبَتِهِ وَعَوْرَةُ الأُنْثَى الْحُرَّةِ أَىْ غَيْرِ الْمَمْلُوكَةِ جَمِيعُ بَدَنِهَا إِلَّا الْوَجْهَ وَالْكَفَّيْنِ. وَيَجِبُ السَّتْرُ مِنْ كُلِّ الْجَوَانِبِ وَالأَعْلَى وَلا يَجِبُ مِنَ الأَسْفَلِ أَىْ مِمَّا هُوَ أَسْفَلُ مِنَ الْعَوْرَةِ. أَمَّا إِذَا لَبِسَتِ الْمَرْأَةُ سِرْوَالًا وَاسِعَ الأَسْفَلِ لا يُغَطِّى الْقَدَمَيْنِ بَلْ هُوَ إِلَى مَا فَوْقَ ذَلِكَ وَلَبِسَتْ تَحْتَهُ جَوْرَبًا إِلَى نِصْفِ السَّاقِ فَلا تَصِحُّ صَلاتُهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(262) مَا هُوَ اللِّبَاسُ الْمُسْتَحَبُّ فِى الصَّلاةِ.</p><p class=\"answer\">يُسْتَحَبُّ لِلْمَرْأَةِ أَنْ تُصَلِّىَ فِى ثَلاثَةِ أَثْوَابٍ قَمِيصٍ طَوِيلٍ وَخِمَارٍ يَسْتُرُ الرَّأْسَ وَالْعُنُقَ وَسِرْوَالٍ وَيُسْتَحَبُّ لِلرَّجُلِ أَنْ يُصَلِّىَ فِى ثَوْبَيْنِ قَمِيصٍ طَوِيلٍ وَرِدَاءٍ يَضَعُهُ عَلَى كَتِفَيْهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(263) مَا هِىَ شُرُوطُ قَبُولِ الصَّلاةِ.</p><p class=\"answer\">شُرُوطُ قَبُولِ الصَّلاةِ هِىَ شُرُوطٌ لِنَيْلِ الثَّوَابِ وَهِىَ أَنْ يَقْصِدَ بِصَلاتِهِ وَجْهَ اللَّهِ وَحْدَهُ وَأَنْ يَكُونَ مَأْكَلُهُ الَّذِى فِى بَطْنِهِ أَثْنَاءَ صَلاتِهِ وَمَلْبُوسُهُ الَّذِى يَلْبَسُهُ أَثْنَاءَ صَلاتِهِ وَالْمَكَانُ الَّذِى يُصَلِّى فِيهِ حَلالًا وَأَنْ يَخْشَعَ لِلَّهِ قَلْبُهُ فِيهَا وَلَوْ لَحْظَةً. أَمَّا مَنْ لَمْ يَخْشَعْ فِى صَلاتِهِ أَوْ كَانَ مَأْكَلُهُ أَوْ مَلْبُوسُهُ أَوْ مَكَانُ صَلاتِهِ حَرَامًا فَلا ثَوَابَ لَهُ فِى صَلاتِهِ مَعَ كَوْنِهَا صَحِيحَةً لِأَنَّهُ أَتَى بِأَرْكَانِهَا وَشُرُوطِهَا وَاجْتَنَبَ مُبْطِلاتِهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(264) مَا مَعْنَى الْخُشُوعِ.</p><p class=\"answer\">الْخُشُوعُ هُوَ اسْتِشْعَارُ الْخَوْفِ مِنَ اللَّهِ خَوْفَ الإِجْلالِ وَالتَّعْظِيمِ أَوِ اسْتِشْعَارُ مَحَبَّتِهِ وَتَعْظِيمِهِ وَأَمَّا مُجَرَّدُ اسْتِحْضَارِ الْخَوْفِ مِنْ عَذَابِ اللَّهِ فِى الْقَلْبِ فَلا يُسَمَّى خُشُوعًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(265) مَا حُكْمُ الصَّلاةِ فِى غُرْفَةٍ فِيهَا صُوَرُ حَيَوَانَاتٍ كَامِلَةٍ.</p><p class=\"answer\">تُكْرَهُ الصَّلاةُ فِى غُرْفَةٍ فِيهَا صُوَرُ حَيَوَانَاتٍ كَامِلَةٍ إِنْ كَانَتْ أَمَامَهُ أَوْ يَنْظُرُ إِلَيْهَا أَمَّا إِنْ كَانَتْ فِى نَحْوِ خِزَانَةٍ بِحَيْثُ لا يَرَاهَا فَلا تَمْنَعُ عَنْهُ الثَّوَابَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(266) مَا حُكْمُ الصَّلاةِ فِى ثِيَابٍ عَلَيْهَا صُورَةُ حَيَوَانٍ.</p><p class=\"answer\">تُكْرَهُ الصَّلاةُ فِى ثِيَابٍ عَلَيْهَا صُورَةُ حَيَوَانٍ كَامِلٍ أَوْ جُزْءٍ مِنْ حَيَوَانٍ كَوَجْهِهِ فَمَنْ صَلَّى بِثَوْبٍ عَلَيْهِ صُورَةُ حَيَوَانٍ كَامِلٍ أَوْ جُزْءٍ مِنْ حَيَوَانٍ لا ثَوَابَ لَهُ فِى صَلاتِهِ وَقِيلَ يَبْقَى لَهُ شَىْءٌ مِنَ الثَّوَابِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(267) مَا حُكْمُ مَنْ جَهَرَ فِى صَلاتِهِ فِى مَوْضِعِ الإِسْرَارِ أَوْ أَسَرَّ فِى مَوْضِعِ الْجَهْرِ.</p><p class=\"answer\">مَنْ جَهَرَ فِى صَلاتِهِ فِى مَوْضِعِ الإِسْرَارِ أَوْ أَسَرَّ فِى مَوْضِعِ الْجَهْرِ وَقَعَ فِى الْكَرَاهَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(268) مَا هِىَ الصَّلَوَاتُ السِّرِيَّةُ وَالصَّلَوَاتُ الْجَهْرِيَّةُ.</p><p class=\"answer\">الصَّلَوَاتُ السِّرِيَّةُ أَىِ الَّتِى يَقْرَأُ الشَّخْصُ فِيهَا الْفَاتِحَةَ وَمَا بَعْدَهَا سِرًّا أَىْ بِحَيْثُ يُسْمِعُ نَفْسَهُ فَقَطْ هِىَ الظُّهْرُ وَالْعَصْرُ وَالصَّلَوَاتُ الْجَهْرِيَّةُ هِىَ الْمَغْرِبُ وَالْعِشَاءُ وَالصُّبْحُ وَيَجْهَرُ بِهَا الْمُنْفَرِدُ وَالإِمَامُ فِى الرَّكْعَتَيْنِ الأُولَيَيْنِ فِى قِرَاءَةِ الْقُرْءَانِ وَقَوْلِ ءَامِين. أَمَّا مَنْ أَرَادَ أَنْ يَقْضِىَ صَلاةً جَهْرِيَّةً فِى وَقْتِ صَلاةٍ سِرِيَّةٍ كَالصُّبْحِ فِى وَقْتِ الظُّهْرِ أَوْ أَرَادَ أَنْ يَقْضِىَ الصُّبْحَ قَبْلَ أَنْ يَدْخُلَ وَقْتُ الظُّهْرِ فَإِنَّهُ يُسِرُّ بِهَا. وَالْمَرْأَةُ تَجْهَرُ فِى مَوْضِعِ الْجَهْرِ إِنْ لَمْ يَحْضُرْهَا أَجْنَبِىٌّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(269) اذْكُرْ بَعْضَ مُبْطِلاتِ الصَّلاةِ.</p><p class=\"answer\">تَبْطُلُ الصَّلاةُ بِالْكَلامِ وَلَوْ بِحَرْفَيْنِ أَوْ بِحَرْفٍ مُفْهِمٍ لَهُ مَعْنًى إِلَّا أَنْ نَسِىَ أَنَّهُ فِى الصَّلاةِ وَكَانَ الْكَلامُ قَلِيلًا. وَتَبْطُلُ الصَّلاةُ بِالرِّدَّةِ أَىِ الْكُفْرِ وَالْعِيَاذُ بِاللَّهِ وَبِالْفِعْلِ الْكَثِيرِ وَهُوَ مَا يَسَعُ قَدْرَ رَكْعَةٍ مِنَ الزَّمَنِ وَكَانَ مُتَوَالِيًا وَبِالْحَرَكَةِ الْوَاحِدَةِ لِلَّعِبِ وَبِالأَكْلِ وَالشُّرْبِ إِلَّا أَنْ نَسِىَ أَنَّهُ فِى الصَّلاةِ وَكَانَ أَكْلُهُ أَوْ شُرْبُهُ قَلِيلًا. وَتَبْطُلُ الصَّلاةُ بِالْحَدَثِ وَانْكِشَافِ الْعَوْرَةِ وَاسْتِدْبَارِ الْقِبْلَةِ وَتَغَيُّرِ النِّيَّةِ كَأَنْ نَوَى قَطْعَ الصَّلاةِ وَزِيَادَةِ رُكْنٍ فِعْلِىٍّ عَمْدًا وَمُضِىِّ رُكْنٍ مَعَ الشَّكِّ فِى نِيَّةِ الصَّلاةِ أَوْ طَالَ وَقْتُ الشَّكِّ كَأَنْ قَرَأَ سُورَةَ الْمُلْكِ وَهُوَ شَاكٌّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(270) اذْكُرْ أَرْكَانَ الصَّلاةِ.</p><p class=\"answer\">أَرْكَانُ الصَّلاةِ سَبْعَةَ عَشَرَ رُكْنًا وَهِىَ النِّيَّةُ كَأَنْ يَقُولَ بِقَلْبِهِ أُصَلِّى فَرْضَ الْعَصْرِ، وَتَكْبِيرَةُ الإِحْرَامِ أَىْ قَوْلُ اللَّهُ أَكْبَر، وَالْقِيَامُ فِى صَلاةِ الْفَرْضِ لِلْقَادِرِ، وَقِرَاءَةُ الْفَاتِحَةِ، وَالرُّكُوعُ وَهُوَ أَنْ يَنْحَنِىَ بِحَيْثُ تَصِلُ رَاحَتَا يَدَيْهِ إِلَى رُكْبَتَيْهِ مَعَ اعْتِدَالِ الْخِلْقَةِ وَالطُّمَأْنِينَةُ فِيهِ وَهِىَ سُكُونُ كُلِّ عَظْمٍ مَكَانَهُ دَفْعَةً وَاحِدَةً بِأَنْ يَفْصِلَ بَيْنَ حَرَكَةِ النُّزُولِ لِلرُّكُوعِ وَحَرَكَةِ الرَّفْعِ مِنَ الرُّكُوعِ بِقَدْرِ سُبْحَانَ اللَّهِ أَىْ بِحَيْثُ لا يَصِيرَانِ حَرَكَةً وَاحِدَةً، وَالِاعْتِدَالُ وَهُوَ عَوْدُ الرَّاكِعِ إِلَى مَا كَانَ عَلَيْهِ قَبْلَ رُكُوعِهِ وَالطُّمَأْنِينَةُ فِيهِ، وَالسُّجُودُ مَرَّتَيْنِ بِأَنْ يَضَعَ الْمُصَلِّى جَبْهَتَهُ عَلَى الأَرْضِ مَكْشُوفَةً وَيَضَعَ شَيْئًا مِنْ رُكْبَتَيْهِ وَمِنْ بُطُونِ كَفَّيْهِ وَمِنْ بُطُونِ أَصَابِعِ رِجْلَيْهِ، وَالطُّمَأْنِينَةُ فِيهِ أَىْ فِى السُّجُودِ، وَالْجُلُوسُ بَيْنَ السَّجْدَتَيْنِ وَالطُّمَأْنِينَةُ فِيهِ، وَالْجُلُوسُ لِلتَّشَهُّدِ الأَخِيرِ وَمَا بَعْدَهُ مِنَ الصَّلاةِ عَلَى النَّبِىِّ وَالسَّلامِ، وَالتَّشَهُّدُ الأَخِيرُ وَهُوَ أَنْ يَقُولَ التَّحِيَّاتُ لِلَّهِ سَلامٌ عَلَيْكَ أَيُّهَا النَّبِىُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُه سَلامٌ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِين أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّه وَأَنَّ مُحَمَّدًا رَسُولُ اللَّه، وَالصَّلاةُ عَلَى النَّبِىِّ كَأَنْ يَقُولَ اللَّهُمَّ صَلِّ عَلَى مُحَمَّد، وَالسَّلامُ أَىْ قَوْلُ السَّلامُ عَلَيْكُمْ، وَتَرْتِيبُ الأَرْكَانِ كَمَا ذُكِرَتْ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(271) مَا هِىَ الأَرْكَانُ الْقَوْلِيَّةُ فِى الصَّلاةِ.</p><p class=\"answer\">الأَرْكَانُ الْقَوْلِيَّةُ فِى الصَّلاةِ خَمْسَةٌ تَكْبِيرَةُ الإِحْرَامِ وَقِرَاءَةُ الْفَاتِحَةِ وَالتَّشَهُّدُ الأَخِيرُ وَالصَّلاةُ عَلَى النَّبِىِّ وَالسَّلامُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(272) مَا حُكْمُ مَنْ صَلَّى الْفَرْضَ قَاعِدًا وَهُوَ يَسْتَطِيعُ الْقِيَامَ.</p><p class=\"answer\">مَنْ صَلَّى الْفَرْضَ قَاعِدًا وَهُوَ يَسْتَطِيعُ الْقِيَامَ لا تَصِحُّ صَلاتُهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(273) كَيْفَ يُصَلِّى مَنْ كَانَ عَاجِزًا عَنِ الْقِيَامِ.</p><p class=\"answer\">اعْلَمْ أَنَّ الصَّلاةَ لا تَسْقُطُ عَنِ الْمُسْلِمِ مَا دَامَ فِى عَقْلِهِ فَإِذَا عَجَزَ عَنِ الْقِيَامِ فِى صَلاةِ الْفَرْضِ بِأَنْ كَانَتْ تَلْحَقُهُ مَشَقَّةٌ شَدِيدَةٌ لا تُحْتَمَلُ عَادَةً فِى قِيَامِهِ صَلَّى قَاعِدًا وَيَكُونُ رُكُوعُهُ بِأَنْ يُحَاذِىَ رَأْسُهُ مَا قُدَّامَ رُكْبَتَيْهِ وَيَكُونُ سُجُودُهُ أَخْفَضَ مِنْ رُكُوعِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(274) اذْكُرْ بَعْضَ سُنَنِ الصَّلاةِ.</p><p class=\"answer\">لِلصَّلاةِ سُنَنٌ تَتَقَدَّمُهَا مِنْهَا الأَذَانُ وَإِقَامَةُ الصَّلاةِ وَأَنْ يُصَلِّىَ الرَّجُلُ فِى ثَوْبَيْنِ قَمِيصٍ طَوِيلٍ وَرِدَاءٍ وَأَنْ يَضَعَ عَلَى رَأْسِهِ قَلَنْسُوَةً. وَيُسَنُّ لَهُ أَنْ يَسْتَاكَ وَأَنْ يَتَّخِذَ سُتْرَةً كَشَىْءٍ مُرْتَفِعٍ قَدْرَ ثُلُثَىْ ذِرَاعٍ فَأَكْثَرَ وَيَكْفِى سَجَّادَةُ الصَّلاةِ الْمَعْرُوفَةُ. وَيُسَنُّ أَنْ يُفَرِّجَ بَيْنَ قَدَمَيْهِ شِبْرًا وَأَنْ يَخْفِضَ رَأْسَهُ إِلَى الأَمَامِ قَلِيلًا وَأَنْ يَنْظُرَ إِلَى مَوْضِعِ سُجُودِهِ لِأَنَّهُ أَقْرَبُ لِلْخُشُوعِ إِلَّا عِنْدَ رَفْعِهِ السَّبَّابَةَ فِى التَّشَهُّدِ فَيَنْظُرُ إِلَيْهَا ويَخْفِضُهَا قَلِيلًا اتِّبَاعًا لِلسُّنَّةِ. وَيُسَنُّ أَنْ يَقُولَ اللَّهُمَّ ءَاتِنِى أَفْضَلَ مَا تُؤْتِى عِبَادَكَ الصَّالِحِينَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(275) هَلْ يُسَنُّ الأَذَانُ وَالإِقَامَةُ لِمَنْ يُصَلِّى مُنْفَرِدًا وَلِلْمَرْأَةِ.</p><p class=\"answer\">يُسَنُّ لِلرَّجُلِ وَلَوْ صَلَّى مُنْفَرِدًا أَنْ يُؤَذِّنَ وَيُقِيمَ أَمَّا الْمَرْأَةُ فَإِنَّهَا تُقِيمُ الصَّلاةَ لِنَفْسِهَا ولا تُؤَذِّنُ، وَتُؤَذِّنُ وَتُقِيمُ فِى النِّسَاءِ بِدُونِ رَفْعِ الصَّوْتِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(276) مَا هُوَ الأَذَانُ.</p><p class=\"answer\">الأَذَانُ هُوَ الإِعْلامُ بِدُخُولِ وَقْتِ الصَّلاةِ الْمَفْرُوضَةِ لِيَجْتَمِعَ النَّاسُ لَهَا وَأَلْفَاظُ الأَذَانِ هِىَ</p></div>\n<p>اللَّهُ أَكْبَرُ اللَّهُ أَكْبَر، اللَّهُ أَكْبَرُ اللَّهُ أَكْبَر.</p>\n<p>أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّه، أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّه.</p>\n<p>أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّه، أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّه.</p>\n<p>حَىَّ عَلَى الصَّلاة، حَىَّ عَلَى الصَّلاة، حَىَّ عَلَى الْفَلاح، حَىَّ عَلَى الْفَلاح.</p>\n<p>اللَّهُ أَكْبَرُ اللَّهُ أَكْبَر، لا إِلَهَ إِلَّا اللَّه.</p>\n<p>وَيُسَنُّ أَنْ يَزِيدَ الْمُؤَذِّنُ فِى أَذَانِ الصُّبْحِ بَعْدَ قَوْلِهِ حَىَّ عَلَى الْفَلاحِ الثَّانِيَةِ الصَّلاةُ خَيْرٌ مِنَ النَّوْم مَرَّتَيْنِ. وَمَعْنَى حَىَّ عَلَى الْفَلاحِ أَقْبِلْ إِلَى الْفَلاحِ وَهِىَ الصَّلاةُ.</p>\n<div class=\"qa-item\"><p class=\"question\">(277) مَاذَا يُسَنُّ لِلْمُؤَذِّنِ أَنْ يقُولَ بَعْدَ الأَذَانِ.</p><p class=\"answer\">يُسَنُّ لَهُ أَنْ يُصَلِّىَ عَلَى النَّبِىِّ ﷺ ثُمَّ يَقُولَ اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ وَالصَّلاةِ الْقَائِمَةِ ءَاتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِى وَعَدْتَهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(278) مَا هِىَ الإِقَامَةُ.</p><p class=\"answer\">الإِقَامَةُ هِىَ الدَّعْوَةُ إِلَى تَأْدِيَةِ الصَّلاةِ وَأَلْفَاظُ الإِقَامَةِ اللَّهُ أَكْبَرُ اللَّهُ أَكْبَر، أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّه، أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّه، حَىَّ عَلَى الصَّلاةِ حَىَّ عَلَى الْفَلاح، قَدْ قَامَتِ الصَّلاةُ قَدْ قَامَتِ الصَّلاة، اللَّهُ أَكْبَرُ اللَّهُ أَكْبَر، لا إِلَهَ إِلَّا اللَّه. وَمَعْنَى قَدْ قَامَتِ الصَّلاةُ اقْتَرَبَ وَحَانَ وَقْتُ أَدَائِهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(279) مَا حُكْمُ الدُّعَاءِ بَيْنَ الأَذَانِ وَالإِقَامَةِ.</p><p class=\"answer\">يُسَنُّ الدُّعَاءُ بَيْنَ الأَذَانِ وَالإِقَامَةِ لِكُلٍّ مِنَ الْمُؤَذِّنِ وَالسَّامِعِ لِحَدِيثِ الدُّعَاءُ بَيْنَ الأَذَانِ وَالإِقَامَةِ مُسْتَجَابٌ رَوَاهُ أَبُو يَعْلَى.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(280) مَا هِىَ الْمَوَاضِعُ الَّتِى يُشْرَعُ الدُّعَاءُ فِيهَا فِى الصَّلاةِ.</p><p class=\"answer\">يُشْرَعُ الدُّعَاءُ بَعْدَ افْتِتَاحِ الصَّلاةِ وَفِى اعْتِدَالِ الرَّكْعَةِ الثَّانِيَةِ مِنْ صَلاةِ الصُّبْحِ وَفِى اعْتِدَالِ الرَّكْعَةِ الأَخِيرَةِ مِنْ صَلاةِ الْوِتْرِ فِى النِّصْفِ الأَخِيرِ مِنْ رَمَضَانَ وَفِى اعْتِدَالِ ءَاخِرِ رَكْعَةٍ مِنَ الصَّلاةِ الْمَكْتُوبَةِ عِنْدَ نُزُولِ الْبَلاءِ وَفِى السُّجُودِ وَالْجُلُوسِ بَيْنَ السَّجْدَيْنِ وَبَعْدَ التَّشَهُّدِ الأَخِيرِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(281) مَا هُوَ دُعَاءُ الِافْتِتَاحِ.</p><p class=\"answer\">دُعَاءُ الِافْتِتَاحِ مِنْ سُنَنِ الصَّلاةِ وَيُقْرَأُ قَبْلَ الْفَاتِحَةِ فِى الرَّكْعَةِ الأُولَى وَلَفْظُهُ وَجَّهْتُ وَجْهِىَ لِلَّذِى فَطَرَ السَّمَوَاتِ وَالأَرْضَ حَنِيفًا مُسْلِمًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ إِنَّ صَلاتِى وَنُسُكِى وَمَحْيَاىَ وَمَمَاتِى لِلَّهِ رَبِّ الْعَالَمِينَ لا شَرِيكَ لَهُ وَبِذَلِكَ أُمِرْتُ وَأَنَا مِنَ الْمُسْلِمِينَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(282) كَيْفَ تَكُونُ قِرَاءَةُ الْفَاتِحَةِ صَحِيحَةً.</p><p class=\"answer\">يَجِبُ قِرَاءَةُ الْفَاتِحَةِ بِالْبَسْمَلَةِ وَالتَّشْدِيدَاتِ أَىْ يُشْتَرَطُ ابْتِدَاؤُهَا بِالْبَسْمَلَةِ وَلا بُدَّ أَنْ يَأْتِىَ بِالتَّشْدِيدَاتِ الأَرْبَعَ عَشْرَةَ الَّتِى فِيهَا وَيُشْتَرَطُ مُوَالاتُهَا بِأَنْ لا يَفْصِلَ بَيْنَ كَلِمَاتِهَا بِأَكْثَرَ مِنْ سَكْتَةِ التَّنَفُّسِ بِلا عُذْرٍ وَيُشْتَرَطُ تَرْتِيبُهَا بِأَنْ يَأْتِىَ بِهَا عَلَى نَظْمِهَا الْمَعْرُوفِ وَإِخْرَاجُ الْحُرُوفِ مِنْ مَخَارِجِهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(283) مَا هُوَ أَكْمَلُ التَّشَهُّدِ.</p><p class=\"answer\">أَكْمَلُ التَّشَهُّدِ التَّحِيَّاتُ الْمُبَارَكَاتُ الصَّلَوَاتُ الطَّيِّبَاتُ لِلَّه السَّلامُ عَلَيْكَ أَيُّهَا النَّبِىُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُه السَّلامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِين أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّه وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّه. وَيَجِبُ مُرَاعَاةُ تَشْدِيدَاتِ كَلِمَاتِ التَّشَهُّدِ فَيَجِبُ الإِتْيَانُ بِتَشْدِيدِ الْيَاءِ فِى كَلِمَةِ النَّبِىّ فَإِنَّ مَنْ تَرَكَ الشَّدَّةَ فِيهَا لا تَصِحُّ صَلاتُهُ، وَيَجِبُ الإِتْيَانُ بِحَرْفِ الْهَاءِ فِى كَلِمَةِ وَبَرَكَاتُه. وَلْيُحْذَرْ مِنْ قِرَاءَةِ الصَّالِحِينَ بِالسِّينِ لِفَسَادِ الْمَعْنَى لِأَنَّ مَعْنَى السَّالِحِينَ بِالسِّينِ الْمُتَغَوِّطُونَ أَوْ أَصْحَابُ السِّلاحِ فَإِنَّ مَنْ قَرَأَهَا بِالسِّينِ فَسَدَتْ صَلاتُهُ. وَيَجِبُ الإِتْيَانُ بِالْمَدِّ الطَّبِيعِىِّ فِى كَلِمَةِ عَلَيْنَا وَكَلِمَةِ عَلَى وَمَنْ لَمْ يَأْتِ بِالأَلِفِ فِيهَا فَسَدَتْ صَلاتُهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(284) مَا هُوَ أَقَلُّ الصَّلاةِ عَلَى النَّبِىِّ ﷺ.</p><p class=\"answer\">أَقَلُّ الصَّلاةِ عَلَى النَّبِىِّ ﷺ اللَّهُمَّ صَلِّ عَلَى مُحَمَّد أَوْ صَلَّى اللَّهُ عَلَى مُحَمَّد. أَمَّا قَوْلُ اللَّهُمَّ صَلِّى عَلَى مُحَمَّدٍ بِالْيَاءِ فَلا يَجُوزُ وَمَنْ قَالَ ذَلِكَ فِى صَلاتِهِ فَسَدَتْ صَلاتُهُ أَمَّا مَنْ قَالَ ذَلِكَ وَهُوَ يَعْرِفُ الْمَعْنَى فَإِنَّهُ يَكْفُرُ لِأَنَّهُ خِطَابٌ لِلْأُنْثَى. وَمَعْنَى اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ اللَّهُمَّ زِدْ سَيِّدَنَا مُحَمَّدًا شَرَفًا وَتَعْظِيمًا وَقَدْرًا وَلَيْسَ مَعْنَاهُ أَنَّ اللَّهَ يُشْبِهُنَا وَيُصَلِّى مِثْلَنَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(285) مَا هُوَ أَكْمَلُ الصَّلاةِ عَلَى النَّبِىِّ ﷺ.</p><p class=\"answer\">أَكْمَلُ الصَّلاةِ عَلَى النَّبِىِّ اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى ءَالِ مُحَمَّد كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى ءَالِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيد اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى ءَالِ مُحَمَّد كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى ءَالِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيد.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(286) هَلْ يَكْفِى لِلسَّلامِ فِى الصَّلاةِ أَنْ يَقُولَ سَلامٌ عَلَيْكُمْ.</p><p class=\"answer\">لا يَكْفِى أَنْ يَقُولَ سَلامٌ عَلَيْكُمْ لِأَنَّهُ لا بُدَّ مِنَ الإِتْيَانِ بِأَلْ. وَيُشْتَرَطُ فِى السَّلامِ الْمُوَالاةُ بَيْنَ كَلِمَتَيْهِ بِأَنْ لا يَفْصِلَ بَيْنَهُمَا بِفَاصِلٍ طَوِيلٍ وَكَوْنُهُ مُسْتَقْبِلَ الْقِبْلَةِ إِلَى تَمَامِهِ وَأَنْ يَكُونَ بِحَيْثُ يُسْمِعُ نَفْسَهُ جَمِيعَ حُرُوفِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(287) اذْكُرْ بَعْضَ مَكْرُوهَاتِ الصَّلاةِ.</p><p class=\"answer\">تُكْرَهُ الصَّلاةُ بلِا سُتْرَةٍ بَيْنَ الْمُصَلِّى وَبَيْنَ الْقِبْلَةِ. وَيُكْرَهُ لِلرَّجُلِ أَنْ يَكْشِفَ كَتِفَيْهِ فِى الصَّلاةِ وَأَنْ يُصَلِّىَ بِالثَّوْبِ الطَّوِيلِ الَّذِى يَنْزِلُ إِلَى مَا تَحْتَ الْكَعْبَيْنِ. وَيُكْرَهُ اللِّبَاسُ الضَّيِّقُ لِلنِّسَاءِ فِى الصَّلاةِ وَهُوَ خِلافُ الأَوْلَى لِلرِّجَالِ. وَتُكْرَهُ الصَّلاةُ فِى ثِيَابٍ عَلَيْهَا صُورَةُ حَيَوَانٍ كَامِلٍ أَوْ جُزْءٍ مِنْ حَيَوَانٍ كَوَجْهِهِ وَالصَّلاةُ فِى غُرْفَةٍ فِيهَا صُوَرُ حَيَوَانَاتٍ كَامِلَةٍ أَوْ غَيْرِ كَامِلَةٍ إِنْ كَانَتْ أَمَامَهُ أَوْ يَنْظُرُ إِلَيْهَا. وَيُكْرَهُ رَفْعُ الْبَصَرِ إِلَى السَّمَاءِ وَالِالْتِفَاتُ فِى الصَّلاةِ بِوَجْهِهِ إِلَّا لِحَاجَةٍ. وَيُكْرَهُ أَنْ يَبْسُطَ ذِرَاعَيْهِ فِى السُّجُودِ بَلْ يَنْبَغِى لَهُ رَفْعُهُمَا عَنِ الأَرْضِ. وَيُكْرَهُ تَرْكُ التَّشَهُّدِ الأَوَّلِ عَمْدًا بِلا عُذْرٍ وَالْجَهْرُ فِى مَوْضِعِ الإِسْرَارِ وَالإِسْرَارُ فِى مَوْضِعِ الْجَهْرِ وَمُقَارَنَةُ الإِمَامِ فِى أَفْعَالِ الصَّلاةِ. وَتُكْرَهُ الصَّلاةُ حَالَ كَوْنِهِ مُدَافِعًا لِلْبَوْلِ أَوِ الْغَائِطِ أَوِ الرِّيحِ إِنْ وَسِعَ الْوَقْتُ. وَيُكْرَهُ تَأْخِيرُ الْعَصْرِ إِلَى وَقْتِ الْكَرَاهَةِ بِلا عُذْرٍ وَهُوَ مِقْدَارُ نِصْفِ سَاعَةٍ تَقْرِيبًا قَبْلَ غُرُوبِ الشَّمْسِ، وَيُكْرَهُ تَأْخِيرُ الصُّبْحِ إِلَى وَقْتِ الْكَرَاهَةِ بِلا عُذْرٍ وَهُوَ مِقْدَارُ ثُلُثِ سَاعَةٍ تَقْرِيبًا قَبْلَ طُلُوعِ الشَّمْسِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(288) اذْكُرْ بَعْضَ الأُمُورِ الَّتِى تُخَالِفُ فِيهَا الْمَرْأَةُ الرَّجُلَ فِى الصَّلاةِ.</p><p class=\"answer\">اعْلَمْ أَنَّ الْمَرْأَةَ تُخَالِفُ الرَّجُلَ فِى أُمُورٍ فَالْمَرْأَةُ تُقِيمُ الصَّلاةَ لِنَفْسِهَا ولا تُؤَذِّنُ وَتُؤَذِّنُ وَتُقِيمُ فِى النِّسَاءِ بِدُونِ رَفْعِ الصَّوْتِ وَتَضُمُّ بَعْضَهَا إِلَى بَعْضٍ فَتُلْصِقُ بَطْنَهَا بِفَخِذَيْهَا فِى السُّجُودِ وَتَضُمُّ مِرْفَقَيْهَا لِجَنْبَيْهَا فِى الرُّكُوعِ وَالسُّجُودِ وَتَخْفِضُ صَوْتَهَا فِى مَوْضِعِ الْجَهْرِ بِحَضْرَةِ الرِّجَالِ الأَجَانِبِ، وَعَوْرَتُهَا فِى الصَّلاةِ إِنْ كَانَتْ حُرَّةً جَمِيعُ بَدَنِهَا إِلَّا الْوَجْهَ وَالْكَفَّيْنِ وَإِذَا صَلَّتْ بِنِسْوَةٍ فَإِنَّهَا تَقِفُ وَسَطَ الصَّفِّ الأَوَّلِ مِنْ دُونِ أَنْ تَتَقَدَّمَ عَلَيْهِنَّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(289) مَاذَا يُسَنُّ لِلْمُصَلِّى أَنْ يَقُولَ عَقِبَ صَلاتِهِ.</p><p class=\"answer\">يُسَنُّ لَهُ أَنْ يَسْتَغْفِرَ اللَّهَ ثَلاثًا وَأَنْ يَقُولَ اللَّهُمَّ أَعِنِّى عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ. وَيُسَنُّ لَهُ أَنْ يَقُولَ اللَّهُمَّ أَنْتَ السَّلامُ وَمِنْكَ السَّلامُ تَبَارَكْتَ يَا ذَا الْجَلالِ وَالإِكْرَامِ. وَيُسَنُّ أَنْ يَقْرَأَ عَقِبَ كُلِّ صَلاةٍ ءَايَةَ الْكُرْسِىِّ وَيُسْتَحَبُّ أَنْ يَقْرَأَ الْمُعَوِّذَتَيْنِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(290) مَاذَا يُسَنُّ لِلْمُصَلِّى أَنْ يَقُولَ عَقِبَ صَلاةِ الصُّبْحِ وَالْمَغْرِبِ.</p><p class=\"answer\">رَوَى التِّرْمِذِىُّ أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ مَنْ قَالَ عَقِبَ صَلاةِ الْمَغْرِبِ وَهُوَ ثَانٍ رِجْلَهُ قَبْلَ أَنْ يَتَكَلَّمَ (أَىْ بِكَلامِ النَّاسِ) لا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لا شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ يُحْيِى وَيُمِيتُ وَهُوَ عَلَى كُلِّ شَىءٍ قَدِيرٌ عَشْرَ مَرَّاتٍ كُتِبَتْ لَهُ عَشْرُ حَسَنَاتٍ مُوجِبَاتٍ (أَىْ لِدُخُولِ الْجَنَّةِ) وَمُحِيَتْ عَنْهُ عَشْرُ سَيِّئَاتٍ مُوبِقَاتٍ (أَىْ مِنَ الْكَبَائِرِ) وَإِنْ فَعَلَ مِثْلَ ذَلِكَ بَعْدَ صَلاةِ الْفَجْرِ فَلَهُ مِثْلُ ذَلِكَ. وَهَذَا لِمَنْ صَلَّى الصَّلاةَ فِى وَقْتِهَا. وَيُسْتَحَبُّ أَنْ يَقُولَ عَقِبَ صَلاةِ الْمَغْرِبِ وَالصُّبْحِ وَقَبْلَ أَنْ يَتَكَلَّمَ سَبْعَ مَرَّاتٍ اللَّهُمَّ أَجِرْنِى مِنَ النَّار وَثَلاثَ مَرَّاتٍ اللَّهُمَّ أَدْخِلْنِى الْجَنَّةَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(291) مَاذَا يَفْعَلُ مَنْ شَكَّ فِى عَدَدِ رَكَعَاتِ الصَّلاةِ.</p><p class=\"answer\">مَنْ شَكَّ أَثْنَاءَ صَلاتِهِ فِى عَدَدِ الرَّكَعَاتِ كَأَنْ شَكَّ هَلْ صَلَّى ثَلاثًا أَوْ أَرْبَعًا فَإِنَّهُ يَأْخُذُ بِالْيَقِينِ وَهُوَ الثَّلاثُ وَيَأْتِى بِرَكْعَةٍ. أَمَّا إِنْ حَصَلَ الشَّكُّ بَعْدَ السَّلامِ فَلا يَضُرُّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(292) مَا حُكْمُ مَنْ سَلَّمَ مِنْ صَلاتِهِ ثُمَّ تَيَقَّنَ أَنَّهُ تَرَكَ رَكْعَةً.</p><p class=\"answer\">مَنْ سَلَّمَ مِنْ صَلاتِهِ ثُمَّ تَيَقَّنَ أَنَّهُ تَرَكَ رَكْعَةً لَزِمَهُ أَنْ يَأْتِىَ بِهَا وَلَوْ تَكَلَّمَ بِكَلامٍ قَلِيلٍ أَوِ اسْتَدْبَرَ الْقِبْلَةَ مَا لَمْ يَطُلِ الْفَصْلُ، أَمَّا إِنْ طَالَ الْفَصْلُ فَيَلْزَمُهُ إِعَادَةُ الصَّلاةِ. وَالْفَاصِلُ الطَّوِيلُ هُوَ مِقْدَارُ رَكْعَتَيْنِ خَفِيفَتَيْنِ فَأَكْثَر.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(293) مَا هُوَ الْفَرْضُ الْعَيْنِىُّ وَالْفَرْضُ الْكِفَائِىُّ.</p><p class=\"answer\">الْفَرْضُ الْعَيْنِىُّ هُوَ الَّذِى يَجِبُ عَلَى كُلِّ مُكَلَّفٍ فِعْلُهُ كَأَدَاءِ الصَّلَوَاتِ الْخَمْسِ أَمَّا الْفَرْضُ الْكِفَائِىُّ فَلا يَجِبُ عَلَى كُلِّ مُكَلَّفٍ بِعَيْنِهِ بَلْ يَكْفِى أَنْ يَقُومَ بِهِ بَعْضُ الْمُكَلَّفِينَ كَصَلاةِ الْجِنَازَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(294) هَلْ يَجِبُ أَدَاءُ الصَّلَوَاتِ الْخَمْسِ جَمَاعَةً.</p><p class=\"answer\">أَدَاءُ الصَّلَوَاتِ الْخَمْسِ جَمَاعَةً فَرْضُ كِفَايَةٍ عَلَى الذُّكُورِ الأَحْرَارِ الْمُقِيمِينَ الْبَالِغِينَ الْعَاقِلِينَ غَيْرِ الْمَعْذُورِينَ. وَالْمُقِيمُ هُوَ مَنْ نَوَى الإِقَامَةَ فِى بَلَدٍ أَرْبَعَةَ أَيَّامٍ أَوْ أَكْثَرَ غَيْرَ يَوْمَىِ الدُّخُولِ وَالْخُرُوجِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(295) كَيْفَ يَقِفُ الْمَأْمُومُ فِى صَلاةِ الْجَمَاعَةِ.</p><p class=\"answer\">يُسَنُّ لِلْمَأْمُومِ فِى الصَّلاةِ أَنْ يَقِفَ عَنْ يَمِينِ الإِمَامِ وَيُكْرَهُ لَهُ أَنْ يَقِفَ عَنْ يَسَارِهِ أَوْ خَلْفَهُ. أَمَّا إِذَا كَانَا اثْنَيْنِ فَيُسَنُّ لَهُمَا أَنْ يَقِفَا خَلْفَهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(296) مَا حُكْمُ مُقَارَنَةِ الْمَأْمُومِ لِلإِمَامِ فِى الْمَوْقِفِ أَوِ التَّقَدُّمِ عَلَيْهِ.</p><p class=\"answer\">لَوْ قَارَنَ الإِمَامَ فِى الْمَوْقِفِ وَلَمْ يَتَقَدَّمْ عَلَيْهِ لا تَبْطُلُ صَلاتُهُ أَمَّا لَوْ تَقَدَّمَ عَلَيْهِ فَلا تَصِحُّ صَلاتُهُ. وَالْعِبْرَةُ بِالْمُقَارَنَةِ أَوِ التَّقَدُّمِ بِعَقِبِ الرِّجْلِ فِى الْقَائِمِ أَىْ مُؤَخَّرِ قَدَمِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(297) مَا حُكْمُ مُقَارَنَةِ الْمَأْمُومِ لِلإِمَامِ فِى تَكْبِيرَةِ الإِحْرَامِ أَوِ التَّقَدُّمِ عَلَيْهِ.</p><p class=\"answer\">لَوْ قَارَنَ الإِمَامَ فِى تَكْبِيرَةِ الإِحْرَامِ أَوْ تَقَدَّمَ عَلَيْهِ لا تَصِحُّ صَلاتُهُ فَيَجِبُ تَأْخِيرُ جَمِيعِ تَكْبِيرَةِ الْمَأْمُومِ عَنْ جَمِيعِ تَكْبِيرَةِ الإِمَامِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(298) مَا حُكْمُ تَقَدُّمِ الْمَأْمُومِ عَلَى الإِمَامِ بِرُكْنٍ فِعْلِىٍّ عَمْدًا.</p><p class=\"answer\">لَوْ تَقَدَّمَ الْمَأْمُومُ عَلَى الإِمَامِ بِرُكْنٍ فِعْلِىٍّ عَمْدًا كَأَنْ رَكَعَ ثُمَّ رَفَعَ رَأْسَهُ مِنَ الرُّكُوعِ وَالإِمَامُ قَائِمٌ وَقَعَ فِى ذَنْبٍ كَبِيرٍ وَلا تَبْطُلُ صَلاتُهُ أَمَّا لَوْ تَقَدَّمَ عَلَى الإِمَامِ بِبَعْضِ الرُّكْنِ لا بِكُلِّهِ فَهُوَ مَكْرُوهٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(299) مَا حُكْمُ تَقَدُّمِ الْمَأْمُومِ عَلَى الإِمَامِ بِرُكْنَيْنِ فِعْلِيَّيْنِ مُتَوَالِيَيْنِ بِلا عُذْرٍ.</p><p class=\"answer\">لَوْ تَقَدَّمَ الْمَأْمُومُ عَلَى الإِمَامِ بِرُكْنَيْنِ فِعْلِيَّيْنِ مُتَوَالِيَيْنِ بِلا عُذْرٍ كَأَنْ رَكَعَ ثُمَّ اعْتَدَلَ ثُمَّ هَوَى لِلسُّجُودِ وَالإِمَامُ قَائِمٌ بَطَلَتْ صَلاتُهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(300) مَا حُكْمُ تَأَخُّرِ الْمَأْمُومِ عَنِ الإِمَامِ بِرُكْنَيْنِ فِعْلِيَّيْنِ مُتَوَالِيَيْنِ بِلا عُذْرٍ.</p><p class=\"answer\">لَوْ تَأَخَّرَ الْمَأْمُومُ عَنِ الإِمَامِ بِرُكْنَيْنِ فِعْلِيَّيْنِ مُتَوَالِيَيْنِ بِلا عُذْرٍ بَطَلَتْ صَلاتُهُ كَأَنْ رَكَعَ الإِمَامُ ثُمَّ اعْتَدَلَ ثُمَّ هَوَى لِلسُّجُودِ وَالْمَأْمُومُ قَائِمٌ. أَمَّا إِنْ كَانَ تَأَخُّرُهُ لِعُذْرٍ كَأَنْ تَأَخَّرَ لِقِرَاءَةِ الْفَاتِحَةِ فَلا تَبْطُلُ صَلاتُهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(301) مَا حُكْمُ تَأَخُّرِ الْمَأْمُومِ عَنِ الإِمَامِ بِأَكْثَرَ مِنْ ثَلاثَةِ أَرْكَانٍ طَوِيلَةٍ وَلَوْ لِعُذْرٍ.</p><p class=\"answer\">لَوْ تَأَخَّرَ الْمَأْمُومُ لِإِتْمَامِ الْفَاتِحَةِ حَتَّى فَرَغَ الإِمَامُ مِنَ الرُّكُوعِ وَالسُّجُودَيْنِ فَجَلَسَ لِلتَّشَهُّدِ أَوْ قَامَ لِرَكْعَةٍ أُخْرَى وَلَمْ يُتَابِعِ الْمَأْمُومُ الإِمَامَ وَلا نَوَى مُفَارَقَتَهُ بَطَلَتْ صَلاتُهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(302) مَاذَا يَفْعَلُ الْمَأْمُومُ إِذَا تَأَخَّرَ عَنِ الإِمَامِ بِأَكْثَرَ مِنْ ثَلاثَةِ أَرْكَانٍ طَوِيلَةٍ لِإِتْمَامِ الْفَاتِحَةِ.</p><p class=\"answer\">يَتْرُكُ الْمَأْمُومُ إِتْمَامَ الْفَاتِحَةِ وَيُوَافِقُ الإِمَامَ فِيمَا هُوَ فِيهِ وَيَأْتِى بِرَكْعَةٍ بَعْدَ سَلامِ إِمَامِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(303) إِذَا شَكَّ الإِمَامُ فِى عَدَدِ رَكَعَاتِ الصَّلاةِ فَأَتَى بِرَكْعَةٍ مَاذَا يَفْعَلُ الْمَأْمُومُ.</p><p class=\"answer\">إِمَّا أَنْ يَنْتَظِرَهُ حَتَّى يُسَلِّمَ مَعَهُ وَإِمَّا أَنْ يَنْوِىَ مُفَارَقَتَهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(304) هَلْ يَجِبُ عَلَى مَنْ صَلَّى خَلْفَ مُحْدِثٍ أَنْ يُعِيدَ صَلاتَهُ.</p><p class=\"answer\">إِنْ أَعْلَمَهُ الإِمَامُ قَبْلَ أَنْ يَنْتَهِىَ مِنْ صَلاتِهِ أَنَّهُ كَانَ عَلَى غَيْرِ وُضُوءٍ يُكْمِلُ صَلاتَهُ وَإِنْ أَعْلَمَهُ بَعْدَ الْفَرَاغِ مِنْ الصَّلاةِ صَحَّتْ صَلاتُهُ فِى مَذْهَبِ الإِمَامِ الشَّافِعِىِّ لِأَنَّهُ لَمْ يَكُنْ عَلَى عِلْمٍ بِحَدَثِ الإِمَامِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(305) مَاذَا يَفْعَلُ الْمَأْمُومُونَ إِذَا انْتَقَضَ وُضُوءُ الإِمَامِ فِى صَلاةٍ مَكْتُوبَةٍ.</p><p class=\"answer\">إِذَا انْتَقَضَ وُضُوءُ الإِمَامِ لا يَجُوزُ لَهُ أَنْ يَسْتَمِرَّ فِى صَلاتِهِ إِنَّمَا يَتَقَدَّمُ أَحَدُ الْمَأْمُومِينَ لِيُصَلِّىَ بِهِمْ إِمَامًا وَلا بُدَّ أَنْ يَنْوِىَ الْمَأْمُومُونَ الِاقْتِدَاءَ بِهِ إِنْ أَرَادُوا الِاقْتِدَاءَ وَإِلَّا فَيَجُوزُ لَهُمْ أَنْ يُكْمِلُوا فُرَادَى.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(306) مَا حُكْمُ مَنْ ذَكَرَ اللَّهَ فِى صَلاتِهِ لِتَنْبِيهِ غَيْرِهِ.</p><p class=\"answer\">إِنْ ذَكَرَ اللَّهَ فِى صَلاتِهِ كَأَنْ قَالَ سُبْحَانَ اللَّهِ لِلتَّنْبِيهِ فَقَطْ بَطَلَتْ صَلاتُهُ أَمَّا إِذَا نَوَى مَعَ التَّنْبِيهِ الذِّكْرَ فَلا تَبْطُلُ صَلاتُهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(307) مَنْ هُوَ الْمَسْبُوقُ.</p><p class=\"answer\">الْمَسْبُوقُ هُوَ الَّذِى لَمْ يَدْخُلْ فِى الصَّلاةِ فَوْرًا
