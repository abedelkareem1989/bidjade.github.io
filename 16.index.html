بَعْدَ أَنْ كَبَّرَ الإِمَامُ تَكْبِيرَةَ الإِحْرَامِ فَلَمْ يَجِدْ وَقْتًا يَكْفِيهِ لِقِرَاءَةِ الْفَاتِحَةِ كُلِّهَا مَعَ الإِمَامِ أَوْ كَانَ الإِمَامُ فِى رُكْنٍ ءَاخَرَ كَالرُّكُوعِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(308) مَاذَا يَفْعَلُ الْمَسْبُوقُ إِذَا دَخَلَ فِى الصَّلاةِ وَالإِمَامُ قَائِمٌ يَقْرَأُ الْفَاتِحَةَ.</p><p class=\"answer\">يَبْدَأُ بِقِرَاءَةِ الْفَاتِحَةِ وَلا يَشْتَغِلُ بِسُنَّةٍ كَدُعَاءِ الِافْتِتَاحِ أَوِ التَّعَوُّذِ فَإِذَا رَكَعَ الإِمَامُ قَبْلَ أَنْ يَنْتَهِىَ الْمَأْمُومُ مِنَ الْقِرَاءَةِ يَقْطَعُ الْمَأْمُومُ قِرَاءَتَهُ وَيَرْكَعُ وَتَسْقُطُ عَنْهُ بَقِيَّةُ الْفَاتِحَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(309) مَاذَا يَفْعَلُ الْمَسْبُوقُ إِذَا دَخَلَ فِى الصَّلاةِ وَكَانَ الإِمَامُ رَاكِعًا.</p><p class=\"answer\">لا يَجِبُ عَلَيْهِ أَنْ يَقْرَأَ الْفَاتِحَةَ بَلْ يَرْكَعُ فَإِذَا أَدْرَكَ الطُّمَأْنِينَةَ فِى الرُّكُوعِ قَبْلَ أَنْ يَرْفَعَ الإِمَامُ رَأْسَهُ مِنَ الرُّكُوعِ تُحْسَبُ لَهُ الرَّكْعَةُ وَإِلَّا فَلا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(310) هَلِ الْعِلْمُ بِانْتِقَالاتِ الإِمَامِ فِى الصَّلاةِ شَرْطٌ لِصِحَّةِ الْقُدْوَةِ بِهِ.</p><p class=\"answer\">يَشْتَرَطُ لِصِحَّةِ الْقُدْوَةِ بِالإِمَامِ أَنْ يَعْلَمَ الْمَأْمُومُ بِانْتِقَالاتِ إِمَامِهِ بِأَنْ يَرَى الإِمَامَ أَوْ يَرَى مَنْ يَرَى الإِمَامَ أَوْ يَسْمَعَ صَوْتَ الإِمَامِ وَلَوْ بِوَاسِطَةِ الآلَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(311) إِذَا كَانَ الْمَأْمُومُ وَالإِمَامُ فِى مَكَانٍ غَيْرِ الْمَسْجِدِ وَكَانَ بَيْنَهُمَا حَائِلٌ يَمْنَعُ الْمُرُورَ إِلَى الإِمَامِ أَوْ رُؤْيَتَهُ هَلْ تَصِحُّ صَلاةُ الْمَأْمُومِ.</p><p class=\"answer\">لا تَصِحُّ صَلاةُ الْمَأْمُومِ إِنْ كَانَ بَيْنَهُ وَبَيْنَ الإِمَامِ حَائِلٌ يَمْنَعُ الْمُرُورَ إِلَى الإِمَامِ أَوْ رُؤْيَتَهُ كَجِدَارٍ أَوْ بَابٍ مُغْلَقٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(312) إِذَا كَانَ الْمَأْمُومُ وَالإِمَامُ فِى مَسْجِدٍ وَكَانَ بَيْنَهُمَا حَائِلٌ يَمْنَعُ الْمُرُورَ إِلَى الإِمَامِ أَوْ رُؤْيَتَهُ هَلْ تَصِحُّ صَلاةُ الْمَأْمُومِ.</p><p class=\"answer\">تَصِحُّ صَلاةُ الْمَأْمُومِ إِنْ كَانَ يُمْكِنُهُ مُتَابَعَةُ الإِمَامِ لِأَنَّ الْمَسْجِدَ حُكْمُهُ كَحُكْمِ الْمَكَانِ الْوَاحِدِ فَلا تَأْثِيرَ لِبَابٍ مُغْلَقٍ أَوْ مَرْدُودٍ فِى دَاخِلِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(313) إِذَا كَانَتِ الْمَسَافَةُ بَيْنَ الْمَأْمُومِ وَالإِمَامِ أَكْثَرَ مِنْ ثَلاثِمِائَةِ ذِرَاعٍ فَهَلْ تَصِحُّ قُدْوَةُ الْمَأْمُومِ بِالإِمَامِ.</p><p class=\"answer\">إِذَا كَانَا فِى مَسْجِدٍ صَحَّتِ الْقُدْوَةُ وَإِنْ بَعُدَتِ الْمَسَافَةُ بَيْنَهُمَا جِدًّا بِشَرْطِ إِمْكَانِ مُتَابَعَةِ الإِمَامِ أَمَّا إِنْ كَانَا فِى مَكَانٍ غَيْرِ الْمَسْجِدِ فَيُشْتَرَطُ أَنْ لا تَزِيدَ الْمَسَافَةُ بَيْنَهُمَا أَوْ بَيْنَ الْمَأْمُومِ وَالصَّفِّ الَّذِى أَمَامَهُ عَلَى ثَلاثِمِائَةِ ذِرَاعٍ تَقْرِيبًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(314) إِنْ تَرَكَ الإِمَامُ التَّشَهُّدَ الأَوَّلَ وَأَتَى بِهِ الْمَأْمُومُ فَمَا حُكْمُ صَلاةِ الْمَأْمُومِ.</p><p class=\"answer\">بَطَلَتْ صَلاتُهُ إِنْ كَانَ عَالِمًا بِالْحُرْمَةِ وَتَعَمَّدَ ذَلِكَ وَإِلَّا فَلا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(315) إِذَا كَبَّرَ الْمَأْمُومُ تَكْبِيرَةَ الإِحْرَامِ أَوْ قَرَأَ جُزْءًا مِنَ الْفَاتِحَةِ أَثْنَاءَ هُويِّهِ لِلرُّكُوعِ فَمَا حُكْمُ صَلاتِهِ.</p><p class=\"answer\">إِذَا كَبَّرَ الْمَأْمُومُ تَكْبِيرَةَ الإِحْرَامِ أَوْ قَرَأَ جُزْءًا مِنَ الْفَاتِحَةِ بَعْدَ أَنْ مَالَ مَيْلًا شَدِيدًا بِحَيْثُ خَرَجَ عَنْ كَوْنِهِ قَائِمًا لا يَصِحُّ تَكْبِيرُهُ وَلا قِرَاءَتُهُ لِأَنَّهُ يَلْزَمُهُ أَنْ يُكَبِّرَ وَيَقْرَأَ الْفَاتِحَةَ وَهُوَ قَائِمٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(316) عَلَى مَنْ يَجِبُ إِقَامَةُ صَلاةِ الْجُمُعَةِ.</p><p class=\"answer\">يَجِبُ عَلَى الذُّكُورِ الأَحْرَارِ الْمُقِيمِينَ الْبَالِغِينَ الْعَاقِلِينَ غَيْرِ الْمَعْذُورِينَ إِقَامَةُ صَلاةِ الْجُمُعَةِ إِذَا كَانُوا أَرْبَعِينَ مُكَلَّفِينَ مُسْتَوْطِنِينَ فِى أَبْنِيَةٍ لا فِى الْخِيَامِ. وَالْمُسْتَوْطِنُ هُوَ الَّذِى يُقِيمُ فِى مَكَانٍ وَلا يَفَارِقُهُ إِلَّا لِحَاجَةٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(317) هَلْ تَجِبُ صَلاةُ الْجُمُعَةِ عَلَى الْمُقِيمِ وَالْمُسَافِرِ.</p><p class=\"answer\">تَجِبُ صَلاةُ الْجُمُعَةِ عَلَى الْمُقِيمِ وَلا تَجِبُ عَلَى الْمُسَافِرِ إِلَّا أَنْ يَكُونَ عَاصِيًا بِسَفَرِهِ. وَلا يُشْتَرَطُ فِى الْمَسَافِرِ أَنْ يَكُونَ سَفَرُهُ طَوِيلًا إِنَّمَا الشَّرْطُ أَنْ يَكُونَ غَادَرَ بُنْيَانَ بَلَدِهِ قَبْلَ الْفَجْرِ أَمَّا مَنْ غَادَرَ بَعْدَ الْفَجْرِ وَدَخَلَ بَلَدَ الْجُمُعَةِ فَتَجِبُ عَلَيْهِ الْجُمُعَةُ. وَالْمُقِيمُ هُوَ مَنْ نَوَى الإِقَامَةَ فِى بَلَدٍ أَرْبَعَةَ أَيَّامٍ أَوْ أَكْثَرَ غَيْرَ يَوْمَىِ الدُّخُولِ وَالْخُرُوجِ أَمَّا الْمُسَافِرُ فَهُوَ مَنْ نَوَى الإِقَامَةَ فِيهِ أَقَلَّ مِنْ أَرْبَعَةِ أَيَّامٍ غَيْرَ يَوْمَىِ الدُّخُولِ وَالْخُرُوجِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(318) مَا هِىَ شُرُوطُ صِحَّةِ صَلاةِ الْجُمُعَةِ.</p><p class=\"answer\">أَنْ تُصَلَّى فِى وَقْتِ الظُّهْرِ وَأَنْ تُصَلَّى جَمَاعَةً وَخُطْبَتَانِ قَبْلَهَا بَعْدَ دُخُولِ الْوَقْتِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(319) مَا هِىَ أَرْكَانُ الْخُطْبَتَيْنِ.</p><p class=\"answer\">أَرْكَانُ الْخُطْبَتَيْنِ حَمْدُ اللَّهِ وَالصَّلاةُ عَلَى النَّبِىِّ ﷺ وَالْوَصِيَّةُ بِالتَّقْوَى فِى كُلٍّ مِنَ الْخُطْبَتَيْنِ وَقِرَاءَةُ ءَايَةٍ مُفْهِمَةٍ فِى إِحْدَاهُمَا وَالدُّعَاءُ لِلْمُؤْمِنِينَ فِى الثَّانِيَةِ كَقَوْلِ اللَّهُمَّ اغْفِرْ لِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(320) اذْكُرْ بَعْضَ شُرُوطِ الْخُطْبَتَيْنِ.</p><p class=\"answer\">مِنْ شُرُوطِ الْخُطْبَتَيْنِ أَنْ يَكُونَ الْخَطِيبُ طَاهِرًا عَنِ الْحَدَثَيْنِ الأَصْغَرِ وَالأَكْبَرِ وَعَنِ النَّجَاسَةِ غَيْرِ الْمَعْفُوِّ عَنْهَا سَاتِرًا لِلْعَوْرَةِ قَائِمًا إِنْ قَدَرَ وَأَنْ يَأْتِىَ بِالأَرْكَانِ بِالْعَرَبِيَّةِ وَأَنْ يَجْلِسَ بَيْنَ الْخُطْبَتَيْنِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(321) مَا حُكْمُ الْكَلامِ أَثْنَاءَ خُطْبَةِ الْجُمُعَةِ.</p><p class=\"answer\">يُكْرَهُ الْكَلامُ أَثْنَاءَ الْخُطْبَةِ وَلا يَحْرُمُ فَمَنْ تَكَلَّمَ أَثْنَاءَ الْخُطْبَةِ بِلا عُذْرٍ وَلَوْ كَانَ خَارِجَ الْمَسْجِدِ وَقَرِيبًا مِنْهُ فَلا ثَوَابَ لَهُ فِى صَلاةِ الْجُمُعَةِ. وَيُبَاحُ الْكَلامُ بِلا كَرَاهَةٍ قَبْلَ الْبَدْءِ بِالْخُطْبَةِ الأُولَى وَبَعْدَ الِانْتِهَاءِ مِنَ الْخُطْبَةِ الثَّانِيَةِ وَبَيْن الْخُطْبَتَيْنِ. وَتُسَنُّ الصَّلاةُ عَلَى النَّبِىِّ ﷺ عِنْدَ ذِكْرِ اسْمِهِ أَثْنَاءَ الْخُطْبَةِ وَلا تُكْرَهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(322) مَاذَا يُسَنُّ أَنْ يَفْعَلَ مَنْ أَرَادَ حُضُورَ صَلاةِ الْجُمُعَةِ.</p><p class=\"answer\">يُسْتَحَبُّ لَهُ أَنْ يَغْتَسِلَ غُسْلَ الْجُمُعَةِ وَيَتَطَيَّبَ وَيَقُصَّ شَارِبَهُ وَيُقَلِّمَ أَظَافِرَهُ إِنْ طَالَتْ وَيَحْلِقَ عَانَتَهُ وَيَلْبَسَ أَحْسَنَ ثِيَابِهِ وَأَفْضَلُهَا الْبَيَاضُ وَأَنْ يُبَكِّرَ إِلَى الصَّلاةِ. وَيُسْتَحَبُّ لَهُ أَنْ يَخْرُجَ مِنْ بَيْتِهِ بِرِجْلِهِ الْيُمْنَى وَيَقُولَ بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ لا حَوْلَ وَلا قُوَّةَ إِلَّا بِاللَّهِ وَيَقُولَ اللَّهُمَّ إِنِّى أَسْأَلُكَ بِحَقِّ السَّائِلِينَ عَلَيْكَ وَبِحَقِّ مَمْشَاىَ هَذَا فَإِنِّى لَمْ أَخْرُجْ أَشَرًا وَلا بَطَرًا وَلا رِيَاءً وَلا سُمْعَةً خَرَجْتُ اتِّقَاءَ سَخَطِكَ وَابْتِغَاءَ مَرْضَاتِكَ أَسْأَلُكَ أَنْ تُنْقِذَنِى مِنَ النَّارِ وَأَنْ تَغْفِرَ لِى ذُنُوبِى إِنَّهُ لا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ. وَيُسَنُّ أَنْ يَدْخُلَ الْمَسْجِدَ بِرِجْلِهِ الْيُمْنَى وَيَقُولَ بِسْمِ اللَّهِ اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ ﷺ اللَّهُمَّ افْتَحْ لِى أَبْوَابَ رَحْمَتِكَ وَيُسْتَحَبُّ لَهُ إِذَا دَخَلَ الْمَسْجِدَ أَنْ يُصَلِّىَ رَكْعَتَيْنِ تَحِيَّةَ الْمَسْجِدِ. وَيُسَنُّ أَنْ يَخْرُجَ مِنَ الْمَسْجِدِ بِرِجْلِهِ الْيُسْرَى وَيَقُولَ اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ ﷺ اللَّهُمَّ إِنِّى أَسْأَلُكَ مِنْ فَضْلِكَ. وَيُسْتَحَبُّ أَنْ يَقْرَأَ سُورَةَ الْكَهْفِ وَيُكْثِرَ مِنَ الصَّلاةِ عَلَى النَّبِىِّ ﷺ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(323) مَنْ وُلِدَ لَهُ وَلَدٌ مَاذَا يُسَنُّ لَهُ أَنْ يَفْعَلَ.</p><p class=\"answer\">يُسَنُّ لِمَنْ وُلِدَ لَهُ وَلَدٌ أَنْ يُؤَذِّنَ فِى أُذُنِهِ الْيُمْنَى وَيُقِيمَ فِى أُذُنِهِ الْيُسْرَى أَوَّلَ وِلادَتِهِ وَيُسَنُّ أَنْ يُحَنِّكَهُ بِتَمْرٍ وَأَنْ يُسَمِّيَهُ فِى الْيَوْمِ السَّابِعِ وَيُسَنُّ أَنْ يَحْلِقَ شَعَرَهُ وَيَتَصَدَّقَ بِوَزْنِهِ ذَهَبًا أَوْ فِضَّةً وَأَنْ يَذْبَحَ شَاةً مِنْ غَيْرِ أَنْ يَكْسِرَ عَظْمَهَا وَيَتَصَدَّقَ بِثُلُثٍ وَيُهْدِى ثُلُثًا وَيَجْعَلَ ثُلُثًا لِأَهْلِ بَيْتِهِ. وَيُسَنُّ خِتَانُهُ فِى سَابِعِ وِلادَتِهِ إِنْ أَطَاقَ وَلا يُحْسَبُ يَوْمُ الْوِلادَةِ مِنْهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(324) مَاذَا يَجِبُ لِلْمُسْلِمِ الْمَيِّتِ إِذَا وُلِدَ حَيًّا.</p><p class=\"answer\">يَجِبُ وُجُوبًا كِفَائِيًّا غَسْلُهُ وَتَكْفِينُهُ وَالصَّلاةُ عَلَيْهِ وَدَفْنُهُ. وَيُسْتَحَبُّ تَغْمِيضُ عَيْنَيْهِ لِئَلَّا تَبْقَى مَفْتُوحَتَيْنِ فَيَقْبُحَ مَنْظَرُهُ وَأَنْ يُقَالَ حَالَ إِغْمَاضِهِ بِسْمِ اللَّهِ وَعَلَى مِلَّةِ رَسُولِ اللَّهِ ﷺ وَيُسْتَحَبُّ شَدُّ لَحْيَيْهِ بِعِصَابَةٍ عَرِيضَةٍ تُرْبَطُ فَوْقَ رَأْسِهِ لِئَلَّا يَبْقَى فَمُهُ مَفْتُوحًا فَتَدْخُلَهُ الْهَوَامُّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(325) مَاذَا يَجِبُ لِسْقِطٍ وُلِدَ مَيِّتًا.</p><p class=\"answer\">يَجِبُ غَسْلُهُ وَتَكْفِينُهُ وَدَفْنُهُ إِنْ ظَهَرَتْ فِيهِ خِلْقَةُ ءَادَمِىٍّ وَلا يُصَلَّى عَلَيْهِ أَمَّا إِنْ لَمْ تَظْهَرْ فِيهِ خِلْقَةُ ءَادَمِىٍّ فَيُسَنُّ لَفُّهُ بِخِرْقَةٍ وَدَفْنُهُ</p></div>\n<div class=\"qa-item\"><p class=\"question\">(326) مَا هُوَ أَقَلُّ الْغُسْلِ لِلْمَيِّتِ.</p><p class=\"answer\">أَقَلُّ الْغُسْلِ لِلْمَيِّتِ إِزَالَةُ النَّجَاسَةِ إِنْ كَانَتْ عَلَى بَدَنِهِ وَتَعْمِيمُ جَمِيعِ الْبَدَنِ مَرَّةً بِالْمَاءِ الْمُطَهِّرِ وَالأَفْضَلُ تَثْلِيثُ غَسْلِهِ. وَيُسَنُّ أَنْ يُغْسَلَ فِى قَمِيصٍ وَأَنْ يُغَطَّى وَجْهُهُ بِخِرْقَةٍ وَأَنْ يُسْتَقْبَلَ بِهِ الْقِبْلَةُ. وَيَجِبُ أَنْ يَغُضَّ الْغَاسِلُ بَصَرَهُ عَنْ عَوْرَتِهِ وَيُسَنُّ عَنْ غَيْرِ عَوْرَتِهِ وَيَحْرُمُ مَسُّ عَوْرَتِهِ بِغَيْرِ حَائِلٍ. وَيَجُوزُ لِلرَّجُلِ أَنْ يَغْسِلَ زَوْجَتَهُ بَعْدَ مَوْتِهَا وَلا يَجُوزُ لَهُ أَنْ يَنْظُرَ بِشَهْوَةٍ إِلَى مَا بَيْنَ سُرَّتِهَا وَرُكْبَتِهَا وَيَحْرُمُ عَلَيْهِ جِمَاعُهَا بَعْدَ الْمَوْتِ وَلا يَحْرُمُ عَلَيْهِ لَمْسُهَا. وَيَجُوزُ لِلْمَرْأَةِ أَنْ تَغْسِلَ زَوْجَهَا الْمَيِّتَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(327) مَا هُوَ الْوَاجِبُ فِى تَكْفِينِ الْمُسْلِمِ الْمَيِّتِ.</p><p class=\"answer\">الْوَاجِبُ فِى تَكْفِينِ الْمَيِّتِ مَا يَسْتُرُ جَمِيعَ الْبَدَنِ إِلَّا رَأْسَ مُحْرِمٍ بِحَجٍّ أَوْ عُمْرَةٍ وَوَجْهَ مُحْرِمَةٍ. وَلا يَجُوزُ تَكْفِينُهُ بِمَا لا يَلِيقُ بِهِ كَالْخَيْشِ أَوْ بِمَا لا يَحِلُّ لَهُ فِى حَيَاتِهِ كَالْحَرِيرِ لِلرَّجُلِ. وَيَجِبُ تَكْفِينُهُ بِثَلاثِ لَفَائِفَ إِنْ تَرَكَ تَرِكَةً زَائِدَةً عَلَى دَيْنِهِ أَوْ لَمْ يَكُنْ عَلَيْهِ دَيْنٌ أَصْلًا إِلَّا إِذَا أَوْصَى بِتَرْكِ تَكْفِينِهِ بِالثَّلاثِ وَلا يَجِبُ تَكْفِينُهُ بِالْجَدِيدِ. وَالْكَفَنُ لِلْمَرْأَةِ قَمِيصٌ وَخِمَارٌ وَإِزَارٌ وَلِفَافَتَانِ. وَالْقَمِيصُ هُوَ مَا يَسْتُرُ أَغْلَبَ الْبَدَنِ وَالإِزَارُ هُوَ مَا يُلْبَسُ لِلنِّصْفِ الأَسْفَلِ غَيْرُ السِّرْوَالِ وَالْخِمَارُ هُوَ مَا تُغَطِّى بِهِ الْمَرْأَةُ رَأْسَهَا وَأَمَّا اللِّفَافَتَانِ فَهُمَا مَا يُلَفُّ عَلَيْهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(328) تَكَلَّمْ عَنْ كَيْفِيَّةِ صَلاةِ الْجِنَازَةِ.</p><p class=\"answer\">صَلاةُ الْجِنَازَةِ لا رُكُوعَ وَلا سُجُودَ فِيهَا يُصَلِّيهَا الْمُؤْمِنُ قَائِمًا إِنْ قَدَرَ وَيُسِرُّ بِهَا. وَلا بُدَّ فِيهَا مِنَ شُرُوطِ الصَّلاةِ كَاسْتِقْبَالِ الْقِبْلَةِ وَالطَّهَارَةِ عَنِ الْحَدَثَيْنِ وَعَنِ النَّجَاسَةِ الَّتِى لا يُعْفَى عَنْهَا. وَيَقِفُ الإِمَامُ عِنْدَ رَأْسِ الرَّجُلِ وَعِنْدَ عَجِيزَةِ الْمَرْأَةِ أَىْ وَسَطِهَا فَيَبْدَأُ صَلاتَهُ بِالتَّكْبِيرِ مَعَ النِّيَّةِ فَيَنْوِى فِى قَلْبِهِ أَنَّهُ يُصَلِّى فَرْضَ صَلاةِ الْجِنَازَةِ جَمَاعَةً عَلَى هَذَا الْمَيِّتِ ثُمَّ يَقْرَأُ الْفَاتِحَةَ ثُمَّ يُكَبِّرُ التَّكْبِيرَةَ الثَّانِيَةَ ثُمَّ يُصَلِّى عَلَى النَّبِىِّ ﷺ ثُمَّ يُكَبِّرُ التَّكْبِيرَةَ الثَّالِثَةَ ثُمَّ يَدْعُو لِلْمَيِّتِ بِخُصُوصِهِ كَأَنْ يَقُولَ اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ، ثُمَّ يُكَبِّرُ التَّكْبِيرَةَ الرَّابِعَةَ ثُمَّ يَقُولُ السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ مَرَّتَيْنِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(329) مَا هُوَ أَقَلُّ الدَّفْنِ.</p><p class=\"answer\">أَقَلُّ الدَّفْنِ حُفْرَةٌ تَكْتُمُ رَائِحَتَهُ بَعْدَ طَمِّهِ وَتَحْرُسُهُ مِنَ السِّبَاعِ أَنْ تَنْبُشَهُ وَتَأْكُلَ جُثَّتَهُ. وَيُسَنُّ أَنْ يُعَمَّقَ الْقَبْرُ قَدْرَ قَامَةٍ وَبَسْطَةٍ وَأَنْ يُوَسَّعَ بِحَيْثُ يَسَعُ مَنْ يُنْزِلُهُ وَمُعِينَهُ وَيَجِبُ تَوْجِيهُهُ إِلَى الْقِبْلَةِ. وَيُكْرَهُ الدَّفْنُ فِى التَّابُوتِ إِلَّا إِذَا كَانَتِ الأَرْضُ رِخْوَةً فَلا كَرَاهَةَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(330) مَا حُكْمُ تَلْقِينِ الْمَيِّتِ.</p><p class=\"answer\">يُسَنُّ تَلْقِينُ الْمُسْلِمِ بَعْدَ دَفْنِهِ فَيُقَالُ يَا عَبْدَ اللَّهِ ابْنَ أَمَةِ اللَّهِ ثَلاثَ مَرَّاتٍ اذْكُرِ الْعَهْدَ الَّذِى خَرَجْتَ عَلَيْهِ مِنَ الدُّنْيَا شَهَادَةَ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ وَأَنَّكَ رَضِيتَ بِاللَّهِ رَبًّا وَبِالإِسْلامِ دِينًا وَبِمُحَمَّدٍ نَبِيًّا وَبِالْقُرْءَانِ إِمَامًا. وَأَمَّا لِلأُنْثَى فَيُقَالُ يَا أَمَةَ اللَّهِ ابْنَةَ أَمَةِ اللَّهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(331) مَا حُكْمُ قِرَاءَةِ الْقُرْءَانِ عَلَى قَبْرِ الْمُسْلِمِ.</p><p class=\"answer\">يُسْتَحَبُّ قِرَاءَةُ الْقُرْءَانِ عَلَى الْقَبْرِ كَسُورَةِ يَس لِحَدِيثِ اقْرَءُوا يَس عَلَى مَوْتَاكُمْ رَوَاهُ ابْنُ حِبَّانَ وَصَحَّحَهُ. وَعَلَى هَذَا كُلُّ أَئِمَّةِ الإِسْلامِ وَخَالَفَتِ الْوَهَّابِيَّةُ كَعَادَتِهِمْ كُلَّ الْمُسْلِمِينَ فَحَرَّمُوا ذَلِكَ وَالْعِيَاذُ بِاللَّهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(332) مَا حُكْمُ التَّعْزِيَةِ.</p><p class=\"answer\">يُسْتَحَبُّ التَّعْزِيَةُ وَهِىَ الأَمْرُ بِالصَّبْرِ وَالدُّعَاءُ لِلْمَيِّتِ بِالْمَغْفِرَةِ. وَوَقْتُ التَّعْزِيَةِ مِنْ حِينِ الْمَوْتِ إِلَى مَا بَعْدَ الدَّفْنِ بِثَلاثَةِ أَيَّامٍ وَتُكْرَهُ بَعْدَ الثَّلاثَةِ لِغَيْرِ عُذْرٍ. وَيُقَالُ فِى تَعْزِيَةِ الْمُسْلِمِ بِالْمُسْلِمِ أَعْظَمَ اللَّهُ أَجْرَكَ (أَىْ جَعَلَ أَجْرَكَ عَظِيمًا) وَأَحْسَنَ عَزَاءَكَ (أَىْ جَعَلَ صَبْرَكَ حَسَنًا) وَغَفَرَ لِمَيِّتِكَ. أَمَّا الْكَافِرُ فَيُقَالُ لَهُ عِنْدَ تَعْزِيَتِهِ اللَّهُ يُصَبِّرُ قَلْبَكَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(333) مَتَى تَصِحُّ قِسْمَةُ تَرِكَةِ الْمَيِّتِ.</p><p class=\"answer\">لا تَصِحُّ قِسْمَةُ تَرِكَةِ مَيِّتٍ إِلَّا بَعْدَ أَنْ تُوَفَّ دُيُونُهُ إِنْ كَانَتْ عَلَيْهِ وَتُخْرَجَ أُجْرَةُ حَجَّةٍ وَعُمْرَةٍ إِنْ كَانَا عَلَيْهِ وَتُنَفَّذَ وَصَايَاهُ أَىْ مَا أَوْصَى بِهِ بِأَنْ يُصْرَفَ بَعْدَ مَوْتِهِ لِغَيْرِ وَارِثٍ كَأَنْ أَوْصَى بِثُلُثِ مَالِهِ أَوْ أَقَلَّ. (334) مَا حُكْمُ زِيَارَةِ الْقُبُورِ.</p></div>\n<p>يُسْتَحَبُّ لِلرِّجَالِ زِيَارَةُ الْقُبُورِ بِالإِجْمَاعِ نَقَلَ الإِجْمَاعَ الْحَافِظُ النَّوَوِىُّ فِى كِتَابِهِ الْمَجْمُوعِ أَمَّا لِلنِّسَاءِ فَفِيهَا قَوْلانِ قَوْلٌ بِالْكَرَاهَةِ وَقَوْلٌ بِعَدَمِ الْكَرَاهَةِ وَعِنْدَ الْحَنَفِيَّةِ لا يُكْرَهُ وَهُوَ الأَوْفَقُ لِعُمُومِ حَدِيثِ كُنْتُ نَهَيْتُكُمْ عَنْ زِيَارَةِ الْقُبُورِ أَلَا فَزُورُوهَا. وَأَمَّا حَدِيثُ لَعَنَ اللَّهُ زَوَّارَاتِ الْقُبُورِ فَقَدْ قَالَ التِّرْمِذِىُّ فِيهِ وَقَدْ رَأَى بَعْضُ أَهْلِ الْعِلْمِ أَنَّ هَذَا كَانَ قَبْلَ أَنْ يُرَخِّصَ النَّبِىُّ ﷺ فِى زِيَارَةِ الْقُبُورِ فَلَمَّا رَخَصَّ دَخَلَ فِى رُخْصَتِهِ الرِّجَالُ وَالنِّسَاءُ وَقَالَ الْحَاكِمُ فِى الْمُسْتَدْرَكِ وَهَذِهِ الأَحَادِيثُ الْمَرْوِيَّةُ فِى النَّهْىِ عَنْ زِيَارَةِ الْقُبُورِ مَنْسُوخَةٌ وَالنَّاسِخُ لَهَا حَدِيثُ عَلْقَمَةَ عَنْ سُلَيْمَانَ بنِ بُرَيْدَةَ عَنْ أَبِيهِ عَنِ النَّبِىِّ ﷺ كُنْتُ نَهَيْتُكُمْ عَنْ زِيَارَةِ الْقُبُورِ أَلا فَزُورُوهَا. أَمَّا زِيَارَةُ قَبْرِ النَّبِىِّ ﷺ فَتُسَنُّ لِلرِّجَالِ وَالنِّسَاءِ فَقَدْ ثَبَتَ فِى الْحَدِيثِ الَّذِى رَوَاهُ الدَّارَقُطْنِىُّ وَغَيْرُهُ مَنْ زَارَ قَبْرِى وَجَبَتْ لَهُ شَفَاعَتِى.</p>\n<div class=\"qa-item\"><p class=\"question\">(335) هَلْ يَصِحُّ قَضَاءُ الصَّلاةِ وَالصِّيَامِ عَنِ الْمَيِّتِ الْمُسْلِمِ.</p><p class=\"answer\">لا يَصِحُّ قَضَاءُ الصَّلاةِ عَنِ الْمَيِّتِ وَيَجُوزُ لِقَرِيبِهِ أَنْ يَصُومَ عَنْهُ إِنْ كَانَ عَلَيْهِ صَوْمٌ. وَأَمَّا الْحَجُّ فَيَصِحُّ عَنِ الْمَيِّتِ بَلْ يَجِبُ إِخْرَاجُ أُجْرَةِ حَجَّةٍ وَعُمْرَةٍ قَبْلَ قِسْمَةِ تَرِكَتِهِ بَيْنَ الْوَرَثَةِ إِنْ كَانَا عَلَيْهِ وَيَكْفِى أَنْ تُسَلَّمَ إِلَى مَنْ يَحُجُّ عَنْهُ وَيَعْتَمِرُ.</p></div>", "wordCount": 5453, "paraCount": 208}, {"id": "zakah", "title": "كتاب الزكاة", "icon": "fa-hand-holding-usd", "desc": "أحكام الزكاة وأنواعها ومصارفها", "content": "<p>كِتَابُ الزَّكَاةِ</p>\n<div class=\"qa-item\"><p class=\"question\">(336) مَا هِىَ الزَّكَاةُ وَمَا الدَّلِيلُ عَلَى وُجُوبِهَا.</p><p class=\"answer\">الزَّكَاةُ هِىَ اسْمٌ لِمَا يُخْرَجُ عَنْ مَالٍ أَوْ بَدَنٍ عَلَى وَجْهٍ مَخْصُوصٍ قَالَ اللَّهُ تَعَالَى ﴿وَأَقِيمُوا الصَّلاةَ وَءَاتُوا الزَّكَاةَ﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(337) فِيمَ تَجِبُ الزَّكَاةُ.</p><p class=\"answer\">تَجِبُ الزَّكَاةُ فِى الإِبِلِ وَالْبَقَرِ وَالْغَنَمِ وَالتَّمْرِ وَالزَّبِيبِ وَالزُّرُوعِ الَّتِى يَتَّخِذُهَا النَّاسُ قُوتًا أَيَّامَ الرَّخَاءِ كَالْقَمْحِ وَالشَّعِيرِ، وَالْقُوتُ هُوَ مَا يَعِيشُ بِهِ الْبَدَنُ. وَتَجِبُ الزَّكَاةُ فِى الذَّهَبِ وَالفِّضَّةِ وَالْمَعْدِنِ وَالرِّكَازِ مِنْهُمَا وَالْمَعْدِنُ هُوَ الذَّهَبُ أَوِ الْفِضَّةُ الْمُسْتَخْرَجَانِ مِنَ الْمَكَانِ الَّذِى خُلِقَا فِيهِ وَالرِّكَازُ هُوَ الذَّهَبُ أَوِ الْفِضَّةُ الْمَدْفُونَانِ قَبْلَ بِعْثَةِ النَّبِىِّ ﷺ. وَتَجِبُ الزَّكَاةُ فِى أَمْوَالِ التِّجَارَةِ وَالْفِطْرِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(338) مَا هُوَ أَوَّلُ نِصَابِ الإِبِلِ وَالْبَقَرِ وَالْغَنَمِ وَمَاذَا يَجِبُ فِيهِ.</p><p class=\"answer\">النِّصَابُ هُوَ الْقَدْرُ الَّذِى تَجِبُ فِيهِ الزَّكَاةُ وَأَوَّلُ نِصَابِ الإِبِلِ خَمْسٌ وَالْبَقَرِ ثَلاثُونَ وَالْغَنَمِ أَرْبَعُونَ. فَيَجِبُ فِى خَمْسٍ مِنَ الإِبِلِ شَاةٌ إِمَّا جَذَعَةُ ضَأْنٍ أَكْمَلَتْ سَنَةً أَوْ ثَنِيَّةُ مَعْزٍ أَكْمَلَتْ سَنَتَيْنِ وَفِى ثَلاثِينَ مِنَ الْبَقَرِ ذَكَرٌ مِنَ الْبَقَرِ أَكْمَلَ سَنَةً وَتُجْزِئُ الأُنْثَى وَتَجِبُ فِى أَرْبَعِينَ مِنَ الْغَنَمِ شَاةٌ أُنْثَى جَذَعَةُ ضَأْنٍ أَوْ ثَنِيَّةُ مَعْزٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(339) مَا هِىَ شُرُوطُ وُجُوبِ الزَّكَاةِ فِى الأَنْعَامِ.</p><p class=\"answer\">الأَنْعَامُ هِىَ الإِبِلُ وَالْبَقَرُ وَالْغَنَمُ وَيُشْتَرَطُ لِوُجُوبِ الزَّكَاةِ فِيهَا النِّصَابُ وَالْحَوْلُ أَىْ مُرُورُ سَنَةٍ قَمَرِيَّةٍ ابْتِدَاءً مِنْ تَمَامِ النِّصَابِ وَأَنْ يَرْعَاهَا مَالِكُهَا أَوْ مَنْ أَذِنَ لَهُ الْمَالِكُ فِى مَرْعًى لا مَالِكَ لَهُ وَأَنْ لا تَكُونَ عَامِلَةً فَالْعَامِلَةُ فِى نَحْوِ الْحَرْثِ لا زَكَاةَ فِيهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(340) مَا هُوَ أَوَّلُ نِصَابِ التَّمْرِ وَالزَّبِيبِ وَالزُّرُوعِ.</p><p class=\"answer\">أَوَّلُ نِصَابِ التَّمْرِ وَالزَّبِيبِ وَالزُّرُوعِ خَمْسَةُ أَوْسُقٍ وَهِىَ ثَلاثُمِائَةِ صَاعٍ بِصَاعِ النَّبِىِّ ﷺ وَالصَّاعُ أَرْبَعَةُ أَمْدَادٍ وَالْمُدُّ هُوَ الْحَفْنَةُ بِكَفَّىْ رَجُلٍ مُعْتَدِلٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(341) مَاذَا يَجِبُ فِى التَّمْرِ وَالزَّبِيبِ وَالزُّرُوعِ إِذَا بَلَغَتْ قَدْرًا تَجِبُ فِيهِ الزَّكَاةُ.</p><p class=\"answer\">يَجِبُ فِيهَا الْعُشْرُ إِنْ سُقِيَتْ بِلا كُلْفَةٍ كَأَنْ سُقِيَتْ بِمَاءِ الْمَطَرِ وَنِصْفُ الْعُشْرِ إِنْ سُقِيَتْ بِكُلْفَةٍ كَالْمَسْقِىِّ بِالْمَاءِ الْمَنْقُولِ عَلَى الدَّوَابِّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(342) مَا هُوَ نِصَابُ الذَّهَبِ وَالْفِضَّةِ.</p><p class=\"answer\">نِصَابُ الذَّهَبِ عِشْرُونَ مِثْقَالًا أَىْ مَا يُسَاوِى خَمْسَةً وَثَمَانِينَ غرَامًا تَقْرِيبًا مِنَ الذَّهَبِ الْخَالِصِ. وَنِصَابُ الذَّهَبِ مِنْ عِيَارِ أَرْبَعَةٍ وَعِشْرِينَ سِتَّةٌ وَثَمَانُونَ غرَامًا وَمِنْ عِيَارِ وَاحِدٍ وَعِشْرِينَ سَبْعَةٌ وَتِسْعُونَ غرَامًا وَمِنْ عِيَارِ ثَمَانِيَةَ عَشَرَ مِائَةٌ وَأَرْبَعَةَ عَشَرَ غرَامًا. أَمَّا نِصَابُ الْفِضَّةِ فَهُوَ مِائَتَا دِرْهَمٍ أَىْ مَا يُسَاوِى خَمْسَمِائَةٍ وَخَمْسَةً وَتِسْعِينَ غرَامًا تَقْرِيبًا مِنَ الْفِضَّةِ الْخَالِصَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(343) مَاذَا يَجِبُ فِى نِصَابِ الذَّهَبِ وَالْفِضَّةِ.</p><p class=\"answer\">يَجِبُ فِى نِصَابِ الذَّهَبِ وَالْفِضَّةِ وَمَا زَادَ عَلَيْهِ رُبْعُ الْعُشْرِ أَمَّا الرِّكَازُ فَيَجِبُ فِيهِ الْخُمُسُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(344) هَلْ يُشْتَرَطُ مُرُورُ سَنَةٍ كَامِلَةٍ لِوُجُوبِ الزَّكَاةِ فِى الذَّهَبِ وَالْفِضَّةِ.</p><p class=\"answer\">يُشْتَرَطُ لِوُجُوبِ الزَّكَاةِ فِى الذَّهَبِ وَالْفِضَّةِ مُرُورُ سَنَةٍ كَامِلَةٍ إِلَّا فِى الْمَعْدِنِ وَالرِّكَازِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(345) هَلْ يَجِبُ عَلَى الْمَرْأَةِ أَنْ تَدْفَعَ زَكَاةً إِذَا كَانَ مَهْرُهَا ذَهَبًا أَوْ فِضَّةً.</p><p class=\"answer\">إِذَا كَانَ مَهْرُ الْمَرْأَةِ ذَهَبًا أَوْ فِضَّةً وَبَلَغَ نِصَابًا وَمَضَتْ عَلَيْهِ سَنَةٌ كَامِلَةٌ أَىْ مِنْ تَسْمِيَةِ الْمَهْرِ فِى الْعَقْدِ وَجَبَتْ عَلَيْهَا زَكَاتُهُ وَلَوْ لَمْ تَقْبِضْهُ بَعْدُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(346) تَكَلَّمْ عَنْ زَكَاةِ التِّجَارَةِ.</p><p class=\"answer\">تَجِبُ الزَّكَاةُ فِى أَمْوَالِ التِّجَارَةِ إِذَا بَلَغَتْ نِصَابًا وَلا يُعْتَبَرُ النِّصَابُ إِلَّا ءَاخِرَ الْحَوْلِ وَأَمَّا نِصَابُهَا فَهُوَ نِصَابُ مَا اشْتُرِيَتْ بِهِ مِنَ النَّقْدَيْنِ أَىِ الذَّهَبِ وَالْفِضَّةِ فَإِنِ اشْتُرِيَتْ بِغَيْرِهِمَا قُوِّمَتْ بِالنَّقْدِ الْغَالِبِ فِى ذَلِكَ الْبَلَدِ. فَإِذَا بَلَغَتْ قِيمَةُ الْبِضَاعَةِ ءَاخِرَ الْحَوْلِ نِصَابًا أَىْ قِيمَةُ الْبِضَاعَةِ الَّتِى عِنْدَهُ بِاعْتِبَارِ شِرَاءِ النَّاسِ لِلْبِضَاعَةِ بِسِعْرِ الْجُمْلَةِ وَقِيمَةُ الْبِضَاعَةِ الَّتِى بَاعَهَا وَقَبَضَ ثَمَنَهَا وَقِيمَةُ الْبِضَاعَةِ الَّتِى بَاعَهَا وَلَمْ يَقْبِضْ ثَمَنَهَا وَجَبَتِ الزَّكَاةُ فِيهَا. وَيَجِبُ إِخْرَاجُ رُبْعِ عُشْرِ الْقِيمَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(347) عَلَى مَنْ تَجِبُ زَكَاةُ الْفِطْرِ.</p><p class=\"answer\">يَجِبُ عَلَى كُلِّ مُسْلِمٍ مُكَلَّفٍ أَنْ يُخْرِجَ زَكَاةَ الْفِطْرِ عَنْ نَفْسِهِ وَعَمَّنْ تَجِبُ عَلَيْهِ نَفَقَتُهُمْ إِذَا كَانُوا مُسْلِمِينَ إِذَا فَضَلَ مَا يُخْرِجُهُ لِلْفِطْرَةِ عَنْ دَيْنِهِ وَكِسْوَتِهِ وَمَسْكَنِهِ وَقُوتِهِ وَكِسْوَةِ وَمَسْكَنِ وَقُوتِ مَنْ عَلَيْهِ نَفَقَتُهُمْ يَوْمَ الْعِيدِ وَلَيْلَتَهُ الْمُتَأَخِّرَةَ عَنْهُ. وَلا يَصِحُّ إِخْرَاجُ زَكَاةِ الْفِطْرِ عَنِ الْوَلَدِ الْبَالِغِ إِلَّا بِإِذْنِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(348) هَلْ يَجِبُ عَلَى الرَّجُلِ إِخْرَاجُ زكَاةِ الْفِطْرِ عَنْ زَوْجَتِهِ فِى مَذْهَبِ الإِمَامِ أَبِى حَنِيفَةَ.</p><p class=\"answer\">لا يَجِبُ عَلَى الرَّجُلِ فِى مَذْهَبِ الإِمَامِ أَبِى حَنِيفَةَ أَنْ يُخْرِجَ زَكَاةَ الْفِطْرِ عَنْ زَوْجَتِهِ وَيَصِحُّ عِنْدَهُمْ أَنْ يُخْرِجَ الزَّكَاةَ عَنْهَا وَعَنْ أَوْلادِهِ الْبَالِغِينَ دُونَ إِذْنِهِمْ لِثُبُوتِ الإِذْنِ عَادَةً. وَيَجِبُ عَلَيْهِ إِخْرَاجُ زَكَاةِ الْفِطْرِ عَنْ أَوْلادِهِ الصِّغَارِ الَّذِينَ هُمْ دُونَ الْبُلُوغِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(349) مَا هُوَ مِقْدَارُ زَكَاةِ الْفِطْرِ.</p><p class=\"answer\">مِقْدَارُ زَكَاةِ الْفِطْرِ فِى الْمَذْهَبِ الْحَنَفِىِّ نِصْفُ صَاعٍ مِنْ قَمْحٍ وَهُوَ نَحْوُ أَلْفَيْنِ وَمِائَةٍ وَخَمْسِينَ غرَامًا مِنَ الْقَمْحِ وَيَصِحُّ دَفْعُ الْقِيمَةِ بِالْعُمْلَةِ الْوَرَقِيَّةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(350) مَتَى يَجِبُ إِخْرَاجُ زَكَاةِ الْفِطْرِ.</p><p class=\"answer\">يَجِبُ إِخْرَاجُ زَكَاةِ الْفِطْرِ بِغُرُوبِ شَمْسِ ءَاخِرِ يَوْمٍ مِنْ رَمَضَانَ وَيَحْرُمُ تَأْخِيرُهَا إِلَى مَا بَعْدَ غُرُوبِ شَمْسِ يَوْمِ الْعِيدِ بِغَيْرِ عُذْرٍ وَيُسَنُّ إِخْرَاجُهَا قَبْلَ صَلاةِ الْعِيدِ وَيَجُوزُ إِخْرَاجُهَا فِى أَىِّ يَوْمٍ مِنْ رَمَضَانَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(351) هَلِ النِّيَّةُ وَاجِبَةٌ فِى الزَّكَاةِ.</p><p class=\"answer\">تَجِبُ النِّيَّةُ فِى جَمِيعِ أَنْوَاعِ الزَّكَاةِ وَتَكْفِى النِّيَّةُ مَعَ الإِفْرَازِ أَىْ عَزْلِ الْقَدْرِ الَّذِى يَكُونُ زَكَاةً.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(352) مَا هِىَ الأَصْنَافُ الثَّمَانِيَّةُ الَّتِى يَجِبُ دَفْعُ الزَّكَاةِ إِلَيْهِمْ.</p><p class=\"answer\">يَجِبُ دَفْعُ الزَّكَاةِ إِلَى الأَصْنَافِ الثَّمَانِيَةِ الَّذِينَ ذَكَرَهُمُ اللَّهُ فِى الْقُرْءَانِ بِقَوْلِهِ ﴿إِنَّمَا الصَّدَقَاتُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ وَالْعَامِلِينَ عَلَيْهَا وَالْمُؤَلَّفَةِ قُلُوبُهُمْ وَفِى الرِّقَابِ وَالْغَارِمِينَ وَفِى سَبِيلِ اللَّهِ وَابْنِ السَّبِيلِ﴾ وَلا تُعْطَى الزَّكَاةُ إِلَّا لِمُسْلِمٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(353) هَلْ يَجُوزُ دَفْعُ الزَّكَاةِ لِفَقِيرٍ إِذَا كَانَ هَاشِمِيًّا أَوْ مُطَّلِبِيًّا.</p><p class=\"answer\">لا يَجُوزُ دَفْعُ الزَّكَاةِ لِهَاشِمِىٍّ أَوْ مُطَّلِبِىٍّ وَلَوْ كَانَ فَقِيرًا وَالْهَاشِمِىُّ هُوَ الْمُسْلِمُ مِنْ ذُرِّيَّةِ هَاشِمِ بنِ عَبْدِ مَنَافٍ أَمَّا الْمُطَّلِبِىُّ فَهُوَ الْمُسْلِمُ مِنْ ذُرِّيَّةِ الْمُطَّلِبِ بنِ عَبْدِ مَنَافٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(354) هَلْ يَجُوزُ دَفْعُ الزَّكَاةِ لِلْمَنْسُوبِ لِلرَّسُولِ ﷺ.</p><p class=\"answer\">مَنْ كَانَ نَسَبُهُ لِلرَّسُولِ ﷺ أَوْ لِعَلِىٍّ أَوِ الْعَبَّاسِ أَوْ جَعْفَرٍ أَوْ عَقِيلٍ لا يَجُوزُ دَفْعُ الزَّكَاةِ إِلَيْهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(355) هَلْ يَجُوزُ لِلْمُسْلِمِ أَنْ يَدْفَعَ الزَّكَاةَ لِزَوْجَتِهِ أَوْ لِأَبِيهِ وَأُمِّهِ الْفُقَرَاءِ.</p><p class=\"answer\">لا يَجُوزُ لِلرَّجُلِ أَنْ يَدْفَعَ الزَّكَاةَ لِزَوْجَتِهِ أَوْ لِأَبِيهِ وَأُمِّهِ الْفُقَرَاءِ وَلا يَجُوزُ لَهُ أَنْ يَدْفَعُ الزَّكَاةَ لِأَوْلادِهِ الْبَالِغِينَ بِالْعُمْلَةِ الْوَرَقِيَّةِ وَيَجُوزُ أَنْ يَدْفَعَ الزَّكَاةَ لِأَخِيهِ وأُخْتِهِ الْفَقِيرَيْنِ.</p></div>", "wordCount": 847, "paraCount": 41}, {"id": "siyam", "title": "كتاب الصيام", "icon": "fa-moon", "desc": "أحكام الصيام ورمضان والكفارات", "content": "<p>كِتَابُ الصِّيَامِ</p>\n<div class=\"qa-item\"><p class=\"question\">(356) مَا مَعْنَى الصِّيَامِ شَرْعًا.</p><p class=\"answer\">الصِّيَامُ شَرْعًا هُوَ الإِمْسَاكُ عَنِ الْمُفَطِّرَاتِ مِنَ الْفَجْرِ إِلَى الْمَغْرِبِ مَعَ النِّيَّةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(357) مَا الدَّلِيلُ عَلَى فَرْضِيَّةِ الصِّيَامِ فِى رَمَضَانَ.</p><p class=\"answer\">قَالَ اللَّهُ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ كَمَا كُتِبَ عَلَى الَّذِينَ مِنْ قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(358) كَيْفَ يَثْبُتُ صِيَامُ رَمَضَانَ.</p><p class=\"answer\">يَثْبُتُ صِيَامُ رَمَضَانَ بِشَهَادَةِ مُسْلِمٍ ذَكَرٍ حُرٍّ عَدْلٍ أَنَّهُ رَأَى هِلالَ رَمَضَانَ بَعْدَ غُرُوبِ شَمْسِ التَّاسِعِ وَالْعِشْرِينَ مِنْ شَعْبَانَ أَوْ بِاسْتِكْمَالِ شَعْبَانَ ثَلاثِينَ يَوْمًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(359) عَلَى مَنْ يَجِبُ صِيَامُ رَمَضَانَ.</p><p class=\"answer\">يَجِبُ صِيَامُ رَمَضَانَ عَلَى كُلِّ مُسْلِمٍ بَالِغٍ عَاقِلٍ قَادِرٍ عَلَى الصِّيَامِ وَلا يَصِحُّ مِنْ حَائِضٍ وَنُفَسَاءَ وَيَجِبُ عَلَيْهِمَا الْقَضَاءُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(360) هَلْ يَصِحُّ الصِّيَامُ مِنَ الصَّبِىِّ غَيْرِ الْمُمَيِّزِ.</p><p class=\"answer\">لا يَصِحُّ الصِّيَامُ مِنْ غَيْرِ الْمُمَيِّزِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(361) مَا هِىَ الأَعْذَارُ الَّتِى يَجُوزُ بِهَا الْفِطْرُ.</p><p class=\"answer\">يَجُوزُ الْفِطْرُ لِمُسَافِرٍ قَبْلَ الْفَجْرِ سَفَرًا طَوِيلًا إِذَا كَانَ سَفَرُهُ فِى غَيْرِ مَعْصِيَةٍ وَلِحَامِلٍ وَمُرْضِعٍ خَافَتَا عَلَى نَفْسَيْهِمَا الضَّرَرَ أَوْ عَلَى وَلَدَيْهِمَا كَأَنْ عَلِمَتِ الْحَامِلُ أَوِ الْمُرْضِعُ أَنَّهَا تَتَضَرَّرُ أَوْ يَتَضَرَّرُ الْوَلَدُ بَعْدَ أَنْ جَرَّبَتْ أَنْ تَصُومَ يَوْمًا أَمَّا مُجَرَّدُ الْحَمْلِ وَالإِرْضَاعِ فَلَيْسَ عُذْرًا لِلْفِطْرِ. وَيَجُوزُ الْفِطْرُ لِعَاجِزٍ عَنِ الصِّيَامِ لِكِبَرِ سِنٍّ أَوْ مَرَضٍ يَشَقُّ عَلَيْهِ الصَّوْمُ مَشَقَّةً لا تُحْتَمَلُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(362) هَلْ يَجِبُ عَلَى الْعَاجِزِ عَنِ الصِّيَامِ لِكِبَرِ سِنٍّ أَوْ مَرَضٍ لا يُرْجَى شِفَاؤُهُ أَنْ يَدْفَعَ الْفِدْيَةَ عِنْدَ الْحَنَفِيَّةِ.</p><p class=\"answer\">تَجِبُ الْفِدْيَةُ عِنْدَ الْحَنَفِيَّةِ عَلَى الشَّيْخِ الْفَانِى وَلا تَجِبُ عَلَى الْمَرِيضِ وَالْمُسَافِرِ وَالْحَامِلِ وَالْمُرْضِعِ وَلَوْ خَافَتَا عَلَى وَلَدَيْهِمَا. وَالْفِدْيَةُ عِنْدَهُمْ نِصْفُ صَاعٍ مِنْ قَمْحٍ أَوْ صَاعٌ مِنْ شَعِيرٍ أَوْ أَرُزٍّ أَوْ تَمْرٍ أَوْ قِيمَةُ ذَلِكَ وَلَوْ بِالْعُمْلَةِ الْوَرَقِيَّةِ. وَنِصْفُ الصَّاعِ مِنْ قَمْحٍ أَلْفَانِ وَمِائَةٌ وَخَمْسَةٌ وَأَرْبَعُونَ غرَامًا تَقْرِيبًا. وَيَصِحُّ عِنْدَهُمْ إِخْرَاجُهَا وَلَوْ فِى أَوَّلِ الشَّهْرِ وَعِنْدَ بَعْضِهِمْ ءَاخِرَ الشَّهْرِ عَنِ الشَّهْرِ كُلِّهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(363) مَا هِىَ فَرَائِضُ الصِّيَامِ.</p><p class=\"answer\">فَرَائِضُ الصِّيَامِ اثْنَانِ النِّيَّةُ لَيْلًا وَالإِمْسَاكُ عَنِ الْمُفَطِّرَاتِ نَهَارًا. وَتَجِبُ النِّيَّةُ لِكُلِّ يَوْمٍ مِنْ رَمَضَانَ وَكَمَالُ النِّيَّةِ أَنْ يَقُولَ بِقَلْبِهِ نَوَيْتُ صَوْمَ يَوْمِ غَدٍ عَنْ أَدَاءِ فَرْضِ رَمَضَانِ هَذِهِ السَّنَة إِيمَانًا وَاحْتِسَابًا لِلَّهِ تَعَالَى وَالِاحْتِسَابُ هُوَ طَلَبُ الأَجْرِ. وَيَكْفِى عِنْدَ الإِمَامِ مَالِكٍ أَنْ يَنْوِىَ فِى لَيْلَةِ الْيَوْمِ الأَوَّلِ مِنْ رَمَضَانَ عَنِ الشَّهْرِ كُلِّهِ مَا لَمْ يَطْرَأْ مَانِعٌ مِنْ تَتَابُعِ صِيَامِهِ كَمَرَضٍ كَأَنْ يَقُولَ بِقَلْبِهِ نَوَيْتُ صَوْمَ شَهْرِ رَمَضَانِ هَذِهِ السَّنَة إِيمَانًا وَاحْتِسَابًا لِلَّهِ تَعَالَى.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(364) هَلْ يَجِبُ تَبْيِيتُ النِّيَّةِ لِلصِّيَامِ فِى رَمَضَانَ.</p><p class=\"answer\">يَجِبُ تَبْيِيتُ النِّيَّةِ لِكُلِّ يَوْمٍ مِنْ رَمَضَانَ بِأَنْ يَنْوِىَ لَيْلًا بَيْنَ غُرُوبِ الشَّمْسِ وَطُلُوعِ الْفَجْرِ فَإِنْ نَسِىَ لَزِمَهُ الإِمْسَاكُ عَنِ الْمُفَطِّرَاتِ بَقِيَّةَ النَّهَارِ وَقَضَاءُ هَذَا الْيَوْمِ. وَيَصِحُّ عِنْدَ أَبِى حَنِيفَةَ أَنْ يَنْوِىَ الصِّيَامَ فِى الْيَوْمِ التَّالِى قَبْلَ دُخُولِ وَقْتِ الظُّهْرِ قَبْلَ أَنْ يَتَنَاوَلَ مُفَطِّرًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(365) عَمَّ يَجِبُ الإِمْسَاكُ أَثْنَاءَ الصَّوْمِ.</p><p class=\"answer\">يَجِبُ الإِمْسَاكُ عَنِ الأَكْلِ وَالشُّرْبِ وَالْجِمَاعِ وَالِاسْتِمْنَاءِ وَهُوَ اسْتِخْرَاجُ الْمَنِىِّ بِغَيْرِ جِمَاعٍ بِنَحْوِ الْيَدِ وَالِاسْتِقَاءَةِ وَهِىَ اسْتِخْرَاجُ الْقَىْءِ عَمْدًا بِنَحْوِ إِدْخَالِ إِصْبَعِهِ فِى فَمِهِ. وَيَجِبُ الإِمْسَاكُ عَنِ الرِّدَّةِ أَىِ الْكُفْرِ سَوَاءٌ كَانَ بِالْقَوْلِ كَسَبِّ اللَّهِ أَوِ الْفِعْلِ كَالسُّجُودِ لِلشَّيْطَانِ أَوِ الِاعْتِقَادِ كَاعْتِقَادِ أَنَّ اللَّهَ لَهُ شَكْلٌ أَوْ حَجْمٌ أَوْ أَنَّهُ يَسْكُنُ مَكَانًا أَوْ جِهَةً أَوِ اعْتِقَادِ أَنَّهُ جَالِسٌ عَلَى الْعَرْشِ وَيَنْزِلُ حَقِيقَةً وَيَصْعَدُ وَالْعِيَاذُ بِاللَّهِ. وَيَجِبُ عَلَى الصَّائِمِ الإِمْسَاكُ عَنْ إِدْخَالِ شَىْءٍ لَهُ حَجْمٌ إِلَى جَوْفِهِ مِنْ مَنْفَذٍ مَفْتُوحٍ كَالْفَمِ وَالأَنْفِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(366) مَاذَا يَجِبُ عَلَى مَنْ وَقَعَ فِى الرِّدَّةِ أَثْنَاءَ الصِّيَامِ.</p><p class=\"answer\">يَجِبُ عَلَى مَنْ وَقَعَ فِى الرِّدَّةِ أَثْنَاءَ الصِّيَامِ الرُّجُوعُ فَوْرًا إِلَى الإِسْلامِ بِالنُّطْقِ بِالشَّهَادَتَيْنِ وَالإِمْسَاكُ عَنِ الْمُفَطِّرَاتِ بَقِيَّةَ النَّهَارِ وَقَضَاءُ هَذَا الْيَوْمِ بَعْدَ يَوْمِ الْعِيدِ فَوْرًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(367) مَا حُكْمُ مَنْ أَكَلَ أَوْ شَرِبَ نَاسِيًا فِى نَهَارِ رَمَضَانَ وَهُوَ صَائِمٌ.</p><p class=\"answer\">مَنْ أَكَلَ أَوْ شَرِبَ نَاسِيًا فِى نَهَارِ رَمَضَانَ وَهُوَ صَائِمٌ لا يَفْسُدُ صَوْمُهُ لِقَوْلِهِ ﷺ مَنْ نَسِىَ وَهُوَ صَائِمٌ فَأَكَلَ أَوْ شَرِبَ فَلْيُتِمَّ صَوْمَهُ فَإِنَّمَا أَطْعَمَهُ اللَّهُ وَسَقَاهُ رَوَاهُ الْبُخَارِىُّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(368) هَلِ الْقَىْءُ مُفَطِّرٌ.</p><p class=\"answer\">إِذَا اسْتَقَاءَ بِنَحْوِ إِدْخَالِ إِصْبَعِهِ أَفْطَرَ أَمَّا لَوْ غَلَبَهُ الْقَىْءُ وَلَمْ يَبْلَعْ شَيْئًا مِنْ رِيقِهِ الْمُتَنَجِّسِ فَلا يُفْطِرُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(369) هَلِ الْقَطْرَةُ فِى الْعَيْنِ أَوِ الأُذُنِ مُفَطِّرَةٌ.</p><p class=\"answer\">الْقَطْرَةُ فِى الْعَيْنِ لا تُفَطِّرُ فِى مَذْهَبِ الإِمَامِ الشَّافِعِىِّ وَلَوْ شَعَرَ بِطَعْمِهَا فِى حَلْقِهِ وَاخْتَلَفَ أَصْحَابُ الشَّافِعِىِّ فِى الأُذُنِ هَلْ هِىَ مَنْفَذٌ مَفْتُوحٌ أَمْ لا فَقَالَ بَعْضٌ مَا دَخَلَ الأُذُنَ وَجَاوَزَ الظَّاهِرَ إِلَى بَاطِنِهَا أَىْ جَاوَزَ خَرْقَ الأُذُنِ مِنْ مَاءٍ أَوْ دَوَاءٍ أَوْ دُهْنٍ مُفَطِّرٌ وَقَالَ بَعْضُهُمْ لا يُفَطِّرُ لِأَنَّهُ كَتَشَرُّبِ الْمَسَامِّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(370) مَا هِىَ الأَيَّامُ الَّتِى لا يَجُوزُ وَلا يَصِحُّ صَوْمُهَا.</p><p class=\"answer\">لا يَصِحُّ وَلا يَجُوزُ صَوْمُ يَوْمِ عِيدِ الْفِطْرِ وَيَوْمِ عِيدِ الأَضْحَى وَأَيَّامِ التَّشْرِيقِ الثَّلاثَةِ وَهِىَ الَّتِى تَلِى يَوْمَ عِيدِ الأَضْحَى.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(371) هَلْ يَجُوزُ صَوْمُ يَوْمِ الشَّكِّ.</p><p class=\"answer\">لا يَصِحُّ وَلا يَجُوزُ صَوْمُ يَوْمِ الشَّكِّ أَىْ يَوْمِ الثَّلاثِينَ مِنْ شَعْبَانَ عَلَى أَنَّهُ مِنْ رَمَضَانَ أَىْ إِذَا أَخْبَرَ مَنْ لا يَثْبُتُ الصِّيَامُ بِشَهَادَتِهِمْ كَالْفَسَقَةِ أَنَّهُمْ رَأَوْا هِلالَ رَمَضَانَ فِى التَّاسِعِ وَالْعِشْرِينَ لَيْلًا لِوُرُودِ النَّهْىِ عَنْ صَوْمِهِ قَالَ عَمَّارُ بنُ يَاسِرٍ رَضِىَ اللَّهِ عَنْهُ مَنْ صَامَ الْيَوْمَ الَّذِى يُشَكُّ فِيهِ فَقَدْ عَصَى أَبَا الْقَاسِمِ رَوَاهُ ابْنُ حِبَّانَ وَصَحَّحَهُ. أَمَّا صِيَامُ يَوْمِ الشَّكِّ لِقَضَاءِ يَوْمٍ فَائِتٍ فَيَجُوزُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(372) هَلْ يَجُوزُ صَوْمُ النِّصْفِ الأَخِيرِ مِنْ شَعْبَانَ.</p><p class=\"answer\">لا يَصِحُّ وَلا يَجُوزُ صَوْمُ النِّصْفِ الأَخِيرِ مِنْ شَعْبَانَ إِلَّا إِذَا وَصَلَهُ بِمَا قَبْلَهُ كَأَنْ صَامَ الْخَامِسَ عَشَرَ مِنْهُ وَوَصَلَهُ بِمَا بَعْدَهُ أَوْ كَانَ صَوْمُهُ لِلنِّصْفِ الأَخِيرِ مِنْ شَعْبَانَ لِقَضَاءِ أَيَّامٍ فَاتَتْهُ أَوْ نَذْرٍ أَوْ وِرْدٍ وَهُوَ مَا يُعْتَادُ صَوْمُهُ تَطَوُّعًا كَمَنِ اعْتَادَ صَوْمَ الِاثْنَيْنِ وَالْخَمِيسِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(373) مَا حُكْمُ مَنْ جَامَعَ فِى نَهَارِ رَمَضَانَ عَمْدًا بِغَيْرِ عُذْرٍ.</p><p class=\"answer\">مَنْ جَامَعَ فِى نَهَارِ رَمَضَانَ عَمْدًا بِغَيْرِ عُذْرٍ فَسَدَ صَوْمُهُ وَعَلَيْهِ الإِثْمُ وَالْقَضَاءُ بَعْدَ يَوْمِ الْعِيدِ فَوْرًا وَكَفَّارَةٌ. وَالْكَفَّارَةُ عَلَى الرَّجُلِ وَلَيْسَتْ عَلَى الْمَرْأَةِ وَهِىَ عِتْقُ رَقَبَةٍ مُؤْمِنَةٍ فَإِنْ لَمْ يَسْتَطِعْ فَصِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ فَإِنْ لَمْ يَسْتَطِعْ فَإِطْعَامُ سِتِّينَ مِسْكِينًا سِتِّينَ مُدًّا مِنْ غَالِبِ قُوتِ الْبَلَدِ كَالْقَمْحِ وَالْمُدُّ مِلْءُ الْكَفَّيْنِ الْمُعْتَدِلَتَيْنِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(374) مَا حُكْمُ مَنْ جَامَعَ فِى نَهَارِ رَمَضَانَ نَاسِيًا.</p><p class=\"answer\">مَنْ جَامَعَ فِى نَهَارِ رَمَضَانَ نَاسِيًا لا يَفْسُدُ صَوْمُهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(375) هَلْ يَحْرُمُ عَلَى الصَّائِمِ صَوْمَ فَرْضٍ تَقْبِيلُ زَوْجَتِهِ بِشَهْوَةٍ.</p><p class=\"answer\">يَحْرُمُ عَلَى الصَّائِمِ صَوْمَ فَرْضٍ تَقْبِيلُ زَوْجَتِهِ بِشَهْوَةٍ إِنْ خَشِىَ إِنْزَالَ الْمَنِىِّ بِسَبَبِ الْقُبْلَةِ أَمَّا إِنْ قَبَّلَهَا بِشَهْوَةٍ وَكَانَ لا يَخْشَى الإِنْزَالَ فَلَيْسَ حَرَامًا إِنَّمَا هُوَ مَكْرُوهٌ فَقَطْ. وَأَمَّا إِنْ قَبَّلَهَا بِلا شَهْوَةٍ فَلَيْسَ مَكْرُوهًا وَلا مَعْصِيَةَ فِيهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(376) هَلِ الْغِيبَةُ تُذْهِبُ ثَوَابَ الصَّوْمِ.</p><p class=\"answer\">اعْلَمْ أَنَّ مَنْ وَقَعَ فِى الْغِيبَةِ لا يَفْسُدُ صَوْمُهُ لَكِنْ غِيبَةُ التَّقِىِّ وَكَذَلِكَ النَّمِيمَةُ وَشَهَادَةُ الزُّورِ أَىِ الْكَذِبِ وَالْعَمَلُ بِهَا تُذْهِبُ ثَوَابَ الصَّوْمِ. وَالْغِيبَةُ هِىَ ذِكْرُكَ أَخَاكَ الْمُسْلِمَ بِمَا فِيهِ فِى خَلْفِهِ بِمَا يَكْرَهُ وَأَمَّا النَّمِيمَةُ فَهِىَ نَقْلُ الْكَلامِ بَيْنَ اثْنَيْنِ مُسْلِمَيْنِ لِافْسَادِ الْعَلاقَةِ بَيْنَهُمَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(377) مَا هِىَ الأَيَّامُ الَّتِى يُسَنُّ الصِّيَامُ فِيهَا.</p><p class=\"answer\">يُسَنُّ صَوْمُ يَوْمِ عَرَفَةَ وَيَوْمِ النِّصْفِ مِنْ شَعْبَانَ وَعَاشُورَاءَ وَهُوَ الْعَاشِرُ مِنْ شَهْرِ مُحَرَّمٍ وَتَاسُوعَاءَ وَهُوَ التَّاسِعُ مِنْ شَهْرِ مُحَرَّمٍ. وَيُسَنُّ صَوْمُ سِتٍّ مِنْ شَوَّالٍ وَأَيَّامِ الْبِيضِ وَهِىَ الثَّالِثَ عَشَرَ وَالرَّابِعَ عَشَرَ وَالْخَامِسَ عَشَرَ مِنْ كُلِّ شَهْرٍ. وَيُسَنُّ صَوْمُ يَوْمِ الِاثْنَيْنِ وَالْخَمِيسِ وَيُكْرَهُ إِفْرَادُ صَوْمِ يَوْمِ الْجُمُعَةِ فِى النَّفْلِ بِلا سَبَبٍ أَمَّا إِذَا صَادَفَ يَوْمُ عَرَفَةَ أَوِ النِّصْفُ مِنْ شَعْبَانَ يَوْمَ الْجُمُعَةِ فَلا يُكْرَهُ إِفْرَادُهُ بِالصَّوْمِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(378) تَكَلَّمْ عَنْ فَضْلِ لَيْلَةِ النِّصْفِ مِنْ شَعْبَانَ.</p><p class=\"answer\">اعْلَمْ أَنَّهُ يُسَنُّ صَوْمُ يَوْمِ النِّصْفِ مِنْ شَعْبَانَ وَقِيَامُ لَيْلِهِ بِالطَّاعَةِ وَالْعِبَادَةِ لِحَدِيثِ إِذَا كَانَتْ لَيْلَةُ النِّصْفِ مِنْ شَعْبَانَ فَقُومُوا لَيْلَهَا وَصُومُوا نَهَارَهَا رَوَاهُ ابْنُ مَاجَهْ. وَمِنْ خَصَائِصِ لَيْلَةِ النِّصْفِ مِنْ شَعْبَانَ أَنَّ الدُّعَاءَ فِيهَا مُسْتَجَابٌ ذَكَرَ ذَلِكَ الإِمَامُ الشَّافِعِىُّ فِى كِتَابِهِ الأُمّ. وَوَرَدَ عَنْ الرَّسُولِ ﷺ أَنَّهُ قَالَ يَطَّلِعُ اللَّهُ إِلَى خَلْقِهِ فِى لَيْلَةِ النِّصْفِ مِنْ شَعْبَانَ فَيَغْفِرُ لِجَمِيعِ خَلْقِهِ إِلَّا لِمُشْرِكٍ أَوْ مُشَاحِن رَوَاهُ ابْنُ حِبَّانَ. وَمَعْنَى يَطَّلِعُ اللَّهُ إِلَى خَلْقِهِ فِى لَيْلَةِ النِّصْفِ مِنْ شَعْبَانَ يَرْحَمُهُمْ فِيهَا بِرَحْمَةٍ خَاصَّةٍ فَيَغْفِرُ لِبَعْضِ عِبَادِهِ الْمُسْلِمِينَ بَعْضَ ذُنُوبِهِمْ وَلِبَعْضٍ كُلَّ ذُنُوبِهِمْ أَمَّا الْمُشَاحِنُ وَهُوَ الَّذِى بَيْنَهُ وَبَيْنَ مُسْلِمٍ ءَاخَرَ عَدَاوَةٌ وَحِقْدٌ وَبَغْضَاءُ لِأَجْلِ الدُّنْيَا وَالْكَافِرُ فَلا يَغْفِرُ اللَّهُ لَهُمَا فِى تِلْكَ اللَّيْلَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(379) مَاذَا حَصَلَ فِى يَوْمِ عَاشُورَاءَ.</p><p class=\"answer\">يَوْمُ عَاشُورَاءَ هُوَ الْيَوْمُ الْعَاشِرُ مِنْ شَهْرِ الْمُحَرَّمِ وَهُوَ الْيَوْمُ الَّذِى نَجَّى اللَّهُ فِيهِ سَيِّدَنَا نُوحًا وَمَنْ مَعَهُ فِى السَّفِينَةِ مِنَ الطُّوفَانِ وَفِيهِ تَابَ اللَّهُ عَلَى سَيِّدِنَا ءَادَمَ عَلَيْهِ السَّلامُ مِنْ مَعْصِيَةٍ صَغِيرَةٍ لا خِسَّةَ فِيهَا وَلا دَنَاءَةَ وَفِيهِ نَجَّى اللَّهُ سَيِّدَنَا مُوسَى وَأَتْبَاعَهُ الْمُسْلِمِينَ مِنَ الْغَرَقِ وَأَهْلَكَ فِرْعَوْنَ وَمَنْ مَعَهُ مِنَ الْكَافِرِينَ وَفِيهِ نَجَّى اللَّهُ نَبِيَّهُ إِبْرَاهِيمَ عَلَيْهِ السَّلامُ مِنْ نَارِ النُّمْرُودِ وَفِيهِ نَجَّى اللَّهُ نَبِيَّهُ يُونُسَ عَلَيْهِ السَّلامُ مِنْ جَوْفِ الْحُوتِ وَفِيهِ رُفِعَ الْمَسِيحُ عَلَيْهِ السَّلامُ إِلَى السَّمَاءِ وَفِيهِ رَدَّ اللَّهُ سَيِّدَنَا يُوسُفَ عَلَى أَبِيهِ سَيِّدِنَا يَعْقُوبَ عَلَيْهِمَا السَّلامُ وَفِيهِ شَفَى اللَّهُ سَيِّدَنَا أَيُّوبَ عَلَيْهِ السَّلامُ وَرَفَعَ عَنْهُ الْبَلاء وَفِيهِ قُتِلَ سَيِّدُنَا الْحُسَيْنُ رَضِىَ اللَّهُ عَنْهُ فِى كَرْبَلاءَ فَظَهَرَتِ النُّجُومُ فِى النَّهَارِ وَبَكَى عَلَيْهِ الصَّالِحُونَ مِنْ أَهْلِ الأَرْضِ وَمَلائِكَةُ السَّمَاءِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(380) اذْكُرْ بَعْضَ سُنَنِ الصِّيَامِ.</p><p class=\"answer\">يُسَنُّ لِلصَّائِمِ أَنْ يُعَجِّلَ الْفِطْرَ وَأَنْ يُفْطِرَ عَلَى تَمْرٍ فَإِنْ لَمْ يَجِدْ فَعَلَى مَاءٍ وَيُسَنُّ لَهُ أَنْ يَقُولَ عِنْدَ فِطْرِهِ اللَّهُمَّ لَكَ صُمْتُ وَعَلَى رِزْقِكَ أَفْطَرْتُ ذَهَبَ الظَّمَأُ وَابْتَلَّتِ الْعُرُوقُ وَثَبَتَ الأَجْرُ إِنْ شَاءَ اللَّهُ. وَيُسْتَحَبُّ لَهُ أَنْ يَقُولَ إِذَا أَفْطَرَ اللَّهُمَّ إِنِّى أَسْأَلُكَ بِرَحْمَتِكَ الَّتِى وَسِعَتْ كُلَّ شَىْءٍ أَنْ تَغْفِرَ لِى. وَيُسَنُّ لِمَنْ أَفْطَرَ عِنْدَ شَخْصٍ أَنْ يَقُولَ لَهُ أَفْطَرَ عِنْدَكُمُ الصَّائِمُونَ وَأَكَلَ طَعَامَكُمُ الأَبْرَارُ وَصَلَّتْ عَلَيْكُمُ الْمَلائِكَةُ. وَيُسَنُّ لَهُ أَنْ يَتَسَحَّرَ وَأَنْ يُؤَخِّرَ السُّحُورَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(381) هَلْ يَصِحُّ الْجَمْعُ بَيْنَ صِيَامِ الْقَضَاءِ وَصِيَامِ سِتٍّ مِنْ شَوَّالٍ فِى نِيَّةٍ وَاحِدَةٍ.</p><p class=\"answer\">لا يَصِحُّ الْجَمْعُ بَيْنَ الْعِبَادَتَيْنِ بِنِيَّةٍ وَاحِدَةٍ عَلَى الْقَوْلِ الْمُعْتَمَدِ وَإِذَا صَامَ بِنِيَّةِ الْقَضَاءِ وَبِنِيَّةِ السِّتِّ مِنْ شَوَّالٍ حَصَلَ الْفَرْضُ فَقَطْ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(382) هَلْ يَجُوزُ إِطْعَامُ الْمُكَلَّفِ غَيْرِ الْمَعْذُورِ فِى نَهَارِ رَمَضَانَ.</p><p class=\"answer\">لا يَجُوزُ إِطْعَامُ الْمُكَلَّفِ غَيْرِ الْمَعْذُورِ فِى نَهَارِ رَمَضَانَ وَلَوْ كَانَ كَافِرًا فَالْكَافِرُ الْمُكَلَّفُ غَيْرُ الْمَعْذُورِ إِذَا أَكَلَ فِى نَهَارِ رَمَضَانَ عَلَيْهِ مَعْصِيَةٌ كَبِيرَةٌ وَلا يَجُوزُ إِعَانَتُهُ عَلَى الْمَعْصِيَةِ فَمَنْ أَعَانَ غَيْرَهُ عَلَى فِعْلِ مَعْصِيَةٍ كَبِيرَةٍ وَقَعَ فِى ذَنْبٍ كَبِيرٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(383) تَكَلَّمْ عَنْ فَضْلِ لَيْلَةِ الْقَدْرِ.</p><p class=\"answer\">لَيْلَةُ الْقَدْرِ هِىَ لَيْلَةٌ فِى رَمَضَانَ عَظِيمَةُ الشَّأْنِ الْعَمَلُ الصَّالِحُ فِيهَا لَهُ قَدْرٌ عَظِيمٌ عِنْدَ اللَّهِ وَثَوَابُ الْعِبَادَةِ فِيهَا أَفْضَلُ مِنْ ثَوَابِ الْعِبَادَةِ فِى أَلْفِ شَهْرٍ لَيْسَ فِيهِ لَيْلَةُ الْقَدْرِ. وَقَدْ تُصَادِفُ هَذِهِ اللَّيْلَةُ أَىَّ لَيْلَةٍ مِنْ شَهْرِ رَمَضَانَ لَكِنَّهَا فِى الْغَالِبِ تَكُونُ فِى الْعَشْرِ الأَوَاخِرِ. وَإِحْيَاءُ لَيْلَةِ الْقَدْرِ يَكُونُ بِالصَّلاةِ فِيهَا بِأَنْ يَقُومَ كُلَّ اللَّيْلِ أَوْ مُعْظَمَهُ أَوْ نِصْفَ اللَّيْلِ، لا بُدَّ أَنْ يَكُونَ مُسْتَيْقِظًا أَكْثَرَ مِنْ نِصْفِ اللَّيْلِ وَلَوْ بِقَلِيلٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(384) مَا هِىَ عَلامَاتُ لَيْلَةِ الْقَدْرِ.</p><p class=\"answer\">مِنْ عَلامَاتِ لَيْلَةِ الْقَدْرِ رُؤْيَةُ نُورٍ غَيْرِ نُورِ الشَّمْسِ وَالْقَمَرِ وَالْكَهْرُبَاءِ يَمْلَأُ السَّمَاءَ وَيَدْخُلُ الْبُيُوتَ. وَمِنْ عَلامَاتِهَا رُؤْيَةُ الأَشْجَارِ سَاجِدَةً وَطُلُوعُ الشَّمْسِ صَبِيحَتَهَا لَطِيفَةً بَيْضَاءَ لا شُعَاعَ لَهَا وَرُؤْيَةُ الْمَلائِكَةِ عَلَى أَشْكَالِهِمُ الأَصْلِيَّةِ أَوْ سَمَاعُ أَصْوَاتِهِمْ. وَمَنْ يَسَّرَ اللَّهُ لَهُ أَنْ يَدْعُوَ فِى وَقْتِ رُؤْيَتِهَا كَانَ ذَلِكَ عَلامَةً لِاسْتِجَابَةِ الدُّعَاءِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(385) مَا هِىَ التَّرَاوِيحُ.</p><p class=\"answer\">التَّرَاوِيحُ هِىَ الصَّلاةُ الَّتِى تُصَلَّى فِى كُلِّ لَيْلَةٍ مِنْ شَهْرِ رَمَضَانَ وَهِىَ عِشْرُونَ رَكْعَةً بِعَشْرِ تَسْلِيمَاتٍ وَوَقْتُهَا مَا بَيْنَ صَلاةِ الْعِشَاءِ وَطُلُوعِ الْفَجْرِ يَنْوِى فِى كُلِّ رَكْعَتَيْنِ أَنَّهُ يُصَلِّى رَكْعَتَيْنِ مِنَ التَّرَاوِيحِ. وَيُسَنُّ أَنْ يُنَادَى الصَّلاةُ جَامِعَة لِأَنَّهَا نَفْلٌ تُشْرَعُ فِيهِ الْجَمَاعَةُ وَلا يُؤَذَّنُ لَهَا وَلا يُقَامُ. أَمَّا إِذَا كَانَ يُصَلِّى قِيَامَ رَمَضَانَ فَيُصَلِّى ثَمَانِىَ رَكَعَاتٍ يَنْوِى فِى كُلِّ رَكْعَتَيْنِ قِيَامَ رَمَضَانَ وَيُوتِرُ بَعْدَهَا بِثَلاثٍ إِلَّا أَنْ يَكُونَ لَهُ تَهَجُّدٌ يُصَلِّيهِ بَعْدَ التَّرَاوِيحِ فَيَجْعَلُ الْوِتْرَ بَعْدَهُ. وَالتَّهَجُّدُ هُوَ أَنْ يُصَلِّىَ النَّفْلَ بَعْدَ نَوْمٍ وَالأَفْضَلُ أَنْ يُسَلِّمَ مِنْ كُلِّ رَكْعَتَيْنِ يَنْوِى بِهِمَا قِيَامَ اللَّيْلِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(386) مَاذَا يَنْبَغِى لِلْمُسْلِمِ أَنْ يَعْمَلَ فِى يَوْمِ الْعِيدِ.</p><p class=\"answer\">يُسَنُّ لِلْمُسْلِمِ أَنْ يَغْتَسِلَ لِيَوْمِ الْعِيدِ وَيَبْدَأُ وَقْتُهُ بَعْدَ طُلُوعِ الْفَجْرِ وَيَنْبَغِى لَهُ أَنْ يَلْبَسَ الثِّيَابَ الْحَسَنَةَ النَّظِيفَةَ وَالأَحْسَنُ لِلرَّجُلِ أَنْ يَلْبَسَ الْقَمِيصَ الأَبْيَضَ الطَّوِيلَ وَأَنْ يَضَعَ عَلَى كَتِفَيْهِ رِدَاءً أَبْيَضَ وَعَلَى رَأْسِهِ قَلَنْسُوَةً. وَيُسْتَحَبُّ لِمَنْ لَبِسَ لِبَاسًا جَدِيدًا أَنْ يَقُولَ الْحَمْدُ لِلَّهِ الَّذِى كَسَانِى مَا أُوَارِى بِهِ عَوْرَتِى وَأَتَجَمَّلُ بِهِ فِى حَيَاتِى. وَيُسْتَحَبُّ إِذَا لَبِسَ وَنَظَرَ فِى الْمِرْآةِ أَنْ يَقُولَ الْحَمْدُ لِلَّهِ اللَّهُمَّ كَمَا حَسَّنْتَ خَلْقِى فَحَسِّنْ خُلُقِى أَىْ كَمَا أَنَّكَ لَمْ تَجْعَلْ فِى خِلْقَتِى عَاهَةً فَجَمِّلْنِى بِالأَخْلاقِ الْحَسَنَةِ. وَيُسْتَحَبُّ التَّنَظُّفُ يَوْمَ الْعِيدِ بِنَتْفِ الإِبْطِ وَحَلْقِ شَعْرِ الْعَانَةِ وَقَلْمُ الظُّفْرِ وَقَطْعُ الرَّائِحَةِ الْكَرِيهَةِ وَالتَّطَيُّبُ ويَسْتَوِى فِى اسْتِحْبَابِ مَا ذُكِرَ الْقَاعِدُ فِى بَيْتِهِ وَالْخَارِجُ إِلَى صَلاةِ الْعِيدِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(387) مَاذَا يُسْتَحَبُّ لِمَنْ أَرَادَ الْخُرُوجَ لِصَلاةِ الْعِيدِ.</p><p class=\"answer\">يُسْتَحَبُّ لِلْمُسْلِمِ أَنْ يُبَكِّرَ لِصَلاةِ الْعِيدِ ويُسَنُّ الْخُرُوجُ مَشْيًا اتِّبَاعًا لِلنَّبِىِّ ﷺ يَغْدُو مِنْ طَرِيقٍ وَيَعُودُ مِنْ أُخْرَى. وَيُسَنُّ لَهُ قَبْلَ أَنْ يَخْرُجَ لِصَلاةِ الْعِيدِ أَنْ يَأْكُلَ تَمَرَاتٍ بِعَدَدٍ وِتْرٍ كَوَاحِدَةٍ أَوْ ثَلاثَةٍ. وَيُسَنُّ التَّكْبِيرُ يَوْمَ الْعِيدِ جَهْرًا وَيُسْتَحَبُّ لِمَنْ لَقِىَ أَخَاهُ الْمُسْلِمَ أَنْ يَقُولَ لَهُ تَقَبَّلَ اللَّهُ مِنَّا وَمِنْكُمْ. وَيُسَنُّ إِخْرَاجُ زَكَاةِ الْفِطْرِ قَبْلَ الصَّلاةِ وَيَنْبَغِى اغْتِنَامُ يَوْمِ الْعِيدِ فِى صِلَةِ الرَّحِمِ وَإِظْهَارُ الْفَرَحِ فِيهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(388) مَا هِىَ تَكْبِيرَاتُ الْعِيدِ.</p><p class=\"answer\">تَكْبِيرَاتُ الْعِيدِ هِىَ</p></div>\n<p>اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ اللَّهُ أَكْبَر، لا إِلَهَ إِلَّا اللَّه، اللَّهُ أَكْبَرُ اللَّهُ أَكْبَر وَلِلَّهِ الْحَمْد.</p>\n<p>اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ اللَّهُ أَكْبَر، لا إِلَهَ إِلَّا اللَّه، اللَّهُ أَكْبَرُ اللَّهُ أَكْبَر وَلِلَّهِ الْحَمْد.</p>\n<p>اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ اللَّهُ أَكْبَر، لا إِلَهَ إِلَّا اللَّه، اللَّهُ أَكْبَرُ اللَّهُ أَكْبَر وَلِلَّهِ الْحَمْد.</p>\n<p>اللَّهُ أَكْبَرُ كَبِيرا وَالْحَمْدُ لِلَّهِ كَثِيرا وَسُبْحَانَ اللَّهِ وَبِحَمْدِهِ بُكْرَةً وَأَصِيلا، لا إِلَهَ إِلَّا اللَّهُ وَحْدَه، صَدَقَ وَعْدَه، وَنَصَرَ عَبْدَه، وَأَعَزَّ جُنْدَه، وَهَزَمَ الأَحْزَابَ وَحْدَه، لا إِلَهَ إِلَّا اللَّه وَلا نَعْبُدُ إِلَّا إِيَّاه مُخْلِصِينَ لَهُ الدِّينَ وَلَوْ كَرِهَ الْكَافِرُون، اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى ءَالِ مُحَمَّد، وَعَلَى أَصْحَابِ مُحَمَّد، وَعَلَى أَنْصَارِ مُحَمَّد، وَعَلَى أَزْوَاجِ مُحَمَّد، وَعَلَى ذُرِّيَّةِ مُحَمَّدٍ وَسَلِّمْ تَسْلِيمًا كَثِيرا، رَبِّ اغْفِرْ لِى وَلِوَالِدَىَّ رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِى صَغِيرا. وَيُسَنُّ التَّكْبِيرُ إِلَى أَنْ يَدْخُلَ الإِمَامُ فِى الصَّلاةِ.</p>\n<div class=\"qa-item\"><p class=\"question\">(389) تَكَلَّمْ عَنْ صَلاةِ عِيدِ الْفِطْرِ.</p><p class=\"answer\">صَلاةُ الْعِيدِ سُنَّةٌ مُؤَكَّدَةٌ وَقِيلَ فَرْضُ كِفَايَةٍ وَهِىَ رَكْعَتَانِ يُكَبِّرُ نَدْبًا فِى الأُولَى بَعْدَ دُعَاءِ الِافْتِتَاحِ وَقَبْلَ التَّعَوُّذِ سَبْعَ تَكْبِيرَاتٍ وَيُكَبِّرُ فِى الثَّانِيَةِ بَعْدَ تَكْبِيرَةِ الْقِيَامِ وَقَبْلَ قِرَاءَةِ الْفَاتِحَةِ خَمْسَ تَكْبِيرَاتٍ يَرْفَعُ يَدَيْهِ فِى جَمِيعِ التَّكْبِيرَاتِ حَذْوَ مَنْكِبَيْهِ وَيَقْرَأُ بَعْدَ الْفَاتِحَةِ فِى الرَّكْعَةِ الأُولَى سُورَةَ ق وَفِى الثَّانِيَةِ سُورَةَ الْقَمَرِ. وَيُسَنُّ أَنْ تُصَلَّى جَمَاعَةً وَيُنَادَى لَهَا الصَّلاةُ جَامِعَة وَلا يُؤَذَّنُ لَهَا وَلا يُقَامُ. وَوَقْتُهَا مِنْ شُرُوقِ شَمْسِ يَوْمِ الْعِيدِ إِلَى مَا قَبْلَ دُخُولِ وَقْتِ الظُّهْرِ وَيُسَنُّ تَأْخِيرُهَا بِنَحْوِ ثُلُثِ سَاعَةٍ بَعْدَ الشُّرُوقِ. وَيَخْطُبُ الإِمَامُ نَدْبًا خُطْبَتَيْنِ بَعْدَ الصَّلاةِ يَسْتَفْتِحُ الأُولَى بِتِسْعِ تَكْبِيرَاتٍ وَالثَّانِيَةَ بِسَبْعِ تَكْبِيرَاتٍ.</p></div>", "wordCount": 2120, "paraCount": 73}, {"id": "hajj", "title": "كتاب الحج", "icon": "fa-kaaba", "desc": "أحكام الحج والعمرة ومناسكهما", "content": "<p>كِتَابُ الْحَجِّ</p>\n<div class=\"qa-item\"><p class=\"question\">(390) مَا هُوَ الْحَجُّ وَالْعُمْرَةُ.</p><p class=\"answer\">الْحَجُّ هُوَ قَصْدُ الْكَعْبَةِ بِأَفْعَالٍ مَخْصُوصَةٍ وَالْعُمْرَةُ زِيَارَةُ الْكَعْبَةِ لِأَفْعَالٍ مَخْصُوصَةٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(391) مَا هِىَ أَشْهُرُ الْحَجِّ.</p><p class=\"answer\">أَشْهُرُ الْحَجِّ شَوَّالٌ وَذُو الْقَعْدَةِ وَذُو الْحِجَّةِ. وَالْحَجُّ لا تَصِحُّ نِيَّتُهُ إِلَّا بَعْدَ دُخُولِ شَهْرِ شَوَّالٍ وَقَبْلَ فَجْرِ لَيْلَةِ الْعَاشِرِ مِنْ ذِى الْحِجَّةِ أَمَّا الْعُمْرَةُ فَتَصِحُّ فى كُلِّ وَقْتٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(392) عَلَى مَنْ يَجِبُ الْحَجُّ وَالْعُمْرَةُ.</p><p class=\"answer\">يَجِبُ الْحَجُّ وَالْعُمْرَةُ مَرَّةً فِى الْعُمُرِ عَلَى الْمُسْلِمِ الْحُرِّ الْبَالِغِ الْعَاقِلِ الْمُسْتَطِيعِ. وَمَنْ وَجَبَ عَلَيْهِ الْحَجُّ وَكَانَ مُسْتَطِيعًا فَأَخَّرَ الْحَجَّ إِلَى الْعَامِ الْقَابِلِ ثُمَّ مَاتَ قَبْلَ أَنْ يَحُجَّ عَصَى اللَّهَ تَعَالَى فَإِذَا حُجَّ عَنْهُ بَعْدَ مَوْتِهِ سَقَطَ عَنْهُ الْفَرْضُ فَلا يُسْأَلُ عَنْهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(393) مَا هِىَ أَرْكَانُ الْحَجِّ.</p><p class=\"answer\">أَرْكَانُ الْحَجِّ سِتَّةٌ مَنْ تَرَكَ رُكْنًا مِنْهَا لا يَصِحُّ حَجُّهُ وَهِىَ الإِحْرَامُ وَالْوُقُوفُ بِعَرَفَةَ وَالطَّوَافُ بِالْكَعْبَةِ وَالسَّعْىُ بَيْنَ الصَّفَا وَالْمَرْوَةِ وَالْحَلْقُ أَوِ التَّقْصِيرُ وَالتَّرْتِيبُ فِى مُعْظَمِ الأَرْكَانِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(394) مَا مَعْنَى الإِحْرَامِ فِى الْحَجِّ.</p><p class=\"answer\">الإِحْرَامُ فِى الْحَجِّ هُوَ نِيَّةُ الدُّخُولِ فِى عَمَلِ الْحَجِّ كَأَنْ يَقُولَ بِقَلْبِهِ دَخَلْتُ فِى عَمَلِ الْحَجِّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(395) مَتَى يَبْدَأُ وَقْتُ الْوُقُوفِ بِعَرَفَةَ وَمَتَى يَنْتَهِى.</p><p class=\"answer\">يَبْدَأُ وَقْتُ الْوُقُوفِ بِعَرَفَةَ بِزَوَالِ يَوْمِ التَّاسِعِ مِنْ ذِى الْحِجَّةِ أَىْ بِدُخُولِ وَقْتِ الظُّهْرِ وَيَنْتَهِى بِطُلُوعِ فَجْرِ لَيْلَةِ الْعَاشِرِ مِنْ ذِى الْحِجَّةِ أَىْ فَجْرِ لَيْلَةِ الْعِيدِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(396) مَا مَعْنَى الطَّوَافِ وَمَا هِىَ شُرُوطُهُ.</p><p class=\"answer\">الطَّوَافُ هُوَ أَنْ يَدُورَ الْحَاجُّ حَوْلَ الْكَعْبَةِ سَبْعَ مَرَّاتٍ. وَمِنْ شُرُوطِ الطَّوَافِ أَنْ يَبْدَأَ بِالْحَجَرِ الأَسْوَدِ وَأَنْ يَجْعَلَ الْكَعْبَةَ عَنْ يَسَارِهِ لا يَسْتَقْبِلُهَا وَلا يَسْتَدْبِرُهَا وَأَنْ يَكُونَ سَبْعًا يَقِينًا. وَمِنْ شُرُوطِهِ سَتْرُ الْعَوْرَةِ وَالطَّهَارَةُ عَنِ الْحَدَثَيْنِ وَعَنِ النَّجَاسَةِ غَيْرِ الْمَعْفُوِ عَنْهَا فَلا يَصِحُّ الطَّوَافُ مَعَ الْحَدَثِ وَلا مَعَ النَّجَاسَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(397) مَتَى يَدْخُلُ وَقْتُ طَوَافِ الْفَرْضِ.</p><p class=\"answer\">يَدْخُلُ وَقْتُ طَوَافِ الْفَرْضِ بَعْدَ مُنْتَصَفِ لَيْلَةِ الْعَاشِرِ مِنْ ذِى الْحِجَّةِ وَهِىَ لَيْلَةُ عِيدِ الأَضْحَى.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(398) مَا هِىَ شُرُوطُ السَّعْىِ بَيْنَ الصَّفَا وَالْمَرْوَةِ.</p><p class=\"answer\">يُشْتَرَطُ أَنْ يَكُونَ السَّعْىُ بَعْدَ طَوَافٍ وَأَنْ يَكُونَ سَبْعًا يَقِينًا وَأَنْ يَبْتَدِئَ بِالصَّفَا وَيَنْتَهِىَ بِالْمَرْوَةِ وَلا تُشْتَرَطُ فِيهِ الطَّهَارَةُ. وَيَصِحُّ السَّعْىُ فِى الْمَسْعَى الْقَدِيمِ وَلا يَصِحُّ فِى الْمَسْعَى الْجَدِيدِ لِأَنَّ مَوْضِعَهُ خَارِجَ حُدُودِ الصَّفَا وَالْمَرْوَةِ عَرْضًا فَلْيُتَنَبَّهْ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(399) مَا مَعْنَى الْحَلْقِ وَالتَّقْصِيرِ وَمَتَى يَدْخُلُ وَقْتُهُ.</p><p class=\"answer\">الْحَلْقُ هُوَ اسْتِئْصَالُ الشَّعَرِ بِالْمُوسَى أَمَّا التَّقْصِيرُ فَهُوَ أَخْذُ شَىْءٍ مِنَ الشَّعَرِ وَأَقَلُّ الْوَاجِبِ إِزَالَةُ ثَلاثِ شَعَرَاتٍ وَيَدْخُلُ وَقْتُهُ بَعْدَ مُنْتَصَفِ لَيْلَةِ الْعِيدِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(400) مَا هِىَ وَاجِبَاتُ الْحَجِّ.</p><p class=\"answer\">وَاجِبَاتُ الْحَجِّ الإِحْرَامُ مِنَ الْمِيقَاتِ وَرَمْىُ جَمْرَةِ الْعَقَبَةِ يَوْمَ الْعِيدِ وَرَمْىُ الْجَمَرَاتِ الثَّلاثِ أَيَّامَ التَّشْرِيقِ أَمَّا الْمَبِيتُ فِى أَرْضِ مُزْدَلِفَةَ وَمِنًى وَطَوَافُ الْوَدَاعِ فَفِيهَا قَوْلانِ قَوْلٌ بِالْوُجُوبِ وَقَوْلٌ بِعَدَمِ الْوُجُوبِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(401) مَتَى يَبْدَأُ وَقْتُ رَمْىِ جَمْرَةِ الْعَقَبَةِ وَالْجَمَرَاتِ الثَّلاثِ وَمَتَى يَنْتَهِى.</p><p class=\"answer\">يَبْدَأُ وَقْتُ رَمْىِ جَمْرَةِ الْعَقَبَةِ بَعْدَ مُنْتَصَفِ لَيْلَةِ الْعِيدِ وَيَبْدَأُ وَقْتُ رَمْىِ الْجَمَرَاتِ الثَّلاثِ بِدُخُولِ وَقْتِ الظُّهْرِ فِى كُلِّ يَوْمٍ مِنْ أَيَّامِ التَّشْرِيقِ الثَّلاثَةِ. وَيَنْتَهِى وَقْتُ رَمْىِ جَمْرَةِ الْعَقَبَةِ وَالْجَمَرَاتِ الثَّلاثِ بِغُرُوبِ شَمْسِ ءَاخِرِ يَوْمٍ مِنْ أَيَّامِ التَّشْرِيقِ. وَالْجَمْرَةُ هِىَ مَوْضِعُ رَمْىِ الْحَصَى بِمِنًى.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(402) مَا هِىَ أَرْكَانُ الْعُمْرَةِ.</p><p class=\"answer\">أَرْكَانُ الْعُمْرَةِ الإِحْرَامُ وَالطَّوَافُ بِالْكَعْبَةِ وَالسَّعْىُ بَيْنَ الصَّفَا وَالْمَرْوَةِ وَالْحَلْقُ أَوِ التَّقْصِيرُ وَتَرْتِيبُ الأَرْكَانِ كَمَا ذُكِرَتْ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(403) مَا مَعْنَى الإِحْرَامِ فِى الْعُمْرَةِ.</p><p class=\"answer\">الإِحْرَامُ فِى الْعُمْرَةِ هُوَ نِيَّةُ الدُّخُولِ فِى عَمَلِ الْعُمْرَةِ فَيَقُولُ بِقَلْبِهِ دَخَلْتُ فِى عَمَلِ الْعُمْرَةِ. وَالإِحْرَامُ لِلْعُمْرَةِ يَكُونُ مِنْ خَارِجِ حَرَمِ مَكَّةَ حَتَّى لِلْمَكِّىِّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(404) مَا هِىَ مُحَرَّمَاتُ الإِحْرَامِ.</p><p class=\"answer\">يَحْرُمُ عَلَى الْمُحْرِمِ بِحَجٍّ أَوْ عُمْرَةٍ طِيبٌ وَدَهْنُ رَأْسٍ وَلِحْيَةٍ بِدُهْنٍ كَزَيْتٍ وَإِزَالَةُ ظُفْرٍ وَشَعَرٍ وَجِمَاعٌ وَمُقَدِّمَاتُهُ كَتَقْبِيلٍ بِشَهْوَةٍ وَصَيْدُ مَأْكُولٍ بَرِّىٍّ وَحْشِىٍّ كَالنَّعَامَةِ وَالضَّبُعِ وَعَقْدُ نِكَاحٍ لَهُ أَوْ لِغَيْرِهِ كَبِنْتِهِ وَلا يَصِحُّ. وَيَحْرُمُ عَلَى الرَّجُلِ الْمُحْرِمِ سَتْرُ رَأْسِهِ بِمَا يُعَدُّ سَاتِرًا عُرْفًا كَقَلَنْسُوَةٍ وَلُبْسُ شَىْءٍ يُحِيطُ بِالْبَدَنِ بِخِيَاطَةٍ كَالسِّرْوَالِ وَيَحْرُمُ عَلَى الْمَرْأَةِ الْمُحْرِمَةِ سَتْرُ وَجْهِهَا وَقُفَّازٌ وَهُوَ شَىْءٌ يُعْمَلُ لِلْكَفِّ لِيَقِيَهَا مِنَ الْبَرْدِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(405) مَا حُكْمُ الْجِمَاعِ بَعْدَ التَّحَلُّلِ الأَوَّلِ.</p><p class=\"answer\">الْجِمَاعُ بَعْدَ التَّحَلُّلِ الأَوَّلِ لا يُفْسِدُ الْحَجَّ لَكِنَّهُ حَرَامٌ وَفِيهِ فِدْيَةٌ أَمَّا الْجِمَاعُ قَبْلَ التَّحَلُّلِ الأَوَّلِ فَهُوَ حَرَامٌ وَمُفْسِدٌ لِلْحَجِّ. وَمَنْ أَفْسَدَ حَجَّهُ بِالْجِمَاعِ يَمْضِى فِيهِ وَلا يَقْطَعُهُ ثُمَّ يَقْضِى فِى السَّنَةِ الْقَابِلَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(406) مَا هِىَ الْفِدْيَةُ فِى الطِّيبِ وَالدُّهْنِ وَلُبْسِ شَىْءٍ يُحِيطُ بِالْبَدَنِ بِخِيَاطَةٍ وَإِزَالَةِ ثَلاثِ شَعَرَاتٍ أَوْ ثَلاثَةِ أَظْفَارٍ أَوْ أَكْثَرَ وَالْجِمَاعِ بَعْدَ التَّحَلُّلِ الأَوَّلِ وَمُقَدِّمَاتِ الْجِمَاعِ كَالتَّقْبِيلِ بِشَهْوَةٍ.</p><p class=\"answer\">الْفِدْيَةُ فِى الطِّيبِ وَالدُّهْنِ وَلُبْسِ شَىْءٍ يُحِيطُ بِالْبَدَنِ بِخِيَاطَةٍ وَإِزَالَةِ ثَلاثِ شَعَرَاتٍ أَوْ ثَلاثَةِ أَظْفَارٍ أَوْ أَكْثَرَ وَمُقَدِّمَاتِ الْجِمَاعِ كَالتَّقْبِيلِ بِشَهْوَةٍ وَالْجِمَاعِ بَعْدَ التَّحَلُّلِ الأَوَّلِ أَىْ بَعْدَ فِعْلِ اثْنَيْنِ مِنْ ثَلاثَةٍ طَوَافِ الْفَرْضِ وَالْحَلْقِ أَوْ التَّقْصِيرِ وَرَمْىِ جَمْرَةِ الْعَقَبَةِ ذَبْحُ شَاةٍ أَوِ التَّصَدُّقُ بِثَلاثَةِ ءَاصُعٍ لِسِتَّةِ مَسَاكِينَ وَهِىَ اثْنَتَا عَشْرَةَ حَفْنَةً بِكَفَّىْ رَجُلٍ مُعْتَدِلٍ أَوْ صَوْمُ ثَلاثَةِ أَيَّامٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(407) تَكَلَّمْ عَنْ فَضْلِ الْعَشْرِ الأُوَلِ مِنْ ذِى الْحِجَّةِ.</p><p class=\"answer\">اعْلَمْ أَنَّ الْعَشْرَ الأُوَلَ مِنْ ذِى الْحِجَّةِ لَهَا فَضْلٌ عَظِيمٌ عِنْدَ اللَّهِ وَالْعَمَلُ الصَّالِحُ فِيهَا أَفْضَلُ وَأَحَبُّ إِلَى اللَّهِ مِنَ الْعَمَلِ فِى غَيْرِهَا فَيَنْبَغِى الإِكْثَارُ فِيهَا مِنَ الطَّاعَاتِ وَالْعِبَادَاتِ كَالصَّلاةِ وَالذِّكْرِ وَصِلَةِ الأَرْحَامِ. وَيُسْتَحَبُّ الصِّيَامُ فِى الأَيَّامِ التِّسْعِ مِنْ ذِى الْحِجَّةِ لا سِيَّمَا التَّاسِعِ مِنْهَا وَهُوَ يَوْمُ عَرَفَةَ. وَيَوْمُ عَرَفَةَ أَفْضَلُ أَيَّامِ الْعَامِ وَالدُّعَاءُ فِيهِ خَيْرُ الدُّعَاءِ وَهُوَ يَوْمٌ يَغْفِرُ اللَّهُ فِيهِ الذُّنُوبَ وَيُعْتِقُ مِنَ النَّارِ مَنْ شَاءَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(408) تَكَلَّمْ عَنْ صَلاةِ عِيدِ الأَضْحَى.</p><p class=\"answer\">صَلاةُ عِيدِ الأَضْحَى سُنَّةٌ مُؤَكَّدَةٌ وَقِيلَ فَرْضُ كِفَايَةٍ وَهِىَ رَكْعَتَانِ يُكَبِّرُ نَدْبًا فِى الأُولَى بَعْدَ دُعَاءِ الِافْتِتَاحِ وَقَبْلَ التَّعَوُّذِ سَبْعَ تَكْبِيرَاتٍ وَيُكَبِّرُ فِى الثَّانِيَةِ بَعْدَ تَكْبِيرَةِ الْقِيَامِ وَقَبْلَ قِرَاءَةِ الْفَاتِحَةِ خَمْسَ تَكْبِيرَاتٍ يَرْفَعُ يَدَيْهِ فِى جَمِيعِ التَّكْبِيرَاتِ حَذْوَ مَنْكِبَيْهِ وَيَقْرَأُ بَعْدَ الْفَاتِحَةِ فِى الرَّكْعَةِ الأُولَى سُورَةَ ق وَفِى الثَّانِيَةِ سُورَةَ الْقَمَرِ. وَوَقْتُهَا مِنْ شُرُوقِ شَمْسِ يَوْمِ الْعِيدِ إِلَى مَا قَبْلَ دُخُولِ وَقْتِ الظُّهْرِ وَيُسَنُّ تَأْخِيرُهَا عَنِ الشُّرُوقِ بِنَحْوِ ثُلُثِ سَاعَةٍ. وَيُسَنُّ أَنْ تُصَلَّى جَمَاعَةً وَأَنْ يُنَادَى لَهَا الصَّلاةُ جَامِعَة أَوِ الصَّلاةَ جَامِعَة. وَيُسْتَحَبُّ لِلْمُسْلِمِ فِى يَوْمِ الْعِيدِ أَنْ يَغْتَسِلَ وَيَتَطَيَّبَ وَأَنْ يُبَكِّرَ لِلصَّلاةِ وَأَنْ يَخْرُجَ إِلَيْهَا مَاشِيًا وَأَنْ لا يَأْكُلَ قَبْلَ الصَّلاةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(409) هَلْ يَخْطُبُ الإِمَامُ خُطْبَتَيْنِ لِصَلاةِ الْعِيدِ.</p><p class=\"answer\">تُسَنُّ خُطْبَتَانِ بَعْدَ الصَّلاةِ كَخُطْبَتَىِ الْجُمُعَةِ فِى الأَرْكَانِ وَالسُّنَنِ وَلا يُشْتَرَطُ الْقِيَامُ فِيهِمَا وَلا الْجُلُوسُ بَيْنَهُمَا بَلْ يُسْتَحَبُّ إِلَّا أَنَّهُ يَسْتَفْتِحُ الأُولَى بِتِسْعِ تَكْبِيرَاتٍ وَالثَّانِيَةَ بِسَبْعِ تَكْبِيرَاتٍ. وَيُسَنُّ أَنْ يَتَكَلَّمَ فِى الْخُطْبَةِ عَنْ أَحْكَامِ الأُضْحِيَّةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(410) مَا حُكْمُ الأُضْحِيَّةِ.</p><p class=\"answer\">الأُضْحِيَّةُ سُنَّةٌ مُؤَكَّدَةٌ وَهِىَ سُنَّةٌ عَلَى الْكِفَايَةِ إِذَا فَعَلَهَا وَاحِدٌ مِنْ أَهْلِ الْبَيْتِ كَفَى عَنِ الْجَمِيعِ وَإِنْ تَرَكُوهَا كُرِهَ لَهُمْ. وَالأُضْحِيَّةُ هِىَ مَا يُذْبَحُ مِنَ الإِبِلِ أَوِ الْبَقَرِ أَوِ الْغَنَمِ يَوْمَ عِيدِ الأَضْحَى وَأَيَّامَ التَّشْرِيقِ وَيَدْخُلُ وَقْتُهَا بَعْدَ دُخُولِ وَقْتِ صَلاةِ الْعِيدِ بِقَدْرِ رَكْعَتَيْنِ وَخُطْبَتَيْنِ وَيَخْرُجُ وَقْتُهَا بِغُرُوبِ شَمْسِ الْيَوْمِ الثَّالِثِ مِنْ أَيَّامِ التَّشْرِيقِ. وَالرَّجُلُ لَهُ أَنْ يَذْبَحَ عَنْ نَفْسِهِ وَعَنْ زَوْجَتِهِ وَأَوْلادِهِ الصِّغَارِ وَلَوْ شَاةً وَاحِدَةً وَإِذَا أَرَادَ أَنْ يَذْبَحَ عَنْ وَلَدِهِ الْبَالِغِ فَيُشْتَرَطُ أَنْ يَسْتَأْذِنَهُ وَيَذْبَحَ شَاةً أُخْرَى. وَيُجْزِئُ فِى الأُضْحِيَّةِ جَذَعٌ مِنَ الضَّأْنِ أَىِ الْغَنَمِ وَالثَّنِيَّةُ مِنَ الْمَعْزِ وَالْبَقَرِ وَالإِبِلِ. وَالْجَذَعُ مِنَ الضَّأْنِ هُوَ الَّذِى اسْتَكْمَلَ سَنَةً وَالثَّنِىُّ مِنَ الْمَعْزِ هُوَ الَّذِى اسْتَكْمَلَ سَنَتَيْنِ وَالثَّنِىُّ مِنَ الْبَقَرِ هُوَ الَّذِى اسْتَكْمَلَ سَنَتَيْنِ وَدَخَلَ فِى الثَّالِثَةِ وَالثَّنِىُّ مِنَ الإِبِلِ هُوَ الَّذِى اسْتَكْمَلَ خَمْسَ سِنِينَ. وَتُجْزِئُ الشَّاةُ عَنْ وَاحِدٍ وَالْبَقَرَةُ عَنْ سَبْعَةٍ يَشْتَرِكُونَ فِيهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(411) اذْكُرْ بَعْضَ سُنَنِ الذَّبْحِ.</p><p class=\"answer\">يُسْتَحَبُّ لِلرَّجُلِ أَنْ يَذْبَحَ بِنَفْسِهِ وَيُسْتَحَبُّ لِلْمَرْأَةِ أَنْ تُوَكِّلَ رَجُلًا يَذْبَحُ عَنْهَا. وَيُسَنُّ لِلذَّابِحِ أَنْ يَنْوِىَ أَنَّهُ يَذْبَحُ عَنْ نَفْسِهِ أَوْ عَنْ غَيْرِهِ تَقَرُّبًا إِلَى اللَّهِ وَيُسَنُّ أَنْ يَذْبَحَ الْبَقَرَ وَالْغَنَمَ مُضْجَعَةً عَلَى جَنْبِهَا الأَيْسَرِ وَأَنْ يَسْتَقْبِلَ بِهَا الْقِبْلَةَ. وَيُسْتَحَبُّ أَنْ يُسَمِّىَ اللَّهَ عِنْدَ الذَّبْحِ وَيُكَبِّرَ وَيُصَلِّىَ عَلَى النَّبِىِّ ﷺ فَيَقُولَ بِسْمِ اللَّهِ وَاللَّهُ أَكْبَر وَصَلَّى اللَّهُ عَلَى رَسُولِهِ مُحَمَّدٍ وَعَلَى ءَالِهِ وَصَحْبِهِ وَسَلَّم اللَّهُمَّ مِنْكَ وَإِلَيْكَ فَتَقَبَّلْ مِنِّى أَوْ تَقَبَّلْ مِنْ فُلانٍ صَاحِبِهَا إِنْ كَانَ يَذْبَحُ عَنْ غَيْرِهِ وَيُسْتَحَبُّ أَنْ يَحْضُرَ صَاحِبُهَا عِنْدَ الذَّبْحِ. وَيَأْكُلُ الْمُضَحِّى ثُلُثَ الأُضْحِيَّةِ وَيُهْدِى الثُّلُثَ وَيَتَصَدَّقُ بِالثُّلُثِ. وَلا يَجُوزُ بَيْعُ شَىْءٍ مِنَ الأُضْحِيَّةِ وَلا إِعْطَاءُ شَىْءٍ مِنْهَا أُجْرَةً لِلْجَزَّارِ. وَيُسْتَحَبُّ لِمَنْ أَرَادَ أَنْ يُضَحِّىَ وَدَخَلَ عَلَيْهِ الْعَشْرُ مِنْ ذِى الْحِجَّةِ أَنْ يُمْسِكَ عَنْ قَصِّ الظُّفْرِ وَإِزَالَةِ الشَّعَرِ إِلَى أَنْ يَذْبَحَ.</p></div>", "wordCount": 1173, "paraCount": 45}, {"id": "muamalat", "title": "كتاب المعاملات والنكاح", "icon": "fa-balance-scale", "desc": "أحكام البيوع والنكاح والطلاق والمعاملات", "content": "<p>كِتَابُ الْمُعَامَلاتِ وَالنِّكَاحِ</p>\n<div class=\"qa-item\"><p class=\"question\">(412) مَاذَا يَجِبُ عَلَى الْمُسْلِمِ إِذَا أَرَادَ أَنْ يَدْخُلَ فِى مُعَامَلَةٍ.</p><p class=\"answer\">يَجِبُ عَلَيْهِ أَنْ يَتَعَلَّمَ مَا أَحَلَّ اللَّهُ مِنْهَا وَمَا حَرَّمَ قَبْلَ الدُّخُولِ فِيهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(413) مَا هُوَ الْبَيْعُ الْجَائِزُ.</p><p class=\"answer\">الْبَيْعُ الْجَائِزُ هُوَ مَا كَانَ الْمَبِيعُ وَالثَّمَنُ مُبَاحَيْنِ فِى الشَّرْعِ فَلا يَجُوزُ بَيْعُ الْمُحَرَّمِ وَالنَّجِسِ أَىْ نَجِسِ الْعَيْنِ كَالدَّمِ وَلَحْمِ الْمَيْتَةِ وَسَائِرِ أَجْزَائِهَا مِنْ عَظْمٍ وَشَعَرٍ وَغَيْرِ ذَلِكَ. وَمِنْ شُرُوطِ صِحَّةِ الْبَيْعِ أَنْ يَكُونَ الْبَيْعُ غَيْرَ مُوَقَّتٍ وَأَنْ يَكُونَ غَيْرَ مُعَلَّقٍ عَلَى حُصُولِ شَىْءٍ. وَيُشْتَرَطُ فِى الْمَبِيعِ أَنْ يَكُونَ مُنْتَفَعًا بِهِ وَأَنْ يَكُونَ مَعْلُومًا وَأَنْ يَكُونَ الْبَائِعُ قَادِرًا عَلَى تَسْلِيمِهِ وَأَنْ لا يَكُونَ مَعْدُومًا كَبِنَاءٍ لَمْ يُبْنَ بَعْدُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(414) مَا حُكْمُ رَفْعِ السِّعْرِ عِنْدَ الْبَيْعِ.</p><p class=\"answer\">قَالَ رَسُولُ اللَّهِ ﷺ إِنَّمَا الْبَيْعُ عَنْ تَرَاضٍ رَوَاهُ الْبَيْهَقِىُّ فَلا يَجُوزُ تَحْرِيمُ رَفْعِ السِّعْرِ وَلا يَجُوزُ أَنْ يُقَالَ عَمَّنْ يَرْفَعُ السِّعْرَ بِلا غَشٍّ وَلا كَذِبٍ حَرَامِى أَوْ نَصَّابٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(415) مَا هِىَ الإِجَارَةُ.</p><p class=\"answer\">الإِجَارَةُ هِىَ تَمْلِيكُ مَنْفَعَةٍ مُبَاحَةٍ بِعِوَضٍ مَعَ بَقَاءِ الْعَيْنِ عَلَى وَجْهٍ خَاصٍّ. وَيُشْتَرَطُ فِى الإِجَارَةِ صِيغَةٌ كَأَنْ يَقُولَ ءَاجَرْتُكَ هَذَا الْبَيْتَ بِكَذَا لِمُدَّةِ كَذَا فَيَقُولَ الْمُسْتَأْجِرُ اسْتَأْجَرْتُ مِنْكَ هَذَا الْبَيْتَ بِتِلْكَ الأُجْرَةِ أَوْ يَقُولَ ءَاجَرْتُكَ نَفْسِىَ لِعَمَلِ كَذَا بِكَذَا فَيَقُولَ الْمُسْتَأْجِرُ اسْتَأْجَرْتُكَ بِتِلْكَ الأُجْرَةِ. وَاخْتَارَ بَعْضُ أَصْحَابِ الشَّافِعِىِّ صِحَّةَ الْمُعَاطَاةِ فِى الإِجَارَةِ أَىِ التَّعَاقُدِ بِلا لَفْظٍ مِنَ الْجَانِبَيْنِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(416) هَلْ يَجُوزُ لِلْمُسْلِمِ أَنْ يَعْمَلَ عِنْدَ كَافِرٍ.</p><p class=\"answer\">اعْلَمْ أَنَّهُ لا يَجُوزُ لِلْمُسْلِمِ أَنْ يَعْمَلَ عِنْدَ كَافِرٍ عَمَلًا فِيهِ إِذْلالٌ لِنَفْسِهِ كَأَنْ يَقُومَ بِتَنْظِيفِ وَسَخِهِ أَوْ بَيْتِ خَلائِهِ أَوْ حِذَائِهِ. أَمَّا الْعَمَلُ الْمُبَاحُ الَّذِى لَيْسَ فِيهِ إِذْلالُ نَفْسٍ فَيَجُوزُ لَهُ أَنْ يَعْمَلَهُ عِنْدَ كَافِرٍ كَأَنْ يَعْمَلَ حَارِسًا عَلَى بُسْتَانِهِ أَوْ بَيْتِهِ. وَيَجُوزُ لِلْمُسْلِمَةِ أَنْ تَعْمَلَ فِى تَنْظِيفِ أَطْفَالِ غَيْرِ الْمُسْلِمِينَ مِنَ النَّجَاسَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(417) مَا هُوَ الرَّهْنُ.</p><p class=\"answer\">الرَّهْنُ هُوَ جَعْلُ عَيْنٍ مَالِيَّةٍ كَدَارٍ وَثِيقَةً بِدَيْنٍ أَىْ مَرْبُوطَةً بِدَيْنٍ يُسْتَوْفَى مِنْهَا الدَّيْنُ عِنْدَ تَعَذُّرِ الْوَفَاءِ كَأَنْ يَقُولَ لِشَخْصٍ رَهَنْتُكَ هَذِهِ الدَّارَ بِالْمَبْلَغِ الَّذِى لَكَ عَلَىَّ فَلا يَتَصَرَّفُ بِهَا صَاحِبُهَا بِحَيْثُ تَخْرُجُ عَنْ مِلْكِهِ إِلَّا بَعْدَ أَنْ يَدْفَعَ الدَّيْنَ أَوْ يَأْذَنَ لَهُ صَاحِبُ الدَّيْنِ وَيَجُوزُ لَهُ أَنْ يَنْتَفِعَ بِهَا بِغَيْرِ الْبَيْعِ وَالْهِبَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(418) مَا هِىَ الْوَكَالَةُ.</p><p class=\"answer\">الْوَكَالَةُ هِىَ تَفْوِيضُ شَخْصٍ إِلَى غَيْرِهِ تَصَرُّفًا عَلَى وَجْهٍ خَاصٍّ لِيَفْعَلَهُ حَالَ حَيَاتِهِ. وَيُشْتَرَطُ فِى الْوَكَالَةِ أَنْ لا يَكُونَ الْمُوَكَّلُ فِيهِ مَرْهُونًا أَوْ مُغْتَصَبًا وَأَنْ يَكُونَ مَعْلُومًا وَلَوْ مِنْ بَعْضِ الْوُجُوهِ كَأَنْ يَقُولَ لَهُ وَكَّلْتُكَ بِبَيْعِ أَمْوَالِى وَلا يَصِحُّ أَنْ يَقُولَ وَكَّلْتُكَ فِى كُلِّ أُمُورِى. وَيُشْتَرَطُ لَفْظٌ يُشْعِرُ بِرِضَاهُ كَقَوْلِهِ وَكَّلْتُكَ بِكَذَا وَلا يُشْتَرَطُ أَنْ يَقُولَ لَهُ قَبِلْتُ. وَلِكُلٍّ مِنْهُمَا فَسْخُ الْوَكَالَةِ مَتَى شَاءَ وَتَنْفَسِخُ بِمَوْتِ أَحَدِهِمَا أَوْ جُنُونِهِ. وَكُلُّ مَا جَازَ لِلإِنْسَانِ التَّصَرُّفُ فِيهِ بِنَفْسِهِ جَازَ لَهُ أَنْ يُوَكِّلَ فِيهِ غَيْرَهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(419) مَا هِىَ الْعَارِيَّةُ.</p><p class=\"answer\">الْعَارِيَّةُ هِىَ إِبَاحَةُ الِانْتِفَاعِ بِشَىْءٍ مَجَّانًا مَعَ بَقَاءِ عَيْنِهِ وَتَجُوزُ الْعَارِيَّةُ مُطْلَقَةً مِنْ غَيْرِ تَقْيِيدٍ بِمُدَّةٍ كَأَعَرْتُكَ هَذَا الثَّوْبَ وَمُقَيَّدَةً بِمُدَّةٍ كَأَعَرْتُكَ هَذَا الثَّوْبَ شَهْرًا. وَيُشْتَرَطُ فِى الْمُعَارِ أَنْ يُمْكِنَ الِانْتِفَاعُ بِهِ انْتِفَاعًا مُبَاحًا مَعَ بَقَاءِ عَيْنِهِ فَلا يَصِحُّ إِعَارَةُ ءَالاتِ اللَّهْوِ الْمُحَرَّمَةِ أَوْ إِعَارَةُ مَطْعُومٍ لِلأَكْلِ أَوِ الشَّمْعَةِ لِلْوَقُودِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(420) مَا هِىَ الشَّرِكَةُ.</p><p class=\"answer\">الشَّرِكَةُ هِىَ عَقْدٌ يَتَضَمَّنُ ثُبُوتَ الْحَقِّ فِى شَىْءٍ لِاثْنَيْنِ فَأَكْثَرَ عَلَى جِهَةِ الشُّيُوعِ أَىْ مِنْ غَيْرِ تَعْيِينِ حِصَّةِ كُلٍّ مِنْهُمَا فِى هَذَا الشَّىْءِ وَيُشْتَرَطُ لَفْظٌ يُشْعِرُ بِالإِذْنِ فِى التَّصَرُّفِ لِكِلَيْهِمَا وَلا يَجُوزُ لِأَحَدِهِمَا أَنْ يَبِيعَ بِأَقَلَّ مِنْ ثَمَنِ الْمِثْلِ وَلا بِالأَجَلِ بِلا إِذْنٍ مِنْ شَرِيكِهِ. وَيُشْتَرَطُ فِى الشَّرِكَةِ أَنْ يَكُونَ الرِّبْحُ وَالْخُسْرَانُ عَلَى قَدْرِ الْمَالَيْنِ. وَلِكُلِّ وَاحِدٍ مِنَ الشَّرِيكَيْنِ فَسْخُ الشَّرِكَةِ مَتَى شَاءَ وَتَنْفَسِخُ بِمَوْتِ أَحَدِهِمَا أَوْ جُنُونِهِ. (421) مَا حُكْمُ الرِّبَا.</p></div>\n<p>يَحْرُمُ الرِّبَا فِعْلُهُ وَأَكْلُهُ وَأَخْذُهُ وَكِتَابَتُهُ وَشَهَادَتُهُ فَيَشْتَرِكُ فِى الإِثْمِ ءَاخِذُ الرِّبَا وَدَافِعُهُ وَكَاتِبُ الْعَقْدِ وَشَاهِدُهُ وَالَّذِى يَنْتَفِعُ بِالْمَالِ الَّذِى يَصِلُ إِلَيْهِ بِطَرِيقِ الرِّبَا.</p>\n<div class=\"qa-item\"><p class=\"question\">(422) مَا هُوَ رِبَا الْقَرْضِ.</p><p class=\"answer\">رِبَا الْقَرْضِ هُوَ كُلُّ قَرْضٍ شُرِطَ فِيهِ جَرُّ مَنْفَعَةٍ. وَمَا يَفْعَلُهُ بَعْضُ النَّاسِ أَنَّهُمْ يَتَّفِقُونَ عَلَى أَنْ يَدْفَعَ كُلٌّ مِنْهُمْ مَبْلَغًا فِى كُلِّ شَهْرٍ ثُمَّ يُعْطَى الْمَجْمُوعُ لِوَاحِدٍ مِنْهُمْ وَيُسَمُّونَ ذَلِكَ بِالْجَمْعِيَّةِ فَهُوَ قَرْضٌ جَرَّ مَنْفَعَةً لِأَنَّ كُلًّا مِنْهُمْ لَمْ يَدْفَعْ إِلَّا وَهُوَ يَطْمَعُ بِأَخْذِ مَالِ الْجَمِيعِ مَجْمُوعًا وَأَنْ يَصِلَهُ الدَّوْرُ. وَالْقَرْضُ هُوَ أَنْ يُدْفَعَ مَالٌ لِشَخْصٍ لِيَرُدَّ مِثْلَهُ وَالْقَرْضُ شَرَعَهُ اللَّهُ تَعَالَى لِلْمُوَاسَاةِ بَيْنَ الْعِبَادِ فَلا يَجُوزُ شَرْطُ جَرِّ مَنْفَعَةٍ فِيهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(423) مَا هُوَ رِبَا النَّسِيئَةِ.</p><p class=\"answer\">رِبَا النَّسِيئَةِ هُوَ أَنْ يُبَادِلَ نَقْدًا بِنَقْدٍ كَذَهَبٍ بِفِضَّةٍ أَوْ مَطْعُومًا بِمَطْعُومٍ كَقَمْحٍ بِشَعِيرٍ مَعَ تَأْخِيرِ الْقَبْضِ إِلَى وَقْتٍ مُعَيَّنٍ كَأَنْ يَقُولَ لَهُ بِعْتُكَ هَذَا الْقَمْحَ بِهَذَا الشَّعِيرِ عَلَى أَنْ تُسَلِّمَنِيهِ غَدًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(424) مَا هُوَ رِبَا الْيَدِ.</p><p class=\"answer\">رِبَا الْيَدِ هُوَ أَنْ يُبَادِلَ نَقْدًا بِنَقْدٍ كَذَهَبٍ بِفِضَّةٍ أَوْ مَطْعُومًا بِمَطْعُومٍ كَقَمْحٍ بِشَعِيرٍ بِغَيْرِ تَقَابُضٍ فِى مَجْلِسِ الْعَقْدِ بِأَنْ يَتَفَرَّقَ الْمُتَبَايِعَانِ مِنْ غَيْرِ أَنْ يَتَقَابَضَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(425) مَا هُوَ رِبَا الْفَضْلِ.</p><p class=\"answer\">رِبَا الْفَضْلِ هُوَ أَنْ يُبَادِلَ نَقْدًا بِنَقْدٍ مِنْ جِنْسِهِ كَذَهَبٍ بِذَهَبٍ أَوْ فِضَّةٍ بِفِضَّةٍ مَعَ اخْتِلافِ الْوَزْنِ أَو أَنْ يُبَادِلَ مَطْعُومًا بِمَطْعُومٍ مِنْ جِنْسِهِ كَشَعِيرٍ بِشَعِيرٍ مَعَ اخْتِلافِ الْكَمِّيَّةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(426) مَا حُكْمُ بَيْعِ مَا لَمْ يَقْبِضْهُ.</p><p class=\"answer\">يَحْرُمُ بَيْعُ مَا لَمْ يَقْبِضْهُ أَىْ إِذَا اشْتَرَى شَخْصٌ شَيْئًا لا يَجُوزُ لَهُ أَنْ يَبِيعَهُ قَبْلَ أَنْ يَقْبِضَهُ. وَيَحْصُلُ الْقَبْضُ فِيمَا يُنْقَلُ كَالسَّيَّارَةِ بِالنَّقْلِ إِلَى مَكَانٍ لا يَخْتَصُّ بِالْبَائِعِ وَبِالْمُنَاوَلَةِ فِيمَا يُتَنَاوَلُ بِالْيَدِ كَالثَّوْبِ وَالْكِتَابِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(427) مَا حُكْمُ بَيْعِ الدَّيْنِ بِالدَّيْنِ.</p><p class=\"answer\">يَحْرُمُ بَيْعُ الدَّيْنِ بِالدَّيْنِ كَأَنْ يَبِيعَ دَيْنًا لَهُ عَلَى زَيْدٍ لِعَمْرٍو بِثَمَنٍ مُؤَجَّلٍ كَأَنْ يَقُولَ لِعَمْرٍو بِعْتُكَ دَيْنِى الَّذِى عَلَى زَيْدٍ وَهُوَ كَذَا بِأَلْفِ دِينَارٍ إِلَى شَهْرٍ أَوْ يَبِيعَ الدَّيْنَ الَّذِى لَهُ عَلَى زَيْدٍ قَبْلَ حُلُولِهِ كَمَا يَفْعَلُ بَعْضُ النَّاسِ بِأَنْ يَكُونَ لَهُ فِى ذِمَّةِ شَخْصٍ ثَمَنُ مَبِيعٍ مُقَسَّطٌ إِلَى ءَاجَالٍ فَيَقُولُ لِشَخْصٍ لِى كَذَا وَكَذَا فِى ذِمَّةِ فُلانٍ وَأَنَا أَبِيعُكَ إِيَّاهُ بِمَبْلَغِ كَذَا فَعَنْ عَبْدِ اللَّهِ بنِ عُمَرَ رَضِىَ اللَّهُ عَنْهُمَا أَنَّ النَّبِىَّ ﷺ نَهَى عَنْ بَيْعِ الْكَالِئِ بِالْكَالِئِ أَىْ بَيْعِ الدَّيْنِ بِالدَّيْنِ رَوَاهُ الْحَاكِمُ وَالْبَيْهَقِىُّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(428) مَا حُكْمُ بَيْعِ الْفُضُولِىِّ.</p><p class=\"answer\">يَحْرُمُ بَيْعُ الْفُضُولِىِّ أَىْ أَنْ يَبِيعَ الشَّخْصُ مَا لَيْسَ مِلْكًا لَهُ وَلا لَهُ عَلَيْهِ وِلايَةٌ بِطَرِيقٍ مِنَ الطُّرُقِ الشَّرْعِيَّةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(429) مَا حُكْمُ بَيْعِ مَا لا مَنْفَعَةَ فِيهِ.</p><p class=\"answer\">يَحْرُمُ بَيْعُ مَا لا مَنْفَعَةَ فِيهِ حِسًّا كَالْخُبْزِ الْمُحْتَرِقِ أَوْ شَرْعًا كَالصُّوَرِ الْمُجَسَّمَةِ لِإِنْسَانٍ أَوْ بَهِيمَةٍ كَلُعَبِ الأَطْفَالِ وَأَجَازَ الْمَالِكِيَّةُ شِرَاءَ اللُّعَبِ لِلْبَنَاتِ الصِّغَارِ إِذَا كَانَتِ اللُّعْبَةُ بِهَيْئَةِ بِنْتٍ صَغِيرَةٍ وَيَجُوزُ عِنْدَهُمْ بَيْعُ صُورَةِ الْحَيَوَانِ الْكَامِلَةِ إِذَا كَانَتْ حَلْوَى تُقْصَدُ لِلأَكْلِ وَلَوْ كَانَتْ مُجَسَّمَةً.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(430) مَا حُكْمُ بَيْعِ مَا لا قُدْرَةَ عَلَى تَسْلِيمِهِ.</p><p class=\"answer\">يَحْرُمُ بَيْعُ مَا لا قُدْرَةَ عَلَى تَسْلِيمِهِ كَبَعِيرٍ شَارِدٍ أَوْ بَيْتٍ مَغْصُوبٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(431) مَا حُكْمُ بَيْعِ مَا لا يَدْخُلُ تَحْتَ الْمِلْكِ.</p><p class=\"answer\">يَحْرُمُ بَيْعُ مَا لَيْسَ مَمْلُوكًا كَالإِنْسَانِ الْحُرِّ وَالأَرْضِ الْمَوَاتِ وَتُمْلَكُ بِالإِحْيَاءِ أَىْ بِتَهْيِأَتِهَا لِلانْتِفَاعِ بِهَا إِمَّا بِزِرَاعَتِهَا أَوْ بِالسَّكَنِ فِيهَا وَنَحْوِ ذَلِكَ لِقَوْلِهِ ﷺ مَنْ أَحْيَا أَرْضًا مَيِّتَةً فَهِىَ لَهُ رَوَاهُ التِّرْمِذِىُّ وَحَسَّنَهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(432) مَا حُكْمُ بَيْعِ الْمَجْهُولِ.</p><p class=\"answer\">يَحْرُمُ بَيْعُ الْمَجْهُولِ وَلا يَصِحُّ كَأَنْ يَقُولَ بِعْتُكَ أَحَدَ هَذَيْنِ الثَّوْبَيْنِ بِكَذَا مِنْ غَيْرِ تَعْيِينٍ فَيَأْخُذَ أَحَدَهُمَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(433) مَا حُكْمُ بَيْعِ الْمُسْكِرِ وَالنَّجِسِ.</p><p class=\"answer\">يَحْرُمُ بَيْعُ الْمُسْكِرِ كَالْخَمْرِ وَالنَّجِسِ كَالدَّمِ وَالْمُتَنَجِّسِ الَّذِى لا يُمْكِنُ تَطْهِيرُهُ كَالزَّيْتِ الْمُتَنَجِّسِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(434) مَا حُكْمُ بَيْعِ ءَالاتِ اللَّهْوِ الْمُحَرَّمَةِ.</p><p class=\"answer\">يَحْرُمُ بَيْعُ ءَالاتِ اللَّهْوِ الْمُحَرَّمَةِ كالْمِزْمَارِ وَالْكُوبَةِ أَىِ الطَّبْلِ الضَّيِّقِ الْوَسَطِ الَّتِى يُقَالُ لَهَا بِالْعَامِيَّةِ الدِّرْبَكَّة.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(435) مَا حُكْمُ بَيْعِ الْحَلالِ الطَّاهِرِ لِمَنْ تَعْلَمُ أَنَّهُ يُرِيدُ أَنْ يَعْصِىَ بِهِ.</p><p class=\"answer\">يَحْرُمُ بَيْعُ الْحَلالِ الطَّاهِرِ لِمَنْ تَعْلَمُ أَنَّهُ يُرِيدُ أَنْ يَعْصِىَ بِهِ كَبَيْعِ الْعِنَبِ لِمَنْ تَعْلَمُ أَنَّهُ يُرِيدُ أَنْ يَعْتَصِرَهُ خَمْرًا وَالسِّلاحِ لِمَنْ تَعْلَمُ أَنَّهُ يُرِيدُ أَنْ يَقْتُلَ بِهِ نَفْسَهُ أَوْ يَعْتَدِىَ بِهِ عَلَى النَّاسِ لِأَنَّ فِيهِ إِعَانَةً عَلَى الْمَعْصِيَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(436) مَا حُكْمُ بَيْعِ الْمَعِيبِ بِلا إِظْهَارٍ لِعَيْبِهِ.</p><p class=\"answer\">يَحْرُمُ بَيْعُ الْمَعِيبِ بِلا إِظْهَارٍ لِعَيْبِهِ أَىْ مَعَ تَرْكِ بَيَانِ عَيْبِهِ لِحَدِيثِ مُسْلِمٍ مَنْ غَشَّنَا فَلَيْسَ مِنَّا، أَىْ لَيْسَ عَلَى طَرِيقَتِنَا الْكَامِلَةِ وَلَيْسَ الْمُرَادُ نَفْىَ صِفَةِ الإِسْلامِ عَنْهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(437) مَا حُكْمُ تَفْتِيرِ رَغْبَةِ الْمُشْتَرِى أَوِ الْبَائِعِ قَبْلَ إِجْرَاءِ الْعَقْدِ.</p><p class=\"answer\">يَحْرُمُ تَفْتِيرُ رَغْبَةِ الْمُشْتَرِى أَوِ الْبَائِعِ قَبْلَ إِجْرَاءِ الْعَقْدِ وَبَعْدَ اسْتِقْرَارِ الثَّمَنِ بِأَنْ يَكُونَ كُلٌّ مِنَ الْبَائِعِ وَالْمُشْتَرِى قَدْ صَرَّحَا بِالرِّضَا بِالثَّمَنِ كَأَنْ يَقُولَ لِلْمُشْتَرِى أَنَا أَبِيعُكَ مِثْلَهُ بِثَمَنٍ أَقَلَّ أَوْ يَقُولَ لِلْبَائِعِ لا تَبِعْهُ لِفُلانٍ أَنَا أَشْتَرِيهِ مِنْكَ بِأَكْثَرَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(438) مَا حُكْمُ تَفْتِيرِ رَغْبَةِ الْمُشْتَرِى أَوِ الْبَائِعِ بَعْدَ الْعَقْدِ فِى مُدَّةِ الْخِيَارِ.</p><p class=\"answer\">يَحْرُمُ تَفْتِيرُ رَغْبَةِ الْمُشْتَرِى أَوِ الْبَائِعِ بَعْدَ حُصُولِ الْعَقْدِ بِإِيجَابٍ وَقَبُولٍ مِنَ الْمُتَبَايِعَيْنِ فِى مُدَّةِ الْخِيَارِ أَىْ خِيَارِ الْمَجْلِسِ لِأَنَّ الْمُتَبَايِعَيْنِ لَهُمَا الْخِيَارُ فِى فَسْخِ الْعَقْدِ مَا دَامَا فِى الْمَجْلِسِ. وَيُوجَدُ خِيَارٌ يُسَمَّى خِيَارَ الشَّرْطِ وَهُوَ أَنْ يَشْرِطَ الْبَائِعُ أَوِ الْمُشْتَرِى أَنْ يَكُونَ لَهُ الْخِيَارُ لِيَوْمٍ أَوْ يَوْمَيْنِ أَوْ ثَلاثَةٍ فِى فَسْخِ الْعَقْدِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(439) مَا حُكْمُ احْتِكَارِ الطَّعَامِ.</p><p class=\"answer\">يَحْرُمُ احْتِكَارُ الطَّعَامِ بِأَنْ يَشْتَرِىَ الطَّعَامَ أَىِ الْقُوتَ وَهُوَ مَا يَعِيشُ بِهِ الْبَدَنُ كَالْحِنْطَةِ وَالشَّعِيرِ وَالْفُولِ وَالْحِمَّصِ وَقْتَ الْغَلاءِ وَالْحَاجَةِ إِلَيْهِ لِيَحْبِسَهُ عِنْدَهُ وَيَبِيعَهُ بِأَغْلَى عِنْدَ اشْتِدَادِ حَاجَةِ النَّاسِ إِلَيْهِ. أَمَّا إِذَا اشْتَرَاهُ وَقْتَ الرُّخْصِ فَحَبَسَهُ لِيَبِيعَهُ بِأَغْلَى فَلَيْسَ حَرَامًا لِأَنَّ النَّاسَ لا يَنْضَرُّونَ بِذَلِكَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(440) مَا حُكْمُ الْبَيْعِ بِالْمَزَادِ.</p><p class=\"answer\">الْبَيْعُ بِالْمَزَادِ جَائِزٌ أَمَّا أَنْ يَتَّفِقَ الْبَائِعُ مَعَ شَخْصٍ أَنْ يَزِيدَ فِى السِّعْرِ لِيَغُرَّ النَّاسَ فَيَزِيدُوا هُمْ فِى السِّعْرِ فَهُوَ حَرَامٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(441) مَا حُكْمُ الْغَشِّ.</p><p class=\"answer\">يَحْرُمُ الْغَشُّ فِى الْوَزْنِ وَالذَّرْعِ وَالْكَيْلِ وَالْعَدِّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(442) مَا هِىَ الصِّيغَةُ الَّتِى تُقَالُ إِذَا أَرَادَ الشَّخْصُ إِرْسَالَ مَالٍ مِنْ بَلَدٍ إِلَى بَلَدٍ.</p><p class=\"answer\">إِذَا أَرَادَ الشَّخْصُ إِرْسَالَ مَالٍ مِنْ بَلَدٍ إِلَى بَلَدٍ يَقُولُ لِصَاحِبِ الْبَنْكِ أَوْ لِصَاحِبِ شَرِكَةِ تَحْوِيلِ الأَمْوَالِ ادْفَعْ عَنِّى لِفُلانٍ فِى مَكَانِ كَذَا مَبْلَغَ كَذَا ثُمَّ هُوَ يُعْطِيهِ مِنْ مَالِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(443) مَا هِىَ شُرُوطُ صِحَّةِ النِّكَاحِ.</p><p class=\"answer\">يُشْتَرَطُ لِصِحَّةِ النِّكَاحِ وَلِىٌّ وَشَاهِدَانِ وَزَوْجَانِ وَصِيغَةٌ كَأَنْ يَقُولَ الْوَلِىُّ زَوَّجْتُكَ فُلانَةَ فَيَقُولَ الزَّوْجُ قَبِلْتُ زِوَاجَهَا. وَيُشْتَرَطُ فِى الشَّاهِدَيْنِ أَنْ يَكُونَا مُسْلِمَيْنِ ذَكَرَيْنِ عَدْلَيْنِ وَالْعَدْلُ هُوَ الْمُسْلِمُ الْمُجْتَنِبُ لِكَبَائِرِ الذُّنُوبِ وَلا يُكْثِرُ مِنَ الذُّنُوبِ الصَّغِيرَةِ بِحَيْثُ تَزِيدُ عَلَى طَاعَاتِهِ الْمُحَافِظُ عَلَى أَخْلاقِ أَهْلِ الْفَضْلِ مِنْ أَمْثَالِهِ فَلا يَشْتَغِلُ بِنَحْوِ تَطْيِيرِ الْحَمَامِ وَلا يُكْثِرُ مِنَ الرِّوَايَاتِ الْمُضْحِكَةِ الَّتِى لا ثَمَرَةَ مِنْهَا وَنَحْوِ ذَلِكَ</p></div>\n<div class=\"qa-item\"><p class=\"question\">(444) رَجُلٌ خَطَبَ امْرَأَةً وَلَمْ يَعْقِدْ عَلَيْهَا أَوْ عَقَدَ عَلَيْهَا وَقَدَّمَ لَهَا هَدَايَا كَذَهَبٍ وَثِيَابٍ هَلْ يَجِبُ عَلَيْهَا أَنْ تَرُدَّ لَهُ مَا قَدَّمَهُ لَهَا مِنَ الْهَدَايَا فِى حَالِ فَسْخِ الْخِطْبَةِ.</p><p class=\"answer\">إِنْ أَعْرَضَ الرَّجُلُ عَنْهَا يَتْرُكُ لَهَا مَا قَدَّمَهُ لَهَا مِنَ الْهَدَايَا أَمَّا إِذَا أَعْرَضَتِ الْمَرْأَةُ عَنْهُ فَتَرُدُّ لَهُ كُلَّ مَا قَدَّمَهُ لَهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(445) إِذَا تَزَوَّجَ الرَّجُلُ امْرَأَةً فَهَلْ يَجُوزُ لَهُ أَنْ يُجَامِعَهَا قَبْلَ الْعُرْسِ بِغَيْرِ إِذْنِ أَبِيهَا.</p><p class=\"answer\">لا يَجُوزُ لَهُ أَنْ يُجَامِعَهَا قَبْلَ الْعُرْسِ إِذَا كَانَ أَبُوهَا لا يَرْضَى بَلْ يَغْتَمُّ قَلْبُهُ إِنْ بَلَغَهُ ذَلِكَ. وَإِذَا تَزَوَّجَ الرَّجُلُ امْرَأَةً وَأَرَادَ أَنْ يَسْتَلِمَهَا مِنْ أَهْلِهَا فَيَجُوزُ لِأَبِيهَا أَنْ يُمْسِكَهَا ثَلاثَةَ أَيَّامٍ أَمَّا بَعْدَ ثَلاثَةِ أَيَّامٍ فَيَجُوزُ لِلزَّوْجِ أَنْ يَأْخُذَهَا وَلَوْ بِغَيْرِ رِضَى أَبِيهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(446) هَلْ يَجُوزُ لِلْمُسْلِمَةِ أَنْ تَتَزَوَّجَ بِغَيْرِ الْمُسْلِمِ.</p><p class=\"answer\">لا يَجُوزُ لِلْمُسْلِمَةِ أَنْ تَتَزَوَّجَ بِغَيْرِ الْمُسْلِمِ وَمَنْ قَالَ بِخِلافِ ذَلِكَ فَهُوَ كَافِرٌ لِتَكْذِيبِهِ الْقُرْءَانَ قَالَ اللَّهُ تَعَالَى ﴿فَإِنْ عَلِمْتُمُوهُنَّ مُؤْمِنَاتٍ فَلا تَرْجِعُوهُنَّ إِلَى الْكُفَّارِ لا هُنَّ حِلٌّ لَّهُمْ وَلا هُمْ يَحِلُّونَ لَهُنَّ﴾. أَمَّا الْمُسْلِمُ فَيَجُوزُ لَهُ أَنْ يَتَزَوَّجَ مِنَ الْمُسْلِمَةِ أَوِ الْيَهُودِيَّةِ أَوِ النَّصْرَانِيَّةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(447) مَا حُكْمُ نِكَاحِ الزَّوْجَيْنِ مِنْ أَهْلِ الْكِتَابِ إِذَا أَسْلَمَا.</p><p class=\"answer\">أَهْلُ الْكِتَابِ هُمُ الْيَهُودُ وَالنَّصَارَى فَإِذَا أَسْلَمَ الزَّوْجَانِ مِنْ أَهْلِ الْكِتَابِ فِى وَقْتٍ وَاحِدٍ لا يُطَالَبَانِ بِتَجْدِيدِ الْعَقْدِ وَكَذَلِكَ الرَّجُلُ إِذَا أَسْلَمَ لِأَنَّ الرَّجُلَ الْمُسْلِمَ يَجُوزُ لَهُ أَنْ يَتَزَوَّجَ مِنَ الْكِتَابِيَّةِ الْيَهُودِيَّةِ أَوِ النَّصْرَانِيَّةِ. أَمَّا إِذَا أَسْلَمَتِ الْمَرْأَةُ وَلَمْ يُسْلِمِ الرَّجُلُ فَتَنْتَظِرُ الْمَرْأَةُ مُدَّةَ الْعِدَّةِ فَإِذَا أَسْلَمَ الرَّجُلُ أَثْنَاءَ الْعِدَّةِ فَلا يُحْتَاجُ إِلَى تَجْدِيدِ الْعَقْدِ أَمَّا إِنْ لَمْ يُسْلِمْ أَثْنَاءَ الْعِدَّةِ فَلَهَا أَنْ تَتَزَوَّجَ بِأَىِّ مُسْلِمٍ بَعْدَ انْتِهَاءِ عِدَّتِهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(448) هَلْ يَجِبُ عَلَى الزَّوْجِ أَنْ يُنْفِقَ عَلَى زَوْجَتِهِ قَبْلَ أَنْ يَسْتَلِمَهَا.</p><p class=\"answer\">مَنْ عَقَدَ عَلَى امْرَأَةٍ وَلَمْ يَسْتَلِمْهَا مِنْ أَهْلِهَا لا يَجِبُ عَلَيْهِ أَنْ يُنْفِقَ عَلَيْهَا وَلا يَجِبُ عَلَيْهِ أَنْ يَدْفَعَ عَنْهَا زَكَاةَ الْفِطْرِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(449) مَا حُكْمُ مَنْ قَالَ لِزَوْجَتِهِ بِلَفْظٍ وَاحِدٍ أَنْتِ طَالِقٌ ثَلاثًا.</p><p class=\"answer\">مَنْ قَالَ لِزَوْجَتِهِ بِلَفْظٍ وَاحِدٍ أَنْتِ طَالِقٌ ثَلاثًا طَلَقَتْ ثَلاثًا وَكَذَلِكَ إِنْ قَالَ لَهَا أَنْتِ طَالِقٌ أَنْتِ طَالِقٌ أَنْتِ طَالِقٌ وَلَمْ يَنْوِ بِهِ تَأْكِيدَ الطَّلْقَةِ الأُولَى، أَمَّا إِنْ نَوَى بِهِ تَأْكِيدَ الطَّلْقَةِ الأُولَى فَيُعَدُّ طَلاقًا وَاحِدًا. وَهَذِهِ الْمَسْأَلَةُ مُجْمَعٌ عَلَيْهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(450) مَا حُكْمُ مَنْ طَلَّقَ زَوْجَتَهُ طَلْقَةً وَاحِدَةً أَوِ اثْنَتَيْنِ.</p><p class=\"answer\">مَنْ طَلَّقَ زَوْجَتَهُ طَلْقَةً وَاحِدَةً أَوِ اثْنَتَيْنِ يَجُوزُ لَهُ أَنْ يُرْجِعَهَا قَبْلَ انْتِهَاءِ عِدَّتِهَا كَأَنْ يَقُولَ أَرْجَعْتُ زَوْجَتِى إِلَى نِكَاحِى أَمَّا إِذَا انْتَهَتِ الْعِدَّةُ فَلا تَحِلُّ لَهُ إِلَّا بِعَقْدٍ جَدِيدٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(451) مَا حُكْمُ مَنْ طَلَّقَ زَوْجَتَهُ فِى حَالِ الْمَزْحِ أَوِ الْغَضَبِ.</p><p class=\"answer\">مَنْ طَلَّقَ زَوْجَتَهُ وَكَانَ مَازِحًا أَوْ غَضْبَانًا وَقَعَ طَلاقُهُ لِقَوْلِهِ ﷺ ثَلاثٌ جِدُّهُنَّ جِدٌّ وَهَزْلُهُنَّ جِدٌّ النِّكَاحُ وَالطَّلاقُ وَالرَّجْعَةُ رَوَاهُ أَبُو دَاوُدَ فِى السُّنَنِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(452) مَا حُكْمُ مَنْ قَالَ لِامْرَأَتِهِ عَلَىَّ الطَّلاقُ إِنْ فَعَلْتِ كَذَا.</p><p class=\"answer\">هَذِهِ الْكَلِمَةُ بِالأَصْلِ لَيْسَتْ إِيقَاعًا لِلطَّلاقِ إِنَّمَا وَعْدٌ بِالطَّلاقِ وَقَدْ يُغَيِّرُ الشَّخْصُ رَأْيَهُ وَلا يُطَلِّقُ لَكِنْ عِنْدَ الْعَامِىِّ مَعْنَاهَا إِنْ فَعَلْتِ كَذَا فَأَنْتِ طَالِقٌ فَإِنْ فَعَلَتْ وَقَعَ الطَّلاقُ لِأَنَّهُ يَفْهَمُ مِنْ كَلِمَةِ عَلَىَّ الطَّلاقُ إِيقَاعَ الطَّلاقِ إِنْ حَصَلَ مَا عَلَّقَ عَلَيْهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(453) مَا حُكْمُ طَلاقِ الْحَامِلِ.</p><p class=\"answer\">يَقَعُ الطَّلاقُ وَلا مَعْصِيَةَ فِيهِ لَكِنَّهُ غَيْرُ مُسْتَحَبٍّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(454) مَاذَا يَجِبُ لِلْمُطَلَّقَةِ طَلْقَةً أَوِ اثْنَتَيْنِ أَوْ ثَلاثًا أَثْنَاءَ الْعِدَّةِ.</p><p class=\"answer\">يَجِبُ لِلْمُطَلَّقَةِ طَلْقَةً أَوِ اثْنَتَيْنِ السُّكْنَى وَالنَّفَقَةُ أَثْنَاءَ الْعِدَّةِ وَيَجِبُ لِلْمُطَلَّقَةِ بِالثَّلاثِ السُّكْنَى دُونَ النَّفَقَةِ إِلَّا أَنْ تَكُونَ حَامِلًا. وَيَجِبُ لِلْمُطَلَّقَةِ مُتْعَةٌ والْمُتْعَةُ مِقْدَارٌ مِنَ الْمَالِ يُدْفَعُ لَهَا إِنْ وَقَعَ الْفِرَاقُ بَيْنَهَا وَبَيْنَ زَوْجِهَا بِغَيْرِ سَبَبٍ مِنْهَا أَمَّا إِذَا انْفَسَخَ الْعَقْدُ بِسَبَبٍ مِنْهَا كَأَنِ ارْتَدَّتْ بَعْدَ دُخُولِ الزَّوْجِ بِهَا وَبَقِيَتْ عَلَى الرِّدَّةِ إِلَى انْقِضَاءِ الْعِدَّةِ فَلا مُتْعَةَ لَهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(455) مَا هِىَ الْحَضَانَةُ وَمَنْ لَهُ حَقُّ الْحَضَانَةِ.</p><p class=\"answer\">الْحَضَانَةُ هِىَ كَفَالَةُ الطِّفْلِ وَتَرْبِيَتُهُ فَإِذَا فَارَقَ الرَّجُلُ زَوْجَتَهُ وَلَهُ مِنْهَا وَلَدٌ غَيْرُ مُمَيِّزٍ ذَكَرٌ أَوْ أُنْثَى فَهِىَ أَحَقُّ بِحَضَانَتِهِ وَتَسْتَمِرُّ حَضَانَتُهَا لِلطِّفْلِ إِلَى أَنْ يُمَيِّزَ فَإِذَا مَيَّزَ يُخَيَّرُ بَيْنَ أَبَوَيْهِ فَإِذَا اخْتَارَ أَبَاهُ فَالأُمُّ لَهَا أَنْ تَزُورَهُ وَلا يَجُوزُ لِلأَبِ أَنْ يَمْنَعَهَا إِلَّا إِذَا كَانَتْ فَاسِقَةً يُخْشَى أَنْ تُعَلِّمَ الطِّفْلَ الْفَسَادَ. وَمُؤْنَةُ الْحَضَانَةِ عَلَى مَنْ عَلَيْهِ نَفَقَةُ الطَّفْلِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(456) مَا هُوَ الْخُلْعُ.</p><p class=\"answer\">الْخُلْعُ هُوَ أَنْ تَقُولَ الزَّوْجَةُ لِزَوْجِهَا خَالِعْنِى عَلَى مِائَةِ دِرْهَمٍ مَث
