<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مقصد الراغبين - تطبيق القراءة الإسلامية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #0d7377;
      --primary-dark: #095456;
      --gold: #c9a227;
      --gold-light: #e8d48b;
      --bg: #f8f5f0;
      --bg-card: #ffffff;
      --text: #2c3e50;
      --text-muted: #6b7280;
      --border: #e5e0d8;
      --shadow: 0 4px 20px rgba(13, 115, 119, 0.08);
      --radius: 16px;
      --font: 'Cairo', sans-serif;
      --font-size: 18px;
      --header-h: 64px;
    }
    [data-theme="dark"] {
      --primary: #14b8a6;
      --primary-dark: #0d9488;
      --gold: #f0c14b;
      --gold-light: #f5d76e;
      --bg: #0f172a;
      --bg-card: #1e293b;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #334155;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      font-size: var(--font-size);
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }
    /* Header */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      height: var(--header-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.25rem;
      box-shadow: var(--shadow);
    }
    .header-title {
      font-size: 1.15rem; font-weight: 700;
      color: var(--primary);
      display: flex; align-items: center; gap: 0.5rem;
    }
    .header-title i { color: var(--gold); }
    .nav-btns { display: flex; gap: 0.5rem; }
    .nav-btn {
      background: none; border: none; color: var(--text-muted);
      font-size: 1.2rem; cursor: pointer; padding: 0.5rem;
      border-radius: 10px; transition: all 0.2s;
    }
    .nav-btn:hover, .nav-btn.active { background: var(--primary); color: #fff; }
    /* Search */
    .search-bar {
      position: relative; max-width: 600px; margin: 1.5rem auto 0;
      padding: 0 1.25rem;
    }
    .search-bar input {
      width: 100%; padding: 0.9rem 1.2rem 0.9rem 3rem;
      border: 2px solid var(--border); border-radius: 50px;
      background: var(--bg-card); color: var(--text);
      font-family: var(--font); font-size: 1rem;
      outline: none; transition: border 0.2s;
    }
    .search-bar input:focus { border-color: var(--primary); }
    .search-bar i {
      position: absolute; right: 2.2rem; top: 50%;
      transform: translateY(-50%); color: var(--text-muted);
    }
    .search-results {
      position: absolute; top: 100%; right: 1.25rem; left: 1.25rem;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 12px; max-height: 320px; overflow-y: auto;
      box-shadow: var(--shadow); z-index: 50; display: none;
    }
    .search-results.show { display: block; }
    .search-item {
      padding: 0.85rem 1.2rem; cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .search-item:hover { background: rgba(13,115,119,0.08); }
    .search-item .s-title { font-weight: 600; color: var(--primary); }
    .search-item .s-snip { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem; }
    /* Pages */
    .page { display: none; animation: fadeIn 0.3s ease; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    /* Home */
    .hero {
      text-align: center; padding: 2rem 1.25rem 1rem;
    }
    .hero h1 { font-size: 1.6rem; color: var(--primary); margin-bottom: 0.4rem; }
    .hero p { color: var(--text-muted); font-size: 0.95rem; }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem; padding: 1.5rem 1.25rem 3rem;
      max-width: 1200px; margin: 0 auto;
    }
    .card {
      background: var(--bg-card); border-radius: var(--radius);
      padding: 1.5rem; cursor: pointer;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transition: transform 0.25s, box-shadow 0.25s;
      position: relative; overflow: hidden;
    }
    .card:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 12px 30px rgba(13,115,119,0.15); }
    .card:active { transform: scale(0.98); }
    .card-icon {
      width: 52px; height: 52px; border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; margin-bottom: 1rem;
    }
    .card h3 { font-size: 1.1rem; margin-bottom: 0.4rem; color: var(--text); }
    .card .desc { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 0.8rem; line-height: 1.6; }
    .card .meta { font-size: 0.8rem; color: var(--gold); font-weight: 600; }
    .card .fav-badge {
      position: absolute; top: 1rem; left: 1rem;
      color: var(--gold); font-size: 1rem;
    }
    /* Section page */
    .section-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff; padding: 2rem 1.25rem 1.5rem;
      text-align: center;
    }
    .section-header h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .section-stats {
      display: flex; justify-content: center; gap: 1.5rem;
      font-size: 0.9rem; opacity: 0.9;
    }
    .tools-bar {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
      justify-content: center; padding: 1rem;
      background: var(--bg-card); border-bottom: 1px solid var(--border);
      position: sticky; top: var(--header-h); z-index: 40;
    }
    .tool-btn {
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); padding: 0.5rem 0.9rem;
      border-radius: 10px; cursor: pointer; font-family: var(--font);
      font-size: 0.85rem; display: flex; align-items: center; gap: 0.4rem;
      transition: all 0.2s;
    }
    .tool-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
    .tool-btn.active { background: var(--gold); color: #1a1a1a; border-color: var(--gold); }
    .content-area {
      max-width: 800px; margin: 0 auto; padding: 1.5rem 1.25rem 5rem;
    }
    .content-area p { margin-bottom: 1rem; }
    .qa-item {
      background: var(--bg-card); border-radius: 12px;
      padding: 1.2rem 1.3rem; margin-bottom: 1rem;
      border: 1px solid var(--border);
      border-right: 4px solid var(--primary);
    }
    .qa-item .question {
      font-weight: 700; color: var(--primary);
      margin-bottom: 0.6rem; font-size: 1.05em;
    }
    .qa-item .answer { color: var(--text); margin: 0; }
    /* Progress */
    .read-progress {
      position: fixed; top: 0; right: 0; height: 3px;
      background: var(--gold); width: 0%; z-index: 200;
      transition: width 0.1s;
    }
    .back-top {
      position: fixed; bottom: 1.5rem; left: 1.5rem;
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--primary); color: #fff; border: none;
      font-size: 1.2rem; cursor: pointer; box-shadow: var(--shadow);
      opacity: 0; pointer-events: none; transition: all 0.3s;
      z-index: 50;
    }
    .back-top.show { opacity: 1; pointer-events: auto; }
    /* Favorites & Settings */
    .page-inner { max-width: 900px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
    .page-inner h2 {
      font-size: 1.4rem; color: var(--primary); margin-bottom: 1.25rem;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .empty-state {
      text-align: center; padding: 3rem 1rem; color: var(--text-muted);
    }
    .empty-state i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.4; }
    /* Settings */
    .setting-item {
      background: var(--bg-card); border-radius: 12px;
      padding: 1.2rem 1.4rem; margin-bottom: 1rem;
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 0.8rem;
    }
    .setting-item label { font-weight: 600; }
    .setting-item select, .setting-item input[type="range"] {
      font-family: var(--font); padding: 0.4rem 0.8rem;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text);
    }
    .toggle-switch {
      width: 52px; height: 28px; background: var(--border);
      border-radius: 14px; position: relative; cursor: pointer;
      transition: background 0.3s;
    }
    .toggle-switch.on { background: var(--primary); }
    .toggle-switch::after {
      content: ''; position: absolute; top: 3px; right: 3px;
      width: 22px; height: 22px; background: #fff;
      border-radius: 50%; transition: transform 0.3s;
    }
    .toggle-switch.on::after { transform: translateX(-24px); }
    .reset-btn {
      background: #ef4444; color: #fff; border: none;
      padding: 0.7rem 1.5rem; border-radius: 10px;
      font-family: var(--font); font-size: 0.95rem;
      cursor: pointer; margin-top: 1rem;
    }
    .reset-btn:hover { background: #dc2626; }
    /* Toast */
    .toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--primary); color: #fff; padding: 0.8rem 1.5rem;
      border-radius: 50px; font-size: 0.9rem; z-index: 300;
      opacity: 0; transition: all 0.3s; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    /* Responsive */
    @media (max-width: 600px) {
      .hero h1 { font-size: 1.3rem; }
      .cards-grid { grid-template-columns: 1fr; }
      .section-header h1 { font-size: 1.25rem; }
      .tools-bar { gap: 0.35rem; }
      .tool-btn { padding: 0.4rem 0.65rem; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="read-progress" id="progressBar"></div>
  <header class="header">
    <div class="header-title"><i class="fas fa-moon"></i> مقصد الراغبين</div>
    <div class="nav-btns">
      <button class="nav-btn active" data-page="home" title="الرئيسية"><i class="fas fa-home"></i></button>
      <button class="nav-btn" data-page="favorites" title="المفضلة"><i class="fas fa-star"></i></button>
      <button class="nav-btn" data-page="settings" title="الإعدادات"><i class="fas fa-cog"></i></button>
    </div>
  </header>

  <!-- HOME -->
  <div class="page active" id="page-home">
    <div class="hero">
      <h1>مقصد الراغبين في تعلم العقيدة وأحكام الدين</h1>
      <p>لفضيلة الشيخ نبيل الشريف — كتاب جامع لأهم الضروريات</p>
    </div>
    <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="ابحث في الأقسام والمحتوى..." autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
    <div class="cards-grid" id="cardsGrid"></div>
  </div>

  <!-- SECTION -->
  <div class="page" id="page-section">
    <div class="section-header">
      <h1 id="secTitle"></h1>
      <div class="section-stats">
        <span><i class="fas fa-font"></i> <span id="secWords"></span> كلمة</span>
        <span><i class="fas fa-clock"></i> <span id="secTime"></span> دقيقة قراءة</span>
      </div>
    </div>
    <div class="tools-bar">
      <button class="tool-btn" id="btnCopy"><i class="fas fa-copy"></i> نسخ</button>
      <button class="tool-btn" id="btnShare"><i class="fas fa-share-alt"></i> مشاركة</button>
      <button class="tool-btn" id="btnFav"><i class="far fa-star"></i> مفضلة</button>
      <button class="tool-btn" id="btnFontUp"><i class="fas fa-plus"></i> تكبير</button>
      <button class="tool-btn" id="btnFontDown"><i class="fas fa-minus"></i> تصغير</button>
      <button class="tool-btn" id="btnBackHome"><i class="fas fa-arrow-right"></i> رجوع</button>
    </div>
    <div class="content-area" id="secContent"></div>
  </div>

  <!-- FAVORITES -->
  <div class="page" id="page-favorites">
    <div class="page-inner">
      <h2><i class="fas fa-star" style="color:var(--gold)"></i> المفضلة</h2>
      <div id="favList"></div>
    </div>
  </div>

  <!-- SETTINGS -->
  <div class="page" id="page-settings">
    <div class="page-inner">
      <h2><i class="fas fa-cog"></i> الإعدادات</h2>
      <div class="setting-item">
        <label>الوضع الليلي</label>
        <div class="toggle-switch" id="themeToggle"></div>
      </div>
      <div class="setting-item">
        <label>نوع الخط</label>
        <select id="fontSelect">
          <option value="Cairo">Cairo</option>
          <option value="Tajawal">Tajawal</option>
          <option value="'Noto Kufi Arabic'">Noto Kufi Arabic</option>
          <option value="Amiri">Amiri</option>
        </select>
      </div>
      <div class="setting-item">
        <label>حجم الخط: <span id="fontSizeLabel">18</span>px</label>
        <input type="range" id="fontSizeRange" min="14" max="28" value="18" step="1">
      </div>
      <button class="reset-btn" id="btnReset"><i class="fas fa-undo"></i> إعادة ضبط الإعدادات</button>
    </div>
  </div>

  <button class="back-top" id="backTop"><i class="fas fa-chevron-up"></i></button>
  <div class="toast" id="toast"></div>

  <script>
const SECTIONS = [{"id": "intro", "title": "المقدمة", "icon": "fa-book-open", "desc": "مقدمة الكتاب وبيان أهميته وطريقة عرضه", "content": "<p>مَقْصِدُ الرَّاغِبِينَ</p>\n<p>فِى تَعَلُّمِ الْعَقِيدَةِ وَأَحْكَامِ الدِّين</p>\n<p>لِفَضِيلَةِ الشَّيْخِ نَبِيل الشَّرِيف</p>\n<p>مُقَدِّمَةٌ</p>\n<p>الْحَمْدُ لِلَّهِ وَالصَّلاةُ وَالسَّلامُ عَلَى سَيِّدِنَا مُحَمَّدٍ رَسُولِ اللَّهِ أَمَّا بَعْدُ فَإِنَّ كِتَابَ مَقْصِدِ الرَّاغِبِينَ هُوَ كِتَابٌ مُخْتَصَرٌ جَامِعٌ لِأَغْلَبِ الضَّرُورِيَّاتِ نَافِعٌ جِدًّا لِمَنْ أَرَادَ أَنْ يَتَعَلَّمَ عَقِيدَةَ الْمُسْلِمِينَ وَأَحْكَامَ الدِّينِ مِنَ الصِّغَارِ وَالْكِبَارِ وَيَتَمَيَّزُ هَذَا الْكِتَابُ بِسُهُولَةِ عِبَارَاتِهِ وَأَهَمِيَّةِ مَسَائِلِهِ الَّتِى تَتَعَلَّقُ بِأُصُولِ الدِّينِ وَفُرُوعِهِ. اخْتُصِرَ مِنْ كِتَابِ بُغْيَةِ الْمُحْتَاجِ وَجُعِلَ بِطَرِيقَةِ سُؤَالٍ وَجَوَابٍ لِيَسْهُلَ عَلَى الطَّالِبِ دَرْسُهُ وَعَلَى الْمُبْتَدِئِ حِفْظُهُ رَاجِينَ الْمَوْلَى تَعَالَى أَنْ يَجْعَلَهُ لَنَا ذُخْرًا عِنْدَهُ وَأَنْ يَضَعَ لَهُ الْقَبُولَ وَأَنْ يَنْفَعَ بِهِ الطُّلَّابَ وَالْحَمْدُ لِلَّهِ الَّذِى بِنِعْمَتِهِ تَتِمُّ الصَّالِحَاتُ وَصَلَّى اللَّهُ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى ءَالِهِ وَصَحْبِهِ وَسَلَّمَ.</p>", "wordCount": 105, "paraCount": 5}, {"id": "aqidah", "title": "كتاب العقيدة والردة", "icon": "fa-moon", "desc": "أصول العقيدة الإسلامية وصفات الله والأنبياء واليوم الآخر", "content": "<p>كِتَابُ الْعَقِيدَةِ وَالرِّدَّةِ</p>\n<div class=\"qa-item\"><p class=\"question\">(1) مَا هُوَ الْفَرْضُ الْعَيْنِىُّ مِنْ عِلْمِ الدِّينِ.</p><p class=\"answer\">الْفَرْضُ الْعَيْنِىُّ مِنْ عِلْمِ الدِّينِ هُوَ الْقَدْرُ الَّذِى يَجِبُ عَلَى كُلِّ مُكَلَّفٍ أَنْ يَتَعَلَّمَهُ فَإِذَا أَهْمَلَ تَحْصِيلَهُ يَكُونُ عَاصِيًا مُسْتَحِقًّا لِلْعَذَابِ فِى النَّارِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(2) مَنْ هُوَ الْمُكَلَّفُ شَرْعًا.</p><p class=\"answer\">الْمُكَلَّفُ هُوَ الْبَالِغُ الْعَاقِلُ الَّذِى بَلَغَتْهُ دَعْوَةُ الإِسْلامِ أَىْ بَلَغَهُ أَنَّهُ لا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(3) مَا هِىَ عَاقِبَةُ مَنْ لَمْ يَتَعَلَّمْ عِلْمَ الدِّينِ.</p><p class=\"answer\">مَنْ تَرَكَ تَعَلُّمَ عِلْمِ الدِّينِ قَدْ يَقَعُ فِى الْكُفْرِ فَيَخْلُدُ فِى نَارِ جَهَنَّمَ إِنْ مَاتَ عَلَيْهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(4) مَا هُوَ أَفْضَلُ الْعُلُومِ.</p><p class=\"answer\">أَفْضَلُ الْعُلُومِ هُوَ الْعِلْمُ الَّذِى يُعْرَفُ بِهِ مَا يَلِيقُ بِاللَّهِ وَمَا لا يَلِيقُ بِهِ وَمَا يَلِيقُ بِأَنْبِيَاءِ اللَّهِ وَمَا لا يَلِيقُ بِهِمْ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(5) مَا هُوَ أَفْضَلُ الأَعْمَالِ.</p><p class=\"answer\">أَفْضَلُ الأَعْمَالِ هُوَ الإِيمَانُ بِاللَّهِ وَرَسُولِهِ ﷺ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(6) مَا مَعْنَى الإِيمَانِ بِاللَّهِ.</p><p class=\"answer\">الإِيمَانُ بِاللَّهِ هُوَ اعْتِقَادُ أَنَّ اللَّهَ مَوْجُودٌ لا كَالْمَوْجُودَاتِ وأَنَّهُ مَوْجُودٌ بِلا كَيْفٍ وَلا مَكَانٍ وَلا جِهَةٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(7) مَا مَعْنَى مَوْجُودٌ بِلا كَيْفٍ.</p><p class=\"answer\">مَعْنَى مَوْجُودٌ بِلا كَيْفٍ أَنْ تُؤْمِنَ بِوُجُودِ اللَّهِ مَعَ تَنْزِيهِ اللَّهِ عَنْ صِفَاتِ الْخَلْقِ أَىْ مَعَ نَفْىِ كُلِّ صِفَاتِ الْخَلْقِ عَنِ اللَّهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(8) مَا هُوَ اعْتِقَادُنَا فِى اللَّهِ.</p><p class=\"answer\">اعْتِقَادُنَا فِى اللَّهِ أَنَّ اللَّهَ لَيْسَ جِسْمًا مُؤَلَّفًا مِنْ أَجْزَاءٍ مُنَزَّهٌ عَنِ الْحَجْمِ وَاللَّوْنِ وَالشَّكْلِ وَالأَعْضَاءِ لا يَسْكُنُ الْعَرْشَ وَلا السَّمَاءَ وَلا أَىَّ جِهَةٍ وَلا مَكَانٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(9) مَا مَعْنَى الإِيمَانِ بِرَسُولِ اللَّهِ ﷺ.</p><p class=\"answer\">الإِيمَانُ بِرَسُولِ اللَّهِ هُوَ اعْتِقَادُ أَنَّهُ ﷺ رَسُولُ اللَّهِ أَىْ مُرْسَلٌ مِنْ عِنْدِ اللَّهِ إِلَى كَافَّةِ الإِنْسِ وَالْجِنِّ وَأَنَّهُ صَادِقٌ فِى كُلِّ مَا جَاءَ بِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(10) مَا هُوَ الدِّينُ الْمَقْبُولُ عِنْدَ اللَّهِ.</p><p class=\"answer\">الدِّينُ الصَّحِيحُ الْمَقْبُولُ عِنْدَ اللَّهِ هُوَ الإِسْلامُ وَهُوَ دِينُ جَمِيعِ الأَنْبِيَاءِ عَلَيْهِمُ السَّلامُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(11) مَا هُوَ الإِسْلامُ.</p><p class=\"answer\">الإِسْلامُ هُوَ أَنْ تَشْهَدَ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(12) مَنْ هُمْ أَهْلُ السُّنَّةِ.</p><p class=\"answer\">أَهْلُ السُّنَّةِ هُمُ الَّذِينَ اتَّبَعُوا سُنَّةَ النَّبِىِّ ﷺ أَىْ شَرِيعَتَهُ أَىْ مَا جَاءَ بِهِ مِنَ الْعَقِيدَةِ وَالأَحْكَامِ وَهُمُ الصَّحَابَةُ وَمَنْ تَبِعَهُمْ فِى الْمُعْتَقَدِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(13) مَا هُوَ أَوَّلُ وَاجِبٍ عَلَى الْمُكَلَّفِ.</p><p class=\"answer\">أَوَّلُ مَا يَجِبُ عَلَى الْمُكَلَّفِ إِنْ كَانَ كَافِرًا الدُّخُولُ فِى دِينِ الإِسْلامِ وَالثُّبُوتُ فِيهِ عَلَى الدَّوَامِ وَأَن يُؤَدِّىَ جَمِيعَ الْوَاجِبَاتِ وَيَجْتَنِبَ جَمِيعَ الْمُحَرَّمَاتِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(14) كَيْفَ يَكُونُ الدُّخُولُ فِى الإِسْلامِ.</p><p class=\"answer\">الدُّخُولُ فِى الإِسْلامِ يَكُونُ بِالنُّطْقِ بِالشَّهَادَتَيْنِ بِاللِّسَانِ مَعَ التَّصْدِيقِ بِمَعْنَاهُمَا بِالْقَلْبِ وَلا يَدْخُلُ الْكَافِرُ فِى الإِسْلامِ بِقَوْلِ أَسْتَغْفِرُ اللَّهَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(15) هَلْ يُشْتَرَطُ لِلدُّخُولِ فِى دِينِ الإِسْلامِ لَفْظُ أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ.</p><p class=\"answer\">لا يُشْتَرَطُ هَذَا اللَّفْظُ بِعَيْنِهِ بَلْ يَكْفِى لا إِلَهَ إِلَّا اللَّهُ مُحَمَّدٌ رَسُولُ اللَّهِ أَوْ مَا يُعْطِى مَعْنَاهُ كَقَوْلِ لا رَبَّ إِلَّا اللَّهُ مُحَمَّدٌ نَبِىُّ اللَّهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(16) مَا هُوَ الدِّينُ السَّمَاوِىُّ.</p><p class=\"answer\">الدِّينُ السَّمَاوِىُّ الَّذِى نَزَلَ بِهِ جِبْرِيلُ عَلَيْهِ السَّلامُ عَلَى أَنْبِيَاءِ اللَّهِ هُوَ الإِسْلامُ وَهُوَ الدِّينُ الَّذِى رَضِيَهُ اللَّهُ أَىْ أَحَبَّهُ اللَّهُ لِعِبَادِهِ مِنَ الإِنْسِ وَالْجِنِّ وَالْمَلائِكَةِ وَأَمَرَنَا بِاتِّبَاعِهِ وَلا دِينَ سَمَاوِىٌّ إِلَّا الإِسْلامُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(17) مَا مَعْنَى أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ.</p><p class=\"answer\">مَعْنَى أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللَّهُ أَعْتَرِفُ بِلِسَانِى وَأَعْتَقِدُ بِقَلْبِى أَنْ لا مَعْبُودَ بِحَقٍّ إِلَّا اللَّهُ أَىْ لا يَسْتَحِقُّ الْعِبَادَةَ أَحَدٌ إِلَّا اللَّهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(18) مَا مَعْنَى الْعِبَادَةِ فِى لُغَةِ الْعَرَبِ.</p><p class=\"answer\">الْعِبَادَةُ فِى لُغَةِ الْعَرَبِ هِىَ نِهَايَةُ التَّذَلُّلِ فَإِذَا قُلْنَا نَعْبُدُ اللَّهَ أَىْ نَتَذَلَّلُ لِلَّهِ نِهَايَةَ التَّذَلُّلِ أَىْ نُعَظِّمُ اللَّهَ أَقْصَى غَايَةِ التَّعْظِيمِ فَلَيْسَ التَّوَسُّلُ بِالأَنْبِيَاءِ وَالأَوْلِيَاءِ وَالصَّالِحِينَ عِبَادَةً لِغَيْرِ اللَّهِ كَمَا تَزْعُمُ الْمُشَبِّهَةُ الْمُجَسِّمَةُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(19) مَا مَعْنَى التَّوَسُّلِ.</p><p class=\"answer\">التَّوَسُّلُ هُوَ طَلَبُ حُصُولِ مَنْفَعَةٍ أَوِ انْدِفَاعِ مَضَرَّةٍ مِنَ اللَّهِ بِذِكْرِ اسْمِ نَبِىٍّ أَوْ وَلِىٍّ إِكْرَامًا لِلْمُتَوَسَّلِ بِهِ. وَالتَّوَسُّلُ بِالأَنْبِيَاءِ وَالأَوْلِيَاءِ لَيْسَ كُفْرًا وَلا شِرْكًا وَلا مُحَرَّمًا لِأَنَّهُ لَيْسَ عِبَادَةً لِغَيْرِ اللَّهِ كَمَا تَدَّعِى الْوَهَّابِيَّةُ لِأَنَّ الْعِبَادَةَ هِىَ نِهَايَةُ التَّذَلُّلِ أَىْ أَقْصَى غَايَةِ التَّعْظِيمِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(20) مَا الدَّلِيلُ عَلَى جَوَازِ التَّوَسُّلِ بِرَسُولِ اللَّهِ ﷺ.</p><p class=\"answer\">رَوَى الْحَافِظُ الطَّبَرَانِىُّ فِى الْمُعْجَمِ الصَّغِيرِ وَصَحَّحَهُ أَنَّ الرَّسُولَ ﷺ عَلَّمَ الأَعْمَى أَنْ يَتَوَسَّلَ بِهِ فَذَهَبَ وَتَوَسَّلَ بِهِ فِى غَيْرِ حَضْرَتِهِ بِقَوْلِهِ يَا مُحَمَّدُ إِنِّى أَتَوَجَّهُ بِكَ إِلَى رَبِّى وَعَادَ إِلَى مَجْلِسِ الرَّسُولِ وَقَدْ أَبْصَر. وَمِمَّا يَدُلُّ عَلَى أَنَّ الأَعْمَى تَوَسَّلَ بِالرَّسُولِ ﷺ فِى غَيْرِ حَضْرَتِهِ أَنَّ رَاوِىَ الْحَدِيثِ عُثْمَانَ بنَ حُنَيْفٍ قَالَ لَمَّا رَوَى حَدِيثَ الأَعْمَى فَوَاللَّهِ مَا تَفَرَّقْنَا وَلا طَالَ بِنَا الْمَجْلِسُ حَتَّى دَخَلَ عَلَيْنَا الرَّجُلُ وَقَدْ أَبْصَر كَمَا أَنَّهُ ثَبَتَ النَّهْىُ عَنْ نِدَاءِ الرَّسُولِ بِاسْمِهِ فِى وَجْهِهِ لِقَوْلِهِ تَعَالَى ﴿لا تَجْعَلُوا دُعَاءَ الرَّسُولِ بَيْنَكُمْ كَدُعَاءِ بَعْضِكُمْ بَعْضًا﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(21) مَا مَعْنَى التَّبَرُّكِ وَمَا الدَّلِيلُ عَلَى جَوَازِ التَّبَرُّكِ بِآثَارِ الأَنْبِيَاءِ.</p><p class=\"answer\">التَّبَرُّكُ هُوَ طَلَبُ زِيَادَةِ الْخَيْرِ مِنَ اللَّهِ. وَالتَّبَرُّكُ بِآثَارِ الأَنْبِيَاءِ أَمْرٌ جَائِزٌ شَرْعًا وَلَيْسَ كُفْرًا وَلا شِرْكًا كَمَا تَدَّعِى الْوَهَّابِيَّةُ أَدْعِيَاءُ السَّلَفِيَّةِ وَجَوَازُ هَذَا الأَمْرِ يُعْرَفُ مِنْ فِعْلِ الأَنْبِيَاءِ فَقَدْ قَالَ سَيِّدُنَا يُوسُفُ عَلَيْهِ السَّلامُ ﴿اذْهَبُوا بِقَمِيصِى هَذَا فَأَلْقُوهُ عَلَى وَجْهِ أَبِى يَأْتِ بَصِيرًا﴾ وَفِى هَذَا رَدٌّ عَلَى الْوَهَّابِيَّةِ. فَهَؤُلاءِ كَفَّرُوا نَبِىَّ اللَّهِ يُوسُفَ عَلَيْهِ السَّلامُ لِأَنَّهُ أَرْسَلَ قَمِيصَهُ إِلَى أَبِيهِ لِيَتَبَرَّكَ بِهِ وَكَفَّرُوا أَبَاهُ يَعْقُوبَ عَلَيْهِ السَّلامُ لِأَنَّهُ تَبَرَّكَ بِقَمِيصِ ابْنِهِ يُوسُفَ فَحَصَلَتْ لَهُ الْبَرَكَةُ وَالشِّفَاءُ كَمَا أَخْبَرَ اللَّهُ تَعَالَى فِى الْقُرْءَانِ. كَمَا أَنَّهُمْ كَفَّرُوا سَيِّدَنَا مُحَمَّدًا ﷺ لِأَنَّهُ قَسَمَ شَعَرَهُ حِينَ حَلَقَ فِى حَجَّةِ الْوَدَاعِ بَيْنَ أَصْحَابِهِ لِيَتَبَرَّكُوا بِهِ كَمَا رَوَى ذَلِكَ الْبُخَارِىُّ وَمُسْلِمٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(22) مَا حُكْمُ الِاحْتِفَالِ بِمَوْلِدِ النَّبِىِّ ﷺ.</p><p class=\"answer\">اعْلَمْ أَنَّ الِاحْتِفَالَ بِمَوْلِدِهِ الشَّرِيفِ ﷺ حَدَثَ فِى الْقَرْنِ السَّابِعِ الْهِجْرِىِّ وَهُوَ بِدْعَةٌ حَسَنَةٌ وَأَوَّلُ مَنْ أَحْدَثَهُ الْمَلِكُ الْمُظَفَّرُ مَلِكُ إِرْبِل أَبُو سَعِيدٍ كُوكَبْرِى وَكَانَ عَالِمًا تَقِيًّا فَاسْتَحْسَنَ ذَلِكَ الْعُلَمَاءُ فِى مَشَارِقِ الأَرْضِ وَمَغَارِبِهَا مِنْهُمُ الْحَافِظُ ابْنُ حَجَرٍ الْعَسْقَلانِىُّ وَتِلْمِيذُهُ الْحَافِظُ السَّخَاوِىُّ وَكَذَلِكَ الْحَافِظُ السُّيُوطِىُّ وَلَهُ رِسَالَةٌ سَمَّاهَا حُسْنَ الْمَقْصِدِ فِى عَمَلِ الْمَوْلِدِ. وَهَذَا مَا عَلَيْهِ عُلَمَاءُ الإِسْلامِ بِخِلافِ الْوَهَّابِيَّةِ الَّذِينَ يَحُرِّمُونَ عَلَى الْمُسْلِمِينَ الِاحْتِفَالَ بِمَوْلِدِهِ الشَّرِيفِ ﷺ. وَالدَّلِيلُ عَلَى مَشْرُوعِيَّةِ عَمَلِ الْمَوْلِدِ قَوْلُهُ تَعَالَى ﴿وَافْعَلُوا الْخَيْرَ لَعَلَّكُمْ تُفْلِحُونَ﴾ وَقَوْلُهُ ﷺ مَنْ سَنَّ فِى الإِسْلامِ سُنَّةً حَسَنَةً فَلَهُ أَجْرُهَا وَأَجْرُ مَنْ عَمِلَ بِهَا بَعْدَهُ مِنْ غَيْرِ أَنْ يَنْقُصَ مِنْ أُجُورِهِمْ شَىْءٌ رَوَاهُ مُسْلِمٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(23) اذْكُرْ دَلِيلًا عَقْلِيَّا عَلَى وُجُودِ اللَّهِ.</p><p class=\"answer\">الدَّلِيلُ الْعَقْلِىُّ عَلَى وُجُودِ اللَّهِ هُوَ كَأَنْ يُقَالَ الْكِتَابَةُ لا بُدَّ لَهَا مِنْ فَاعِلٍ وَالْبِنَاءُ لا بُدَّ لَهُ مِنْ فَاعِلٍ وَالْكِتَابَةُ وَالْبِنَاءُ جُزْءٌ مِنْ هَذَا الْعَالَمِ فَهَذَا الْعَالَمُ بِالأَوْلَى لا بُدَّ لَهُ مِنْ خَالِقٍ خَلَقَهُ لا يُشْبِهُهُ بِوَجْهٍ مِنَ الْوُجُوهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(24) مَا مَعْنَى الْوَاحِدِ إِذَا أُطْلِقَ عَلَى اللَّهِ.</p><p class=\"answer\">مَعْنَى الْوَاحِدِ أَنَّ اللَّهَ لا شَرِيكَ لَهُ فِى الأُلُوهِيَّةِ أَىْ لا يَسْتَحِقُّ الْعِبَادَةَ أَحَدٌ إِلَّا اللَّهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(25) مَا مَعْنَى الأَحَدِ إِذَا أُطْلِقَ عَلَى اللَّهِ.</p><p class=\"answer\">مَعْنَى الأَحَدِ الَّذِى لا يَقْبَلُ الِانْقِسَامَ أَىْ لَيْسَ جِسْمًا وَالْجِسْمُ مَا لَهُ حَجْمٌ صَغِيرًا كَانَ أَوْ كَبِيرًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(26) مَا مَعْنَى الأَوَّلِ وَالْقَدِيمِ إِذَا أُطْلِقَا عَلَى اللَّهِ تَعَالَى.</p><p class=\"answer\">مَعْنَى الأَوَّلِ وَالْقَدِيمِ إِذَا أُطْلِقَا عَلَى اللَّهِ تَعَالَى الَّذِى لا ابْتِدَاءَ لِوُجُودِهِ قَالَ اللَّهُ تَعَالَى ﴿هُوَ الأَوَّلُ﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(27) مَا مَعْنَى الْحَىِّ فِى حَقِّ اللَّهِ.</p><p class=\"answer\">مَعْنَى الْحَىِّ فِى حَقِّ اللَّهِ أَنَّ اللَّهَ مُتَّصِفٌ بِحَيَاةٍ لا تُشْبِهُ حَيَاةَ الْمَخْلُوقِينَ لَيْسَتْ بِرُوحٍ وَجَسَدٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(28) مَا مَعْنَى الْقَيُّومِ فِى حَقِّ اللَّهِ.</p><p class=\"answer\">مَعْنَى الْقَيُّومِ الَّذِى لا يَحْتَاجُ إِلِى غَيْرِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(29) مَا مَعْنَى الدَّائِمِ فِى حَقِّ اللَّهِ.</p><p class=\"answer\">مَعْنَى الدَّائِمِ الَّذِى لا يَلْحَقُهُ وَلا يَجُوزُ عَلَيْهِ الْفَنَاءُ وَبِمَعْنَاهُ الْبَاقِى.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(30) مَا مَعْنَى الْخَالِقِ.</p><p class=\"answer\">مَعْنَى الْخَالِقِ الَّذِى أَبْرَزَ جَمِيعَ الْمَخْلُوقَاتِ مِنَ الْعَدَمِ إِلَى الْوُجُودِ أَىْ صَارَتْ كُلُّهَا مَوْجُودَةً بِإِيجَادِ اللَّهِ لَهَا بَعْدَ أَنْ لَمْ تَكُنْ مَوْجُودَةً.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(31) مَا هِىَ الأَسْمَاءُ الْخَاصَّةُ بِاللَّهِ.</p><p class=\"answer\">الأَسْمَاءُ الْخَاصَّةُ بِاللَّهِ هِىَ الرَّحْمٰنُ وَالْقُدُّوسُ وَالْخَالِقُ وَالرَّازِقُ وَالرَّزَّاقُ وَالْقَيُّومُ وَمَالِكُ الْمُلْكِ وَذُو الْجَلالِ وَالإِكْرَامِ وَالْمُحْيِى الْمُمِيتُ وَالرَّبُّ بِالأَلِفِ وَاللَّامِ لا يُسَمَّى بِهَا إِلَّا اللَّهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(32) مَا مَعْنَى الرَّازِقِ فِى حَقِّ اللَّهِ.</p><p class=\"answer\">مَعْنَى الرَّازِقِ الَّذِى يُوصِلُ الأَرْزَاقَ إِلَى عِبَادِهِ مِنْ غَيْرِ أَنْ تَلْحَقَهُ مَشَقَّةٌ أَوْ تَعَبٌ. وَالرِّزْقُ هُوَ مَا يَنْفَعُ حِسًّا وَلَوْ كَانَ مُحَرَّمًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(33) مَا مَعْنَى الْعَالِمِ فِى حَقِّ اللَّهِ.</p><p class=\"answer\">مَعْنَى الْعَالِمِ الْمُتَّصِفُ بِالْعِلْمِ وَعِلْمُ اللَّهِ أَزَلِىٌّ أَبَدِىٌّ لا يَزِيدُ وَلا يَنْقُصُ فَهُوَ عَالِمٌ فِى الأَزَلِ بِكُلِّ شَىْءٍ عَالِمٌ بِذَاتِهِ وَصِفَاتِهِ وَمَا يُحْدِثُهُ مِنْ مَخْلُوقَاتِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(34) مَا مَعْنَى الْقَدِيرِ فِى حَقِّ اللَّهِ.</p><p class=\"answer\">مَعْنَى الْقَدِيرِ الْمُتَّصِفُ بِالْقُدْرَةِ التَّامَّةِ فَاللَّهُ تَعَالَى قَادِرٌ عَلَى كُلِّ شَىْءٍ لا يُعْجِزُهُ شَىْءٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(35) مَا مَعْنَى مَا شَاءَ اللَّهُ كَانَ وَمَا لَمْ يَشَأْ لَمْ يَكُنْ.</p><p class=\"answer\">مَا شَاءَ اللَّهُ كَانَ وَمَا لَمْ يَشَأْ لَمْ يَكُنْ أَىْ مَا أَرَادَ اللَّهُ فِى الأَزَلِ وُجُودَهُ لا بُدَّ أَنْ يُوجَدَ وَمَا لَمْ يُرِدِ اللَّهُ وُجُودَهُ لا يَدْخُلُ فِى الْوُجُودِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(36) مَا مَعْنَى لا حَوْلَ وَلا قُوَّةَ إِلَّا بِاللَّهِ.</p><p class=\"answer\">مَعْنَى لا حَوْلَ وَلا قُوَّةَ إِلَّا بِاللَّهِ لا حَوْلَ عَنْ مَعْصِيَةِ اللَّهِ إِلَّا بِعِصْمَةِ اللَّهِ وَلا قُوَّةَ عَلَى طَاعَةِ اللَّهِ إِلَّا بِعَوْنِ اللَّهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(37) مَا مَعْنَى قَوْلِهِ تَعَالَى ﴿لَيْسَ كَمِثْلِهِ شَىْءٌ﴾.</p><p class=\"answer\">مَعْنَى قَوْلِهِ تَعَالَى ﴿لَيْسَ كَمِثْلِهِ شَىْءٌ﴾ أَنَّ اللَّهَ تَعَالَى لا يُشْبِهُ الْمَخْلُوقَاتِ بِأَىِّ وَجْهٍ مِنَ الْوُجُوهِ مَهْمَا تَصَوَّرْتَ بِبَالِكَ فَاللَّهُ لا يُشْبِهُ ذَلِكَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(38) تَكَلَّمْ عَنْ صِفَاتِ اللَّهِ تَعَالَى.</p><p class=\"answer\">صِفَاتُ اللَّهِ أَزَلِيَّةٌ أَىْ لا بِدَايَةَ لَهَا أَمَّا صِفَاتُ غَيْرِهِ فَهِىَ حَادِثَةٌ أَىْ مَخْلُوقَةٌ قَالَ اللَّهُ تَعَالَى ﴿وَلِلَّهِ الْمَثَلُ الأَعْلَى﴾ أَىْ لِلَّهِ صِفَاتٌ تَدُلُّ عَلَى الْكَمَالِ لا تُشْبِهُ صِفَاتِ غَيْرِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(39) اذْكُرِ الصِّفَاتِ الثَّلاثَ عَشْرَةَ الْوَاجِبَةَ لِلَّهِ تَعَالَى.</p><p class=\"answer\">الصِّفَاتُ الثَّلاثَ عَشْرَةَ الْوَاجِبَةُ لِلَّهِ تَعَالَى هِىَ الْوُجُودُ وَالْوَحْدَانِيَّةُ وَالْقِدَمُ أَىِ الأَزَلِيَّةُ وَالْبَقَاءُ وَقِيَامُهُ بِنَفْسِهِ أَىْ أَنَّهُ لا يَحْتَاجُ إِلَى غَيْرِهِ وَالْقُدْرَةُ وَالإِرَادَةُ وَالْعِلْمُ وَالسَّمْعُ وَالْبَصَرُ وَالْحَيَاةُ وَالْكَلامُ وَالْمُخَالَفَةُ لِلْحَوَادِثِ أَىْ عَدَمُ مُشَابَهَتِهِ لِلْمَخْلُوقَاتِ. وَلَمَّا كَانَتْ هَذِهِ الصِّفَاتُ ذِكْرُهَا كَثِيرًا فِى النُّصُوصِ الشَّرْعِيَّةِ قَالَ الْعُلَمَاءُ تَجِبُ مَعْرِفَتُهَا عَلَى كُلِّ مُكَلَّفٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(40) تَكَلَّمْ عَنْ صِفَةِ الْوُجُودِ لِلَّهِ.</p><p class=\"answer\">يَجِبُ اعْتِقَادُ أَنَّ اللَّهَ مَوْجُودٌ لا شَكَّ فِى وُجُودِهِ وَوُجُودُهُ تَعَالَى لَيْسَ بِإِيجَادِ مُوجِدٍ قَالَ اللَّهُ تَعَالَى ﴿أَفِى اللَّهِ شَكٌّ﴾ أَىْ لا شَكَّ فِى وُجُودِ اللَّهِ تَبَارَكَ وَتَعَالَى.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(41) تَكَلَّمْ عَنْ صِفَةِ الْوَحْدَانِيَّةِ لِلَّهِ.</p><p class=\"answer\">يَجِبُ اعْتِقَادُ أَنَّ اللَّهَ وَاحِدٌ لا شَرِيكَ لَهُ وَلا مَعْبُودَ بِحَقٍّ سِوَاهُ وَلَيْسَ جِسْمًا مُؤَلَّفًا مِنْ أَجْزَاءٍ قَالَ اللَّهُ تَعَالَى ﴿وَإِلَهُكُمْ إِلَهٌ وَاحِدٌ﴾. وَلَيْسَ الْمُرَادُ بِوَحْدَانِيَّةِ اللَّهِ وَحْدَانِيَّةَ الْعَدَدِ لِأَنَّ الْجِسْمَ الْوَاحِدَ لَهُ أَجْزَاءٌ بَلِ الْمُرَادُ أَنَّهُ لا شَبِيهَ وَلا مَثِيلَ لَهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(42) تَكَلَّمْ عَنْ صِفَةِ الْقِدَمِ لِلَّهِ.</p><p class=\"answer\">اعْلَمْ أَنَّ اللَّهَ تَعَالَى قَدِيمٌ أَىْ لا بِدَايَةَ لِوُجُودِهِ قَالَ اللَّهُ تَعَالَى ﴿هُوَ الأَوَّلُ﴾ أَىْ هُوَ وَحْدَهُ الأَوَّلُ الَّذِى لا ابْتِدَاءَ لِوُجُودِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(43) تَكَلَّمْ عَنْ صِفَةِ الْبَقَاءِ لِلَّهِ.</p><p class=\"answer\">يَجِبُ اعْتِقَادُ أَنَّ اللَّهَ تَعَالَى لا يَلْحَقُهُ وَلا يَجُوزُ عَلَيْهِ الْفَنَاءُ قَالَ اللَّهُ تَعَالَى ﴿وَيَبْقَى وَجْهُ رَبِّكَ﴾ أَىْ ذَاتُ رَبِّكَ أَىْ يَبْقَى اللَّهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(44) تَكَلَّمْ عَنْ صِفَةِ الْقِيَامِ بِالنَّفْسِ لِلَّهِ.</p><p class=\"answer\">يَجِبُ اعْتِقَادُ أَنَّ اللَّهَ مُسْتَغْنٍ عَنْ كُلِّ مَا سِوَاهُ فَلا يَحْتَاجُ إِلَى أَحَدٍ مِنْ خَلْقِهِ وَكُلُّ شَىْءٍ سِوَى اللَّهِ مُحْتَاجٌ إِلَيْهِ قَالَ اللَّهُ تَعَالَى ﴿فَإِنَّ اللَّهَ غَنِىٌّ عَنِ الْعَالَمِين﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(45) تَكَلَّمْ عَنْ صِفَةِ الْقُدْرَةِ لِلَّهِ.</p><p class=\"answer\">يَجِبُ اعْتِقَادُ أَنَّ اللَّهَ قَادِرٌ عَلَى كُلِّ شَىْءٍ لا يُعْجِزُهُ شَىْءٌ قَالَ اللَّهُ تَعَالَى ﴿وَهُوَ عَلَى كُلِّ شَىْءٍ قَدِيرٌ﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(46) تَكَلَّمْ عَنْ صِفَةِ الإِرَادَةِ لِلَّهِ.</p><p class=\"answer\">يَجِبُ اعْتِقَادُ أَنَّ اللَّهَ يَفْعَلُ مَا يُرِيدُ لا يُعْجِزُهُ شَىْءٌ وَلا يَحْتَاجُ إِلَى اسْتِعَانَةٍ بِغَيْرِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(47) تَكَلَّمْ عَنْ صِفَةِ الْعِلْمِ لِلَّهِ.</p><p class=\"answer\">يَجِبُ اعْتِقَادُ أَنَّ اللَّهَ عَالِمٌ بِكُلِّ شَىْءٍ بِعِلْمِهِ الأَزَلِىِّ فَهُوَ عَالِمٌ بِذَاتِهِ وَصِفَاتِهِ وَمَا يُحْدِثُهُ مِنْ مَخْلُوقَاتِهِ قَالَ اللَّهُ تَعَالَى ﴿وَأَنَّ اللَّهَ قَدْ أَحَاطَ بِكُلِّ شَىْءٍ عِلْمًا﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(48) تَكَلَّمْ عَنْ صِفَةِ السَّمْعِ لِلَّهِ.</p><p class=\"answer\">يَجِبُ اعْتِقَادُ أَنَّ اللَّهَ يَسْمَعُ بِسَمْعِهِ الأَزَلِىِّ كُلَّ الْمَسْمُوعَاتِ وَلَيْسَ بِسَمْعٍ يَحْدُثُ فِى ذَاتِهِ عِنْدَ وُجُودِ الْحَادِثَاتِ فَهُوَ تَبَارَكَ وَتَعَالَى يَسْمَعُ كَلامَهُ الأَزَلِىَّ وَكَلامَ الْمَخْلُوقَاتِ وَأَصْوَاتَهُمْ بِلا أُذُنٍ وَلا ءَالَةٍ أُخْرَى قَالَ اللَّهُ تَعَالَى ﴿وَهُوَ السَّمِيعُ الْبَصِيرُ﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(49) تَكَلَّمْ عَنْ صِفَةِ الْبَصَرِ لِلَّهِ.</p><p class=\"answer\">يَجِبُ اعْتِقَادُ أَنَّ اللَّهَ يَرَى بِرُؤْيَتِهِ الأَزَلِيَّةِ كُلَّ الْمَرْئِيَّاتِ فَلا يَحْدُثُ فِى ذَاتِهِ بَصَرٌ كَمَا يَحْصُلُ لِلْمَخْلُوقِ فَهُوَ تَبَارَكَ وَتَعَالَى يَرَى ذَاتَهُ الأَزَلِىَّ وَيَرَى كُلَّ الْمَخْلُوقَاتِ مِنْ غَيْرِ حَاجَةٍ إِلَى حَدَقَةٍ أَوْ شُعَاعِ ضَوْءٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(50) تَكَلَّمْ عَنْ صِفَةِ الْحَيَاةِ لِلَّهِ.</p><p class=\"answer\">يَجِبُ اعْتِقَادُ أَنَّ اللَّهَ حَىٌّ بِحَيَاةٍ لا تُشْبِهُ حَيَاتَنَا لَيْسَتْ بِرُوحٍ وَجَسَدٍ قَالَ اللَّهُ تَعَالَى ﴿وَتوَكَّلْ عَلَى الْحَىِّ الَّذِى لا يَمُوتُ﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(51) تَكَلَّمْ عَنْ صِفَةِ الْكَلامِ لِلَّهِ.</p><p class=\"answer\">يَجِبُ اعْتِقَادُ أَنَّ اللَّهَ يَتَكَلَّمُ بِلا لِسَانٍ وَلا شَفَتَيْنِ لِأَنَّهُ لَيْسَ جِسْمًا وَكَلامُهُ لَيْسَ حَرْفًا وَلا صَوْتًا وَلا لُغَةً لا يُبْتَدَأُ وَلا يُخْتَتَمُ لا يَطْرَأُ عَلَيْهِ سُكُوتٌ أَوْ تَقَطُّعٌ قَالَ اللَّهُ تَعَالَى ﴿وَكَلَّمَ اللَّهُ مُوسَى تَكْلِيمًا﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(52) مَا مَعْنَى مُخَالَفَةِ اللَّهِ لِلْحَوَادِثِ.</p><p class=\"answer\">مَعْنَى مُخَالَفَةِ اللَّهِ لِلْحَوَادِثِ أَنَّهُ لا يُشْبِهُ الْمَخْلُوقَاتِ قَالَ اللَّهُ تَعَالَى ﴿لَيْسَ كَمِثْلِهِ شَىْءٌ﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(53) مَنْ هُوَ ءَاخِرُ الأَنْبِيَاءِ وَمِنْ أَىِّ قَبِيلَةٍ هُوَ وَأَيْنَ وُلِدَ وَأَيْنَ مَاتَ وَدُفِنَ.</p><p class=\"answer\">هُوَ مُحَمَّدُ بنُ عَبْدِ اللَّهِ النَّبِىُّ الْعَرَبِىُّ الْقُرَشِىُّ ﷺ وُلِدَ بِمَكَّةَ وَبُعِثَ بِهَا أَىْ نَزَلَ عَلَيْهِ الْوَحْىُ بِالنُّبُوَّةِ وَهُوَ مُسْتَوْطِنٌ فِيهَا وَهَاجَرَ إِلَى الْمَدِينَةِ وَمَاتَ وَدُفِنَ فِيهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(54) مَا الدَّلِيلُ عَلَى أَنَّ سَيِّدَنَا مُحَمَّدًا ﷺ هُوَ ءَاخِرُ الأَنْبِيَاءِ.</p><p class=\"answer\">قَالَ اللَّهُ تَعَالَى ﴿وَخَاتَمَ النَّبِيِّينَ﴾ وَقَالَ رَسُولُ اللَّهِ ﷺ وَخُتِمَ بِىَ النَّبِيُّونَ رَوَاهُ مُسْلِمٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(55) مَا مَعْنَى أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ.</p><p class=\"answer\">مَعْنَى أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ أَعْتَرِفُ بِلِسَانِى وَأَعْتَقِدُ بِقَلْبِى أَنَّ سَيِّدَنَا مُحَمَّدًا ﷺ مُرْسَلٌ مِنْ عِنْدِ اللَّهِ إِلَى كَافَّةِ الْخَلْقِ مِنْ إِنْسٍ وَجِنٍّ وَأَنَّهُ صَادِقٌ فِى كُلِّ مَا جَاءَ بِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(56) تَكَلَّمْ عَنْ عَذَابِ الْقَبْرِ.</p><p class=\"answer\">يَجِبُ الإِيمَانُ بِعَذَابِ الْقَبْرِ كَعَرْضِ النَّارِ عَلَى الْكَافِرِ كُلَّ يَوْمٍ مَرَّتَيْنِ وَانْزِعَاجِ بَعْضِ عُصَاةِ الْمُسْلِمِينَ مِنْ ظُلْمَةِ الْقَبْرِ وَوَحْشَتِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(57) تَكَلَّمْ عَنْ نَعِيمِ الْقَبْرِ.</p><p class=\"answer\">يَجِبُ الإِيمَانُ بِنَعِيمِ الْقَبْرِ كَتَوْسِيعِ الْقَبْرِ سَبْعِينَ ذِرَاعًا طُولًا فِى سَبْعِينَ ذِرَاعًا عَرْضًا لِلْمُؤْمِنِ التَّقِىِّ وَتَنْوِيرِهِ بِنُورٍ يُشْبِهُ نُورَ الْقَمَرِ لَيْلَةَ الْبَدْرِ وَرُؤْيَةِ مَقْعَدِهِ فِى الْجَنَّةِ كُلَّ يَوْمٍ مَرَّتَيْنِ وَشَمِّ رَائِحَةِ الْجَنَّةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(58) تَكَلَّمْ عَنْ سُؤَالِ الْمَلَكَيْنِ مُنْكَرٍ وَنَكِيرٍ.</p><p class=\"answer\">يَجِبُ الإِيمَانُ بِسُؤَالِ الْمَلَكَيْنِ مُنْكَرٍ وَنَكِيرٍ لِلْمَيِّتِ بَعْدَ دَفْنِهِ. وَيُسْتَثْنَى مِنَ السُّؤَالِ النَّبِىُّ وَالطِّفْلُ وَشَهِيدُ الْمَعْرَكَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(59) مَا هُوَ الرُّوحُ.</p><p class=\"answer\">الرُّوحُ جِسْمٌ لَطِيفٌ لا يُقْبَضُ بِالْيَدِ لا يَعْلَمُ حَقِيقَتَهُ إِلَّا اللَّهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(60) أَيْنَ يَكُونُ رُوحُ الْمُؤْمِنِ التَّقِىِّ إِذَا بَلِىَ جَسَدُهُ.</p><p class=\"answer\">الْمُؤْمِنُ التَّقِىُّ إِذَا مَاتَ وَبَلِىَ جَسَدُهُ وَلَمْ يَبْقَ مِنْهُ إِلَّا عَجْبُ الذَّنَبِ يَكُونُ رُوحُهُ فِى الْجَنَّةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(61) أَيْنَ يَكُونُ رُوحُ شَهِيدِ الْمَعْرَكَةِ.</p><p class=\"answer\">شَهِيدُ الْمَعْرَكَةِ يَصْعَدُ رُوحُهُ فَوْرًا إِلَى الْجَنَّةِ بَعْدَ مَوْتِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(62) أَيْنَ تَكُونُ أَرْوَاحُ عُصَاةِ الْمُسْلِمِينَ بَعْدَ بِلَى الْجَسَدِ.</p><p class=\"answer\">تَكُونُ أَرْوَاحُ عُصَاةِ الْمُسْلِمِينَ بَعْدَ بِلَى الْجَسَدِ فِيمَا بَيْنَ السَّمَاءِ وَالأَرْضِ وَبَعْضُهُمْ فِى السَّمَاءِ الأُولَى. (63) أَيْنَ يَكُونُ رُوحُ الْكَافِرِ إِذَا بَلِىَ جَسَدُهُ.</p></div>\n<p>الْكَافِرُ إِذَا مَاتَ وَبَلِىَ جَسَدُهُ يَكُونُ رُوحُهُ فِى سِجِّينٍ وَهُوَ مَكَانٌ مُظْلِمٌ وَمُوحِشٌ فِى الأَرْضِ السَّابِعَةِ.</p>\n<div class=\"qa-item\"><p class=\"question\">(64) مَا هُوَ الْبَعْثُ.</p><p class=\"answer\">الْبَعْثُ هُوَ خُرُوجُ الْمَوْتَى مِنَ الْقُبُورِ بَعْدَ إِحْيَائِهِمْ أَىْ بَعْدَ إِعَادَةِ الْجَسَدِ الَّذِى أَكَلَهُ التُّرَابُ إِنْ كَانَ مِنَ الأَجْسَادِ الَّتِى يَأْكُلُهَا التُّرَابُ وَعَوْدِ الرُّوحِ إِلَيْهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(65) مَا هُوَ الْحَشْرُ.</p><p class=\"answer\">الْحَشْرُ هُوَ سَوْقُ النَّاسِ بَعْدَ الْبَعْثِ إِلَى أَرْضِ الْمَحْشَرِ. وَيَكُونُ النَّاسُ فِى الْحَشْرِ عَلَى ثَلاثَةِ أَحْوَالٍ فَقِسْمٌ مِنْهُمْ طَاعِمُونَ كَاسُونَ رَاكِبُونَ عَلَى نُوقٍ وَهُمُ الأَتْقِيَاءُ وَقِسْمٌ يُحْشَرُونَ حُفَاةً عُرَاةً وَهُمْ بَعْضُ عُصَاةِ الْمُسْلِمِينَ وَقِسْمٌ يُحْشَرُونَ حُفَاةً عُرَاةً وَيُجَرُّونَ عَلَى وُجُوهِهِمْ وَهُمُ الْكُفَّارُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(66) تَكَلَّمْ عَنِ الْقِيَامَةِ.</p><p class=\"answer\">الْقِيَامَةُ هِىَ قِيَامُ الْمَوْتَى لِلْحِسَابِ وَأَوَّلُهَا مِنْ خُرُوجِ النَّاسِ مِنْ قُبُورِهِمْ إِلَى اسْتِقْرَارِ أَهْلِ الْجَنَّةِ فِى الْجَنَّةِ وَأَهْلِ النَّارِ فِى النَّارِ وَمِقْدَارُ الْقِيَامَةِ خَمْسُونَ أَلْفَ سَنَةٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(67) تَكَلَّمْ عَنِ الْحِسَابِ.</p><p class=\"answer\">الْحِسَابُ هُوَ عَرْضُ أَعْمَالِ الْعِبَادِ عَلَيْهِمْ. وَيَكُونُ بِتَكْلِيمِ اللَّهِ لِلْعِبَادِ جَمِيعِهِمْ فَيَسْمَعُ الْعَبْدُ كَلامَ اللَّهِ الَّذِى لا يُشْبِهُ كَلامَ الْمَخْلُوقِينَ لَيْسَ حَرْفًا وَلا صَوْتًا وَلا لُغَةً لا يُبْتَدَأُ وَلا يُخْتَتَمُ فَيَفْهَمُ مِنْ كَلامِ اللَّهِ السُّؤَالَ عَنْ أَفْعَالِهِ وَأَقْوَالِهِ وَاعْتِقَادَاتِهِ فَيُسَرُّ الْمُؤْمِنُ التَّقِىُّ وَلا يُسَرُّ الْكَافِرُ بَلْ يَغْلِبُ عَلَيْهِ الْخَوْفُ وَالْقَلَقُ وَيَنْتَهِى حِسَابُهُمْ فِى وَقْتٍ قَصِيرٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(68) مَا مَعْنَى الثَّوَابِ.</p><p class=\"answer\">الثَّوَابُ هُوَ الْجَزَاءُ الَّذِى يُجَازَاهُ الْمُؤْمِنُ فِى الآخِرَةِ عَلَى الْعَمَلِ الصَّالِحِ مِمَّا يَسُرُّهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(69) مَا مَعْنَى الْعَذَابِ.</p><p class=\"answer\">الْعَذَابُ هُو الْجَزَاءُ الَّذِى يُجَازَاهُ الْعَبْدُ فِى الآخِرَةِ مِمَّا يَسُوؤُهُ عَلَى مَا عَمِلَ مِنْ سَيِّئَاتٍ كَأَذَى حَرِّ الشَّمْسِ فَإِنَّ الشَّمْسَ تَدْنُو مِنَ الأَرْضِ يَوْمَ الْقِيَامَةِ حَتَّى تَكُونَ بِمِقْدَارِ مِيلٍ أَىْ أَلْفَىْ ذِرَاعٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(70) تَكَلَّمْ عَنِ الْمِيزَانِ فِى الآخِرَةِ.</p><p class=\"answer\">يَجِبُ الإِيمَانُ بِالْمِيزَانِ الَّذِى تُوزَنُ بِهِ أَعْمَالُ الْعِبَادِ يَوْمَ الْقِيَامَةِ وَالَّذِى يُوزَنُ هُوَ الصَّحَائِفُ الَّتِى كُتِبَ عَلَيْهَا الْحَسَنَاتُ وَالسَّيِّئَاتُ. فَمَنْ كَانَتْ حَسَنَاتُهُ أَكْثَرَ مِنْ سَيِّئَاتِهِ أَوْ تَسَاوَتْ فَهُوَ مِنْ أَهْلِ النَّجَاةِ أَمَّا مَنْ كَانَتْ سَيِّئَاتُهُ أَكْثَرَ مِنْ حَسَنَاتِهِ فَهُوَ تَحْتَ مَشِيئَةِ اللَّهِ إِنْ شَاءَ عَذَّبَهُ وَإِنْ شَاءَ غَفَرَ لَهُ. أَمَّا الْكَافِرُ فَتُوضَعُ سِيِّئَاتُهُ فِى كَفَّةٍ مِنَ الْكَفَّتَيْنِ وَلا حَسَنَاتِ لَهُ يَوْمَ الْقِيَامَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(71) هَلْ جَهَنَّمُ مَوْجُودَةٌ.</p><p class=\"answer\">جَهَنَّمُ مَوْجُودَةٌ الآنَ لِقَوْلِهِ تَعَالَى ﴿أُعِدَّتْ لِلْكَافِرِينَ﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(72) أَيْنَ مَكَانُ جَهَنَّمَ.</p><p class=\"answer\">جَهَنَّمُ مَكَانُهَا تَحْتَ الأَرْضِ السَّابِعَةِ مُنْفَصِلَةٌ عَنْهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(73) مَنِ الَّذِى يُعَذَّبُ فِى نَارِ جَهَنَّمَ.</p><p class=\"answer\">الْكُفَّارُ كُلُّهُمْ يُعَذَّبُونَ فِى نَارِ جَهَنَّمَ عَذَابًا أَبَدِيًّا وَبَعْضُ عُصَاةِ الْمُسْلِمِينَ يُعَذَّبُونَ فِيهَا مُدَّةً ثُمَّ يُخْرَجُونَ مِنْهَا وَيُدْخَلُونَ الْجَنَّةَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(74) مَا الدَّلِيلُ عَلَى أَنَّ النَّارَ بَاقِيَةٌ لا تَفْنَى.</p><p class=\"answer\">قَالَ اللَّهُ تَعَالَى ﴿إِنَّ اللَّهَ لَعَنَ الْكَافِرِينَ وَأَعَدَّ لَهُمْ سَعِيرًا خَالِدِينَ فِيهَا أَبَدًا﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(75) مَا الدَّلِيلُ عَلَى أَنَّ الْكَافِرَ فِى جَهَنَّمَ لا يُخَفَّفُ عَنْهُ الْعَذَابُ.</p><p class=\"answer\">قَالَ اللَّهُ تَعَالَى ﴿خَالِدِينَ فِيهَا لا يُخَفَّفُ عَنْهُمُ الْعَذَابُ﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(76) كَيْفَ تَكُونُ خِلْقَةُ الْكَافِرِ فِى جَهَنَّمَ.</p><p class=\"answer\">الْكَافِرُ فِى جَهَنَّمَ يَكُونُ ضِرْسُهُ كَجَبَلِ أُحُدٍ وَمَا بَيْنَ مَنْكِبَيْهِ مَسِيرَةَ ثَلاثَةِ أَيَّامٍ وَغِلْظُ جِلْدِهِ سَبْعِينَ ذِرَاعًا تَأْكُلُهُ النَّارُ كُلَّ يَوْمٍ سَبْعِينَ أَلْفَ مَرَّةٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(77) مَا هُوَ طَعَامُ الْكُفَّارِ فِى جَهَنَّمَ.</p><p class=\"answer\">طَعَامُ الْكُفَّارِ فِى جَهَنَّمَ مِنْ ضَرِيعٍ وَهُوَ شَجَرٌ كَرِيهُ الْمَنْظَرِ كَرِيهُ الطَّعْمِ كَرِيهُ الرَّائِحَةِ وَشَرَابُهُمْ هُوَ الْمَاءُ الْمُتَنَاهِى فِى الْحَرَارَةِ وَمَا يَسِيلُ مِنْ جُلُودِ أَهْلِ النَّارِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(78) هَلْ يُوجَدُ فِى جَهَنَّمَ حَيَّاتٌ وَعَقَارِب.</p><p class=\"answer\">يُوجَدُ فِى جَهَنَّمَ حَيَّاتٌ الْحَيَّةُ الْوَاحِدَةُ كَالْوَادِى وَعَقَارِبُ كَالْبِغَالِ لا تَتَأَثَّرُ بِالنَّارِ تَلْسَعُ الْكُفَّارَ وَتُعَذِّبُهُمْ فَوْقَ عَذَابِهِمْ بِالنَّارِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(79) مَا الدَّلِيلُ عَلَى أَنَّ الْكَافِرَ لا يَنْتَفِعُ فِى الآخِرَةِ بِمَا عَمِلَهُ مِنَ الأَعْمَالِ الْحَسَنَةِ لا بِتَخْفِيفِ عَذَابٍ وَلا بِنَعِيمٍ.</p><p class=\"answer\">قَالَ اللَّهُ تَعَالَى ﴿مَثَلُ الَّذِينَ كَفَرُوا بِرَبِّهِمْ أَعْمَالُهُمْ كَرَمَادٍ اشْتَدَّتْ بِهِ الرِّيحُ فِى يَوْمٍ عَاصِفٍ﴾. فَاللَّهُ تَعَالَى شَبَّهَ أَعْمَالَ الْكُفَّارِ بِالرَّمَادِ الَّذِى إِذَا جَاءَتْهُ رِيحٌ عَاصِفَةٌ لا يَبْقَى مِنْهُ شَىْءٌ كَذَلِكَ الْكُفَّارُ أَعْمَالُهُمْ لا يَنْتَفِعُونَ بِهَا لِأَنَّ الإِيمَانَ شَرْطٌ لِقَبُولِ الأَعْمَالِ الصَّالِحَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(80) مَا الدَّلِيلُ عَلَى أَنَّ اللَّهَ لا يَرْحَمُ الْكَافِرَ بَعْدَ مَوْتِهِ.</p><p class=\"answer\">قَالَ اللَّهُ تَعَالَى ﴿وَرَحْمَتِى وَسِعَتْ كُلَّ شَىْءٍ فَسَأَكْتُبُهَا لِلَّذِينَ يَتَّقُونَ﴾ أَىْ أَنَّ رَحْمَةَ اللَّهِ وَسِعَتْ فِى الدُّنْيَا كُلَّ مُؤْمِنٍ وَكَافِرٍ أَمَّا فِى الآخِرَةِ فَهِىَ خَاصَّةٌ لِلَّذِينَ يَجْتَنِبُونَ الشِّرْكَ وَسَائِرَ أَنْوَاعِ الْكُفْرِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(81) مَا هُوَ الصِّرَاطُ الَّذِى يَرِدُهُ النَّاسُ يَوْمَ الْقِيَامَةِ.</p><p class=\"answer\">الصِّرَاطُ هُوَ جِسْرٌ عَرِيضٌ يُمَدُّ فَوْقَ جَهَنَّمَ فَيَرِدُهُ النَّاسُ جَمِيعًا فَمِنْهُمْ مَنْ يَنْجُو وَمِنْهُمْ مَنْ يَقَعُ فِيهَا فَالْكُفَّارُ يَقَعُونَ مِنْهُ فِى ابْتِدَاءِ وُرُودِهِمْ وَبَعْضُ عُصَاةِ الْمُسْلِمِينَ يَمْشُونَ عَلَيْهِ مَسَافَةً ثُمَّ يَقَعُونَ مِنْهُ. أَمَّا الصَّالِحُونَ فَيَرِدُونَ الصِّرَاطَ وُرُودَ مُرُورٍ فِى هَوَائِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(82) مَا هُوَ الْحَوْضُ الَّذِى يَشْرَبُ مِنْهُ أَهْلُ الْجَنَّةِ.</p><p class=\"answer\">الْحَوْضُ هُوَ مَكَانٌ أَعَدَّ اللَّهُ فِيهِ شَرَابًا لِأَهْلِ الْجَنَّةِ يَشْرَبُونَ مِنْهُ بَعْدَ عُبُورِ الصِّرَاطِ وَقَبْلَ دُخُولِ الْجَنَّةِ فَلا يُصِيبُهُمْ بَعْدَ ذَلِكَ ظَمَأٌ فَمِنْهُمْ مَنْ يَشْرَبُ تَلَذُّذًا وَهُمُ الأَتْقِيَاءُ وَمِنْهُمْ مَنْ يَشْرَبُ عَطَشًا وَهُمُ الْعُصَاةُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(83) مَا مَعْنَى الشَّفَاعَةِ.</p><p class=\"answer\">الشَّفَاعَةُ فِى الآخِرَةِ هِىَ طَلَبُ إِسْقَاطِ الْعِقَابِ عَنْ بَعْضِ الْعُصَاةِ مِنَ الْمُسْلِمِينَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(84) مَنْ هُمُ الشُّفَعَاءُ فِى الآخِرَةِ.</p><p class=\"answer\">الشُّفَعَاءُ فِى الآخِرَةِ هُمُ الأَنْبِيَاءُ وَالْمَلائِكَةُ وَالْعُلَمَاءُ الْعَامِلُونَ وَشُهَدَاءُ الْمَعْرَكَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(85) مَنِ الَّذِى يَحْتَاجُ لِلشَّفَاعَةِ.</p><p class=\"answer\">الَّذِينَ يَحْتَاجُونَ لِلشَّفَاعَةِ هُمْ أَهْلُ الْكَبَائِرِ مِنَ الْمُسْلِمِينَ أَمَّا الأَتْقِيَاءُ وَالَّذِينَ مَاتُوا تَائِبِينَ فَلا يَحْتَاجُونَ لِلشَّفَاعَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(86) مَا الدَّلِيلُ عَلَى أَنْ لا أَحَدَ يَشْفَعُ لِلْكُفَّارِ يَوْمَ الْقِيَامَةِ.</p><p class=\"answer\">الْكُفَّارُ لا شَفَاعَةَ لَهُمْ يَوْمَ الْقِيَامَةِ لِقَوْلِهِ تَعَالَى ﴿وَلا يَشْفَعُونَ إِلَّا لِمَنِ ارْتَضَى﴾ أَىْ إِلَّا لِمَنِ ارْتَضَى الإِسْلامَ دِينًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(87) هَلِ النَّبِىُّ يَشْفَعُ لِبَعْضِ الْعُصَاةِ مِنَ الْمُسْلِمِينَ بَعْدَ دُخُولِهِمُ النَّارَ.</p><p class=\"answer\">النَّبِىُّ ﷺ يَشْفَعُ لِبَعْضِ الْعُصَاةِ مِنَ الْمُسْلِمِينَ بَعْدَ دُخُولِهِمُ النَّارَ لِإِخْرَاجِهِمْ مِنْهَا قَبْلَ أَنْ تَمْضِىَ الْمُدَّةُ الَّتِى يَسْتَحِقُّونَ لِقَوْلِهِ ﷺ يَخْرُجُ نَاسٌ مِنَ النَّارِ بِشَفَاعَةِ مُحَمَّدٍ رَوَاهُ الْبُخَارِىُّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(88) هَلِ الْجَنَّةُ مَوْجُودَةٌ الآنَ وَأَيْنَ مَكَانُهَا.</p><p class=\"answer\">الْجَنَّةُ هِىَ دَارُ النَّعِيمِ الدَّائِمِ لِلْمُؤْمِنِينَ وَمَكَانُهَا فَوْقَ السَّمَاءِ السَّابِعَةِ وَهِىَ مَوْجُودَةٌ الآنَ لِقَوْلِهِ تَعَالَى ﴿أُعِدَّتْ لِلْمُتَّقِينَ﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(89) اذْكُرْ بَعْضَ مَا فِى الْجَنَّةِ مِنْ نَعِيمٍ.</p><p class=\"answer\">نَعِيمُ الْجَنَّةِ قِسْمَانِ نَعِيمٌ عَامٌّ لِكُلِّ أَهْلِ الْجَنَّةِ وَنَعِيمٌ خَاصٌّ لا يَنَالُهُ إِلَّا الأَتْقِيَاءُ أَمَّا النَّعِيمُ الْعَامُّ فَهُوَ أَنَّ أَهْلَ الْجَنَّةِ كُلَّهُمْ أَحْيَاءٌ لا يَمُوتُونَ أَبَدًا وَكُلَّهُمْ فِى صِحَّةٍ لا يَمْرَضُونَ أَبَدًا وَكُلَّهُمْ فِى شَبَابٍ لا يَهْرَمُونَ أَبَدًا وَكُلَّهُمْ فِى نَعِيمٍ لا يَبْأَسُونَ أَبَدًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(90) مَاذَا أَعَدَّ اللَّهُ لِعِبَادِهِ الصَّالِحِينَ فِى الْجَنَّةِ.</p><p class=\"answer\">أَعَدَّ اللَّهُ لِعِبَادِهِ الصَّالِحِينَ فِى الْجَنَّةِ نَعِيمًا خَاصَّا لَمْ يَرَهُ أَحَدٌ مِنَ الْخَلْقِ وَلا سَمِعَ بِهِ وَلا خَطَرَ عَلَى قَلْبِ إِنْسَانٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(91) لِمَاذَا أَهْلُ الْجَنَّةِ لا يَنَامُونَ.</p><p class=\"answer\">أَهْلُ الْجَنَّةِ لا يَنَامُونَ لِأَنَّ الْجَنَّةَ لا يُوجَدُ فِيهَا تَعَبٌ فِكْرِىٌّ وَلا تَعَبٌ جِسْمَانِىٌّ وَأَهْلُ الْجَنَّةِ يَعِيشُونَ فِى نَعِيمٍ وَفَرَحٍ لا انْقِطَاعَ لَهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(92) مَا الدَّلِيلُ عَلَى أَنَّ أَهْلَ الْجَنَّةِ يَأْكُلُونَ فِيهَا وَيَشْرَبُونَ وَلا يَبُولُونَ وَلا يَتَغَوَّطُونَ.</p><p class=\"answer\">الْجَنَّةُ هِىَ الدَّارُ الْمُطَهَّرَةُ مِنَ الأَقْذَارِ كَالْبَوْلِ وَالْغَائِطِ لِقَوْلِهِ ﷺ إِنَّ أَهْلَ الْجَنَّةِ يَأْكُلُونَ فِيهَا وَيَشْرَبُونَ وَلا يَتْفِلُونَ وَلا يَبُولُونَ وَلا يَتَغَوَّطُونَ وَلا يَتَمَخَّطُونَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(93) كَيْفَ هِىَ صِفَةُ الْجَنَّةِ.</p><p class=\"answer\">الْجَنَّةُ كَبِيرَةٌ وَجَمِيلَةٌ جِدًّا وَفِيهَا أَشْجَارٌ كَثِيرَةٌ وَطُيُورٌ أَصْوَاتُهَا جَمِيلَةٌ وَقُصُورٌ عَالِيَةٌ وَأَنْهَارٌ جَارِيَةٌ وَفَاكِهَةٌ نَضِيجَةٌ وَنِسَاءٌ حِسَانٌ جَمِيلاتٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(94) كَيْفَ هِىَ صُورَةُ أَهْلِ الْجَنَّةِ.</p><p class=\"answer\">أَهْلُ الْجَنَّةِ عَلَى صُورَةِ أَبِيهِمْ ءَادَمَ سِتُّونَ ذِرَاعًا طُولًا فِى سَبْعَةِ أَذْرُعٍ عَرْضًا ولا يُوجَدُ شَعَرٌ عَلَى أَجْسَادِهِمْ إِلَّا شَعَرُ الرَّأْسِ وَالأَجْفَانِ وَالْحَاجِبَيْنِ كَأَنَّهُمْ فِى عُمْرِ ثَلاثَةٍ وَثَلاثِينَ عَامًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(95) مَنْ هُمُ الْوِلْدَانُ الْمُخَلَّدُونَ.</p><p class=\"answer\">الْوِلْدَانُ الْمُخَلَّدُونَ هُمْ خَلْقٌ مِنْ خَلْقِ اللَّهِ لَيْسُوا بَشَرًا وَلا جِنًّا وَلا مَلائِكَةً أَشْكَالُهُمْ بِصُوَرِ الْغِلْمَانِ مِنْ بَنِى ءَادَمَ، خَلَقَهُمْ اللَّهُ لِخِدْمَةِ أَهْلِ الْجَنَّةِ كَأَنَّهُمْ مِنَ الْحُسْنِ وَالْبَيَاضِ لُؤْلُؤٌ لَمْ تَمَسَّهُ الأَيْدِى.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(96) مَنْ هُنَّ الْحُورُ الْعِين.</p><p class=\"answer\">الْحُورُ الْعِينُ نِسَاءُ أَهْلِ الْجَنَّةِ مِنْ غَيْرِ الإِنْسِ خُلِقْنَ خَلْقًا مِنْ غَيْرِ تَوَالُدٍ إِكْرَامًا لِلْمُؤْمِنِينَ وَهُنَّ جَمِيلاتٌ وَوَاسِعَاتُ الْعُيُونِ قَالَ اللَّهُ تَعَالَى فِى وَصْفِهِنَّ ﴿كَأَنَّهُنَّ الْيَاقُوتُ وَالْمَرْجَانُ﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(97) هَلِ الْمُؤْمِنُونَ يَرَوْنَ اللَّهَ فِى الآخِرَةِ.</p><p class=\"answer\">يَجِبُ الإِيمَانُ بِأَنَّ اللَّهَ يُرَى فِى الآخِرَةِ يَرَاهُ الْمُؤْمِنُونَ وَهُمْ فِى الْجَنَّةِ بِلا كَيْفٍ فَلا يَرَوْنَهُ حَجْمًا كَثِيفًا كَالإِنْسَانِ وَلا حَجْمًا لَطِيفًا كَالنُّورِ وَلا يَرَوْنَهُ فِى مَكَانٍ وَلا فِى جِهَةٍ وَلا يَكُونُ بَيْنَهُ وَبَيْنَ خَلْقِهِ مَسَافَةٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(98) مَنْ هُمُ الْمَلائِكَةُ وَمِمَّ خُلِقُوا.</p><p class=\"answer\">الْمَلائِكَةُ أَجْسَامٌ لَطِيفَةٌ لا تُجَسُّ بِالْيَدِ خَلَقَهُمُ اللَّهُ مِنْ نُورٍ لَهُمْ أَرْوَاحٌ وَعُقُولٌ وَإِرَادَةٌ. وَكُلُّ مَلَكٍ لَهُ جَنَاحَانِ أَوْ أَرْبَعٌ أَوْ سِتٌّ أَوْ أَكْثَرُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(99) اذْكُرْ بَعْضَ صِفَاتِ الْمَلائِكَةِ.</p><p class=\"answer\">الْمَلائِكَةُ لَيْسُوا ذُكُورًا وَلا إِنَاثًا لا يَأْكُلُونَ وَلا يَشْرَبُونَ وَلا يَبُولُونَ وَلا يَتَغَوَّطُونَ وَلا يَنَامُونَ وَلا يَتْعَبُونَ وَلا يَتَنَاكَحُونَ وَلا يَتَوَالَدُونَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(100) هَلْ يَتَشَكَّلُ الْمَلَكُ بِصُورَةِ رَجُلٍ مِنْ بَنِى ءَادَمَ.</p><p class=\"answer\">اعْلَمْ أَنَّ اللَّهَ تَعَالَى أَعْطَى الْمَلائِكَةَ الْقُدْرَةَ عَلَى التَّشَكُّلِ بِصُوَرِ الرِّجَالِ مِنْ بَنِى ءَادَمَ مِنْ غَيْرِ ءَالَةِ الذُّكُورَةِ لَكِنَّهُمْ لا يَتَشَكَّلُونَ بِأَشْكَالِ الإِنَاثِ وَلا بِالأَشْكَالِ الْقَبِيحَةِ كَالْقِرَدَةِ وَالْكِلابِ وَالْخَنَازِيرِ وَالْحَيَّاتِ وَالْعَقَارِبِ وَالْفِئْرَانِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(101) مَنْ هُمْ أَفْضَلُ الْمَلائِكَةِ.</p><p class=\"answer\">أَفْضَلُ الْمَلائِكَةِ هُمْ جِبْرِيلُ وَمِيكَائِيلُ وَإِسْرَافِيلُ وَعَزْرَائِيلُ وَرِضْوَانُ خَازِنُ الْجَنَّةِ وَمَالِكٌ خَازِنُ النَّارِ وَحَمَلَةُ الْعَرْشِ وَأَفْضَلُهُمْ هُوَ جِبْرِيلُ عَلَيْهِ السَّلامُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(102) مَنْ هُوَ جِبْرِيلُ عَلَيْهِ السَّلامُ.</p><p class=\"answer\">جِبْرِيلُ عَلَيْهِ السَّلامُ هُوَ الْمَلَكُ الَّذِى يَنْزِلُ بِالْوَحْىِ عَلَى أَنْبِيَاءِ اللَّهِ عَلَيْهِمُ السَّلامُ وَيَتَوَلَّى وَزْنَ أَعْمَالِ الْعِبَادِ يَوْمَ الْقِيَامَةِ وَهُوَ الْمَلَكُ الْمُوَكَّلُ بِالْعَذَابِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(103) مَنْ هُمُ الْجِنُّ.</p><p class=\"answer\">الْجِنُّ أَجْسَامٌ لَطِيفَةٌ لا يَرَاهُمْ أَحَدٌ مِنَ الْبَشَرِ عَلَى هَيْئَتِهِمُ الأَصْلِيَّةِ لَكِنْ يَجِبُ الإِيمَانُ بِوُجُودِهِمْ. وَهُمْ يَأْكُلُونَ وَيَشْرَبُونَ وَيَتَنَاكَحُونَ وَيَتَوَالَدُونَ وَلا يَنَامُونَ. وَأَبُو الْجِنِّ هُوَ إِبْلِيسُ خُلِقَ قَبْلَ ءَادَمَ خَلَقَهُ اللَّهُ مِنْ لَهِيبِ النَّارِ الصَّافِى. وَالْجِنُّ الْكَافِرُ هُوَ الشَّيْطَانُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(104) مَنْ هُمْ أَفْضَلُ خَلْقِ اللَّهِ.</p><p class=\"answer\">أَفْضَلُ خَلْقِ اللَّهِ هُمُ الأَنْبِيَاءُ عَلَيْهِمُ السَّلامُ وَأَفْضَلُهُمْ سَيِّدُنَا مُحَمَّدٌ ﷺ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(105) مَا الْفَرْقُ بَيْنَ النَّبِىِّ الرَّسُولِ وَالنَّبِىِّ غَيْرِ الرَّسُولِ.</p><p class=\"answer\">النَّبِىُّ الرَّسُولُ هُوَ مَنْ أُوحِىَ إِلَيْهِ بِشَرْعٍ جَدِيدٍ وَأُمِرَ بِتَبْلِيغِهِ أَمَّا النَّبِىُّ غَيْرُ الرَّسُولِ فَهُوَ مَنْ أُوحِىَ إِلَيْهِ بِاتِّبَاعِ شَرْعِ الرَّسُولِ الَّذِى قَبْلَهُ وَأُمِرَ بِتَبْلِيغِهِ فَكُلٌّ مِنَ النَّبِىِّ وَالرَّسُولِ مَأْمُورٌ بِالتَّبْلِيغِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(106) كَمْ هُوَ عَدَدُ الأَنْبِيَاءِ عَلَيْهِمُ السَّلامُ.</p><p class=\"answer\">رَوَى ابْنُ حِبَّانَ فِى صَحِيحِهِ عَنْ أَبِى ذَرٍّ أَنَّهُ قَالَ قُلْتُ يَا رَسُولَ اللَّهِ كَمِ الأَنْبِيَاءُ قَالَ مِائَةُ أَلْفٍ وَأَرْبَعَةٌ وَعِشْرُونَ أَلْفًا قُلْتُ يَا رَسُولَ اللَّهِ كَمِ الرُّسُلُ مِنْ ذَلِكَ قَالَ ثَلاثُمِائَةٍ وَثَلاثَةَ عَشَرَ جَمًّا غَفِيرًا قَالَ قُلْتُ يَا رَسُولَ اللَّهِ مَنْ كَانَ أَوَّلُهُمْ قَالَ ءَادَمُ قُلْتُ يَا رَسُولَ اللَّهِ أَنَبِىٌّ مُرْسَلٌ قَالَ نَعَمْ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(107) مَنْ هُمُ الأَنْبِيَاءُ الَّذِينَ ذَكَرَهُمُ اللَّهُ فِى الْقُرْءَانِ.</p><p class=\"answer\">الأَنْبِيَاءُ الَّذِينَ ذَكَرَهُمُ اللَّهُ فِى الْقُرْءَانِ هُمْ ءَادَمُ وَإِدْرِيسُ وَنُوحٌ وَهُودٌ وَصَالِحٌ وَشُعَيْبٌ وَإِبْرَاهِيمُ وَلُوطٌ وَإِسْمَاعِيلُ وَإِسْحَاقُ وَيَعْقُوبُ وَيُوسُفُ وَمُوسَى وَهَارُونُ وَيُونُسُ وَأَيَّوبُ وَذُو الْكِفْلِ وَإِلْيَاسُ وَالْيَسَعُ وَدَاوُدُ وَسُلَيْمَانُ وَزَكَرِيَّا وَيَحْيَى وَعِيسَى وَمُحَمَّدٌ عَلَيْهِمُ الصَّلاةُ السَّلامُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(108) مَا الدَّلِيلُ مِنَ الْقُرْءَانِ عَلَى أَنَّ الأَنْبِيَاءَ كُلَّهُمْ كَانُوا عَلَى الإِسْلامِ.</p><p class=\"answer\">قَالَ اللَّهُ تَعَالَى ﴿إِنَّ الدِّينَ عِنْدَ اللَّهِ الإِسْلامُ﴾ أَىْ أَنَّ الدِّينَ الصَّحِيحَ الْمَقْبُولَ عِنْدَ اللَّهِ هُوَ الإِسْلامُ وَقَالَ تَعَالَى ﴿وَمَنْ يَبْتَغِ غَيْرَ الإِسْلامِ دِينًا فَلَنْ يُقْبَلَ مِنْهُ وَهُوَ فِى الآخِرَةِ مِنَ الْخَاسِرِينَ﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(109) مَا الدَّلِيلُ مِنَ الْحَدِيثِ عَلَى أَنَّ الأَنْبِيَاءَ كُلَّهُمْ كَانُوا عَلَى الإِسْلامِ.</p><p class=\"answer\">قَالَ رَسُولُ اللَّهِ ﷺ الأَنْبِيَاءُ إِخْوَةٌ لِعَلَّاتٍ دِينُهُمْ وَاحِدٌ وَأُمَّهَاتُهُمْ شَتَّى رَوَاهُ الإِمَامُ أَحْمَدُ. شَبَّهَ الرَّسُولُ الأَنْبِيَاءَ بِالإِخْوَةِ لِعَلَّاتٍ أَىْ كَمَا أَنَّ الإِخْوَةَ لِعَلَّاتٍ أَبُوهُمْ وَاحِدٌ وَأُمَّهَاتُهُمْ مُخْتَلِفَاتٌ كَذَلِكَ الأَنْبِيَاءُ إِخْوَةٌ فِى الدِّينِ دِينُهُمْ وَاحِدٌ أَىْ عَقِيدَتُهُمْ وَاحِدَةٌ وَشَرَائِعُهُمْ مُخْتَلِفَةٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(110) اذْكُرْ بَعْضَ صِفَاتِ الأَنْبِيَاءِ.</p><p class=\"answer\">يَجِبُ لِلأَنْبِيَاءِ الصِّدْقُ وَالأَمَانَةُ وَالْعِفَّةُ وَالشَّجَاعَةُ وَالْفَصَاحَةُ وَالْفَطَانَةُ فَلا يَكْذِبُونَ وَلا يَغُشُّونَ وَلا يَأْكُلُونَ أَمْوَالَ النَّاسِ بِالْبَاطِلِ وَلَيْسَ فِيهِمْ مَنْ هُوَ رَذِيلٌ يَنْظُرُ إِلَى النِّسَاءِ الأَجْنَبِيَّاتِ بِشَهْوَةٍ وَلَيْسَ فِيهِمْ مَنْ يَقُولُ أَلْفَاظًا شَنِيعَةً تَسْتَقْبِحُهَا النَّفْسُ وَلَيْسَ فِيهِمْ مَنْ هُوَ جَبَانٌ ضَعِيفُ الْقَلْبِ أَوْ ضَعِيفُ الْفَهْمِ أَوْ مَنْ لا يُحْسِنُ النُّطْقَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(111) اذْكُرْ بَعْضَ مَا لا يَجُوزُ عَلَى أَنْبِيَاءِ اللَّهِ مِنَ الصِّفَاتِ.</p><p class=\"answer\">يَسْتَحِيلُ عَلَى الأَنْبِيَاءِ الْكُفْرُ وَالْكَبَائِرُ وَصَغَائِرُ الْخِسَّةِ أَىِ الذُّنُوبُ الصَّغِيرَةُ الَّتِى فِيهَا خِسَّةٌ وَدَنَاءَةٌ وَيَسْتَحِيلُ عَلَيْهِمُ الْكَذِبُ وَالْخِيَانَةُ وَالرَّذَالَةُ وَالسَّفَاهَةُ وَالْجُبْنُ وَالْبَلادَةُ قَبْلَ النُّبُوَّةِ وَبَعْدَهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(112) مَا مَعْنَى الْخِيَانَةِ وَالرَّذَالَةِ وَالسَّفَاهَةِ وَالْجُبْنِ.</p><p class=\"answer\">الْخِيَانَةُ ضِدُّ النَّصِيحَةِ وَقَدْ تَكُونُ بِالْفِعْلِ كَأَكْلِ الأَمَانَةِ أَوْ بِالْقَوْلِ كَجَحْدِ الأَمَانَةِ أَوْ بِالْحَالِ كَمَنْ يُوهِمُ النَّاسَ أَنَّهُ مِنْ أَهْلِ الأَمَانَةِ وَهُوَ لَيْسَ كَذَلِكَ. وَالرَّذَالَةُ هِىَ صِفَاتُ الأَسَافِلِ الدُّونِ مِنَ النَّاسِ كَاخْتِلاسِ النَّظَرِ إِلَى الْمَرْأَةِ الأَجْنَبِيَّةِ بِشَهْوَةٍ. أَمَّا السَّفَاهَةُ فَهِىَ التَّصَرُّفُ بِخِلافِ الْحِكْمَةِ أَوِ التَّلَفُّظُ بِأَلْفَاظٍ شَنِيعَةٍ تَسْتَقْبِحُهَا النَّفْسُ. وَأَمَّا الْجُبْنُ فَهُوَ ضَعْفُ الْقَلْبِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(113) مَا الدَّلِيلُ عَلَى جَوَازِ حُصُولِ الْمَعْصِيَةِ الصَّغِيرَةِ الَّتِى لَيْسَ فِيهَا خِسَّةٌ وَلا دَنَاءَةٌ مِنَ الأَنْبِيَاءِ.</p><p class=\"answer\">مِمَّا يَدُلُّ عَلَى ذَلِكَ قَوْلُهُ تَعَالَى ﴿وَعَصَى ءَادَمُ رَبَّهُ فَغَوَى﴾ أَىْ أَخْطَأَ بِأَكْلِهِ مِنَ الشَّجَرَةِ الَّتِى نَهَاهُ اللَّهُ عَنِ الأَكْلِ مِنْهَا لَمَّا كَانَ فِى الْجَنَّةِ قَبْلَ أَنْ يُوحَى إِلَيْهِ بِالنُّبُوَّةِ فَوَقَعَ فِى مَعْصِيَةِ صَغِيرَةٍ لَيْسَ فِيهَا خِسَّةٌ َوَلا دَنَاءَةٌ ثُمَّ تَابَ مِنْهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(114) اذْكُرْ بَعْضَ مَا يَسْتَحِيلُ عَلَى الأَنْبِيَاءِ.</p><p class=\"answer\">يَسْتَحِيلُ عَلَى الأَنْبِيَاءِ الْجُنُونُ وَالْخَرَفُ وَتَأْثِيرُ السِّحْرِ فِى عُقُولِهِمْ وَتَصَرُّفَاتِهِمْ ولا تَحْصُلُ فِى أَبْدَانِهِمْ وَلا فِى أَفْوَاهِهِمْ وَلا فِى ثِيَابِهِمُ الرَّوَائِحُ الْكَرِيهَةُ وَلَمْ يَكُنْ فِيهِمْ ذُو عَاهَةٍ فِى خِلْقَتِهِ فَلَمْ يَكُنْ فِيهِمْ أَعْرَجُ وَلا أَعْمَى خِلْقَةً وَلا يُصِيبُونَ أَحَدًا بِأَعْيُنِهِمْ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(115) كَيْفَ يُرَدُّ عَلَى مَنْ يَقُولُ إِنَّ أَيُّوبَ عَلَيْهِ السَّلامُ كَانَ يَخْرُجُ مِنْ جِسْمِهِ الدُّودُ.</p><p class=\"answer\">يَجِبُ اعْتِقَادُ أَنَّ الأَنْبِيَاءَ يَسْتَحِيلُ عَلَيْهِمْ كُلُّ مَا يُنَفِّرُ النَّاسَ عَنْ قَبُولِ الدَّعْوَةِ مِنْهُمْ كَالأَمْرَاضِ الْمُنَفِّرَةِ وَمِنْهَا الْجَرَبُ وَالْجُذَامُ وَالْبَرَصُ وَخُرُوجُ الدُّودِ مِنَ الْجِسْمِ فَاللَّهُ تَعَالَى جَعَلَ الأَنْبِيَاءَ قُدْوَةً لِلنَّاسِ وَأَرْسَلَهُمْ لِلدَّعْوَةِ إِلَى دِينِ الإِسْلامِ فَلا يَجُوزُ عَلَيْهِمُ الْمَرَضُ الَّذِى يُنَفِّرُ النَّاسَ مِنْهُمْ فَلَوْ كَانَتْ تُصِيبُهُمُ الأَمْرَاضُ الْمُنَفِّرَةُ لَنَفَرَ النَّاسُ مِنْهُمْ وَاللَّهُ حَكِيمٌ لا يُسَلِّطُ عَلَيْهِمْ هَذِهِ الأَمْرَاضَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(116) مَا هُوَ أَوَّلُ الْمَخْلُوقَاتِ.</p><p class=\"answer\">أَوَّلُ مَا خَلَقَ اللَّهُ هُوَ الْمَاءُ الَّذِى تَحْتَ الْعَرْشِ ثُمَّ بَعْدَ الْمَاءِ خَلَقَ الْعَرْشَ وَالْقَلَمَ الأَعْلَى وَاللَّوْحَ الْمَحْفُوظَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(117) مَنْ هُوَ أَوَّلُ الْبَشَرِ وَمِمَّ خُلِقَ.</p><p class=\"answer\">أَوَّلُ الْبَشَرِ هُوَ ءَادَمُ عَلَيْهِ السَّلامُ خَلَقَهُ اللَّهُ فِى الْجَنَّةِ مِنْ تُرَابِ الأَرْضِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(118) مَنْ هُوَ الْمَلَكُ الَّذِى أَخَذَ مِنْ تُرَابِ الأَرْضِ وَصَعِدَ بِهِ إِلَى الْجَنَّةِ وَعَجَنَهُ بِمَاءِ الْجَنَّةِ.</p><p class=\"answer\">الْمَلَكُ الَّذِى أَخَذَ مِنْ تُرَابِ الأَرْضِ وَصَعِدَ بِهِ إِلَى الْجَنَّةِ هُوَ سَيِّدُنَا عَزْرَائِيلُ عَلَيْهِ السَّلامُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(119) كَيْفَ كانَ سَيِّدُنَا ءَادَمُ عَلَيْهِ السَّلامُ.</p><p class=\"answer\">كانَ سَيِّدُنَا ءَادَمُ عَلَيْهِ السَّلامُ جَمِيلَ الشَّكْلِ حَسَنَ الصَّوْتِ مُنْتَصِبَ الْقَامَةِ وَلَمْ يَكُنْ قِرْدًا وَلا شَبِيهًا بِالْقِرْدِ. وَكَانَ طُولُهُ سِتِّينَ ذِرَاعًا بِذِرَاعِ الْيَدِ وَعَرْضُهُ سَبْعَةَ أَذْرُعٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(120) مَا الدَّلِيلُ عَلَى أَنَّ ءَادَمَ عَلَيْهِ السَّلامُ كَانَ جَمِيلَ الشَّكْلِ.</p><p class=\"answer\">قَالَ رَسُولُ اللَّهِ ﷺ مَا بَعَثَ اللَّهُ نَبِيًّا إِلَّا حَسَنَ الْوَجْهِ حَسَنَ الصَّوْتِ وَإِنَّ نَبِيَّكُمْ (يَعْنِى نَفْسَهُ) أَحْسَنُهُمْ وَجْهًا وَأَحْسَنُهُمْ صَوْتًا رَوَاهُ الإِمَامُ أَحْمَدُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(121) كَمْ سَنَةً عَاشَ سَيِّدُنَا ءَادَمُ فِى الْجَنَّةِ.</p><p class=\"answer\">عَاشَ سَيِّدُنَا ءَادَمُ عَلَيْهِ السَّلامُ فِى الْجَنَّةِ مِائَةً وَثَلاثِينَ سَنَةً يَتَنَعَّمُ فِيهَا مِنْ غَيْرِ أَنْ يَمْرَضَ أَوْ يَتْعَبَ أَوْ يَحْزَنَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(122) لِمَاذَا جَاءَتْ أَحْوَالُ ذُرِّيَّةِ ءَادَمَ مُخْتَلِفَةً.</p><p class=\"answer\">جَاءَتْ أَحْوَالُ ذُرِّيَّةِ ءَادَمَ مُخْتَلِفَةً بِسَبَبِ اخْتِلافِ التُّرَابِ الَّذِى خُلِقَ مِنْهُ ءَادَمُ عَلَيْهِ السَّلامُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(123) عَلَى أَىِّ دِينٍ كَانَ ءَادَمُ عَلَيْهِ السَّلامُ.</p><p class=\"answer\">كَانَ ءَادَمُ عَلَيْهِ السَّلامُ عَلَى دِينِ الإِسْلامِ كَسَائِرِ الأَنْبِيَاءِ وَهُوَ أَوَّلُ الأَنْبِيَاءِ وَالْمُرْسَلِينَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(124) مَاذَا عَلَّمَ سَيِّدُنَا ءَادَمُ ذُرِّيَّتَهُ.</p><p class=\"answer\">عَلَّمَ سَيِّدُنَا ءَادَمُ ذُرِّيَّتَهُ تَوْحِيدَ اللَّهِ وَعَدَمَ الإِشْرَاكِ بِهِ شَيْئًا وَعَلَّمَهُمُ الْوُضُوءَ وَالصَّلاةَ وَغَيْرَ ذَلِكَ مِنْ أُمُورِ الدِّينِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(125) كَيْفَ كَانَ سَيِّدُنَا ءَادَمُ عَلَيْهِ السَّلامُ يَتَكَلَّمُ وَهَلْ كَانَ يَعْرِفُ أَسْمَاءَ الأَشْيَاءِ.</p><p class=\"answer\">كَانَ سَيِّدُنَا ءَادَمُ عَلَيْهِ السَّلامُ يَتَكَلَّمُ بِكَلامٍ وَاضِحٍ مَفْهُومٍ وَلَيْسَ بِالإِشَارَةِ. عَلَّمَهُ اللَّهُ اللُّغَاتِ كُلَّهَا مِنْ دُونِ دِرَاسَةٍ وَكَانَ يَعْرِفُ أَسْمَاءَ الأَشْيَاءِ كَاسْمِ السَّمَاءِ وَالأَرْضِ وَالْبَحْرِ وَالْهَوَاءِ بِدَلِيلِ قَوْلِهِ تَعَالَى ﴿وَعَلَّمَ ءادَمَ الأَسْمَاءَ كُلَّهَا﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(126) مَاذَا عَلَّمَ اللَّهُ ءَادَمَ مِمَّا يَنْفَعُهُ فِى أَمْرِ مَعِيشَتِهِ.</p><p class=\"answer\">عَلَّمَهُ اللَّهُ الزَّرْعَ وَالْبِنَاءَ وَصِنَاعَةَ الثَّوْبِ وَصُنْعَ الْعُمْلَةِ الذَّهَبِيَّةِ وَالْفِضِّيَّةِ. فَكَانَ ءَادَمُ عَلَيْهِ السَّلامُ يَبْنِى الْبُيُوتَ وَيَصْنَعُ لَهَا الأَبْوَابَ وَالسُّطُوحَ وَهُوَ أَوَّلُ مَنْ بَنَى الْكَعْبَةَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(127) كَيْفَ كَانَ يَمْشِى سَيِّدُنَا ءَادَمُ عَلَيْهِ السَّلامُ بَيْنَ النَّاسِ.</p><p class=\"answer\">كَانَ ءَادَمُ عَلَيْهِ السَّلامُ يَلْبَسُ الثِّيَابَ وَلَمْ يَكُنْ يَمْشِى عَارِيًا بَيْنَ النَّاسِ فِى الأَرْضِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(128) مَنْ هُوَ ءَاخِرُ أَنْبِيَاءِ بَنِى إِسْرَائِيلَ.</p><p class=\"answer\">ءَاخِرُ أَنْبِيَاءِ بَنِى إِسْرَائِيلَ هُوَ سَيِّدُنَا عِيسَى عَلَيْهِ السَّلامُ خَلَقَهُ اللَّهُ تَعَالَى فِى رَحِمِ أُمِّهِ مَرْيَمَ بِنْتِ عِمْرَانَ مِنْ غَيْرِ أَبٍ لِيَكُونَ دَلِيلًا عَلَى كَمَالِ قُدْرَتِهِ كَمَا خَلَقَ اللَّهُ تَعَالَى ءَادَمَ مِنْ غَيْرِ أَبٍ وَأُمِّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(129) مَا هُوَ الدِّينُ الَّذِى دَعَا إِلَيْهِ سَيِّدُنَا عِيسَى عَلَيْهِ السَّلامُ وَعَلَّمَهُ لِأَتْبَاعِهِ.</p><p class=\"answer\">سَيِّدُنَا عِيسَى عَلَيْهِ السَّلامُ نَبِىٌّ مُسْلِمٌ كَغَيْرِهِ مِنَ الأَنْبِيَاءِ دَعَا النَّاسَ إِلَى الإِسْلامِ وَعَلَمَّ النَّاسَ شَرِيعَةَ الإِسْلامِ وَأَتْبَاعُهُ كَانُوا عَلَى الإِسْلامِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(130) مَا الدَّلِيلُ عَلَى أَنَّ سَيِّدَنَا عِيسَى عَلَيْهِ السَّلامُ كَانَ عَلَى الإِسْلامِ.</p><p class=\"answer\">قَالَ اللَّهُ تَعَالَى ﴿فَلَمَّا أَحَسَّ عِيسَى مِنْهُمُ الْكُفْرَ قَالَ مَنْ أَنْصَارِى إِلَى اللَّهِ قَالَ الْحَوَارِيُّونَ نَحْنُ أَنْصَارُ اللَّهِ ءَامَنَّا بِاللَّهِ وَاشْهَدْ بِأَنَّا مُسْلِمُونَ﴾. وَالْحَوَارِيُّونَ هُمْ تَلامِيذُ عِيسَى عَلَيْهِ السَّلامُ فَقَدْ كَانُوا عَلَى الإِسْلامِ بِدَلِيلِ قَوْلِهِمْ ﴿وَاشْهَدْ بِأَنَّا مُسْلِمُونَ﴾ وَهَذَا دَلِيلٌ عَلَى أَنَّ عِيسَى عَلَيْهِ السَّلامُ كَانَ عَلَى الإِسْلامِ لِأَنَّهُ هُوَ الَّذِى عَلَّمَهُمْ هَذَا الدِّينَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(131) لِمَاذَا سُمِّىَ عِيسَى عَلَيْهِ السَّلامُ بِالْمَسِيحِ.</p><p class=\"answer\">سُمِّىَ عِيسَى عَلَيْهِ السَّلامُ بِالْمَسِيحِ لِكَثْرَةِ سِيَاحَتِهِ أَىْ تَنَقُّلِهِ فِى الأَرْضِ لِيُعَلِّمَ النَّاسَ دِينَ اللَّهِ وَيَدْعُوَهُمْ إِلَى عِبَادَةِ اللَّهِ وَحْدَهُ وَقِيلَ سُمِّىَ بِذَلِكَ لِأَنَّهُ كَانَ يَمْسَحُ بِيَدِهِ الشَّرِيفَةِ عَلَى الأَبْرَصِ وَالأَكْمَهِ أَىِ الَّذِى يُولَدُ أَعْمَى فَيُشْفَى بِإِذْنِ اللَّهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(132) أَيْنَ يَعِيشُ سَيِّدُنَا عِيسَى عَلَيْهِ السَّلامُ.</p><p class=\"answer\">سَيِّدُنَا عِيسَى عَلَيْهِ السَّلامُ لَمْ يُقْتَلْ وَلَمْ يُصْلَبْ إِنَّمَا رُفِعَ إِلَى السَّمَاءِ قَالَ تَعَالَى ﴿وَمَا قَتَلُوهُ وَمَا صَلَبُوهُ وَلَكِنْ شُبِّهَ لَهُمْ﴾. وَبَعْدَ أَنْ يَنْزِلَ سَيِّدُنَا عِيسَى عَلَيْهِ السَّلامُ إِلَى الأَرْضِ يَمْكُثُ فِيهَا أَرْبَعِينَ سَنَةً يَدْعُو إِلَى الإِسْلامِ وَيَحْكُمُ بِشَرِيعَةِ مُحَمَّدٍ عَلَيْهِ الصَّلاةُ وَالسَّلامُ ثُمَّ يُتَوَفَّى وَيُدْفَنُ فِى الْحُجْرَةِ الشَّرِيفَةِ بِجِوَارِ سَيِّدِنَا مُحَمَّدٍ ﷺ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(133) مَا الدَّلِيلُ عَلَى أَنَّ مُوسَى عَلَيْهِ السَّلامُ كَانَ عَلَى دِينِ الإِسْلامِ.</p><p class=\"answer\">يَجِبُ اعْتِقَادُ أَنَّ سَيِّدَنَا مُوسَى عَلَيْهِ السَّلامُ كَانَ عَلَى الإِسْلامِ كَغَيْرِهِ مِنَ الأَنْبِيَاءِ عَلَيْهِمُ السَّلامُ وَلَمْ يَكُنْ يَهُودِيًّا بِدَلِيلِ أَنَّ السَّحَرَةَ لَمَّا ءَامَنُوا بِمُوسَى وَأَسْلَمُوا دَعَوُا اللَّهَ أَنْ يُثَبِّتَهُمْ عَلَى الإِيمَانِ وَالإِسْلامِ فَقَالُوا ﴿رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَتَوَفَّنَا مُسْلِمِينَ﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(134) كَمْ كِتَابًا أَنْزَلَ اللَّهُ عَلَى أَنْبِيَائِهِ.</p><p class=\"answer\">أَنْزَلَ اللَّهُ تَعَالَى عَلَى أَنْبِيَائِهِ مِائَةً وَأَرْبَعَةَ كُتُبٍ أَشْهَرُهَا الْقُرْءَانُ وَالإِنْجِيلُ أَىِ الأَصْلِىُّ وَالتَّوْرَاةُ أَىِ الأَصْلِيَّةُ وَالزَّبُورُ وَهِىَ كُلُّهَا تَأْمُرُ بِاتِّبَاعِ دِينِ الإِسْلامِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(135) عَلَى مَنْ أُنْزِلَ الْقُرْءَانُ وَالإِنْجِيلُ وَالتَّوْرَاةُ وَالزَّبُورُ.</p><p class=\"answer\">أُنْزِلَ الْقُرْءَانُ عَلَى سَيِّدِنَا مُحَمَّدٍ ﷺ وَأُنْزِلَ الإِنْجِيلُ عَلَى سَيِّدِنَا عِيسَى عَلَيْهِ السَّلامُ وَأُنْزِلَ التَّوْرَاةُ عَلَى سَيِّدِنَا مُوسَى عَلَيْهِ السَّلامُ وَأُنْزِلَ الزَّبُورُ عَلَى سَيِّدِنَا دَاوُدَ عَلَيْهِ السَّلامُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(136) بِأَىِّ لُغَةٍ أُنْزِلَ الْقُرْءَانُ وَالإِنْجِيلُ وَالتَّوْرَاةُ وَالزَّبُورُ.</p><p class=\"answer\">أُنْزِلَ الْقُرْءَانُ بِاللُّغَةِ الْعَرَبِيَّةِ وَأُنْزِلَ الإِنْجِيلُ بِالسُّرْيَانِيَّةِ وَأُنْزِلَ التَّوْرَاةُ وَالزَّبُورُ بِالْعِبْرَانِيَّةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(137) مَا مَعْنَى الْقَدَرِ وَمَا الدَّلِيلُ عَلَى أَنَّ اللَّهَ خَلَقَ كُلَّ شَىْءٍ بِقَدَرٍ.</p><p class=\"answer\">الْقَدَرُ الَّذِى هُوَ صِفَةُ اللَّهِ هُوَ إِيجَادُ اللَّهِ الأَشْيَاءَ عَلَى حَسَبِ عِلْمِهِ وَمَشِيئَتِهِ الأَزَلِيَّيْنِ. فَيَجِبُ اعْتِقَادُ أَنَّ كُلَّ مَا دَخَلَ فِى الْوُجُودِ مِنْ خَيْرٍ وَشَرٍّ فَهُوَ بِتَقْدِيرِ اللَّهِ الأَزَلِىِّ قَالَ اللَّهُ تَعَالَى ﴿إِنَّا كُلَّ شَىْءٍ خَلَقْنَاهُ بقَدَرٍ﴾ وَقَالَ رَسُولُ اللَّهِ ﷺ كُلُّ شَىْءٍ بِقَدَرٍ رَوَاهُ مُسْلِمٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(138) اذْكُرْ دَلِيلًا مِنْ أَقْوَالِ الْعُلَمَاءِ عَلَى أَنَّ الطَّاعَاتِ وَالْمَعَاصِىَ تَحْصُلُ بِقَضَاءِ اللَّهِ وَقَدَرِهِ.</p><p class=\"answer\">قَالَ الإِمَامُ أَبُو حَنِيفَةَ فِى الْفِقْهِ الأَكْبَرِ وَالطَّاعَاتُ كُلُّهَا مَا كَانَتْ وَاجِبَةً فَهِىَ بِأَمْرِ اللَّهِ تَعَالَى وَمَحَبَّتِهِ وَبِرِضَائِهِ وَعِلْمِهِ وَمَشِيئَتِهِ وَقَضَائِهِ وَتَقْدِيرِهِ وَالْمَعَاصِى كُلُّهَا بِعِلْمِهِ وَقَضَائِهِ وَتَقْدِيرِهِ وَمَشِيئَتِهِ لا بِمَحَبَّتِهِ وَلا بِرِضَائِهِ وَلا بِأَمْرِهِ.</p></div>", "wordCount": 4860, "paraCount": 276}, {"id": "riddah", "title": "باب الردة", "icon": "fa-exclamation-triangle", "desc": "أحكام الردة والكفر وما ينقض الإيمان", "content": "<p>بَابُ الرِّدَّةِ</p>\n<div class=\"qa-item\"><p class=\"question\">(139) بَيِّنْ أَقْسَامَ الرِّدَّةِ.</p><p class=\"answer\">الرِّدَّةُ هِىَ قَطْعُ الإِسْلامِ وَهِىَ ثَلاثَةُ أَقْسَامٍ اعْتِقَادَاتٌ وَأَفْعَالٌ وَأَقْوَالٌ أَىْ أَنَّ الْكُفْرَ ثَلاثَةُ أَنْوَاعٍ كُفْرٌ اعْتِقَادِىٌّ وَكُفْرٌ فِعْلِىٌّ وَكُفْرٌ لَفْظِىٌّ وَكُلٌّ مِنَ الأَنْوَاعِ الثَّلاثَةِ مُخْرِجٌ مِنَ الإِسْلامِ بِمُفْرَدِهِ مِنْ غَيْرِ أَنْ يَنْضَمَّ إِلَيْهِ نَوْعٌ ءَاخَرُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(140) أَعْطِ بَعْضَ الأَمْثِلَةِ عَنِ اعْتِقَادَاتٍ كُفْرِيَّةٍ.</p><p class=\"answer\">الِاعْتِقَادَاتُ الْكُفْرِيَّةُ هِىَ كَالشَّكِّ فِى وُجُودِ اللَّهِ أَوْ وَحْدَانِيَّتِهِ أَوِ اعْتِقَادِ أَنَّ اللَّهَ يَسْكُنُ فِى مَكَانٍ أَوْ جِهَةٍ أَوْ أَنَّ لَهُ حَجْمًا أَوْ شَكْلًا أَوْ لَوْنًا أَوِ الشَّكِّ فِى صِدْقِ رَسُولِهِ مُحَمَّدٍ ﷺ أَوْ رِسَالَتِهِ أَىْ فِى كَوْنِهِ مُرْسَلًا مِنْ عِنْدِ اللَّهِ أَوْ فِى نُزُولِ الْقُرْءَانِ عَلَيْهِ أَوِ الشَّكِّ فِى وُجُودِ الْجَنَّةِ أَوِ النَّارِ أَوِ الثَّوَابِ أَوِ الْعِقَابِ فِى الآخِرَةِ أَوْ تَجْوِيزِ الرَّذَائِلِ عَلَى الأَنْبِيَاءِ أَوِ اعْتِقَادِ أَنَّ نَبِيًّا مِنَ الأَنْبِيَاءِ جَاءَ بِغَيْرِ دِينِ الإِسْلامِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(141) أَعْطِ بَعْضَ الأَمْثِلَةِ عَنْ أَفْعَالٍ كُفْرِيَّةٍ.</p><p class=\"answer\">الأَفْعَالُ الْكُفْرِيَّةُ هِىَ كَالدَّوْسِ عَلَى الْمُصْحَفِ أَوْ رَمْيِهِ فِى الْقَاذُورَاتِ أَوِ الْبَوْلِ عَلَيْهِ أَوْ كِتَابَةِ الْقُرْءَانِ بِالْبَوْلِ أَوْ بِدَمِ الْحَيْضِ أَوْ رَمْىِ وَرَقَةٍ فِيهَا اسْمُ اللَّهِ فِى نَجَاسَةٍ عَمْدًا أَوِ السُّجُودِ لِصَنَمٍ أَوْ شَمْسٍ أَوْ شَيْطَانٍ أَوْ نَارٍ وَلَوْ لَمْ يَقْصِدْ عِبَادَتَهَا أَوْ تَعْلِيقِ شِعَارِ الْكُفْرِ عَلَى نَفْسِهِ لِاعْتِقَادِ وُجُودِ الْبَرَكَةِ فِيهِ أَوْ عَلَّقَهُ تَعْظِيمًا لَهُ أَوْ جَوَّزَ تَعْلِيقَهُ مِنْ غَيْرِ ضَرُورَةٍ. وَشِعَارُ الْكُفْرِ هُوَ مَا اتَّخَذَهُ الْكُفَّارُ عَلامَةً دِينِيَّةً خَاصَّةً بِهِمْ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(142) أَعْطِ بَعْضَ الأَمْثِلَةِ عَنْ أَقْوَالٍ كُفْرِيَّةٍ.</p><p class=\"answer\">الأَقْوَالُ الْكُفْرِيَّةُ هِىَ كَسَبِّ اللَّهِ أَوْ نَبِىٍّ مِنَ الأَنْبِيَاءِ أَوْ مَلَكٍ مِنَ الْمَلائِكَةِ أَوْ دِينِ الإِسْلامِ أَوِ الِاسْتِخْفَافِ بِالْجَنَّةِ أَوْ بِشَعِيرَةٍ مِنْ شَعَائِرِ الإِسْلامِ كَالصَّلاةِ وَالصِّيَامِ وَالأَذَانِ أَوْ تَجْوِيزِ نُبُوَّةِ أَحَدٍ بَعْدَ نَبِيِّنَا مُحَمَّدٍ ﷺ أَوْ إِنْكَارِ نُبُوَّةِ أَحَدٍ مِنَ الأَنْبِيَاءِ الَّذِينَ اتَّفَقَ الْمُسْلِمُونَ عَلَى نُبُوَّتِهِ بَعْدَ الْعِلْمِ بِذَلِكَ أَوْ إِنْكَارِ بَعْثِ الأَجْسَادِ وَالأَرْوَاحِ مَعًا أَوْ إِنْكَارِ عَذَابِ الْقَبْرِ أَوِ التَّرَحُّمِ عَلَى الْكَافِرِ بَعْدَ مَوْتِهِ أَوِ الِاسْتِغْفَارِ لَهُ أَوِ الدُّعَاءِ لِجَمِيعِ الْمُسْلِمِينَ أَنْ يُجِيرَهُمُ اللَّهُ مِنْ نَارِ جَهَنَّمَ لِمَا فِيهِ مِنْ تَكْذِيبٍ لِلشَّرْعِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(143) مَا حُكْمُ الِاسْتِخْفَافِ بِاللَّهِ تَعَالَى.</p><p class=\"answer\">مَنِ اسْتَخَفَّ بِاللَّهِ تَعَالَى بِأَنْ نَسَبَ لِلَّهِ نَقْصًا كَفَرَ كَأَنْ قَالَ اللَّهُ جِسْمٌ قَاعِدٌ فَوْقَ الْعَرْشِ أَوْ قَالَ اللَّهُ يَسْكُنُ السَّمَاءَ أَوْ نَسَبَ الظُّلْمَ إِلَى اللَّهِ أَوْ قَالَ أَنَا عَايِفِ اللَّه أَىْ كَرِهْتُ اللَّهَ أَوْ قَالَ بِالْعَامِيَّةِ أَنَا قَدْ اللَّه يَقْصِدُ الْمُمَاثَلَةَ فِى الْحَجْمِ أَوِ الْمَنْزِلَةِ أَوْ قَالَ بِالْعَامِيَّةِ فُلانٌ خَوَتْ رَبِّى أَىْ جَنَّنَهُ أَوْ قَالَ فُلانٌ هَلَكَ رَبِّى أَوْ زَاحَ رَبِّى. وَكَذَا يَكْفُرُ مَنِ اسْتَخَفَّ بِاسْمٍ مِنْ أَسْمَاءِ اللَّهِ تَعَالَى مَعَ عِلْمِهِ أَنَّ الِاسْمَ الَّذِى يَسْتَخِفُّ بِهِ هُوَ اسْمٌ لِلَّهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(144) مَا حُكْمُ الِاسْتِخْفَافِ بِالْكُتُبِ السَّمَاوِيَّةِ.</p><p class=\"answer\">يَجِبُ اعْتِقَادُ أَنَّ اللَّهَ تَعَالَى أَنْزَلَ كُتُبًا عَلَى بَعْضِ أَنْبِيَائِهِ أَشْهَرُهَا الْقُرْءَانُ وَالإِنْجِيلُ أَىِ الأَصْلِىُّ وَالتَّوْرَاةُ أَىِ الأَصْلِيَّةُ وَالزَّبُورُ. وَهَذِهِ الْكُتُبُ مُعَظَّمَةٌ عِنْدَ اللَّهِ فَلا يَجُوزُ تَحْقِيرُهَا فَإِنَّ مَنْ حَقَّرَهَا وَاسْتَخَفَّ بِهَا أَىِ اعْتَبَرَهَا شَيْئًا حَقِيرًا لا شَأْنَ لَهُ كَفَرَ كَأَنْ أَلْقَى الْمُصْحَفَ أَوْ وَرَقَةً مَكْتُوبًا فِيهَا شَىْءٌ مِنَ الْقُرْءَانِ فِى الْقَاذُورَاتِ أَوْ دَاسَ عَلَى الْمُصْحَفِ بِقَدَمِهِ أَوْ شَكَّ فِى حَقِّيَّةِ وَصِحَّةِ مَا فِى الْقُرْءَانِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(145) مَا حُكْمُ الِاسْتِخْفَافِ بِرُسُلِ اللَّهِ.</p><p class=\"answer\">مَنِ اسْتَخَفَّ بِرُسُلِ اللَّهِ أَىْ أَنْبِيَائِهِ بِأَنْ نَسَبَ إِلَيْهِمُ الْقَبَائِحَ وَالرَّذَائِلَ كَفَرَ كَأَنْ قَالَ عَنْ نَبِىٍّ مِنْ أَنْبِيَاءِ اللَّهِ إِنَّهُ كَانَ كَافِرًا أَوْ فَاسِقًا أَوْ كَاذِبًا أَوْ خَائِنًا أَوْ جَبَانًا أَوْ خَسِيسًا أَوْ سَفِيهًا أَوْ رَذِيلًا أَوْ زَانِيًا أَوْ مُتَعَلِّقَ الْقَلْبِ بِالنِّسَاءِ أَوْ شَبِيهًا بِالْقِرْدِ أَوْ لا يُحْسِنُ النُّطْقَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(146) مَا حُكْمُ الِاسْتِخْفَافِ بِالْمَلائِكَةِ.</p><p class=\"answer\">مَنِ استخَفَّ بِمَلائِكَةِ اللَّهِ كَأَنْ قَالَ لَوْ شَهِدَ عِنْدِى الْمَلائِكَةُ بِكَذَا مَا قَبِلْتُهُمْ أَىْ مَا صَدَّقْتُهُمْ كَفَرَ لِأَنَّهُ طَعَنَ فِى صِدْقِهِمْ وَأَمَانَتِهِمْ أَوْ نَسَبَ الْخِيَانَةَ إِلَى الْمَلَكِ جِبْرِيلَ عَلَيهِ السَّلامُ كَقَوْلِ بَعْضِ النَّاسِ تَاهَ الأَمِينُ وَمُرَادُهُمْ أَنَّ جِبرِيلَ عَلَيْهِ السَّلامُ أُمِرَ بِالنُّزُولِ بِالْوَحْىِ عَلَى عَلِىٍّ لَكِنَّهُ أَخْطَأَ فَـنَـزَلَ عَلَى سَيِّدِنَا مُحَمَّدٍ ﷺ أَوْ سَبَّ مَلَكَ الْمَوْتِ عَزْرَائِيلَ عَلَيْهِ السَّلامُ أَىْ ذَمَّهُ وَحَقَّـرَهُ كَأَنْ قَالَ لِشَخْصٍ أَكْرَهُكَ كَمَا أَكْرَهُ عَزْرَائِيلَ فَإِنَّهُ يَكْفُرُ لِأَنَّ عَزْرَائِيلَ عَلَيْهِ السَّلامُ مَلَكٌ يَجِبُ تَعْظِيمُهُ وَلا يَجُوزُ الِاسْتِخْفَافُ بِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(147) مَا حُكْمُ الِاسْتِخْفَافِ بِشَعَائِرِ اللَّهِ.</p><p class=\"answer\">شَعَائِرُ اللَّهِ أَىْ مَعَالِمُ دِينِهِ أَىْ مَا كَانَ مَشْهُورًا مِنْ أُمُورِ الدِّينِ كَالصَّلاةِ وَالصِّيَامِ وَالْحَجِّ وَالزَّكَاةِ وَالأَذَانِ وَالْكَعْبَةِ وَالْمَسَاجِدِ وَعِيدِ الأَضْحَى وَعِيدِ الْفِطْرِ وَالطَّوَافِ وَرَمْىِ الْجِمَارِ. فَمَنِ اسْتَخَفَّ بِشَعَائِرِ اللَّهِ كَفَرَ كَالَّذِى يَقُولُ لَيْسَ الشَّأْنُ بِالصَّلاةِ إِنَّمَا الشَّأْنُ فِى حُسْنِ الْمُعَامَلَةِ مَعَ النَّاسِ أَوْ يَقُولُ الصِّيَامُ لَيْسَ لَهُ مَعْنًى. وَمِنْ شَعَائِرِ الدِّينِ حِجَابُ الْمَرْأَةِ فَمَنِ اسْتَخَفَّ بِسَتْرِ الْمَرْأَةِ لِرَأْسِهَا كَفَرَ وَالْعِيَاذُ بِاللَّهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(148) مَا حُكْمُ الِاسْتِخْفَافِ بِحُكْمٍ مِنْ أَحْكَامِ اللَّهِ.</p><p class=\"answer\">مَنِ اسْتَخَفَّ بِحُكْمٍ مِنْ أَحْكَامِ شَرْعِ اللَّهِ كَأَنْ عَلِمَ بِحُكْمِ الشَّرْعِ أَنَّ لِلذَّكَرِ مِثْلَ حَظِّ الأُنْثَيَيْنِ مِنَ التَّرِكَةِ فَاسْتَخَفَّ بِهِ أَوْ أَعْطَاهُ عَالِمٌ فَتْوًى فَقَالَ أَيْشٍ هَذَا الشَّرْعُ مُرِيدًا بِهَذَا الْقَوْلِ الِاسْتِخْفَافَ بِحُكْمِ الشَّرْعِ وَالِاعْتِرَاضَ عَلَيْهِ كَفَرَ</p></div>\n<div class=\"qa-item\"><p class=\"question\">(149) مَا حُكْمُ الِاسْتِخْفَافِ بِوَعْدِ اللَّهِ أَوْ وَعِيدِهِ.</p><p class=\"answer\">مَنْ سَخِرَ بِوَعْدِ اللَّهِ لِلْمُؤْمِنِينَ بِالْجَنَّةِ وَمَا أَعَدَّ فِيهَا مِنَ النَّعِيمِ الْعَظِيمِ كَفَرَ كَالَّذِى يَقُولُ أَنَا لا أُرِيدُ الْجَنَّةَ أَتْرُكُهَا لَكُمْ وَكَذَا لَوْ سَخِرَ بِوَعِيدِ اللَّهِ لِلْكَافِرِينَ وَالْعُصَاةِ بِالنَّارِ وَمَا أَعَدَّ فِيهَا مِنَ الْعَذَابِ الأَلِيمِ كَقَوْلِ بَعْضِ السُّفَهَاءِ غَدًا نَتَدَفَّأُ بِنَارِ جَهَنَّمَ فَإِنَّ ذَلِكَ كُفْرٌ لِمَا فِيهِ مِنَ الِاسْتِهْزَاءِ بِالدِّينِ وَتَكْذِيبِ الْقُرْءَانِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(150) مَا حُكْمُ مَنْ رَضِىَ بِكُفْرِ غَيْرِهِ أَوِ اسْتَحْسَنَهُ.</p><p class=\"answer\">مَنْ رَضِىَ بِكُفْرِ غَيْرِهِ كَأَنْ ضَحِكَ لِقَوْلِ شَخْصٍ كَلِمَةَ الْكُفْرِ عَلَى وَجْهِ الْمُوَافَقَةِ لَهُ عَلَى قَوْلِهِ كَفَرَ وَكَذَا مَنِ اسْتَحْسَنَ الْكُفْرَ أَىِ أَعْتَقَدَهُ شَيْئًا حَسَنًا كَأَنْ قَالَ لا بَأْسَ بِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(151) مَا حُكْمُ مَنْ أَكْرَهَ غَيْرَهُ عَلَى الْكُفْرِ أَوْ أَعَانَ غَيْرَهُ عَلَيْهِ.</p><p class=\"answer\">مَنْ أَكْرَهَ غَيْرَهُ عَلَى الْكُفْرِ كَأَنْ قَالَ لَهُ اكْفُرْ بِاللَّهِ وَإِلَّا قَتَلْتُكَ أَوْ أَعَانَ غَيْرَهُ عَلَيْهِ كَأَنْ أَعْطَى كَافِرًا مَا يَسْتَعِينُ بِهِ لِفِعْلِ الْكُفْرِ مَعَ عِلْمِهِ بِذَلِكَ كَفَرَ وَالْعِيَاذُ بِاللَّهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(152) مَا حُكْمُ مَنْ فَرِحَ بِالْكُفْرِ أَوْ تَمَنَّاهُ لِنَفْسِهِ.</p><p class=\"answer\">مَنْ سَمِعَ كُفْرًا مِنْ غَيْرِهِ فَفَرِحَ بِهِ أَوْ تَمَنَّاهُ لِنَفْسِهِ كَأَنْ قَالَ لَيْتَنِى كُنْتُ كَافِرًا كَفَرَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(153) مَا حُكْمُ مَنْ سَمَّى الْكُفْرَ إِيمَانًا أَوْ أَشَارَ عَلَى كَافِرٍ أَنْ يَبْقَى عَلَى الْكُفْرِ.</p><p class=\"answer\">مَنْ سَمَّى الْكُفْرَ إِيمَانًا كَأَنْ قَالَ عَنْ رَجُلٍ يَعْتَقِدُ أَنَّ اللَّهَ جَالِسٌ عَلَى الْعَرْشِ إِنَّهُ مُؤْمِنٌ بِاللَّهِ كَفَرَ وَكَذَا إِنْ أَشَارَ عَلَى كَافِرٍ أَنْ يَبْقَى عَلَى الْكُفْرِ مُدَّةً كَأَنْ عَلِمَ أَنَّ كَافِرًا يُرِيدُ أَنْ يُسْلِمَ فَقَالَ لَهُ فَكِّرْ فِى الأَمْرِ أَوَّلًا فَإِنَّهُ يَكْفُرُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(154) مَا حُكْمُ مَنْ نَوَى أَنْ يَكْفُرَ فِى الْمُسْتَقْبَلِ أَوْ عَلَّقَ كُفْرَهُ بِحُصُولِ أَمْرٍ.</p><p class=\"answer\">مَنْ نَوَى أَنْ يَكْفُرَ فِى الْمُسْتَقْبَلِ كَأَنْ عَزَمَ عَلَى تَرْكِ الإِسْلامِ فِى الْمُسْتَقْبَلِ أَوْ عَلَّقَ كُفْرَهُ بِحُصُولِ أَمْرٍ كَأَنْ قَالَ إِنْ حَصَلَ كَذَا أَكْفُرُ أَوْ تَرَدَّدَ هَلْ يَكْفُرُ أَوْ لا كَفَرَ فِى الْحَالِ</p></div>\n<div class=\"qa-item\"><p class=\"question\">(155) مَا حُكْمُ مَنْ مَنَعَ غَيْرَهُ مِنَ الدُّخُولِ فِى الإِسْلامِ أَوْ سَمَّى الإِسْلامَ كُفْرًا.</p><p class=\"answer\">مَنْ مَنَعَ غَيْرَهُ مِنَ الدُّخُولِ فِى الإِسْلامِ كَفَرَ وَكَذَا مَنْ سَمَّى الإِسْلامَ كُفْرًا كَأَنْ قَالَ لِمُسْلِمٍ يَا كَافِرُ وَأَرَادَ أَنَّ مَا عَلَيْهِ هَذَا الْمُسْلِمُ مِنَ الدِّينِ كُفْرٌ مَعَ عِلْمِهِ أَنَّهُ مُسْلِمٌ وَلا يَعْلَمُ عَنْهُ شَيْئًا يَعْتَقِدُهُ كُفْرًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(156) مَا حُكْمُ مَنِ اسْتَحْسَنَ الْمَعْصِيَةَ أَوِ اسْتَحَلَّهَا.</p><p class=\"answer\">مَنِ اسْتَحْسَنَ الْمَعْصِيَةَ كَأَنْ قَالَ عَنْ مَعْصِيَةٍ لا بَأْسَ بِهَا أَوِ اسْتَحَلَّهَا مَعَ عِلْمِهِ بِأَنَّهَا مَعْصِيَةٌ كَأَنِ اسْتَحَلَّ السَّرِقَةَ أَوْ قَتْلَ الْمُسْلِمِ بِغَيْرِ حَقٍّ كَفَرَ وَالْعِيَاذُ بِاللَّهِ تَعَالَى.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(157) مَا حُكْمُ مَنْ قَبَّحَ مَا حَسَّنَهُ الشَّرْعُ أَوْ حَسَّنَ مَا قَبَّحَهُ الشَّرْعُ.</p><p class=\"answer\">مَنْ قَبَّحَ مَا حَسَّنَهُ الشَّرْعُ مَعَ عِلْمِهِ بِأَنَّهُ حَسَنٌ كَأَنْ جَعَلَ سَتْرَ الْمَرْأَةِ لِوَجْهِهَا أَمْرًا قَبِيحًا أَوْ حَسَّنَ مَا قَبَّحَهُ الشَّرْعُ مَعَ عِلْمِهِ بِأَنَّهُ قَبِيحٌ كَأَنِ اسْتَحْسَنَ الْكَذِبَ فَهُوَ كَافِرٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(158) مَا حُكْمُ مَنْ حَرَّمَ حَلالًا أَوْ أَنْكَرَ فَرْضًا.</p><p class=\"answer\">مَنْ حَرَّمَ حَلالًا مَعَ عِلْمِهِ أَنَّهُ حَلالٌ كَأَنْ حَرَّمَ الْبَيْعَ أَوِ النِّكَاحَ كَفَرَ وَكَذَا إِنْ أَنْكَرَ فَرْضًا مَعَ عِلْمِهِ أَنَّهُ فَرْضٌ كَأَنْ أَنْكَرَ فَرْضِيَّةَ الصَّلَوَاتِ الْخَمْسِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(159) مَا حُكْمُ مَنْ أَنْكَرَ حُكْمًا مِنْ أَحْكَامِ الشَّرْعِ.</p><p class=\"answer\">مَنْ أَنْكَرَ حُكْمًا مِنْ أَحْكَامِ الشَّرْعِ بَعْدَ الْعِلْمِ بِهِ كَأَنْ أَنْكَرَ حُرْمَةَ شُرْبِ الْخَمْرِ أَوْ أَوْجَبَ مَا لَيْسَ وَاجِبًا مَعَ عِلْمِهِ بِذَلِكَ كَمَنْ أَوْجَبَ سُنَنَ الصَّلَوَاتِ الْخَمْسِ كَفَرَ وَالْعِيَاذُ بِاللَّهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(160) مَا حُكْمُ مَنْ سَمَّى الْكُتُبَ الْمُحَرَّفَةَ كُتُبًا مُقَدَّسَةً أَوْ سَمَّى الْمَعَابِدَ الدِّينِيَّةَ لِلْكُفَّارِ بُيُوتَ اللَّهِ.</p><p class=\"answer\">مَنْ سَمَّى الْكُتُبَ الْمُحَرَّفَةَ كَالتَّوْرَاةِ الْمُحَرَّفَةِ كُتُبًا مُقَدَّسَةً أَوْ سَمَّى الْمَعَابِدَ الدِّينِيَّةَ لِلْكُفَّارِ بُيُوتَ اللَّهِ كَفَرَ لِأَنَّهَا أَمَاكِنُ بُنِيَتْ لِلشِّرْكِ وَالْكُفْرِ فَلا تَكُونُ مُعَظَّمَ
