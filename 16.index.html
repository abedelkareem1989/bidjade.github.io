َلًا فَيَقُولَ لَهَا خَالَعْتُكِ عَلَى ذَلِكَ فَيَنْفَسِخُ عَقْدُ النِّكَاحِ بَيْنَهُمَا وَلا يَسْتَطِيعُ أَنْ يُرْجِعَهَا إِلَّا بِعَقْدٍ جَدِيدٍ بِرِضَاهَا ثُمَّ تَدْفَعُ لَهُ مِائَةَ دِرْهَمٍ. وَالْخُلْعُ فِى مَذْهَبِ الشَّافِعِىِّ الْقَدِيمِ فَسْخٌ وَلَيْسَ طَلاقًا أَمَّا عِنْدَ أَبِى حَنِيفَةَ فَهُوَ طَلاقٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(457) مَاذَا يَجِبُ لِلْمُخْتَلِعَةِ أَثْنَاءَ الْعِدَّةِ.</p><p class=\"answer\">يَجِبُ لَهَا السُّكْنَى دُونَ النَّفَقَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(458) مَا هِىَ عِدَّةُ الْمُطَلَّقَةِ وَالْمُخْتَلِعَةِ وَالْمُتَوَفَّى عَنْهَا زَوْجُهَا.</p><p class=\"answer\">عِدَّةُ الْمُطَلَّقَةِ طَلاقًا رَجْعِيًّا أَوْ بَائِنًا وَعِدَّةُ الْمُخْتَلِعَةِ وَهِىَ الَّتِى خَالَعَهَا زَوْجُهَا بَعْدَ الدُّخُولِ بِهَا ثَلاثَةُ أَطْهَارٍ إِذَا كَانَتْ تَحِيضُ وَثَلاثَةُ أَشْهُرٍ قَمَرِيَّةٍ إِذَا كَانَتْ لا تَحِيضُ وَالْحَامِلُ عِدَّتُهَا تَنْتَهِى بِوَضْعِ الْحَمْلِ. وَعِدَّةُ الْمُتَوَّفَى عَنْهَا زَوْجُهَا أَرْبَعَةُ أَشْهُرٍ وَعَشَرَةُ أَيَّامٍ أَمَّا الْحَامِلُ فَعِدَّتُهَا تَنْتَهِى بِوَضْعِ الْحَمْلِ. وَأَمَّا الْمُطَلَّقَةُ أَوِ الْمُخْتَلِعَةُ قَبْلَ الدُّخُولِ بِهَا فَلا عِدَّةَ عَلَيْهَا.</p></div>", "wordCount": 2211, "paraCount": 94}, {"id": "wajib_qalb", "title": "فصل في الواجبات القلبية", "icon": "fa-heart", "desc": "الواجبات المتعلقة بالقلب من الإيمان والنية", "content": "<p>فَصْلٌ فِى الْوَاجِبَاتِ الْقَلْبِيَّةِ</p>\n<div class=\"qa-item\"><p class=\"question\">(459) مَا هُوَ الإِيمَانُ بِاللَّهِ وَالإِيمَانُ بِرَسُولِ اللَّهِ ﷺ.</p><p class=\"answer\">الإِيمَانُ بِاللَّهِ وَرَسُولِهِ ﷺ مِنَ الْوَاجِبَاتِ الْقَلْبِيَّةِ أَىْ مَا يَجِبُ عَلَى الْمُكَلَّفِ مِنْ أَعْمَالِ الْقُلُوبِ. وَالإِيمَانُ بِاللَّهِ هُوَ اعْتِقَادُ أَنَّ اللَّهَ مَوْجُودٌ لا كَالْمَوْجُودَاتِ لَيْسَ حَجْمًا وَلا يَتَّصِفُ بِصِفَاتِ الأَحْجَامِ مَوْجُودٌ بِلا كَيْفٍ وَلا مَكَانٍ وَلا جِهَةٍ وَالإِيمَانُ بِرَسُولِ اللَّهِ ﷺ هُوَ اعْتِقَادُ أَنَّهُ ﷺ رَسُولُ اللَّهِ وَأَنَّ اللَّهَ أَرْسَلَهُ لِيَدْعُوَ النَّاسَ إِلَى عِبَادَةِ اللَّهِ وَحْدَهُ وَأَنْ لا يُشْرِكُوا بِهِ شَيْئًا وَاعْتِقَادُ أَنَّهُ صَادِقٌ فِى كُلِّ مَا جَاءَ بِهِ. وَالإِيمَانُ بِاللَّهِ وَرَسُولِهِ ﷺ هُوَ أَصْلُ الْوَاجِبَاتِ لِأَنَّ الْعَبْدَ لَوْلا أَنَّهُ ءَامَنَ بِاللَّهِ وَرَسُولِهِ لَمَا صَلَّى وَصَامَ وَحَجَّ وَزَكَّى وَلَمَا صَحَّتْ مِنْهُ هَذِهِ الْعِبَادَاتُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(460) تَكَلَّمْ عَنِ الإِخْلاصِ.</p><p class=\"answer\">الإِخْلاصُ هُوَ الْعَمَلُ بِالطَّاعَةِ لِلَّهِ وَحْدَهُ أَىْ أَنْ لا يَقْصِدَ بِعَمَلِ الطَّاعَةِ مَدْحَ النَّاسِ لَهُ وَالنَّظَرَ إِلَيْهِ بِعَيْنِ الِاحْتِرَامِ وَالتَّعْظِيمِ قَالَ رَسُولُ اللَّهِ ﷺ إِنَّ اللَّهَ يُحِبُّ إِذَا عَمِلَ أَحَدُكُمْ عَمَلًا أَنْ يُتْقِنَهُ قِيلَ وَمَا إِتْقَانُهُ يَا رَسُولَ اللَّهِ قَالَ أَنْ يُخْلِصَهُ مِنَ الرِّيَاءِ وَالْبِدْعَةِ. فَلا يَكُونُ الْعَمَلُ مَقْبُولًا عِنْدَ اللَّهِ إِلَّا بِأَمْرَيْنِ إِخْلاصِ النِّيَّةِ وَمُوَافَقَةِ الشَّرْعِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(461) تَكَلَّمْ عَنِ النَّدَمِ عَلَى الْمَعَاصِى.</p><p class=\"answer\">تَجِبُ التَّوْبَةُ فَوْرًا مِنْ جَمِيعِ الْمَعَاصِى صَغِيرِهَا وَكَبِيرِهَا وَرُكْنُهَا الأَكْبَرُ هُوَ النَّدَمُ. وَالنَّدَمُ هُوَ اسْتِشْعَارُ الْحُزْنِ بِالْقَلْبِ عَلَى فِعْلِ الْمَعْصِيَةِ كَأَنْ يَقُولَ لَيْتَنِى لَمْ أَفْعَلْ ذَلِكَ. أَمَّا إِذَا كَانَ نَدَمُهُ لِأَجْلِ الْفَضِيحَةِ بَيْنَ النَّاسِ أَوْ خَسَارَةِ مَالِهِ فِى الْقِمَارِ لَمْ يَكُنْ ذَلِكَ تَوْبَةً.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(462) مَا مَعْنَى التَّوَكُّلِ عَلَى اللَّهِ.</p><p class=\"answer\">مَعْنَى التَّوَكُّلِ عَلَى اللَّهِ اعْتِقَادُ أَنَّهُ لا ضَارَّ وَلا نَافِعَ عَلَى الْحَقِيقَةِ إِلَّا اللَّهُ فَيَجِبُ عَلَى الْعَبْدِ أَنْ يَكُونَ اعْتِمَادُهُ عَلَى اللَّهِ لِأَنَّهُ خَالِقُ كُلِّ شَىْءٍ مِنَ الْمَنَافِعِ وَالْمَضَارِّ قَالَ اللَّهُ تَعَالَى ﴿وَعَلَى اللَّهِ فَلْيَتَوَكَّلِ الْمُؤْمِنُونَ﴾. وَمَنْ يَتَوَكَّلُ عَلَى اللَّهِ لا يَلْجَأُ إِلَى مَعْصِيَةِ اللَّهِ فَلا يَلْجَأُ إِلَى السَّرِقَةِ إِنْ قَلَّ مَالُهُ وَلا يَسْأَلُ الْعَرَّافِينَ عَنْ مَالِهِ الْمَسْرُوقِ أَوِ الضَّائِعِ بَلْ يَتَوَكَّلُ عَلَى اللَّهِ وَيَعْتَقِدُ أَنَّ رِزْقَهُ لا يَأْكُلُهُ غَيْرُهُ فَعَنْ جَابِرٍ رَضِىَ اللَّهُ عَنْهُ أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ لَوْ أَنَّ ابْنَ ءَادَمَ فَرَّ مِنْ رِزْقِهِ كَمَا يَفِرُّ مِنَ الْمَوْتِ لَأَدْرَكَهُ رِزْقُهُ كَمَا يُدْرِكُهُ الْمَوْتُ رَوَاهُ أَبُو نُعَيْمٍ فِى الْحِلْيَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(463) مَا مَعْنَى الْمُرَاقَبَةِ لِلَّهِ.</p><p class=\"answer\">الْمُرَاقَبَةُ لِلَّهِ مِنَ الْوَاجِبَاتِ الْقَلْبِيَّةِ وهِىَ اسْتِدَامَةُ الْخَوْفِ مِنَ اللَّهِ بِأَدَاءِ مَا أَوْجَبَهُ وَاجْتِنَابِ مَا حَرَّمَهُ. فَيَجِبُ عَلَى الْمُكَلَّفِ أَوَّلَ مَا يَدْخُلُ فِى التَّكْلِيفِ أَنْ يَنْوِىَ وَيَعْزِمَ أَنْ يُؤَدِّىَ مَا أَوْجَبَهُ اللَّهُ عَلَيْهِ وَأَنْ يَجْتَنِبَ مَا حَرَّمَهُ اللَّهُ عَلَيْهِ. وَمَنْ دَاوَمَ عَلَى اسْتِحْضَارِ أَنَّ اللَّهَ عَالِمٌ بِهِ وَأَنَّ اللَّهَ يَرَاهُ يُورِثُهُ هَذَا فِى قَلْبِهِ خَشْيَةً مِنَ اللَّهِ فَيَتْرُكُ الْمَعَاصِىَ خَوْفًا مِنَ اللَّهِ وَيُؤَدِّى الْوَاجِبَاتِ طَاعَةً لِلَّهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(464) مَا مَعْنَى الرِّضَى عَنِ اللَّهِ.</p><p class=\"answer\">الرِّضَى عَنِ اللَّهِ هُوَ التَّسْلِيمُ لَهُ وَتَرْكُ الِاعْتِرَاضِ عَلَيْهِ اعْتِقَادًا أَوْ لَفْظًا فَيَجِبُ عَلَى الْعَبْدِ أَنْ يَرْضَى بِمَا جَاءَ عَنِ اللَّهِ وَلا يَعْتَرِضَ عَلَيْهِ وَأَنْ يَقْبَلَ مَا جَاءَ فِى الشَّرْعِ مِنَ الْعَقَائِدِ وَالأَحْكَامِ فَلا يَصِحُّ الثَّبَاتُ عَلَى الإِسْلامِ إِلَّا لِمَنْ سَلَّمَ لِلَّهِ عَزَّ وَجَلَّ وَلَمْ يَعْتَرِضْ عَلَيْهِ وَلَمْ يَصِفْهُ بِمَا لا يَلِيقُ بِهِ. وَمَنِ اعْتَرَضَ عَلَى اللَّهِ أَىْ نَسَبَ الظُّلْمَ أَوِ السَّفَهَ أَىْ عَدَمَ الْحِكْمَةِ إِلَى اللَّهِ كَفَرَ وَالْعِيَاذُ بِاللَّهِ. بَعْضُ النَّاسِ تُصِيبُهُمُ الْمَصَائِبُ فَيَعْتَرِضُونَ عَلَى اللَّهِ فَيَكْفُرُونَ بِخَالِقِهِمْ. هَؤُلاءِ ضَرُّوا أَنْفُسَهُمْ، اللَّهُ عَزَّ وَجَلَّ لا يَنْضَرُّ بِكُفْرِ الْكَافِرِينَ وَلا يَنْضَرُّ بِمَعْصِيَةِ الْعُصَاةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(465) تَكَلَّمْ عَنْ تَعْظِيمِ شَعَائِرِ اللَّهِ.</p><p class=\"answer\">يَجِبُ تَعْظِيمُ شَعَائِرِ اللَّهِ وَلا يَجُوزُ الإِخْلالُ بِتَعْظِيمِهَا وَالِاسْتِهَانَةُ بِهَا وَشَعَائِرُ اللَّهِ هِىَ مَعَالِمُ دِينِهِ أَىْ مَا كَانَ مَشْهُورًا مِنْ أُمُورِ الدِّينِ كَالصَّلاةِ وَالصِّيَامِ وَالْحَجِّ وَالزَّكَاةِ وَالأَذَانِ وَالْكَعْبَةِ وَالْمَسَاجِدِ وَعِيدِ الأَضْحَى وَعِيدِ الْفِطْرِ وَالطَّوَافِ وَرَمْىِ الْجِمَارِ. وَأَمَّا الِاسْتِخْفَافُ بِشَعَائِرِ اللَّهِ فَهُوَ كُفْرٌ كَالَّذِى يَقُولُ لَيْسَ الشَّأْنُ بِالصَّلاةِ إِنَّمَا الشَّأْنُ فِى حُسْنِ الْمُعَامَلَةِ مَعَ النَّاسِ أَوْ يَقُولُ الصِّيَامُ لَيْسَ لَهُ مَعْنًى. وَمِنَ الِاسْتِخْفَافِ بِشَعَائِرِ اللَّهِ مَا يَقُولُهُ بَعْضُ الْجُهَّالِ إِنَّ التَّعَمُّقَ فِى الدِّينِ يُعَقِّدُ الإِنْسَانَ أَوْ يُجَنِّنُهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(466) مَا هُوَ الشُّكْرُ الْوَاجِبُ.</p><p class=\"answer\">الشُّكْرُ الْوَاجِبُ هُوَ عَدَمُ اسْتِعْمَالِ نِعَمِ اللَّهِ فِى مَعْصِيَتِهِ فَيَجِبُ عَلَى الْعَبْدِ أَنْ يَشْكُرَ رَبَّهُ بِاسْتِعْمَالِ جَوَارِحِهِ أَىْ أَعْضَاءِ جَسَدِهِ فِى طَاعَتِهِ الْوَاجِبَةِ وَعَدَمِ اسْتِعْمَالِهَا فِى مَعْصِيَتِهِ وَأَمَّا الشُّكْرُ الْمَنْدُوبُ أَىِ الْمَسْنُونُ فَهُوَ الثَّنَاءُ بِاللِّسَانِ عَلَى اللَّهِ عَلَى نِعَمِهِ الَّتِى لا نُحْصِيهَا كَقَوْلِ الْحَمْدُ لِلَّهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(467) مَا مَعْنَى الصَّبْرِ وَمَا هُوَ الصَّبْرُ الْوَاجِبُ.</p><p class=\"answer\">الصَّبْرُ هُوَ قَهْرُ النَّفْسِ عَلَى فِعْلِ شَىْءٍ تَنْفِرُ مِنْهُ أَوْ عَلَى تَحَمُّلِ مُفَارَقَةِ شَىْءٍ لَذِيذٍ تَمِيلُ إِلَيْهِ وَالصَّبْرُ الْوَاجِبُ هُوَ الصَّبْرُ عَلَى أَدَاءِ مَا أَوْجَبَ اللَّهُ وَالصَّبْرُ عَلَى اجْتِنَابِ مَا حَرَّمَ اللَّهُ وَالصَّبْرُ عَلَى الْبَلايَا وَالْمَصَائِبِ بِمَعْنَى عَدَمِ الِاعْتِرَاضِ عَلَى اللَّهِ أَوِ الدُّخُولِ فِيمَا حَرَّمَ اللَّهُ بِسَبَبِ الْمُصِيبَةِ. وَالْمُسْلِمُ الَّذِى تَكْثُرُ عَلَيْهِ الْمَصَائِبُ مَعَ سَلامَةِ الدِّينِ أَفْضَلُ عِنْدَ اللَّهِ مِنَ الْمُسْلِمِ الَّذِى يَعِيشُ مُتَقَلِّبًا فِى الرَّاحَةِ وَلا تُصِيبُهُ الْمَصَائِبُ إِلَّا قَلِيلًا. فَالصَّبْرُ مَعَ الإِيمَانِ دَرَجَةٌ عَالِيَةٌ عِنْدَ اللَّهِ قَالَ رَسُولُ اللَّهِ ﷺ مَنْ يُرِدِ اللَّهُ بِهِ خَيْرًا يُصِبْ مِنْهُ أَىْ مَنْ أَرَادَ اللَّهُ لَهُ رِفْعَةً فِى الدَّرَجَةِ يَبْتَلِيهِ بِمَصَائِبِ الدُّنْيَا وَيَحْفَظُهُ مِنْ مَصَائِبِ الدِّينِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(468) تَكَلَّمْ عَنْ بُغْضِ الشَّيْطَانِ.</p><p class=\"answer\">يَجِبُ عَلَى الْمُكَلَّفِ بُغْضُ الشَّيْطَانِ أَىْ كَرَاهِيَتُهُ لِأَنَّ اللَّهَ تَعَالَى أَمَرَنَا أَنْ نَتَّخِذَهُ عَدُوًّا قَالَ اللَّهُ تَعَالَى ﴿فَاتَّخِذُوهُ عَدُوًّا﴾. وَالشَّيْطَانُ هُوَ الْكَافِرُ مِنْ الْجِنِّ فَيَنْبَغِى مُحَارَبَتُهُ بِتَعَلُّمِ عِلْمِ الدِّينِ وَعَدَمِ الِاسْتِرْسَالِ مَعَهُ. وَمِنَ الشَّيَاطِينِ الْقَرِينُ الَّذِى يُوَسْوِسُ لِلإِنْسَانِ وَيَأْمُرُهُ بِالْكُفْرِ وَالْمَعَاصِى فَلا يَنْبَغِى لِلْمُسْلِمِ أَنْ يَسْتَرْسِلَ مَعَ الْوَسْوَاسِ بَلْ يَنْبَغِى أَنْ يَلْجَأَ إِلَى اللَّهِ فِى دَفْعِهِ وَأَنْ يُعْرِضَ عَنْهُ وَأَنْ يُبَادِرَ إِلَى قَطْعِهِ بِالِاشْتِغَالِ بِغَيْرِهِ كَالذِّكْرِ وَقِرَاءَةِ الْقُرْءَانِ حَتَّى لا تَتَنَكَّدَ عِيْشَتُهُ وَلا يَنْبَغِى لِلْمُسْلِمِ أَنْ يَقْعُدَ وَحْدَهُ إِنَّمَا يَقْعُدُ مَعَ الصَّالِحِينَ إِنْ وَجَدَهُمْ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(469) تَكَلَّمْ عَنْ بُغْضِ الْمَعَاصِى.</p><p class=\"answer\">يَجِبُ كَرَاهِيَةُ جَمِيعِ الْمَعَاصِى كَبِيرِهَا وَصَغِيرِهَا سَوَاءٌ حَصَلَتْ مِنْهُ أَمْ مِنْ غَيْرِهِ لِأَنَّ اللَّهَ يَكْرَهُهَا وَحَرَّمَ عَلَى الْمُكَلَّفِينَ فِعْلَهَا. وَمَنْ تَجَنَّبَ الْكَبَائِرَ تُغْفَرُ لَهُ الصَّغَائِرُ لِقَوْلِهِ تَعَالَى ﴿إِنْ تَجْتَنِبُوا كَبَآئِرَ مَا تُنْهَوْنَ عَنْهُ نُكَفِّرْ عَنْكُمْ سَيِّئَاتِكُمْ﴾ وَالْمُرَادُ بِالسَّيِّئَاتِ هُنَا الصَّغَائِرُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(470) تَكَلَّمْ عَنْ مَحَبَّةِ اللَّهِ وَمَحَبَّةِ كَلامِهِ وَرَسُولِهِ ﷺ.</p><p class=\"answer\">تَجِبُ مَحَبَّةُ اللَّهِ بِتَعْظِيمِهِ أَقْصَى غَايَةِ التَّعْظِيمِ وَالتَّذَلُّلِ لَهُ غَايَةَ التَّذَلُّلِ وَمَحَبَّةُ كَلامِهِ أَىِ الْقُرْءَانِ بِتَعْظِيمِهِ وَالإِيمَانِ بِهِ وَمَحَبَّةُ رَسُولِهِ ﷺ بِتَعْظِيمِهِ كَمَا يَجِبُ قَالَ رَسُولُ اللَّهِ ﷺ لا يُؤْمِنُ أَحَدُكُمْ (أَىْ لا يَكُونُ كَامِلَ الإِيمَانِ) حَتَّى أَكُونَ أَحَبَّ إِلَيْهِ مِنْ وَالِدِهِ وَوَلَدِهِ وَالنَّاسِ أَجْمَعِينَ رَوَاهُ الْبُخَارِىُّ وَمُسْلِمٌ. وَتَجِبُ مَحَبَّةُ الأَنْبِيَاءِ وَسَائِرِ الصَّالِحِينَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(471) مَنْ هُمْ أَصْحَابُ النَّبِىِّ ﷺ وَهَلْ تَجِبُ مَحَبَّةُ كُلِّ فَرْدٍ مِنْهُمْ.</p><p class=\"answer\">تَجِبُ مَحَبَّةُ أَصْحَابِ النَّبِىِّ ﷺ مِنْ حَيْثُ الإِجْمَالُ أَىْ تَعْظِيمُهُمْ لِأَنَّهُمْ أَنْصَارُ دِينِ اللَّهِ وَلا تَجِبُ مَحَبَّةُ كُلِّ فَرْدٍ مِنْهُمْ. وَالصَّحَابِىُّ هُوَ مَنْ لَقِىَ النَّبِىَّ ﷺ عَلَى وَجْهِ الْعَادَةِ مُؤْمِنًا بِهِ وَمَاتَ عَلَى الإِيمَانِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(472) مَنْ هُمْ ءَالُ النَّبِىِّ ﷺ وَهَلْ تَجِبُ مَحَبَّتُهُمْ.</p><p class=\"answer\">ءَالُ النَّبِىِّ ﷺ هُمْ أَزْوَاجُهُ وَأَقْرِبَاؤُهُ الْمُؤْمِنُونَ وَهَؤُلاءِ تَجِبُ مَحَبَّتُهُمْ لِمَا خُصُّوا بِهِ مِنَ الْفَضْلِ وَأَمَّا إِذَا ذُكِرَ ءَالُ النَّبِىِّ فِى مَقَامِ الصَّلاةِ عَلَيْهِ ﷺ فَالْمَقْصُودُ كُلُّ تَقِىٍّ مِنْ أُمَّتِهِ.</p></div>", "wordCount": 1018, "paraCount": 29}, {"id": "maasi_qalb", "title": "فصل في معاصي القلب", "icon": "fa-heart-broken", "desc": "المعاصي القلبية كالرياء والحسد والكبر", "content": "<p>فَصْلٌ فِى مَعَاصِى الْقَلْبِ</p>\n<div class=\"qa-item\"><p class=\"question\">(473) مَا هُوَ الرِّيَاءُ.</p><p class=\"answer\">الرِّيَاءُ هُوَ الْعَمَلُ بِالطَّاعَةِ لِأَجْلِ النَّاسِ أَىْ لِيَمْدَحُوهُ وَهُوَ مِنَ الْكَبَائِرِ لِأَنَّ الرَّسُولَ ﷺ سَمَّاهُ الشِّرْكَ الأَصْغَرَ قَالَ عَلَيْهِ الصَّلاةُ وَالسَّلامُ فِيمَا رَوَاهُ الْحَاكِمُ فِى الْمُسْتَدْرَكِ اتَّقُوا الرِّيَاءَ (أَىِ اجْتَنِبُوا الرِّيَاءَ) فَإِنَّهُ الشِّرْكُ الأَصْغَرُ، مَعْنَاهُ ذَنْبٌ كَبِيرٌ يُشْبِهُ الإِشْرَاكَ بِاللَّهِ وَلا يُخْرِجُ فَاعِلَهُ مِنَ الإِسْلامِ. وَالرِّيَاءُ يُحْبِطُ ثَوَابَ الْعَمَلِ الَّذِى قَارَنَهُ. وَمَنِ اسْتَشْعَرَ بِقَلْبِهِ بِأَنَّهُ لا أَحَدَ يَنْفَعُ فِى جَلْبِ خَيْرٍ وَلا دَفْعِ مَضَرَّةٍ عَلَى الْحَقِيقَةِ إِلَّا اللَّهُ وَأَنَّ الْخَلْقَ أَسْبَابٌ فَقَطْ لا يَخْلُقُونَ شَيْئًا مِنْ مَنْفَعَةٍ وَلا مَضَرَّةٍ يَسْهُلُ عَلَيْهِ تَرْكُ الرِّيَاءِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(474) مَا هُوَ الْعُجْبُ بِطَاعَةِ اللَّهِ.</p><p class=\"answer\">الْعُجْبُ بِطَاعَةِ اللَّهِ مِنَ الْكَبَائِرِ وَهُوَ أَنْ يُعْجَبَ الْعَبْدُ بِطَاعَاتِهِ بِحَيْثُ يَرَى تَعْظِيمَ نَفْسِهِ نَاسِيًا أَنَّ اللَّهَ هُوَ الَّذِى تَفَضَّلَ عَلَيْهِ بِهَا فَأَقْدَرَهُ عَلَيْهَا وَيَرَى فِعْلَهُ لَهَا مَزِيَّةً لِنَفْسِهِ وَيُبْطِلُ الْعُجْبُ ثَوَابَ الطَّاعَةِ الَّتِى قَارَنَهَا أَمَّا إِذَا حَصَلَ الْعُجْبُ بَعْدَ الِانْتِهَاءِ مِنَ الْعَمَلِ فَلا يُحْبِطُ الثَّوَابَ لَكِنَّهُ حَرَامٌ. وَأَمَّا الْفَرَحُ بِالطَّاعَةِ لِأَنَّهَا نِعْمَةٌ مِنَ اللَّهِ فَلا مَعْصِيَةَ فِيهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(475) مَا حُكْمُ مَنْ شَكَّ فِى وُجُودِ اللَّهِ.</p><p class=\"answer\">اعْلَمْ أَنَّ الشَّكَّ خِلافُ الْيَقِينِ وَالشَّكُّ مَحَلُّهُ الْقَلْبُ وَلا يَكُونُ الإِنْسَانُ مُؤْمِنًا إِلَّا بِالتَّصْدِيقِ الْجَازِمِ بِالْقَلْبِ بِوُجُودِ اللَّهِ وَأَنَّهُ لا يُشْبِهُ شَيْئًا مِنَ الْمَخْلُوقَاتِ أَمَّا مَنْ شَكَّ فِى وُجُودِ اللَّهِ أَوْ قُدْرَتِهِ أَوْ عِلْمِه أَوْ وَحْدَانِيَّتِهِ أَوْ حِكْمَتِهِ أَوْ عَدْلِهِ أَوْ فِى أَىِّ صِفَةٍ مِنْ صِفَاتِهِ الثَّلاثَ عَشْرَةَ الْوَاجِبَةِ لَهُ إِجْمَاعًا فَلَيْسَ بِمُؤْمِنٍ. أَمَّا الْخَاطِرُ الْخَبِيثُ الَّذِى يَرِدُ عَلَى الْقَلْبِ بِلا إِرَادَةٍ فَلا يُؤَثِّرُ إِنْ لَمْ يُورِثْهُ شَكًّا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(476) مَا مَعْنَى الأَمْنِ مِنْ مَكْرِ اللَّهِ.</p><p class=\"answer\">الأَمْنُ مِنْ مَكْرِ اللَّهِ مِنَ الْكَبَائِرِ وَهُوَ الِاسْتِرْسَالُ فِى الْمَعَاصِى وَالِاعْتِمَادُ عَلَى رَحْمَةِ اللَّهِ أَمَّا اعْتِقَادُ أَنَّ اللَّهَ لا يُعَذِّبُ عَلَى الْمَعَاصِى بَعْدَ ثُبُوتِ الإِيمَانِ بِالْمَرَّةِ فَهُوَ كُفْرٌ قَالَ تَعَالَى ﴿أَفَأَمِنُوا مَكْرَ اللَّهِ﴾ أَىْ عُقُوبَةَ اللَّهِ ﴿فَلا يَأْمَنُ مَكْرَ اللَّهِ إِلَّا الْقَوْمُ الْخَاسِرُونَ﴾. وَمَكْرُ اللَّهِ لَيْسَ كَمَكْرِ الْعِبَادِ مَكْرُ اللَّهِ لا يُذَمُّ لِأَنَّ اللَّهَ لا يَجُوزُ عَلَيْهِ الظُّلْمُ لا يَكُونُ ظَالِمًا إِنِ انْتَقَمَ مِنْ عِبَادِهِ الظَّالِمِينَ بِمَا شَاءَ وَأَمَّا الْمَكْرُ بِمَعْنَى الِاحْتِيَالِ فَمُسْتَحِيلٌ عَلَى اللَّهِ. وَلا يَجُوزُ تَسْمِيَةُ اللَّهِ مَاكِرًا لِأَنَّهُ اسْتِخْفَافٌ بِاللَّهِ عَزَّ وَجَلَّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(477) مَا مَعْنَى الْقُنُوطِ مِنْ رَحْمَةِ اللَّهِ.</p><p class=\"answer\">الْقُنُوطُ مِنْ رَحْمَةِ اللَّهِ هُوَ أَنْ يَعْتَقِدَ الْعَبْدُ أَنَّ اللَّهَ لا يَغْفِرُ لَهُ وَأَنَّهُ لا مَحَالَةَ يُعَذِّبُهُ لِكَثْرَةِ ذُنُوبِهِ وَهُوَ مِنَ الْكَبَائِرِ أَمَّا اعْتِقَادُ أَنَّ اللَّهَ لا يَغْفِرُ ذُنُوبَ الْمُؤْمِنِينَ الْعُصَاةِ فَهُوَ كُفْرٌ. وَطَرِيقُ النَّجَاةِ الَّذِى يَنْبَغِى أَنْ يَكُونَ عَلَيْهِ الْمُؤْمِنُ أَنْ يَكُونَ خَائِفًا رَاجِيًا يَخَافُ عِقَابَ اللَّهِ عَلَى ذُنُوبِهِ وَيَرْجُو رَحْمَةَ اللَّهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(478) مَا هُوَ التَّكَبُّرُ.</p><p class=\"answer\">التَّكَبُّرُ هُوَ رَدُّ الْحَقِّ عَلَى قَائِلِهِ مَعَ الْعِلْمِ بِأَنَّ الْحَقَّ مَعَ الْقَائِلِ فَيَسْتَعْظِمُ أَنْ يَرْجِعَ إِلَى الْحَقِّ مِنْ أَجْلِ ذَلِكَ وَاسْتِحْقَارُ النَّاسِ وَهُوَ أَنْ يَنْظُرَ إِلَى غَيْرِهِ بِعَيْنِ الِاحْتِقَارِ وَإِلَى نَفْسِهِ بِعَيْنِ التَّعْظِيمِ وَهُوَ مِنَ الْكَبَائِرِ قَالَ رَسُولُ اللَّهِ ﷺ لا يَدْخُلُ الْجَنَّةَ مَنْ كَانَ فِى قَلْبِهِ مِثْقَالُ ذَرَّةٍ مِنْ كِبْرٍ، أَىْ لا يَدْخُلُهَا مَعَ الأَوَّلِينَ بَلْ يَدْخُلُهَا بَعْدَ سَبْقِ عَذَابٍ إِنْ لَمْ يَعْفُ اللَّهُ عَنْهُ. وَالتَّكَبُّرُ مَذْمُومٌ فِى وَجْهِ الْمُؤْمِنِ وَغَيْرِ الْمُؤْمِنِ لِذَلِكَ الأَنْبِيَاءُ لَمَّا دَعَوُا الْكُفَّارَ إِلَى الدِّينِ مَا كَانُوا مُتَكَبِّرِينَ عَلَيْهِمْ لِأَنَّهُمْ لَوْ كَانُوا مُتَكَبِّرِينَ فِى وُجُوهِ الْكُفَّارِ لَنَفَرُوا مِنْهُمْ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(479) مَا هُوَ الْحِقْدُ الْمُحَرَّمُ.</p><p class=\"answer\">الْحِقْدُ مِنْ مَعَاصِى الْقَلْبِ وَهُوَ إِضْمَارُ الْعَدَاوَةِ لِلْمُسْلِمِ مَعَ الْعَزْمِ عَلَى الْعَمَلِ بِمُقْتَضَاهُ فَمَنْ عَزَمَ عَلَى إِيذَاءِ مُسْلِمٍ بِالْقَوْلِ أَوِ الْفِعْلِ كَأَنْ قَالَ فِى نَفْسِهِ إِنْ تَمَكَّنْتُ مِنْ فُلانٍ أَفْعَلُ بِهِ كَذَا وَكَذَا مِمَّا فِيهِ إِضْرَارٌ بِهِ عَصَى اللَّهَ تَعَالَى. أَمَّا إِذَا كَرِهَهُ بِقَلْبِهِ فَقَطْ وَلَمْ يَعْمَلْ بِمُقْتَضَى ذَلِكَ فَلا مَعْصِيَةَ عَلَيْهِ. وَأَمَّا كَرَاهِيَةُ نَبِىٍّ مِنَ الأَنْبِيَاءِ فَهُوَ كُفْرٌ وَالْعِيَاذُ بِاللَّهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(480) مَا هُوَ الْحَسَدُ الْمُحَرَّمُ.</p><p class=\"answer\">الْحَسَدُ الْمُحَرَّمُ هُوَ أَنْ يَتَمَنَّى زَوَالَ النِّعْمَةِ عَنِ الْمُسْلِمِ مَعَ السَّعْىِ لِذَلِكَ بِالْقَوْلِ أَوِ الْفِعْلِ أَمَّا إِذَا لَمْ يَسْعَ فَلا يُكْتَبُ عَلَيْهِ مَعْصِيَةٌ وَأَمَّا إِنْ تَمَنَّى لَهُ الْوُقُوعَ فِى مَعْصِيَةٍ أَوْ تَرْكَ وَاجِبٍ فَقَدْ عَصَى اللَّهَ بِتَمَنِّيهِ وَإِنْ لَمْ يَسْعَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(481) تَكَلَّمْ عَنِ الْمَنِّ بِالصَّدَقَةِ.</p><p class=\"answer\">الْمَنُّ بِالصَّدَقَةِ مِنَ الْمَعَاصِى الْكَبِيرَةِ وَهُوَ أَنْ يُعَدِّدَ نِعْمَتَهُ عَلَى ءَاخِذِهَا لِيَكْسِرَ قَلْبَهُ كَأَنْ يَقُولَ لِمَنْ تَصَدَّقَ عَلَيْهِ أَلَمْ أُعْطِكَ كَذَا مِنَ الْمَالِ يَوْمَ كَذَا وَكَذَا حِينَ كُنْتَ مُحْتَاجًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(482) مَا هُوَ الإِصْرَارُ عَلَى الذَّنْبِ الْمَعْدُودُ مِنَ الْكَبَائِرِ.</p><p class=\"answer\">الإِصْرَارُ عَلَى الذَّنْبِ الْمَعْدُودُ مِنَ الْكَبَائِرِ هُوَ أَنْ يُدَاوِمَ الشَّخْصُ عَلَى فِعْلِ الصَّغَائِرِ بِحَيْثُ تَغْلِبُ صَغَائِرُهُ عَلَى طَاعَاتِهِ مِنْ حَيْثُ الْعَدَدُ بِالنِّسْبَةِ لِمَا مَضَى مِنْ عُمُرِهِ فَيَصِيرُ بِذَلِكَ وَاقِعًا فِى ذَنْبٍ كَبِيرٍ. فَمَنْ وَقَعَ فِى مَعْصِيَةِ الإِصْرَارِ عَلَى الذَّنْبِ يَلْزَمُهُ التَّوْبَةُ مِنْهَا وَمِنَ الصَّغَائِرِ لِذَلِكَ عَلَى الْعَبْدِ أَنْ يَجْتَهِدَ فِى اجْتِنَابِ الْمَعَاصِى صَغِيرِهَا وَكَبِيرِهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(483) مَا هُوَ سُوءُ الظَّنِّ بِاللَّهِ وَسُوءُ الظَّنِّ بِعِبَادِ اللَّهِ.</p><p class=\"answer\">سُوءُ الظَّنِّ بِاللَّهِ هُوَ أَنْ يَظُنَّ الْعَبْدُ بِرَبِّهِ أَنَّهُ لا يَرْحَمُهُ بَلْ يُعَذِّبُهُ وَأَمَّا سُوءُ الظَّنِّ بِعِبَادِ اللَّهِ فَهُوَ أَنْ يَظُنَّ بِعِبَادِ اللَّهِ الْمُؤْمِنِينَ السُّوءَ بِدُونِ دَلِيلٍ مُعْتَبَرٍ كَأَنْ يُسْرَقَ لَهُ مَالٌ فَيَظُنَّ بِفُلانٍ أَنَّهُ السَّارِقُ بِغَيْرِ دَلِيلٍ. (484) مَا حُكْمُ التَّكْذِيبِ بِالْقَدَرِ.</p></div>\n<p>اعْلَمْ أَنَّ الْقَدَرَ صِفَةٌ لِلَّهِ وَمَعْنَى الْقَدَرِ إِيجَادُ اللَّهِ الأَشْيَاءَ عَلَى حَسَبِ عِلْمِهِ وَمَشِيئَتِهِ الأَزَلِيَيْنِ. فَيَجِبُ اعْتِقَادُ أَنَّ كُلَّ مَا دَخَلَ فِى الْوُجُودِ مِنْ خَيْرٍ أَوْ شَرٍّ فَهُوَ بِتَقْدِيرِ اللَّهِ الأَزَلِىِّ وَهَذَا مَعْنَى قَوْلِهِ ﷺ وَتُؤْمِنَ بِالْقَدَرِ خَيْرِهِ وَشَرِّهِ. أَمَّا مَنْ أَنْكَرَ الْقَدَرَ فَهُوَ كَافِرٌ بِالإِجْمَاعِ لِتَكْذِيبِهِ الْقُرْءَانَ قَالَ اللَّهُ تَعَالَى ﴿إِنَّا كُلَّ شَىْءٍ خَلَقْنَاهُ بقَدَرٍ﴾.</p>\n<div class=\"qa-item\"><p class=\"question\">(485) مَا حُكْمُ الْفَرَحِ بِالْمَعْصِيَةِ.</p><p class=\"answer\">يَحْرُمُ الْفَرَحُ بِالْمَعْصِيَةِ الصَّادِرَةِ مِنْهُ أَوْ مِنْ غَيْرِهِ. وَالْفَرَحُ بِالْمَعْصِيَةِ الْكَبِيرَةِ كَبِيرَةٌ أَمَّا الْفَرَحُ بِالْمَعْصِيَةِ الصَّغِيرَةِ فَهِىَ صَغِيرَةٌ إِلَّا إِذَا فَرِحَ بِهَا لِأَنَّهَا مَعْصِيَةٌ لِلَّهِ فَتَكُونُ كَبِيرَةً وَأَمَّا الْفَرَحُ بِكُفْرِ الْغَيْرِ فَهُوَ كُفْرٌ وَالْعِيَاذُ بِاللَّهِ تَعَالَى.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(486) مَا حُكْمُ الْغَدْرِ.</p><p class=\"answer\">الْغَدْرُ مِنْ كَبَائِرِ الذُّنُوبِ وَهُوَ كَأَنْ يَقُولَ لِشَخْصٍ أَنْتَ فِى حِمَايَتِى ثُمَّ يَقْتُلَهُ أَوْ يَدُلَّ عَلَيْهِ مَنْ يَقْتُلُهُ. وَمِنَ الْغَدْرِ الْمُحَرَّمِ أَنْ يَغْدِرَ بِالإِمَامِ بَعْدَ أَنْ يُبَايِعَهُ بِأَنْ يَعُودَ مُحَارِبًا لَهُ أَوْ يُعْلِنَ تَمَرُّدَهُ عَلَى طَاعَتِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(487) مَا مَعْنَى الْمَكْرِ.</p><p class=\"answer\">الْمَكْرُ وَالْخَدِيعَةُ بِمَعْنًى وَاحِدٍ وَهُوَ إِيصَالُ الضَّرَرِ إِلَى الْمُسْلِمِ بِطَرِيقَةٍ خَفِيَّةٍ بِاسْتِعْمَالِ حِيلَةٍ قَالَ رَسُولُ اللَّهِ ﷺ الْمَكْرُ وَالْخَدِيعَةُ فِى النَّارِ رَوَاهُ الْحَاكِمُ فِى الْمُسْتَدْرَكِ. فَمَنْ مَكَرَ بِأَحَدٍ مِنَ الْمُسْلِمِينَ وَقَعَ فِى ذَنْبٍ كَبِيرٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(488) مَا حُكْمُ بُغْضِ الصَّحَابَةِ.</p><p class=\"answer\">الصَّحَابَةُ هُمْ أَصْحَابُ رَسُولِ اللَّهِ ﷺ وَبُغْضُهُمْ أَىْ كَرَاهِيَتُهُمْ جُمْلَةً كُفْرٌ لِأَنَّ الصَّحَابَةَ هُمُ الَّذِينَ نَقَلُوا الْقُرْءَانَ وَأُمُورَ الدِّينِ عَنِ الرَّسُولِ ﷺ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(489) مَا حُكْمُ الْبُخْلِ بِمَا أَوْجَبَ اللَّهُ.</p><p class=\"answer\">الْبُخْلُ بِمَا أَوْجَبَ اللَّهُ مِنَ الْكَبَائِرِ كَالْبُخْلِ عَنْ أَدَاءِ الزَّكَاةِ لِلْمُسْتَحِقِّينَ وَالْبُخْلِ عَنْ دَفْعِ نَفَقَةِ الزَّوْجَةِ وَالأَطْفَالِ وَالْبُخْلِ عَنْ نَفَقَةِ الأَبَوَيْنِ الْفَقِيرَيْنِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(490) مَا هُوَ الشُّحُّ وَمَا حُكْمُهُ.</p><p class=\"answer\">الشُّحُّ هُوَ الْبُخْلُ الشَّدِيدُ كَالِامْتِنَاعِ عَنْ أَدَاءِ الزَّكَاةِ وَنَفَقَةِ الزَّوْجَةِ وَالأَوْلادِ وَهُوَ مِنَ الْكَبَائِرِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(491) مَا حُكْمُ الِاسْتِهَانَةِ بِمَا عَظَّمَ اللَّهُ.</p><p class=\"answer\">الِاسْتِهَانَةُ بِمَا عَظَّمَ اللَّهُ مِنَ مَعَاصِى الْقَلْبِ وَهِىَ الإِخْلالُ بِالتَّعْظِيمِ الْوَاجِبِ كَمَسِّ الْمُصْحَفِ بِغَيْرِ وُضُوءٍ لِقَوْلِهِ تَعَالَى ﴿لا يَمَسُّهُ إِلَّا الْمُطَهَّرُونَ﴾. وَمِنَ الِاسْتِهَانَةِ بِمَا عَظَّمَ اللَّهُ تَقْلِيبُ أَوْرَاقِ الْمُصْحَفِ بِالإِصْبَعِ الَّذِى عَلَيْهِ جِرْمُ الرِّيقِ أَمَّا إِذَا كَانَ عَلَيْهِ أَثَرُ الرِّيقِ بِدُونِ جِرْمٍ أَىْ شَىْءٌ خَفِيفٌ مِنَ الرُّطُوبَةِ فَلَيْسَ حَرَامًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(492) مَا حُكْمُ التَّصْغِيرِ لِمَا عَظَّمَ اللَّهُ مِنْ طَاعَةٍ أَوْ مَعْصِيَةٍ أَوْ قُرْءَانٍ أَوْ عِلْمٍ أَوْ جَنَّةٍ أَوْ عَذَابِ نَارٍ.</p><p class=\"answer\">التَّصْغِيرُ أَىِ التَّحْقِيرُ لِمَا عَظَّمَ اللَّهُ كُفْرٌ كَالَّذِى يَقُولُ لَيْسَ الشَّأْنُ بِالصَّلاةِ إِنَّمَا الشَّأْنُ فِى حُسْنِ الْمُعَامَلَةِ مَعَ النَّاسِ أَوْ يَرَى مَا تَوَعَّدَ اللَّهُ بِهِ عِبَادَهُ مِنَ الْعِقَابِ فِى الآخِرَةِ شَيْئًا هَيِّنًا. وَمِنَ الِاسْتِهَانَةِ بِمَا عَظَّمَ اللَّهُ الِاسْتِهَانَةُ بِشَىْءٍ مِنَ الْقُرْءَانِ أَوْ بِعِلْمِ الدِّينِ كَقَوْلِ سَيِّد قُطُب زَعِيمِ حِزْبِ الإِخْوَانِ بِأَنَّ تَعَلُّمَ الْفِقْهِ مَضْيَعَةٌ لِلْعُمْرِ وَالأَجْرِ وَهَذَا تَكْذِيبٌ لِلْقُرْءَانِ وَالْحَدِيثِ. وَمِنَ الِاسْتِهَانَةِ بِمَا عَظَّمَ اللَّهُ الِاسْتِهَانَةُ بِالْجَنَّةِ أَوْ بِعَذَابِ النَّارِ كَقَوْلِ بَعْضِ السُّفَهَاءِ الْجَنَّةُ لُعْبَةُ الصِّبْيَانِ وَقَوْلِ بَعْضٍ غَدًا نَتَدَفَّأُ بِنَارِ جَهَنَّمَ.</p></div>", "wordCount": 1150, "paraCount": 40}, {"id": "maasi_batn", "title": "فصل في معاصي البطن", "icon": "fa-utensils", "desc": "معاصي البطن من أكل الحرام والخمور", "content": "<p>فَصْلٌ فِى مَعَاصِى الْبَطْنِ</p>\n<div class=\"qa-item\"><p class=\"question\">(493) مَا حُكْمُ أَكْلِ مَالِ الرِّبَا.</p><p class=\"answer\">يَحْرُمُ أَكْلُ مَالِ الرِّبَا أَىِ الِانْتِفَاعُ بِهِ وَهُوَ مِنَ الْكَبَائِرِ لِحَدِيثِ أَبِى دَاوُدَ لَعَنَ رَسُولُ اللَّهِ ﷺ ءَاكِلَ الرِّبَا وَمُوكِلَهُ وَكَاتِبَهُ وَشَاهِدَهُ وَفِى رِوَايَةٍ لِمُسْلِمٍ وَشَاهِدَيْهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(494) مَا حُكْمُ أَكْلِ مَالِ الْمَكْسِ.</p><p class=\"answer\">يَحْرُمُ أَكْلُ مَالِ الْمَكْسِ وَهُوَ مِنَ الْكَبَائِرِ وَالْمَكْسُ هُوَ الضَّرَائِبُ الَّتِى تُؤْخَذُ مِنَ الْمُسْلِمِينَ بِغَيْرِ حَقٍّ وَالَّذِى يَعْمَلُ فِيهِ بِالْكِتَابَةِ عَلَيْهِ مَعْصِيَةٌ كَبِيرَةٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(495) مَا حُكْمُ أَكْلِ مَالِ الْغَصْبِ.</p><p class=\"answer\">أَكْلُ مَالِ الْغَصْبِ مِنَ الْكَبَائِرِ وَالْغَصْبُ هُوَ الِاسْتِيلاءُ عَلَى حَقِّ الْغَيْرِ ظُلْمًا اعْتِمَادًا عَلَى الْقُوَّةِ. أَمَّا مَا يَأْخُذُهُ الْحَاكِمُ مِنْ أَمْوَالِ الأَغْنِيَاءِ لِسَدِّ الضَّرُورَاتِ إِذَا لَمْ يُوجَدْ فِى بَيْتِ الْمَالِ مَا يَكْفِى لِذَلِكَ فَإِنَّهُ جَائِزٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(496) مَا حُكْمُ أَكْلِ مَالِ السَّرِقَةِ.</p><p class=\"answer\">السَّرِقَةُ هِىَ أَخْذُ مَالِ الْغَيْرِ خُفْيَةً بِغَيْرِ حَقٍّ وَأَكْلُ مَالِ السَّرِقَةِ حَرَامٌ مِنَ الْكَبَائِرِ وَيَجِبُ رَدُّهُ إِلَى صَاحِبِهِ قَالَ رَسُولُ اللَّهِ ﷺ إِنَّ أُنَاسًا يَتَخَوَّضُونَ فِى مَالِ اللَّهِ بِغَيْرِ حَقٍّ فَلَهُمُ النَّارُ يَوْمَ الْقِيَامَةِ رَوَاهُ الْبُخَارِىُّ مِنْ حَدِيثِ خَوْلَةَ الأَنْصَارِيَّةِ رَضِىَ اللَّهُ عَنْهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(497) مَا حُكْمُ شُرْبِ الْخَمْرِ.</p><p class=\"answer\">يَحْرُمُ شُرْبُ الْخَمْرِ وَهُوَ مِنَ الْكَبَائِرِ قَالَ رَسُولُ اللَّهِ ﷺ أَتَانِى جِبْرِيلُ عَلَيْهِ السَّلامُ فَقَالَ يَا مُحَمَّدُ إِنَّ اللَّهَ لَعَنَ الْخَمْرَ وَعَاصِرَهَا وَمُعْتَصِرَهَا وَبَائِعَهَا وَمُبْتَاعَهَا وَشَارِبَهَا وَءَاكِلَ ثَمَنِهَا وَحَامِلَهَا وَالْمَحْمُولَةَ إِلَيْهِ وَسَاقِيَهَا وَمُسْتَقِيَهَا رَوَاهُ الإِمَامُ أَحْمَدُ. وَلَيْسَ فِى الأَنْبِيَاءِ مَنْ شَرِبَ الْخَمْرَ أَوْ شَجَّعَ عَلَى شُرْبِهَا فَالأَنْبِيَاءُ عَلَيْهِمُ السَّلامُ لا يَحُثُّونَ أُمَمَهُمْ عَلَى شُرْبِ الْخَمْرِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(498) مَا حُكْمُ أَكْلِ الْمُسْكِرِ وَالنَّجِسِ وَالْمُسْتَقْذَرِ.</p><p class=\"answer\">يَحْرُمُ أَكْلُ الْمُسْكِرِ كَالْخَمْرِ وَالنَّجِسِ كَالدَّمِ وَالْمُسْتَقْذَرِ كَالْمَنِىِّ وَالْمُسْتَقْذَرُ هُوَ الَّذِى تَعَافُهُ النَّفْسُ أَىْ تَنْفِرُ مِنْهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(499) مَا حُكْمُ الْمُخَدِّرَاتِ فِى الإِسْلامِ.</p><p class=\"answer\">اعْلَمْ أَنَّ كُلَّ مَا يُؤَدِّى بِالإِنْسَانِ إِلَى الْهَلاكِ يَحْرُمُ فِعْلُهُ وَتَعَاطِيهِ وَهَذَا يُفْهَمُ مِنْ قَوْلِهِ تَعَالَى ﴿وَلا تَقْتُلُوا أَنْفُسَكُمْ﴾. فَيُفْهَمُ مِنْ ذَلِكَ أَنَّ تَعَاطِىَ الْمُخَدِّرَاتِ كَالْحَشِيشَةِ الْمَعْرُوفَةِ وَالأَفْيُونِ حَرَامٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(500) مَا حُكْمُ أَكْلِ اللَّحْمِ الْمَشْكُوكِ فِى حِلِّهِ.</p><p class=\"answer\">لا يَجُوزُ أَكْلُ اللَّحْمِ الْمَشْكُوكِ فِى حِلِّهِ فَهُوَ كَالْمَيْتَةِ فَاللَّحْمُ أَمْرُهُ مُشَدَّدٌ فِى شَرْعِ اللَّهِ لا يَجُوزُ أَكْلُهُ إِلَّا أَنْ يُعْلَمَ أَنَّهُ ذَبِيحَةُ مُسْلِمٍ أَوْ يَهُودِىٍّ أَوْ نَصْرَانِىٍّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(501) مَا هِىَ شُرُوطُ جَوَازِ الأَكْلِ مِنَ الذَّبِيحَةِ.</p><p class=\"answer\">أَنْ يَكُونَ الذَّابِحُ مُسْلِمًا أَوْ نَصْرَانِيًّا أَوْ يَهُودِيًّا وَأَنْ يَكُونَ الْحَيَوَانُ مَأْكُولًا أَىْ يَحِلُّ أَكْلُهُ وَفِيهِ حَيَاةٌ مُسْتَقِرَّةٌ وَعَلامَةُ اسْتِقْرَارِ الْحَيَاةِ فِيهِ أَنْ تَشْتَدَّ حَرَكَتُهُ بَعْدَ الذَّبْحِ أَوْ يَتَدَفَّقَ دَمُهُ أَىْ يَتَفَجَّرَ بِشِدَّةٍ، وَأَنْ يُقْطَعَ الْمَرِىءُ وَالْحُلْقُومُ بِآلَةٍ حَادَّةٍ وَالْمَرِىءُ مَجْرَى الطَّعَامِ وَالشَّرَابِ وَالْحُلْقُومُ مَجْرَى النَّفَسِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(502) مَا هِىَ سُنَنُ الذَّبْحِ.</p><p class=\"answer\">يُسَنُّ لِلذَّابِحِ أَنْ يُحِدَّ شَفْرَتَهُ وَيُرِيحَ ذَبِيحَتَهُ وَيُوَجِّهَ الذَّبِيحَةَ إِلَى الْقِبْلَةِ وَيُسَمِّىَ اللَّهَ عِنْدَ الذَّبْحِ وَيُصَلِّىَ عَلَى النَّبِىِّ ﷺ وَأَنْ يَذْبَحَ الإِبِلَ مَعْقُولَةً مِنْ قِيَامٍ وَيَذْبَحَ الْبَقَرَ وَالْغَنَمَ مُضْجَعَةً وَلا يَكْسِرَ عُنُقَهَا وَلا يَسْلَخَ جِلْدَهَا حَتَّى تَبْرُدَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(503) مَا حُكْمُ تَرْكِ التَّسْمِيَةِ عِنْدَ الذَّبْحِ.</p><p class=\"answer\">مَنْ لَمْ يُسَمِّ اللَّهَ عِنْدَ الذَّبْحِ لا يَحِلُّ الأَكْلُ مِنَ الذَّبِيحَةِ فِى مَذْهَبِ مَالِكٍ وَأَبِى حَنِيفَةَ وَأَحْمَدَ إِلَّا إِذَا نَسِىَ أَنْ يُسَمِّىَ اللَّهَ عِنْدَ ذَبْحِهَا فَيَجُوزُ وَيَجُوزُ فِى مَذْهَبِ الشَّافِعِىِّ الأَكْلُ مِنَ الذَّبِيحَةِ مَعَ الْكَرَاهَةِ وَلَوْ لَمْ يُسَمِّ اللَّهَ عَمْدًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(504) هَلْ يَجُوزُ الأَكْلُ مِنْ ذَبَائِحِ أَهْلِ الْكِتَابِ الْيَهُودِ وَالنَّصَارَى.</p><p class=\"answer\">يَجُوزُ الأَكْلُ مِنْ ذَبَائِحِهِمْ إِذَا ذَبَحُوا كَمَا يَذْبَحُ الْمُسْلِمُونَ لِقَوْلِهِ تَعَالَى ﴿وَطَعَامُ الَّذِينَ أُوتُوا الْكِتَابَ حِلٌّ لَّكُمْ﴾ أَمَّا إِذَا ذَكَرُوا اسْمَ غَيْرِ اللَّهِ عِنْدَ ذَبْحِهَا فَلا تَحِلُّ. وَأَمَّا غَيْرُ أَهْلِ الْكِتَابِ مِنَ الْكُفَّارِ فَلا يَجُوزُ الأَكْلُ مِنْ ذَبَائِحِهِمْ وَلَوْ ذَبَحُوا كَمَا يَذْبَحُ الْمُسْلِمُونَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(505) مَا حُكْمُ الذَّبْحِ بِالآلَةِ.</p><p class=\"answer\">لَوْ صَارَتِ الآلَةُ تَقْطَعُ الْمَرِىءَ وَالْحُلُقُومَ وَحْدَهَا بِوَاسِطَةِ تَحْرِيكِ الْكَهْرَبَاءِ لَهَا مِنْ غَيْرِ أَنْ يُحَرِّكَهَا مُسْلِمٌ أَوْ كِتَابِىٌّ لا يَحِلُّ أَكْلُهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(506) مَا حُكْمُ أَكْلِ مَالِ الْيَتِيمِ.</p><p class=\"answer\">يَحْرُمُ أَكْلُ مَالِ الْيَتِيمِ بِغَيْرِ حَقٍّ وَهُوَ مِنَ الْكَبَائِرِ لِقَوْلِهِ تَعَالَى ﴿إِنَّ الَّذِينَ يَأْكُلُونَ أَمْوَالَ الْيَتَامَى ظُلْمًا إِنَّمَا يَأْكُلُونَ فِى بُطُونِهِمْ نَارًا﴾. وَالْيَتِيمُ هُوَ مَنْ مَاتَ أَبُوهُ وَلَمْ يَكُنْ بَالِغًا فَالَّذِى يَأْكُلُ مَالَ الْيَتِيمِ بِغَيْرِ حَقٍّ يُبْعَثُ مِنْ قَبْرِهِ وَفَمُهُ يَتَأَجَّجُ نَارًا. وَالَّذِى يَتَوَلَّى التَّصَرُّفَ بِمَالِ الْيَتِيمِ هُوَ الرَّجُلُ الصَّالِحُ مِنْ أَهْلِ الْبَلَدِ يَتَصَرَّفُ بِهِ لِمَصْلَحَةِ الْيَتِيمِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(507) مَا حُكْمُ أَكْلِ مَالِ الأَوْقَافِ.</p><p class=\"answer\">الْوَقْفُ هُوَ عَطِيَّةٌ مُؤَبَّدَةٌ وَأَكْلُ مَالِ الأَوْقَافِ عَلَى مَا يُخَالِفُ شَرْطَ الْوَاقِفِ حَرَامٌ فَإِنْ وَقَفَ مُسْلِمٌ مَاءً لِلشُّرْبِ فَلا يَجُوزُ اسْتِعْمَالُهُ فِى غَيْرِ ذَلِكَ قَالَ رَسُولُ اللَّهِ ﷺ إِنَّ أُنَاسًا يَتَخَوَّضُونَ فِى مَالِ اللَّهِ بِغَيْرِ حَقٍّ فَلَهُمُ النَّارُ يَوْمَ الْقِيَامَةِ رَوَاهُ الْبُخَارِىُّ وَقَالَ عَلَيْهِ الصَّلاةُ وَالسَّلامُ الْمُسْلِمُونَ عِنْد شُرُوطِهِم رَوَاهُ الْبَيْهَقِىُّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(508) مَا حُكْمُ الْمَأْخُوذِ بِوَجْهِ الْحَيَاءِ.</p><p class=\"answer\">مَنْ أَخَذَ شَيْئًا مِنْ مُسْلِمٍ بِطَرِيقِ الْحَيَاءِ لا يَحِلُّ لَهُ الِانْتِفَاعُ بِهِ وَلا يَدْخُلُ فِى مِلْكِهِ وَيَجِبُ عَلَيْهِ أَنْ يَرُدَّهُ قَالَ رَسُولُ اللَّهِ ﷺ لا يَحِلُّ مَالُ امْرِئٍ مُسْلِمٍ إِلَّا بِطِيبِ نَفْسٍ مِنْهُ رَوَاهُ الْبَيْهَقِىُّ. أَمَّا إِذَا اشْتَرَاهُ اسْتِحْيَاءً فَلا يَحْرُمُ الِانْتِفَاعُ بِهِ.</p></div>", "wordCount": 700, "paraCount": 33}, {"id": "maasi_ayn", "title": "فصل في معاصي العين", "icon": "fa-eye", "desc": "معاصي العين من النظر المحرم", "content": "<p>فَصْلٌ فِى مَعَاصِى الْعَيْنِ</p>\n<div class=\"qa-item\"><p class=\"question\">(509) مَا حُكْمُ نَظَرِ الرَّجُلِ إِلَى الْمَرْأَةِ الأَجْنَبِيَّةِ.</p><p class=\"answer\">يَحْرُمُ النَّظَرُ بِشَهْوَةٍ إِلَى وَجْهِ الأَجْنَبِيَّةِ وَكَفَّيْهَا وَإِلَى غَيْرِ الْوَجْهِ وَالْكَفَّيْنِ وَلَوْ بِلا شَهْوَةٍ قَالَ رَسُولُ اللَّهِ ﷺ وَزِنَى الْعَيْنَيْنِ النَّظَرُ رَوَاهُ الْبُخَارِىُّ. وَالْمُرَادُ بِالأَجْنَبِيَّةِ غَيْرُ مَحَارِمِهِ وَزَوْجَتِهِ وَأَمَتِهِ الَّتِى تَحِلُّ لَهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(510) مَا حُكْمُ نَظَرِ الْمَرْأَةِ إِلَى الرَّجُلِ الأَجْنَبِىِّ.</p><p class=\"answer\">يَحْرُمُ النَّظَرُ إِلَى مَا بَيْنَ سُرَّتِهِ وَرُكْبَتِهِ وَيَجُوزُ النَّظَرُ إِلَى مَا سِوَى ذَلِكَ بِلا شَهْوَةٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(511) مَا هِىَ عَوْرَةُ الرَّجُلِ مَعَ الرَّجُلِ.</p><p class=\"answer\">عَوْرَةُ الرَّجُلِ مَعَ الرَّجُلِ مَا بَيْنَ سُرَّتِهِ وَرُكْبَتِهِ. وَالْعَوْرَةُ هِىَ الْقَدْرُ الَّذِى يَجِبُ سَتْرُهُ مِنَ الْجِسْمِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(512) مَا هِىَ عَوْرَةُ الْمَرْأَةِ الْمُسْلِمَةِ مَعَ الْمُسْلِمَةِ.</p><p class=\"answer\">عَوْرَةُ الْمُسْلِمَةِ مَعَ الْمُسْلِمَةِ مَا بَيْنَ السُّرَّةِ وَالرُّكْبَةِ فَلا يَجُوزُ لِلْمَرْأَةِ الْمُسْلِمَةِ أَنْ تَكْشِفَ عَوْرَتَهَا أَمَامَ الْمُسْلِمَةِ كَأُمِّهَا وَأُخْتِهَا وَبِنْتِهَا وَغَيْرِهِنَّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(513) مَا هِىَ عَوْرَةُ الْمَرْأَةِ الْحُرَّةِ مَعَ الرَّجُلِ الأَجْنَبِىِّ.</p><p class=\"answer\">عَوْرَةُ الْمَرْأَةِ الْحُرَّةِ مَعَ الرَّجُلِ الأَجْنَبِىِّ جَمِيعُ بَدَنِهَا إِلَّا الْوَجْهَ وَالْكَفَّيْنِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(514) مَا هِىَ عَوْرَةُ الْمُسْلِمَةِ مَعَ الْمَرْأَةِ غَيْرِ الْمُسْلِمَةِ.</p><p class=\"answer\">اخْتَلَفَ الْعُلَمَاءُ فِى ذَلِكَ فَقَالَ بَعْضُهُمْ لا يَجُوزُ لِلْمُسْلِمَةِ أَنْ تَكْشِفَ مِنْ جَسَدِهَا أَمَامَ غَيْرِ الْمُسْلِمَةِ إِلَّا مَا تَكْشِفُهُ عِنْدَ الْعَمَلِ فِى نَحْوِ الْمَطْبَخِ وَتَنْظِيفِ الْبَيْتِ كَالرَّأْسِ وَالْعُنُقِ وَالسَّاعِدِ وَنِصْفِ السَّاقِ وَقَالَ بَعْضُهُمْ لا يَجُوزُ لَهَا أَنْ تَكْشِفَ أَمَامَهَا إِلَّا مَا تَكْشِفُهُ أَمَامَ الرِّجَالِ الأَجَانِبِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(515) مَا حُكْمُ التَّدَاوِى فِى الإِسْلامِ.</p><p class=\"answer\">قَالَ الْعُلَمَاءُ التَّدَاوِى مُبَاحٌ وَإِنْ نَوَى نِيَّةً حَسَنَةً يَكُونُ مُسْتَحَبًّا كَأَنْ نَوَى أَنْ يَتَدَاوَى لِيَتَقَوَّى عَلَى طَاعَةِ اللَّهِ أَوْ لِيَتَنَشَّطَ لِلْعَمَلِ حَتَّى يُنْفِقَ عَلَى أَهْلِهِ. لَكِنْ إِنْ قُطِعَتْ يَدُهُ مَثَلًا قَالُوا لا يَجُوزُ لَهُ تَرْكُهَا تَنْزِفُ حَتَّى يَمُوتَ بَلْ يَجِبُ أَنْ يَتَدَاوَى فِى هَذِهِ الْحَالِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(516) هَلْ يَجِبُ عَلَى الْمَرْأَةِ أَنْ تُغَطِّىَ رَأْسَهَا أَمَامَ الأَجْنَبِىِّ الْمُرَاهِقِ.</p><p class=\"answer\">يَجِبُ عَلَى الْمَرْأَةِ أَنْ تُغَطِّىَ رَأْسَهَا أَمَامَ الأَجْنَبِىِّ الْمُرَاهِقِ وَلا يَجِبُ عَلَيْهَا أَنْ تُغَطِّىَ رَأْسَهَا أَمَامَ الصَّبِىِّ غَيْرِ الْمُرَاهِقِ. وَالْمُرَاهِقُ هُوَ مَنْ قَارَبَ الْبُلُوغَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(517) هَلْ يَجِبُ عَلَى الأَهْلِ أَمْرُ الْبِنْتِ الْمُرَاهِقَةِ بِسَتْرِ بَدَنِهَا أَمَامَ الأَجَانِبِ.</p><p class=\"answer\">يَجِبُ عَلَى الأَهْلِ أَمْرُ الْبِنْتِ الْمُرَاهِقَةِ بِسَتْرِ جَمِيعِ بَدَنِهَا مَا عَدَا الْوَجْهَ وَالْكَفَّيْنِ أَمَامَ الأَجَانِبِ أَىْ غَيْرِ الْمَحَارِمِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(518) مَا هِىَ عَوْرَةُ الْمَرْأَةِ مَعَ مَحَارِمِهَا.</p><p class=\"answer\">عَوْرَةُ الْمَرْأَةِ مَعَ مَحَارِمِهَا كَأَبِيهَا مَا بَيْنَ السُّرَّةِ وَالرُّكْبَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(519) هَلْ يَجُوزُ لِلأُمِّ أَنْ تَكْشِفَ فَخِذَهَا أَمَامَ وَلَدِهَا الْمُمَيِّزِ.</p><p class=\"answer\">لا يَجُوزُ لِلأُمِّ أَنْ تَكْشِفَ فَخِذَهَا أَمَامَ وَلَدِهَا الْمُمَيِّزِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(520) مَا حُكْمُ كَشْفِ الْعَوْرَةِ فِى الْخَلْوَةِ.</p><p class=\"answer\">يَحْرُمُ عَلَى الرَّجُلِ وَالْمَرْأَةِ كَشْفُ الْعَوْرَةِ فِى الْخَلْوَةِ لِغَيْرِ حَاجَةٍ وَعَوْرَةُ الرَّجُلِ فِى الْخَلْوَةِ السَّوْأَتَانِ أَىِ الْقُبُلُ وَالدُّبُرُ وَعَوْرَةُ الْمَرْأَةِ فِى الْخَلْوَةِ مَا بَيْنَ سُرَّتِهَا وَرُكْبَتِهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(521) مَا الدَّلِيلُ عَلَى فَرْضِيَّةِ الْحِجَابِ عَلَى الْمَرْأَةِ.</p><p class=\"answer\">اعْلَمْ أَنَّ وُجُوبَ تَغْطِيَةِ الْمَرْأَةِ لِرَأْسِهَا أَمَامَ الأَجَانِبِ ثَابِتٌ بِالْقُرْءَانِ وَالْحَدِيثِ وَالإِجْمَاعِ أَىْ إِجْمَاعِ الْعُلَمَاءِ الْمُجْتَهِدِينَ بِلا خِلافٍ بَيْنَهُمْ فَمَنْ أَنْكَرَ ذَلِكَ فَهُوَ كَافِرٌ مُكَذِّبٌ لِلَّهِ وَرَسُولِهِ قَالَ اللَّهُ تَعَالَى ﴿وَلا يُبْدِينَ زِينَتَهُنَّ إِلَّا مَا ظَهَرَ مِنْهَا﴾. وَالْمُرَادُ بِقَوْلِهِ تَعَالَى ﴿وَلا يُبْدِينَ زِينَتَهُنَّ﴾ الزِّينَةُ الْبَاطِنَةُ أَىْ مَوَاضِعُ الزِّينَةِ مِنَ الْبَدَنِ كَالْمَوَاضِعِ الَّتِى يَكُونُ فِيهَا الْحَلَقُ فِى الأُذُنِ وَالْخَلْخَالُ فِى الرِّجْلِ وَالسِّوَارُ فِى الْيَدِ وَالْعِقْدُ فِى الصَّدْرِ. وَالْمُرَادُ بِقَوْلِهِ تَعَالَى ﴿إِلَّا مَا ظَهَرَ مِنْهَا﴾ الْوَجْهُ وَالْكَفَّانِ وَهُوَ قَوْلُ ابْنِ عَبَّاسٍ وَعَائِشَةَ وَالْمِسْوَرِ ابْنِ مَخْرَمَةَ وَسَعِيدِ بنِ جُبَيْرٍ بَلْ وَقَالَ ذَلِكَ جُمْهُورُ الْمُفَسِّرِينَ. وَوَرَدَ أَنَّ الرَّسُولَ ﷺ دَخَلَ عَلَى السَّيِّدَةِ عَائِشَةَ رَضِىَ اللَّهُ عَنْهَا وَكَانَ عِنْدَهَا فَتَاةٌ بَالِغَةٌ يَظْهَرُ مِنْهَا بَعْضُ بَدَنِهَا فَقَالَ رَسُولُ اللَّهِ ﷺ إِنَّ الْمَرْأَةَ إِذَا عَرَكَتْ (أَىْ بَلَغَتْ) لا يَجُوزُ أَنْ يُرَى مِنْهَا إِلَّا هَذَا (وَأَشَارَ إِلَى الْوَجْهِ) وَهَذَا (وَقَبَضَ عَلَى سَاعِدِهِ) ذَكَرَهُ الطَّبَرِىُّ فِى تَفْسِيرِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(522) مَا حُكْمُ النَّظَرِ بِالِاسْتِحْقَارِ إِلَى الْمُسْلِمِ.</p><p class=\"answer\">يَحْرُمُ النَّظَرُ بِالِاسْتِحْقَارِ إِلَى الْمُسْلِمِ لِفَقْرِهِ أَوْ قُبْحِ مَنْظَرِهِ أَوْ نَحْوِ ذَلِكَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(523) مَا حُكْمُ النَّظَرِ فِى بَيْتِ الْغَيْرِ.</p><p class=\"answer\">يَحْرُمُ النَّظَرُ فِى بَيْتِ الْغَيْرِ بِغَيْرِ إِذْنِهِ مِمَّا يَكْرَهُ عَادَةً وَيَتَأَذَّى بِهِ مَنْ فِى الْبَيْتِ كالنَّظَرِ فِى نَحْوِ شَقِّ الْبَابِ أَوْ ثُقْبٍ فِيهِ لِكَوْنِهِ مَكْشُوفَ الْعَوْرَةِ أَوْ لِوُجُودِ زَوْجَتِهِ أَوْ مَحْرَمِهِ كَبِنْتِهِ.</p></div>", "wordCount": 581, "paraCount": 31}, {"id": "maasi_lisan", "title": "فصل في معاصي اللسان", "icon": "fa-comment", "desc": "معاصي اللسان من الغيبة والنميمة والكذب", "content": "<p>فَصْلٌ فِى مَعَاصِى اللِّسَانِ</p>\n<div class=\"qa-item\"><p class=\"question\">(524) مَا هِىَ الْغِيبَةُ وَمَا هُوَ الْبُهْتَانُ.</p><p class=\"answer\">الْغِيبَةُ هِىَ أَنْ تَذْكُرَ أَخَاكَ الْمُسْلِمَ حَيًّا كَانَ أَوْ مَيِّتًا صَغِيرًا كَانَ أَوْ كَبِيرًا بِمَا فِيهِ فِى خَلْفِهِ بِمَا يَكْرَهُ كَأَنْ تَقُولَ فُلانٌ سَىّءُ الْخُلُقِ أَوْ وَلَدُهُ فُلانٌ قَلِيلُ التَّرْبِيَّةِ أَوْ فُلانٌ تَحْكُمُهُ زَوْجَتُهُ. وَالْغِيبَةُ لِأَهْلِ الصَّلاحِ وَالتَّقْوَى مَعْصِيَةٌ كَبِيرَةٌ أَمَّا غِيبَةُ الْمُسْلِمِ الْفَاسِقِ فَهِىَ كَبِيرَةٌ إِذَا بَالَغَ الشَّخْصُ فِى ذِكْرِ مَسَاوِئِهِ عَلَى غَيْرِ وَجْهِ التَّحْذِيرِ. وَأَمَّا الْبُهْتَانُ فَهُوَ أَنْ تَذْكُرَ أَخَاكَ الْمُسْلِمَ بِمَا لَيْسَ فِيهِ فِى خَلْفِهِ بِمَا يَكْرَهُ وَهُوَ أَشَدُّ فِى التَّحْرِيمِ. وَكَمَا تَحْرُمُ الْغِيبَةُ يَحْرُمُ السُّكُوتُ عَلَيْهَا مَعَ الْقُدْرَةِ عَلَى النَّهْىِ لِأَنَّ إِنْكَارَ الْمُنْكَرِ وَاجِبٌ عَلَى الْمُسْتَطِيعِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(525) مَتَى تَكُونُ الْغِيبَةُ جَائِزَةً.</p><p class=\"answer\">تَجُوزُ الْغِيبَةُ لِغَرَضٍ صَحِيحٍ كَأَنْ ظَلَمَهُ شَخْصٌ فَشَكَاهُ لِمَنْ يَسْتَطِيعُ أَنْ يَأْخُذَ لَهُ حَقَّهُ مِنْهُ أَوِ اسْتَعَانَ بِشَخْصٍ لِيَمْنَعَ غَيْرَهُ مِنْ فِعْلِ الْحَرَامِ أَوْ شَكَا مُسْلِمًا اخْتَلَفَ مَعَهُ فِى قَضِيَّةٍ لِيَأْخُذَ الْفَتْوَى مِنَ عَالِمِ تَقِىٍّ أَوْ حَذَّرَ مِنْ شَخْصٍ يَغُشُّ النَّاسَ فِى دِينِهِمْ أَوْ دُنْيَاهُمْ أَوْ أَرَادَ أَنْ يُعَرِّفَ شَخْصًا لِيُعْرَفَ فَقَالَ مَثَلًا فُلانٌ الأَعْرَجُ لا بِقَصْدِ ذَمِّهِ وَهُوَ لا يَتَأَذَّى لَوْ سَمِعَ. وَمَنْ كَانَ يُجَاهِرُ بِمَعْصِيَتِهِ وَلَمْ يَتُبْ يَجُوزُ ذِكْرُهُ بِالْمَعْصِيَةِ إِنْ كَانَ عَلَى وَجْهِ التَّحْذِيرِ مِنْهُ أَوْ زَجْرِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(526) مَا هِىَ النَّمِيمَةُ.</p><p class=\"answer\">النَّمِيمَةُ هِىَ نَقْلُ كَلامِ النَّاسِ بَعْضِهِمْ إِلَى بَعْضٍ لِافْسَادِ الْعَلاقَةِ بَيْنَهُمْ كَأَنْ يَقُولَ لِلأَوَّلِ فُلانٌ قَالَ فِيكَ كَذَا وَيَقُولَ لِلآخَرِ فُلانٌ قَالَ فِيكَ كَذَا حَتَّى يَتَقَاتَلا أَوْ يَتَعَادَيَا. وَالنَّمِيمَةُ مِنَ الْكَبَائِرِ وَهِىَ مِنْ أَكْثَرِ أَسْبَابِ عَذَابِ الْقَبْرِ قَالَ رَسُولُ اللَّهِ ﷺ لا يَدْخُلُ الْجَنَّةَ قَتَّاتٌ أَىْ نَمَّامٌ رَوَاهُ الْبُخَارِىُّ، مَعْنَاهُ لا يَدْخُلُهَا مَعَ الأَوَّلِينَ إِنَّمَا يَدْخُلُهَا بَعْدَ سَبْقِ عَذَابٍ إِنْ لَمْ يَعْفُ اللَّهُ عَنْهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(527) مَا مَعْنَى قَوْلِهِ تَعَالَى ﴿وَالْفِتْنَةُ أَشَدُّ مِنَ الْقَتْلِ﴾.</p><p class=\"answer\">مَعْنَى قَوْلِهِ تَعَالَى ﴿وَالْفِتْنَةُ أَشَدُّ مِنَ الْقَتْلِ﴾ أَنَّ الشِرْكَ أَشَدُّ مِنَ الْقَتْلِ وَلَيْسَ مَعْنَاهُ أَنَّ مُجَرَّدَ الإِفْسَادِ بَيْنَ اثْنَيْنِ مُسْلِمَيْنِ أَشَدُّ مِنْ قَتْلِ الْمُسْلِمِ ظُلْمًا لِأَنَّهُ مِنَ الْمَعْلُومِ عِنْدَ الْمُسْلِمِينَ أَنَّ قَتْلَ الْمُسْلِمِ ظُلْمًا هُوَ أَكْبَرُ الذُّنُوبِ بَعْدَ الْكُفْرِ وَيَدُلُّ عَلَى ذَلِكَ مَا رَوَاهُ الْبُخَارِىُّ أَنَّهُ قِيلَ لِرَسُولِ اللَّهِ ﷺ أَىُّ الذَّنْبِ أَشَدُّ قَالَ أَنْ تَجْعَلَ لِلَّهِ نِدًّا وَهُوَ خَلَقَكَ (أَىْ أَنْ تُشْرِكَ بِاللَّهِ) قِيلَ ثُمَّ أَىُّ قَالَ أَنْ تَقْتُلَ وَلَدَكَ مَخَافَةَ الْفَقْرِ قِيلَ ثُمَّ أَىُّ قَالَ أَنْ تُزَانِىَ حَلِيلَةَ جَارِكَ. أَمَّا مَنْ فَسَّرَ الْفِتْنَةَ فِى الآيَةِ بِالنَّمِيمَةِ فَهُوَ كَافِرٌ مُرْتَدٌّ لا عُذْرَ لَهُ لِأَنَّهُ كَذَّبَ الشَّرْعَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(528) مَا حُكْمُ التَّحْرِيشِ مِنْ غَيْرِ نَقْلِ قَوْلٍ وَلَوْ بَيْنَ الْبَهَائِمِ.</p><p class=\"answer\">يَحْرُمُ التَّحْرِيشُ وَهُوَ الْحَثُّ عَلَى فِعْلِ مُحَرَّمٍ لِإِيقَاعِ الْفِتْنَةِ بَيْنَ اثْنَيْنِ مُسْلِمَيْنِ وَهُوَ مِنْ الْكَبَائِرِ. وَالتَّحْرِيشُ حَرَامٌ وَلَوْ بَيْنَ الْبَهَائِمِ كَالتَّحْرِيشِ بَيْنَ دِيكَيْنِ أَوْ كَبْشَيْنِ لِيَقْتُلَ أَحَدُهُمَا الآخَرَ لِأَنَّهُمَا حَيَوَانَانِ مُحْتَرَمَانِ أَىْ لا يَجُوزُ قَتْلُهُمَا لَكِنْ يَجُوزُ ذَبْحُهُمَا لِأَكْلِهِمَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(529) مَا هُوَ الْكَذِبُ وَمَا حُكْمُهُ.</p><p class=\"answer\">الْكَذِبُ هُوَ الإِخْبَارُ بِالشَّىْءِ عَلَى خِلافِ الْوَاقِعِ عَمْدًا وَهُوَ حَرَامٌ إِنْ كَانَ فِى حَالِ الْجِدِّ أَوِ الْمَزْحِ قَالَ رَسُولُ اللَّهِ ﷺ لا يَصْلُحُ الْكَذِبُ فِى جِدٍّ وَلا فِى هَزْلٍ رَوَاهُ الْبَيْهَقِىُّ. وَلَيْسَ الْكَذِبُ مُطْلَقًا مُخَالَفَةَ الْوَاقِعِ فَمَنْ تَكَلَّمَ بِشَىْءٍ مِنْ أُمُورِ الدُّنْيَا يَظُنُّهُ صَحِيحًا فَطَلَعَ عَلَى خِلافِ مَا قَالَ لا يُقَالُ فِيهِ إِنَّهُ كَذَبَ فَقَدْ وَرَدَ فِى صَحِيحِ الْبُخَارِىِّ أَنَّ النَّبِىَّ ﷺ تَكَلَّمَ بِأَمْرٍ مِنْ أُمُورِ الدُّنْيَا بِغَيْرِ وَحْىٍ فَطَلَعَ عَلَى خِلافِ مَا ظَنَّ. وَمِنَ الْكَذِبِ مَا هُوَ كُفْرٌ كَأَنْ سُئِلَتِ امْرَأَةٌ هَلْ عَلَيْكِ صَلاةٌ فَأَرَادَتْ أَنْ تُوهِمَ النَّاسَ أَنَّهَا حَائِضٌ فَقَالَتْ لا مَا عَلَىَّ صَلاةٌ كَفَرَتْ أَمَّا لَوْ قَالَتْ أَنَا حَائِضٌ لَكَانَ كَذِبًا فَقَطْ وَكَذَلِكَ لَوْ سُئِلَ شَخْصٌ مُكَلَّفٌ هَلْ أَنْتَ مُكَلَّفٌ فَقَالَ لَسْتُ مُكَلَّفًا كَفَرَ لِأَنَّهُ كَذَّبَ الشَّرِيعَةَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(530) مَا حُكْمُ الْيَمِينِ الْكَاذِبَةِ.</p><p class=\"answer\">الْيَمِينُ الْكَاذِبَةُ هِىَ الْحَلِفُ بِاللَّهِ بِذِكْرِ اسْمِهِ أَوْ صِفَةٍ مِنْ صِفَاتِهِ عَلَى شَىْءٍ كَذِبًا كَقَوْلِ وَاللَّهِ أَوْ وَحَيَاةِ اللَّهِ أَوْ وَالْقُرْءَانِ. فَمَنْ حَلَفَ بِالِلَّهِ كَذِبًا وَقَعَ فِى مَعْصِيَةٍ كَبِيرَةٍ لِأَنَّ الْحَلِفَ بِاللَّهِ كَذِبًا تَهَاوُنٌ فِى تَعْظِيمِ اللَّهِ أَمَّا مَنْ حَلَفَ بِاللَّهِ صَادِقًا فَلا مَعْصِيَةَ عَلَيْهِ. وَالْحَلِفُ بِالْقُرْءَانِ لَيْسَ مَكْرُوهًا إِذَا قُصِدَ بِهِ الْكَلامُ الذَّاتِىُّ الَّذِى هُوَ صِفَةٌ لِلَّهِ أَمَّا الْحَلِفُ بِحَيَاةِ الْقُرْءَانِ فَهُوَ حَرَامٌ وَلَوْ كَانَ الْحَالِفُ يَفْهَمُ مِنْهُ وَكَرَامَةِ الْقُرْءَانِ لِأَنَّ الْقُرْءَانَ لا يُوصَفُ بِالْحَيَاةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(531) مَا حُكْمُ مَنْ حَلَفَ بِاللَّهِ أَوْ بِصِفَةٍ مِنْ صِفَاتِ اللَّهِ عَلَى فِعْلِ شَىْءٍ ثُمَّ فَعَلَ خِلافَهُ.</p><p class=\"answer\">مَنْ حَلَفَ بِاللَّهِ أَوْ بِصِفَةٍ مِنْ صِفَاتِ اللَّهِ عَلَى فِعْلِ شَىْءٍ ثُمَّ فَعَلَ خِلافَهُ لَيْسَ عَلَيْهِ مَعْصِيَةٌ وَعَلَيْهِ كَفَّارَةُ يَمِينٍ وَهِىَ عِتْقُ رَقَبَةٍ مُؤْمِنَةٍ عَبْدٍ أَوْ أَمَةٍ أَوْ إِطْعَامُ عَشَرَةِ مَسَاكِينَ أَوْ كِسْوَتُهُمْ فَإِنْ عَجَزَ فَصِيَامُ ثَلاثَةِ أَيَّامٍ مُتَوَالِيَاتٍ أَوْ مُتَفَرِّقَاتٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(532) مَا حُكْمُ قَذْفِ الْمُسْلِمَةِ الْعَفِيفَةِ الَّتِى لَمْ يَمَسَّهَا الزِّنَى.</p><p class=\"answer\">يَحْرُمُ قَذْفُ الْمُسْلِمَةِ أَىْ رَمْيُهَا بِالزِّنَى وَهُوَ مِنَ الْكَبَائِرِ لِقَوْلِهِ ﷺ اجْتَنِبُوا السَّبْعَ الْمُوبِقَاتِ (أَىِ الْمُهْلِكَاتِ) قِيلَ وَمَا هُنَّ يَا رَسُولَ اللَّهِ قَالَ الشِّرْكُ بِاللَّهِ وَالسِّحْرُ وَقَتْلُ النَّفْسِ الَّتِى حَرَّمَ اللَّهُ إِلَّا بِالْحَقِّ وَأَكْلُ الرِّبَا وَأَكْلُ مَالِ الْيَتِيمِ وَالتَّوَلِّى يَوْمَ الزَّحْفِ وَقَذْفُ الْمُحْصَنَاتِ الْغَافِلاتِ الْمُؤْمِنَاتِ رَوَاهُ مُسْلِمٌ. وَالْمُحْصَنَاتُ الْغَافِلاتُ الْحَرَائِرُ الْعَفِيفَاتُ مِنَ النِّسَاءِ اللَّاتِى أَحْصَنَّ فُرُوجَهُنَّ أَىْ حَفِظْنَهَا مِنَ الْحَرَامِ. وَيُجْلَدُ الْقَاذِفُ الْحُرُّ ثَمَانِينَ جَلْدَةً بِسَوْطٍ قَالَ اللَّهُ تَعَالَى ﴿وَالَّذِينَ يَرْمُونَ الْمُحْصَنَاتِ ثُمَّ لَمْ يَأْتُوا بِأَرْبَعَةِ شُهَدَاءَ فَاجْلِدُوهُمْ ثَمَانِينَ جَلْدَةً﴾</p></div>\n<div class=\"qa-item\"><p class=\"question\">(533) مَا حُكْمُ سَبِّ الصَّحَابَةِ.</p><p class=\"answer\">الصَّحَابَةُ هُمْ أَصْحَابُ رَسُولِ اللَّهِ ﷺ وَسَبُّهُمْ جُمْلَةً كُفْرٌ كَالَّذِى يَقُولُ الصَّحَابَةُ خَوَنَةٌ أَوْ كَذَّابُونَ لِأَنَّ الْقُرْءَانَ وَأُمُورَ الدِّينِ الْمَنْقُولَةَ عَنِ الرَّسُولِ ﷺ مِنْ طَرِيقِهِمْ وَصَلَتْ إِلَيْنَا قَالَ اللَّهُ تَعَالَى ﴿وَالسَّابِقُونَ الأَوَّلُونَ مِنَ الْمُهَاجِرِينَ وَالأَنْصَارِ وَالَّذِينَ اتَّبَعُوهُمْ بِإِحْسَانٍ رَّضِىَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ﴾ وَهَؤُلاءِ هُمْ أَوْلِيَاءُ الصَّحَابَةِ كَأَبِى بَكْرٍ وَعُمَرَ وَعُثْمَانَ وَعَلِىٍّ وَسَبُّ وَاحِدٍ مِنْهُمْ مِنَ الْكَبَائِرِ إِنْ كَانَ عَلَى وَجْهٍ لا يُؤَدِّى إِلَى تَكْذِيبِ الشَّرْعِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(534) مَا حُكْمُ شَهَادَةِ الزُّورِ.</p><p class=\"answer\">شَهَادَةُ الزُّورِ مِنَ الْكَبَائِرِ وَالزُّورُ هُوَ الْكَذِبُ قَالَ رَسُولُ اللَّهِ ﷺ فِيمَا رَوَاهُ الْبَيْهَقِىُّ وَأَبُو دَاوُدَ عَدَلَتْ شَهَادَةُ الزُّورِ الإِشْرَاكَ بِاللَّهِ، أَىْ شُبِّهَتْ بِهِ وَلَيْسَ الْمُرَادُ أَنَّهَا تُخْرِجُ فَاعِلَهَا مِنَ الإِسْلامِ. فَمَنْ شَهِدَ زُورًا وَكَذِبًا بِأَنَّ لِفُلانٍ عَلَى فُلانٍ مَالًا إِرْضَاءً لِصَدِيقِهِ أَوْ قَرِيبِهِ وَقَعَ فِى ذَنْبٍ مِنْ أَكْبَرِ الْكَبَائِرِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(535) مَا حُكْمُ مَطْلِ الْغَنِىِّ.</p><p class=\"answer\">مَطْلُ الْغَنِىِّ مِنَ الْكَبَائِرِ وَهُوَ أَنْ يَقْتَرِضَ مَالًا مِنْ شَخْصٍ وَيُمَاطِلَ فِى دَفْعِ الدَّيْنِ مَعَ الْقُدْرَةِ عَلَى الدَّفْعِ قَالَ رَسُولُ اللَّهِ ﷺ مَطْلُ الْغَنِىِّ ظُلْمٌ رَوَاهُ أَبُو دَاوُدَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(536) مَا حُكْمُ شَتْمِ الْمُسْلِمِ وَلَعْنِهِ.</p><p class=\"answer\">يَحْرُمُ شَتْمُ الْمُسْلِمِ أَىْ سَبُّهُ وَذَمُّهُ بِغَيْرِ حَقٍّ قَالَ رَسُولُ اللَّهِ ﷺ سِبَابُ الْمُسْلِمِ فُسُوقٌ رَوَاهُ الْبُخَارِىُّ، أَىْ أَنَّ سَبَّ الْمُسْلِمِ مِنَ الْكَبَائِرِ بِدَلِيلِ تَسْمِيَتِهِ فُسُوقًا. وَيَحْرُمُ لَعْنُ الْمُسْلِمِ أَىْ سَبُّهُ بِالدُّعَاءِ عَلَيْهِ كَأَنْ يَقُولَ لَهُ لَعَنَكَ اللَّهُ أَوْ لَعْنَةُ اللَّهِ عَلَيْكَ قَالَ رَسُولُ اللَّهِ ﷺ لَعْنُ الْمُسْلِمِ كَقَتْلِهِ رَوَاهُ الْبَيْهَقِىُّ، مَعْنَاهُ لَعْنُهُ بِغَيْرِ حَقٍّ ذَنْبٌ كَبِيرٌ. أَمَّا الْمُسْلِمُ الْفَاسِقُ فَيَجُوزُ لَعْنُهُ لِسَبَبٍ شَرْعِىٍّ كَأَنْ يَكُونَ غَشَّاشًا ظَالِمًا يَأْكُلُ حَقَّ النَّاسِ وَكَانَ لَعْنُهُ بِقَصْدِ رَدْعِهِ وَزَجْرِهِ أَوْ تَحْذِيرِ غَيْرِهِ مِنْ أَنْ يَفْعَلَ مِثْلَ فِعْلِهِ. وَأَمَّا مَنْ لَعَنَ مُسْلِمًا فَاسِقًا كَبَائِعِ خَمْرٍ مِنْ غَيْرِ أَنْ يَسْمَعَهُ أَحَدٌ أَىْ لا لِزَجْرِهِ وَلا لِزَجْرِ النَّاسِ عَنْ أَنْ يَفْعَلُوا مِثْلَ فِعْلِهِ فَلا يَجُوزُ لِأَنَّ هَذَا لَيْسَ إِنْكَارًا لِلْمُنْكَرِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(537) مَا حُكْمُ الِاسْتِهْزَاءِ بِالْمُسْلِمِ.</p><p class=\"answer\">يَحْرُمُ الِاسْتِهْزَاءُ بِالْمُسْلِمِ أَىْ تَحْقِيرُهُ وَكُلُّ كَلامٍ مُؤْذٍ لَهُ بِغَيْرِ حَقٍّ. أَمَّا إِذَا كَانَ الْكَلامُ الَّذِى فِيهِ إِيذَاءٌ لِلْمُسْلِمِ بِحَقٍّ شَرْعِىٍّ فَلا يَحْرُمُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(538) مَا حُكْمُ الْكَذِبِ عَلَى اللَّهِ وَعَلَى رَسُولِهِ ﷺ.</p><p class=\"answer\">الْكَذِبُ عَلَى اللَّهِ مِنَ الْكَبَائِرِ كَأَنْ يَقُولَ خَلَقَ اللَّهُ فِى مَكَانِ كَذَا جَبَلًا مِنْ ذَهَبٍ وَهُوَ يَعْلَمُ أَنَّهُ لَيْسَ كَذَلِكَ وَمِنَ الْكَذِبِ عَلَى اللَّهِ مَا هُوَ كُفْرٌ كَقَوْلِ الْوَهَّابِيَّةِ أَدْعِيَاءِ السَّلَفِيَّةِ إِنَّ اللَّهَ قَاعِدٌ عَلَى الْعَرْشِ وَإِنَّهُ يَنْزِلُ حَقِيقَةً وَيَصْعَدُ. أَمَّا الْكَذِبُ عَلَى رَسُولِ اللَّهِ ﷺ فَمِنْهُ مَا هُوَ كَبِيرَةٌ كَأَنْ يَنْسُبَ إِلَى الرَّسُولِ مَا لَمْ يَقُلْهُ لِحَثِّ النَّاسِ عَلَى النَّوَافِلِ كَالذِّكْرِ وَالصَّلاةِ وَقِرَاءَةِ الْقُرْءَانِ مِمَّا لا يُؤَدِّى إِلَى تَكْذِيبِ الشَّرِيعَةِ وَمِنَ الْكَذِبِ عَلَى الرَّسُولِ مَا هُوَ كُفْرٌ كَأَنْ يَنْسُبَ إِلَى الرَّسُولِ تَحْلِيلَ مَا حَرَّمَهُ اللَّهُ فِى شَرْعِهِ مَعَ الْعِلْمِ بِهِ قَالَ رَسُولُ اللَّهِ ﷺ إِنَّ كَذِبًا عَلَىَّ لَيْسَ كَكَذِبٍ عَلَى أَحَدٍ فَمَنْ كَذَبَ عَلَىَّ مُتَعَمِّدًا فَلْيَتَبوَّأْ مَقْعَدَهُ مِنَ النَّارِ رَوَاهُ مُسْلِمٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(539) مَا هِىَ الدَّعْوَى الْبَاطِلَةُ.</p><p class=\"answer\">الدَّعْوَى الْبَاطِلَةُ مِنْ مَعَاصِى اللِّسَانِ وَهِىَ كَأَنْ يَدَّعِىَ عِنْدَ الْحَاكِمِ أَنَّ لَهُ مَالًا عَلَى شَخْصٍ وَيَعْتَمِدَ عَلَى شَهَادَةِ الزُّورِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(540) مَا هُوَ الطَّلاقُ الْبِدْعِىُّ.</p><p class=\"answer\">الطَّلاقُ الْبِدْعِىُّ هُوَ أَنْ يُطَّلِقَ الرَّجُلُ زَوْجَتَهُ فِى حَالِ الْحَيْضِ أَوِ النِّفَاس أَوْ فِى طُهْرٍ جَامَعَهَا فِيهِ وَيَقَعُ هَذَا الطَّلاقُ وَإِنْ كَانَ مُحَرَّمًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(541) مَا هُوَ الظِّهَارُ.</p><p class=\"answer\">الظِّهَارُ هُوَ أَنْ يُشَبِّهَ الزَّوْجُ زَوْجَتَهُ بِأُمِّهِ فِى التَّحْرِيمِ كَأَنْ يَقُولَ لِزَوْجَتِهِ أَنْتِ عَلَىَّ كَظَهْرِ أُمِّى أَىْ لا أُجَامِعُكِ كَمَا لا أُجَامِعُ أُمِّى أَىْ أَمْنَعُ نَفْسِىَ مِنْ جِمَاعِكِ وَهُوَ مِنَ الْكَبَائِرِ لِمَا فِيهِ مِنْ الإِيذَاءِ لِلزَّوْجَةِ وَفِيهِ كَفَّارَةٌ عَلَى الزَّوْجِ إِنْ لَمْ يُطَلِّقْ بَعْدَ الظِّهَارِ فَوْرًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(542) مَا هِىَ كَفَّارَةُ الظِّهَارِ.</p><p class=\"answer\">كَفَّارَةُ الظِّهَارِ هِىَ عِتْقُ رَقَبَةٍ مُؤْمِنَةٍ عَبْدٍ أَوْ أَمَةٍ فَإِنْ عَجَزَ عَنِ الإِعْتَاقِ صَامَ شَهْرَيْنِ مُتَتَابِعَيْنِ وُجُوبًا فَإِنْ عَجَزَ عَنِ الصِّيَامِ أَطْعَمَ سِتِّينَ مِسْكِينًا أَوْ فَقِيرًا سِتِّينَ مُدًّا أَىْ مَلَّكَ كُلَّ وَاحِدٍ مِنْهُمْ مُدًّا مِنْ غَالِبِ قُوتِ الْبَلَدِ. وَالْقُوتُ هُوَ مَا يَعِيشُ عَلَيْهِ الْبَدَنُ كَالْقَمْحِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(543) مَا حُكْمُ اللَّحْنِ فِى الْقُرْءَانِ.</p><p class=\"answer\">يَحْرُمُ عَلَى قَارِئِ الْقُرْءَانِ أَنْ يَقْرَأَ الْقُرْءَانَ وَيُخْطِئَ فِى الْقِرَاءَةِ وَإِنْ لَمْ يُغَيِّرِ الْمَعْنَى فَيَجِبُ تَصْحِيحُ الْقِرَاءَةِ إِلَى الْحَدِّ الَّذِى يَسْلَمُ فِيهِ مِنْ تَغْيِيرِ الْحَرَكَاتِ وَالْحُرُوفِ. أَمَّا الَّذِى يَقْرَأُ الْقُرْءَانَ قِرَاءَةً صَحِيحَةً مِنْ غَيْرِ تَلَقٍّ مِنْ أَحَدٍ فَلا ثَوَابَ لَهُ لِأَنَّ اللَّهَ تَعَالَى قَالَ ﴿يَتْلُونَهُ حَقَّ تِلاوَتِهِ﴾ وَلا يَضْمَنُ الْقَارِئُ لِلْقُرْءَانِ أَنْ يَتْلُوَهُ حَقَّ تِلاوَتِهِ إِلَّا إِذَا تَلَقَّاهُ مِنْ أَهْلِ الْمَعْرِفَةِ الثِّقَاتِ وَقَالَ تَعَالَى ﴿وَلا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ﴾ أَىْ لَيْسَ لَكَ أَنْ تَخُوضَ بِلِسَانِكَ مَا لا عِلْمَ لَكَ فِيهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(544) مَا حُكْمُ مَنْ يَقُولُ اللَّا عَنِ اللَّهِ.</p><p class=\"answer\">لا يَجُوزُ هَذَا الْقَوْلُ لِأَنَّهُ تَحْرِيفٌ لِاسْمِ اللَّهِ قَالَ تَعَالَى ﴿وَلِلَّهِ الأَسْمَاءُ الْحُسْنَى فَادْعُوهُ بِهَا وَذَرُوا الَّذِينَ يُلْحِدُونَ فِى أَسْمَائِهِ﴾ أَىْ أَنَّ اللَّهَ تَعَالَى لَهُ الأَسْمَاءُ الَّتِى تَدُلُّ عَلَى الْكَمَالِ أَىْ لَيْسَ فِيهَا مَا يَدُلُّ عَلَى نَقْصٍ فِى حَقِّ اللَّهِ ﴿وَذَرُوا الَّذِينَ يُلْحِدُونَ فِى أَسْمَائِهِ﴾ أَىْ لا تَتَّبِعُوا الَّذِينَ يُحَرِّفُونَ وَيُغَيِّرُونَ فِى أَسْمَاءِ اللَّهِ. فَمِنْ هُنَا يُعْلَمُ أَنَّهُ لا يَجُوزُ حَذْفُ الأَلِفِ وَالْهَاءِ مِنْ لَفْظِ الْجَلالَةِ الله فَالَّذِى يَقُولُ اللَّا وَهُوَ يَعْرِفُ أَنَّهُ بِذَلِكَ يُحَرِّفُ اسْمَ اللَّهِ فَعَلَيْهِ مَعْصِيَةٌ كَبِيرَةٌ. قَالَ الْخَلِيلُ بنُ أَحْمَدَ الْفَرَاهِيدِىُّ لا يَجُوزُ حَذْفُ الأَلِفِ الَّتِى قَبْلَ الْهَاءِ وَالَّتِى تُلْفَظُ وَلا تُكْتَبُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(545) مَا حُكْمُ مَنْ يَقُولُ الْعَبْدُ اللَّه.</p><p class=\"answer\">هَذِهِ الْكَلِمَةُ فَاسِدَةٌ لِأَنَّ مَعْنَاهَا أَنَّ اللَّهَ هُوَ الْعَبْدُ فَالَّذِى يَقُولُ الْعَبْدُ اللَّه يَكُونُ جَعَلَ اللَّهَ عَبْدًا وَالْعِيَاذُ بِاللَّهِ وَهُوَ كُفْرٌ أَمَّا مَنْ لَمْ يَعْرِفِ الْمَعْنَى كَحَالِ أَغْلَبِ الْعَوَامِّ فَلا يَكْفُرُ لَكِنَّهُ وَقَعَ فِى ذَنْبٍ كَبِيرٍ. فَالْمُكَلَّفُ لا يَجُوزُ لَهُ أَنْ يَتَكَلَّمَ بِمَا لا يَعْلَمُ قَالَ تَعَالَى ﴿وَلا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ﴾ أَىْ لا تَقُلْ قَوْلًا بِغَيْرِ عِلْمٍ. فَإِذَا تَزَوَّجَ الرَّجُلُ بِامْرَأَةٍ وَكَانَ اسْمُهُ عَبْدُ اللَّهِ يُقَالُ عَنْ زَوْجَتِهِ فُلانَةُ مِنْ ءَالِ عَبْدِ اللَّهِ يَعْنِى صَارَتْ مُنْتَسِبَةً إِلَى هَذَا الرَّجُلِ بِالزِّوَاجِ وَلا يُقَالُ فُلانَةُ الْعَبْدُ اللَّه.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(546) مَا حُكْمُ السُّؤَالِ لِلْغَنِىِّ بِمَالٍ أَوْ حِرْفَةٍ.</p><p class=\"answer\">لا يَجُوزُ لِلْغَنِىِّ بِمَالٍ عِنْدَهُ أَوْ حِرْفَةٍ يَعْرِفُهَا وَيَجِدُ بِهَا كِفَايَتَهُ أَنْ يَشْحَذَ لِحَدِيثِ الْبَيْهَقِىِّ وَأَبِى دَاوُدَ لا تَحِلُّ الْمَسْأَلَةُ لِغَنِىٍّ وَلا لِذِى مِرَّةٍ سَوِىٍّ، أَىْ لا يَحِلُّ لِلْمُكْتَفِى بِالْمَالِ أَوِ الْحِرْفَةِ أَنْ يَشْحَذَ كَأَنْ كَانَ مَالِكًا مَا يَكْفِيهِ لِحَاجَاتِهِ الأَصْلِيَّةِ أَوْ كَانَ قَادِرًا عَلَى تَحْصِيلِ ذَلِكَ بِكَسْبٍ حَلالٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(547) مَا حُكْمُ النَّذْرِ بِقَصْدِ حِرْمَانِ الْوَارِثِ.</p><p class=\"answer\">يَحْرُمُ النَّذْرُ بِقَصْدِ حِرْمَانِ الْوَارِثِ وَهُوَ مِنَ الْكَبَائِرِ كَأَنْ يَقُولَ نَذَرْتُ مَالِىَ لِلْمَسْجِدِ أَوْ لِلْفُقَرَاءِ بِقَصْدِ أَنْ يَحْرِمَ وَارِثَهُ مِنَ التَّرِكَةِ وَهُوَ نَذْرٌ بَاطِلٌ لا يَصِحُّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(548) مَا حُكْمُ تَرْكِ الْوَصِيَّةِ بِدَيْنٍ أَوْ عَيْنٍ لا يَعْلَمُهُمَا غَيْرُهُ.</p><p class=\"answer\">مَنْ كَانَ عَلَيْهِ دَيْنٌ إِنْ كَانَ دَيْنًا لِلَّهِ كَزَكَاةٍ أَوْ دَيْنًا لِآدَمِىٍّ أَوْ كَانَ عِنْدَهُ أَمَانَةٌ لِغَيْرِهِ وَخَشِىَ ضَيَاعَ الدَّيْنِ أَوِ الأَمَانَةِ بِمَوْتِهِ يَجِبُ عَلَيْهِ أَنْ يُعْلِمَ بِهَذَا الدَّيْنِ أَوِ الأَمَانَةِ شَخْصًا ثِقَةً غَيْرَ وَارِثٍ يَثْبُتُ بِقَوْلِهِ أَوْ يَرُدَّهُ حَالًا خَوْفًا مِنْ خِيَانَةِ الْوَارِثِ فَإِنْ تَرَكَ الْوَصِيَّةَ وَقَعَ فِى مَعْصِيَةِ اللَّهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(549) مَا حُكْمُ الِانْتِمَاءِ إِلَى غَيْرِ أَبِيهِ.</p><p class=\"answer\">يَحْرُمُ الِانْتِمَاءُ إِلَى غَيْرِ أَبِيهِ وَهُوَ مِنَ الْكَبَائِرِ كَأَنْ يَقُولَ أَنَا ابْنُ فُلانٍ وَهُوَ لَيْسَ ابْنَهُ قَالَ رَسُولُ اللَّهِ ﷺ مَنِ ادَّعَى إِلَى غَيْرِ أَبِيهِ فَعَلَيْهِ لَعْنَةُ اللَّهِ رَوَاهُ أَبُو دَاوُدَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(550) مَا حُكْمُ التَّبَنِّى فِى الإِسْلامِ.</p><p class=\"answer\">مِنَ الأَحْكَامِ الشَّرْعِيَّةِ الَّتِى يَنْبَغِى أَنْ تُعَلَّمَ لِلنَّاسِ وَتُنْشَرَ أَنَّهُ لا يَجُوزُ التَّبَنِّى فِى الإِسْلامِ. وَمَعْنَى التَّبَنِّى أَنْ يَتَّخِذَ الشَّخْصُ طِفْلًا ابْنًا لَهُ وَهُوَ لَيْسَ ابْنًا لَهُ فِى الأَصْلِ فَلا يَجُوزُ لِلْمُسْلِمِ أَنْ يَتَبَنَّى شَخْصًا فَيَنْسُبَهُ إِلَى نَفْسِهِ عَلَى أَنَّهُ وَلَدُهُ. وَالتَّبَنِّى كَانَ جَائِزًا فِى الإِسْلامِ فَقَدْ تَبَنَّى الرَّسُولُ ﷺ زَيْدَ بنَ حَارِثَةَ ثُمَّ حُرِّمَ قَالَ اللَّهُ تَعَالَى ﴿مَّا كَانَ مُحَمَّدٌ أَبَا أَحَدٍ مِّنْ رِّجَالِكُمْ وَلَكِنْ رَّسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّينَ﴾ وَالدَّلِيلُ عَلَى تَحْرِيمِهِ أَنَّ الرَّسُولَ ﷺ تَزَوَّجَ زَيْنَبَ بِنْتَ جَحْشٍ الَّتِى كَانَتْ زَوْجَةً لِزَيْدٍ ثُمَّ طَلَّقَهَا قَالَ تَعَالَى ﴿فَلَمَّا قَضَى زَيْدٌ مِّنْهَا وَطَرًا زَوَّجْنَاكَهَا﴾ وَمَعْلُومٌ أَنَّ الرَّجُلَ لا يَجُوزُ لَهُ أَنْ يَتَزَوَّجَ زَوْجَةَ ابْنِهِ فَدَلَّ ذَلِكَ عَلَى أَنَّ التَّبَنِّىَ حَرَامٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(551) مَا حُكْمُ الْخِطْبَةِ عَلَى خِطْبَةِ أَخِيهِ.</p><p class=\"answer\">يَحْرُمُ عَلَى الرَّجُلِ أَنْ يَخْطُبَ عَلَى خِطْبَةِ أَخِيهِ فِى الإِسْلامِ أَىْ أَنْ يَطْلُبَ امْرَأَةً لِلزِّوَاجِ بَعْدَ أَنْ طَلَبَهَا الأَوَّلُ وَوَافَقَ وَلِيُّهَا لِمَا فِيهِ مِنَ الإِيذَاءِ وَالْقَطِيعَةِ أَمَّا إِذَا أَذِنَ لَهُ فَلا حُرْمَةَ فِى ذَلِكَ وَكَذَلِكَ إِنْ أَعْرَضَ هُوَ أَوْ أَعْرَضَ الْوَلِىُّ قَالَ رَسُولُ اللَّهِ ﷺ لا يَخْطُبْ أَحَدُكُمْ عَلَى خِطْبَةِ أَخِيهِ حَتَّى يَتْرُكَ الْخَاطِبُ قَبْلَهُ أَوْ يَأْذَنَ لَهُ رَوَاهُ الْبُخَارِىُّ وَمُسْلِمٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(552) مَا حُكْمُ الْفَتْوَى بِغَيْرِ عِلْمٍ.</p><p class=\"answer\">الْفَتْوَى بِغَيْرِ عِلْمٍ إِمَّا كُفْرٌ أَوْ مَعْصِيَةٌ كَبِيرَةٌ قَالَ اللَّهُ تَعَالَى ﴿وَلا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ﴾ أَىْ لا تَقُلْ قَوْلًا بِغَيْرِ عِلْمٍ ﴿إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَئِكَ كَانَ عَنْهُ مَسْؤُولًا﴾ وَقَالَ رَسُولُ اللَّهِ ﷺ مَنْ أَفْتَى بِغَيْرِ عِلْمٍ لَعَنَتْهُ مَلائِكَةُ السَّمَاءِ وَالأَرْضِ رَوَاهُ ابْنُ عَسَاكِرَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(553) مَا حُكْمُ تَعَلُّمِ وَتَعْلِيمِ عِلْمٍ مُضِرٍّ.</p><p class=\"answer\">يَحْرُمُ تَعَلُّمُ وَتَعْلِيمُ عِلْمٍ مُضِرٍّ لِغَيْرِ سَبَبٍ شَرْعِىٍّ كَالسِّحْرِ وَالْفَلْسَفَةِ وَهِىَ الْمَوْرُوثَةُ عَنِ الْفَلاسِفَةِ الْقَائِلِينَ بِقِدَمِ الْعَالَمِ وَأَزَلِيَّتِهِ وَهُوَ كُفْرٌ وَالتَّنْجِيمِ أَىِ الإِخْبَارِ عَنِ الْمُسْتَقْبَلِ اعْتِمَادًا عَلَى النُّجُومِ. فَلا يَجُوزُ الإِخْبَارُ عَنِ الْمُسْتَقْبَلِ اعْتِمَادًا عَلَى خَبَرِ الْجِنِّ أَوْ عَلَى النُّجُومِ أَوِ اعْتِمَادًا عَلَى النَّظَرِ فِى الْكَفِّ أَوِ فِنْجَانِ الْبُنِّ. وَلا يَجُوزُ الإِخْبَارُ عَنِ الْمُسْتَقْبَلِ اعْتِمَادًا عَلَى الأَبْرَاجِ. وَالأَبْرَاجُ مَجْمُوعَةٌ مِنَ النُّجُومِ كَالْحَمَلِ وَالأَسَدِ وَالثَّوْرِ وَالسَّرَطَانِ وَالْمِيزَانِ وَهَذِهِ لا تَأْثِيرَ لَهَا عَلَى الإِنْسَانِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(554) تَكَلَّمْ عَنِ الْحُكْمِ بِغَيْرِ حُكْمِ اللَّهِ.</p><p class=\"answer\">يَحْرُمُ الْحُكْمُ بِغَيْرِ حُكْمِ اللَّهِ أَىْ بِغَيْرِ شَرْعِهِ الَّذِى أَنْـزَلَهُ عَلَى رَسُولِهِ وَهُوَ مِنَ الْكَبَائِرِ إِجْمَاعًا وَمَنْ جَحَدَ حُكْمَ اللَّهِ أَىْ أَنْكَرَهُ أَوْ فَضَّلَ غَيْرَهُ عَلَيْهِ أَوْ سَاوَاهُ بِهِ كَأَنْ قَالَ إِنَّ حُكْمَ اللَّهِ لَيْسَ أَفْضَلَ مِنْهُ بَلْ هُمَا مُتَسَاوِيَانِ كَفَرَ وَالْعِيَاذُ بِاللَّهِ. أَمَّا قَوْلُهُ تَعَالَى ﴿وَمَنْ لَّمْ يَحْكُمْ بِمَا أَنْزَلَ اللَّهُ فَأُولَئِكَ هُمُ الْكَافِرُونَ﴾ فَلَيْسَ مَعْنَاهُ الْكُفْرَ الَّذِى يَنْقُلُ عَنِ الْمِلَّةِ بَلْ هُوَ كُفْرٌ دُونَ كُفْرٍ أَىْ ذَنْبٌ كَبِيرٌ قَالَهُ ابْنُ عَبَّاسٍ وَقَالَ الصَّحَابِىُّ الْجَلِيلُ الْبَرَاءُ بنُ عَازِبٍ هَذِهِ الآيَاتُ نَزَلَتْ فِى الْكُفَّارِ أَىْ هَذِهِ الآيَةُ وَالَّتِى فِيهَا الْفَاسِقُونَ وَالَّتِى فِيهَا الظَّالِمُونَ وَقَدْ كَذَّبَ سَيِّد قُطُب زَعِيمُ حِزْبِ الإِخْوَانِ كُلَّ عُلَمَاءِ الإِسْلامِ وَكَفَّرَ كُلَّ الْبَشَرِ فَقَالَ ارْتَدَّتِ الْبَشَرِيَّةُ بِجُمْلَتِهَا بِمَا فِيهَا أُولَئِكَ الَّذِينَ يُرَدِّدُونَ عَلَى الْمَآذِنِ كَلِمَاتِ لا إِلَهَ إِلَّا اللَّهُ بِلا مَدْلُولٍ وَلا وَاقِعٍ بَلْ وَقَالَ إِنَّ التَّأْوِيلَ وَالتَّأَوُّلَ فِى هَذَا الْحُكْمِ يُعَدُّ تَحْرِيفًا لِلْكَلِمِ عَنْ مَوَاضِعِهِ فَيَكُونُ بِذَلِكَ نَسَبَ تَحْرِيفَ الْقُرْءَانِ الْكَرِيمِ إِلَى أَصْحَابِ رَسُولِ اللَّهِ ﷺ وَكَفَاهُ ذَلِكَ خِزْيًا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(555) مَا حُكْمُ النَّدْبِ وَالنِّيَاحَةِ.</p><p class=\"answer\">النَّدْبُ وَالنِّيَاحَةُ مِنَ الْكَبَائِرِ وَالنَّدْبُ هُوَ ذِكْرُ مَحَاسِنِ الْمَيِّتِ بِرَفْعِ الصَّوْتِ عَلَى صُورَةِ الْجَزَعِ أَمَّا النِّيَاحَةُ فَهِىَ الصِّيَاحُ عَلَى صُورَةِ الْجَزَعِ لِمُصِيبَةِ الْمَوْتِ قَالَ رَسُولُ اللَّهِ ﷺ صَوْتَانِ مَلْعُونَانِ فِى الدُّنْيَا وَالآخِرَةِ مِزْمَارٌ عِنْدَ نِعْمَةٍ (أَىْ صَوْتُ الْمِزْمَارِ عِنْدَ حُصُولِ نِعْمَةٍ) وَرَنَّةٌ عِنْدَ مُصِيبَةٍ (أَىِ الصُّرَاخُ عِنْدَ حُصُولِ الْمُصِيبَةِ) رَوَاهُ الْبَزَّارُ وَالْهَيْثَمِىُّ وَصَحَّحَهُ أَبُو يَعْلَى الْمَوْصِلِىُّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(556) مَا حُكْمُ الْقَوْلِ الَّذِى يَحُثُّ عَلَى فِعْلِ مُحَرَّمٍ أَوْ يُفَتِّرُ عَنْ وَاجِبٍ.</p><p class=\"answer\">كُلُّ كَلامٍ يُشَجِّعُ النَّاسَ عَلَى فِعْلِ الْمُحَرَّمَاتِ أَوْ يُفَتِّرُ هِمَمَهُمْ عَنْ فِعْلِ الْوَاجِبَاتِ فَهُوَ حَرَامٌ. وَالْوَاجِبُ هُوَ مَا يُثَابُ عَلَى فِعْلِهِ امْتِثَالًا لِأَمْرِ اللَّهِ وَيُعَاقَبُ عَلَى تَرْكِهِ أَمَّا الْحَرَامُ فَهُوَ مَا يُثَابُ عَلَى تَرْكِهِ امْتِثَالًا لِأَمْرِ اللَّهِ وَيُعَاقَبُ عَلَى فِعْلِهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(557) مَا حُكْمُ مَنْ يَقْدَحُ فِى دِينِ الإِسْلامِ أَوْ فِى أَحَدٍ مِنَ الأَنْبِيَاءِ أَوْ فِى جَمِيعِ الْعُلَمَاءِ أَوِ الْقُرْءَانِ أَوْ فِى شَىْءٍ مِنْ شَعَائِرِ اللَّهِ.</p><p class=\"answer\">مَنْ يَقْدَحُ فِى دِينِ اللَّهِ أَىْ يَطْعَنُ فِيهِ وَيَذُمُّهُ فَهُوَ كَافِرٌ وَكَذَا مَنْ يَقْدَحُ فِى أَحَدٍ مِنَ الأَنْبِيَاءِ أَوْ فِى جَمِيعِ الْعُلَمَاءِ أَوِ الْقُرْءَانِ أَوْ فِى شَىْءٍ مِنْ شَعَائِرِ اللَّهِ أَىْ مَعَالِمِ دِينِهِ كَالصَّلاةِ وَالصِّيَامِ وَالْحَجِّ وَالأَذَانِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(558) مَا حُكْمُ التَّزْمِيرِ.</p><p class=\"answer\">التَّزْمِيرُ حَرَامٌ وَهُوَ النَّفْخُ فِى الْمِزْمَارِ. وَالْمِزْمَارُ ءَالَةٌ مُوسِيقِيَّةٌ مَصْنُوعَةٌ مِنَ الْخَشَبِ أَوِ الْحَدِيدِ يُنْفَخُ فِيهَا قَالَ رَسُولُ اللَّهِ ﷺ صَوْتَانِ مَلْعُونَانِ فِى الدُّنْيَا وَالآخِرَةِ مِزْمَارٌ عِنْدَ نِعْمَةٍ وَرَنَّةٌ عِنْدَ مُصِيبَةٍ رَوَاهُ الْبَزَّارُ. (559) مَا حُكْمُ السُّكُوتِ عَنِ الأَمْرِ بِالْمَعْرُوفِ وَعَنِ النَّهْىِ عَنِ الْمُنْكَرِ.</p></div>\n<p>اعْلَمْ أَنَّ الأَمْرَ بِأَدَاءِ الْوَاجِبَاتِ وَالنَّهْىَ عَنْ فِعْلِ الْمُحَرَّمَاتِ وَاجِبٌ عَلَى كُلِّ مَنِ اسْتَطَاعَ مِنْ أَفْرَادِ الْمُكَلَّفِينَ قَالَ اللَّهُ تَعَالَى ﴿وَلْتَكُنْ مِّنْكُمْ أُمَّةٌ يَدْعُونَ إِلَى الْخَيْرِ وَيَأْمُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ الْمُنْكَرِ﴾ فَلا يَجُوزُ السُّكُوتُ عَنِ الأَمْرِ بِالْمَعْرُوفِ وَعَنِ النَّهْىِ عَنِ الْمُنْكَرِ بِلا عُذْرٍ شَرْعِىٍّ لِأَنَّ السُّكُوتَ عَنِ الْبَاطِلِ مَعَ الِاسْتِطَاعَةِ عَلَى الإِنْكَارِ مَفْسَدَةٌ فَلا يَجُوزُ السُّكُوتُ عَمَّنْ يَنْتَهِكُ حُدُودَ الشَّرِيعَةِ مَعَ الْقُدْرَةِ عَلَى الإِنْكَارِ وَخَاصَّةً فِى هَذَا الزَّمَنِ الَّذِى كَثُرَ فِيهِ الْمُفْسِدُونَ الَّذِينَ يَسُوقُونَ النَّاسَ إِلَى جَهَنَّمَ كَالْمُشَبِّهَةِ الْوَهَّابِيَّةِ أَدْعِيَاءِ السَّلَفِيَّةِ وَجَمَاعَةِ حِزْبِ الإِخْوَانِ جَمَاعَةِ سَيِّد قُطُب وَجَمَاعَةِ حِزْبِ التَّحْرِيرِ وَابْنِ تَيْمِيَةَ وَمُحَمَّدِ بنِ عَبْدِ الْوَهَّابِ وَابْنِ بَازٍ وَابْنِ الْعُثَيْمِين وَسَيِّد قُطُب وَسَيِّد سَابِق وَرَجَب دِيب وَعَلِى جُمْعَة الْمِصْرِىّ وَمُحَمَّد سَعِيد رَمَضَان الْبُوطِى وَالشَّعْرَاوِىِّ الْمِصْرِىِّ وَعَمْرِو خَالِد وَخَالِدٍ الْجُنْدِىِّ وَالْقَرَضَاوِىِّ وَمُحَمَّد رَاتِب النَّابُلُسِىّ.</p>\n<div class=\"qa-item\"><p class=\"question\">(560) مَا حُكْمُ كَتْمِ الْعِلْمِ الدِّينِىِّ الْوَاجِبِ مَعَ وُجُودِ الطَّالِبِ.</p><p class=\"answer\">كَتْمُ الْعِلْمِ الدِّينِىِّ الْوَاجِبِ مَعَ وُجُودِ الطَّالِبِ مَعْصِيَةٌ كَبِيرَةٌ قَالَ رَسُولُ اللَّهِ ﷺ مَنْ سُئِلَ عَنْ عِلْمٍ فَكَتَمَهُ أُلْجِمَ يَوْمَ الْقِيَامَةِ بِلِجَامٍ مِنْ نَارٍ رَوَاهُ الْحَاكِمُ وَابْنُ حِبَّانَ. وَاللِّجَامُ هُوَ كَالَّذِى يُوضَعُ فِى فَمِ الْفَرَسِ لَكِنَّهُ مِنْ نَارٍ. فَيَنْبَغِى لِطَالِبِ الْعِلْمِ الَّذِى أَخَذَ الْعِلْمَ مِنْ أَهْلِهِ أَنْ يَنْشُرَهُ لِقَوْلِهِ ﷺ بَلِّغُوا عَنِّى وَلَوْ ءَايَةً رَوَاهُ الْبُخَارِىُّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(561) ما حُكْمُ الضَّحِكِ لِخُرُوجِ الرِّيحِ مِنْ مُسْلِمٍ.</p><p class=\"answer\">يَحْرُمُ الضَّحِكُ لِخُرُوجِ الرِّيحِ مِنْ مُسْلِمٍ أَوِ الضَّحِكُ عَلَيْهِ اسْتِحْقَارًا لَهُ لِمَا فِيهِ مِنَ الإِيذَاءِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(562) مَا حُكْمُ كَتْمِ الشَّهَادَةِ.</p><p class=\"answer\">يَحْرُمُ كَتْمُ الشَّهَادَةِ بِلا عُذْرٍ بَعْدَ أَنْ دَعَاهُ الْحَاكِمُ إِلَيْهَا وَهُوَ مِنَ الْكَبَائِرِ قَالَ اللَّهُ تَعَالَى ﴿وَمَنْ يَكْتُمْهَا فَإِنَّهُ ءَاثِمٌ قَلْبُهُ﴾.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(563) مَا حُكْمُ الْبَدْءِ بِالسَّلامِ ومَتَى يَكُونُ رَدُّ السَّلامِ فَرْضَ عَيْنٍ.</p><p class=\"answer\">اعْلَمْ أَنَّ الْبَدْءَ بِالسَّلامِ سُنَّةٌ أَمَّا رَدُّ السَّلامِ فَهُوَ فَرْضٌ فَإِذَا سَلَّمَ مُسْلِمٌ غَيْرُ فَاسِقٍ عَلَى مُسْلِمٍ مُعَيَّنٍ فَرَدُّ السَّلامِ عَلَيْهِ فَرْضُ عَيْنٍ أَمَّا لَوْ سَلَّمَ عَلَى جَمَاعَةٍ فَرَدُّ السَّلامِ عَلَيْهِ فَرْضُ كِفَايَةٍ أَىْ يَكْفِى أَنْ يَرُدَّ عَلَيْهِ وَاحِدٌ مِنْهُمْ. أَمَّا مَنْ بَلَغَهُ أَنَّ فُلانًا يُسَلِّمُ عَلَيْهِ فَيَقُولُ وَعَلَيْهِ السَّلامُ وَكَذَلِكَ إِذَا كَتَبَ إِلَيْهِ شَخْصٌ رِسَالَةً سَلَّمَ عَلَيْهِ فِيهَا. أَمَّا إِذَا سَلَّمَ رَجُلٌ أَجْنَبِىٌّ عَلَى مُسْلِمَةٍ وَكَانَتْ وَحْدَهَا فَلا يَجِبُ عَلَيْهَا رَدُّ السَّلامِ عَلَيْهِ وَلا يَجِبُ عَلَى الْمَرْأَةِ أَنْ تَرُدَّ السَّلامَ إِذَا قِيلَ لَهَا فُلَانٌ يُسَلِّمُ عَلَيْكِ وَكَانَ أَجْنَبِيًّا وَكَذَلِكَ إِذَا كَتَبَ إِلَيْهَا رِسَالَةً سَلَّمَ عَلَيْهَا فِيهَا. أَمَّا لَوْ سَلَمَّ رَجُلٌ أَجْنَبِىٌّ عَلَى جَمَاعَةٍ مِنَ النِّسَاءِ فَيَجِبُ رَدُّ السَّلامِ عَلَيْهِ وُجُوبًا كِفَائِيًّا. أَمَّا رَدُّ السَّلامِ عَلَى الطِّفْلِ فَالْقَوْلُ الْمُعْتَمَدُ أَنَّهُ وَاجِبٌ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(564) مَتَى يَحْرُمُ عَلَى الرَّجُلِ تَقْبِيلُ زَوْجَتِهِ بِشَهْوَةٍ.</p><p class=\"answer\">يَحْرُمُ عَلَى الْمُحْرِمِ بِحَجٍّ أَوْ عُمْرَةٍ تَقْبِيلُ زَوْجَتِهِ بِشَهْوَةٍ وَيَحْرُمُ عَلَى الصَّائِمِ صَوْمَ فَرْضٍ تَقْبِيلُ زَوْجَتِهِ بِشَهْوَةٍ إِنْ خَشِىَ إِنْزَالَ الْمَنِىِّ بِسَبَبِ الْقُبْلَةِ وَلا يَبْطُلُ صَوْمُهُ إِنْ لَمْ يُنْزِلْ. وَيَحْرُمُ تَقْبِيلُ الأَجْنَبِيَّةِ وَلَوْ بِلا شَهْوَةٍ وَالأَجْنَبِيَّةُ هِىَ مَنْ سِوَى مَحَارِمِهِ وَزَوْجَتِهِ وَأَمَتِهِ الَّتِى تَحِلُّ لَهُ.</p></div>", "wordCount": 2946, "paraCount": 82}, {"id": "maasi_udhn", "title": "فصل في معاصي الأذن", "icon": "fa-assistive-listening-systems", "desc": "معاصي الأذن من الاستماع إلى المحرمات", "content": "<p>فَصْلٌ فِى مَعَاصِى الأُذُنِ</p>\n<div class=\"qa-item\"><p class=\"question\">(565) مَا حُكْمُ الِاسْتِمَاعِ إِلَى كَلامِ قَوْمٍ أَخْفَوْهُ عَنْهُ.</p><p class=\"answer\">يَحْرُمُ الِاسْتِمَاعُ إِلَى كَلامِ قَوْمٍ يَكْرَهُونَ اطِّلاعَهُ عَلَيْهِ وَهُوَ مِنَ الْكَبَائِرِ لِأَنَّهُ نَوْعٌ مِنَ التَّجَسُّسِ الْمُحَرَّمِ قَالَ رَسُولُ اللَّهِ ﷺ مَنِ اسْتَمَعَ إِلَى حَدِيثِ قَوْمٍ وَهُمْ لَهُ كَارِهُونَ صُبَّ فِى أُذُنَيْهِ الآنُكُ يَوْمَ الْقِيَامَةِ رَوَاهُ الْبُخَارِىُّ. وَالآنُكُ هُوَ الرَّصَاصُ الْمُذَابُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(566) مَا حُكْمُ الِاسْتِمَاعِ إِلَى الْغِيبَةِ وَالنَّمِيمَةِ وَإِلَى سَائِرِ ءَالاتِ اللَّهْوِ الْمُحَرَّمَةِ.</p><p class=\"answer\">يَحْرُمُ الِاسْتِمَاعُ إِلَى الْغِيبَةِ وَالنَّمِيمَةِ وَإِلَى سَائِرِ ءَالاتِ اللَّهْوِ الْمُحَرَّمَةِ كَالْكَمَنْجَةِ وَالْعُودِ وَالطُّنْبُورِ وَالْمِزْمَارِ وَلا يَحْرُمُ الِاسْتِمَاعُ إِلَى الطَّبْلِ وَالدُّفِّ وَالصَّنْجِ وَهِىَ قِطْعَتَانِ مِنْ نُحَاسٍ تُضْرَبُ إِحْدَاهُمَا بِالأُخْرَى قَالَ رَسُولُ اللَّهِ ﷺ لَيَكُونَنَّ فِى أُمَّتِى أُنَاسٌ يَسْتَحِلُّونَ الْحِرَ وَالْحَرِيرَ وَالْخَمْرَ وَالْمَعَازِفَ رَوَاهُ الْبُخَارِىُّ، مَعْنَاهُ يَكُونُ فِى أُمَّتِهِ ﷺ أُنَّاسٌ يَسْتَحِلُّونَ الْفَرْجَ أَىْ يُكْثِرُونَ مِنَ الْوُقُوعِ فِى الزِّنَى وَيَعْزِفُونَ بِآلاتِ اللَّهْوِ الْمُحَرَّمَةِ وَيَلْبَسُ رِجَالُهُمُ الْحَرِيرَ وَهُوَ حَرَامٌ عَلَى الذُّكُورِ</p></div>", "wordCount": 133, "paraCount": 5}, {"id": "maasi_yad", "title": "فصل في معاصي اليدين", "icon": "fa-hand-paper", "desc": "معاصي اليدين من السرقة والضرب والغصب", "content": "<p>فَصْلٌ فِى مَعَاصِى الْيَدَيْنِ</p>\n<div class=\"qa-item\"><p class=\"question\">(567) مَا حُكْمُ التَّطْفِيفِ فِى الْكَيْلِ وَالْوَزْنِ وَالذَّرْعِ.</p><p class=\"answer\">يَحْرُمُ التَّطْفِيفُ فِى الْكَيْلِ وَالْوَزْنِ وَالذَّرْعِ وَهُوَ مِنَ الْكَبَائِرِ وَالتَّطْفِيفُ هُوَ أَنْ يُنْقِصَ الْبَائِعُ مِنْ حَقِّ الْمُشْتَرِى عِنْدَ الْبَيْعِ قَالَ اللَّهُ تَعَالَى ﴿وَيْلٌ لِّلْمُطَفِّفِينَ الَّذِينَ إِذَا اكْتَالُوا عَلَى النَّاسِ يَسْتَوْفُونَ وَإِذَا كَالُوهُمْ أَوْ وَّزَنُوهُمْ يُخْسِرُونَ﴾ أَىْ إِذَا اكْتَالُوا مِنَ النَّاسِ يَسْتَوْفُونَ حُقُوقَهُمْ مِنْهُمْ أَىْ يَأْخُذُونَهَا كَامِلَةً أَمَّا إِذَا كَالُوا لِلنَّاسِ أَوْ وَزَنُوا لَهُمْ فَإِنَّهُمْ يُنْقِصُونَ لَهُمْ فِى الْكَيْلِ أَوِ الْوَزْنِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(568) مَا حُكْمُ السَّرِقَةِ.</p><p class=\"answer\">السَّرِقَةُ حَرَامٌ مِنَ الْكَبَائِرِ وَهِىَ أَخْذُ مَالِ الْغَيْرِ خُفْيَةً بِغَيْرِ حَقٍّ. وَيُحَدُّ السَّارِقُ إِنْ سَرَقَ مَا يُسَاوِى رُبْعَ دِينَارٍ مِنَ الذَّهَبِ الْخَالِصِ مِنْ حِرْزِهِ أَىْ مِنَ الْمَكَانِ الَّذِى يُحْفَظُ فِيهِ عَادَةً بِقَطْعِ يَدِهِ الْيُمْنَى مِنَ الْكُوعِ ثُمَّ إِنْ عَادَ إِلَى السَّرِقَةِ ثَانِيًا فَبِقَطْعِ رِجْلِهِ الْيُسْرَى مِنَ الْكَعْبِ ثُمَّ إِنْ عَادَ ثَالِثًا فَبِقَطْعِ يَدِهِ الْيُسْرَى ثُمَّ إِنْ عَادَ رَابِعًا فَبِقَطْعِ رِجْلِهِ الْيُمْنَى قَالَ رَسُولُ اللَّهِ ﷺ لا تُقْطَعُ يَدُ السَّارِقِ إِلَّا فِى رُبْعِ دِينَارٍ فَصَاعِدًا رَوَاهُ مُسْلِمٌ. وَأَمَّا مَا سُرِقَ مِنْ غَيْرِ حِرْزِهِ فَلا تُقْطَعُ بِهِ يَدُ السَّارِقِ مَعَ كَوْنِهِ حَرَامًا مِنَ الْكَبَائِرِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(569) مَا حُكْمُ النَّهْبِ وَالْغَصْبِ.</p><p class=\"answer\">النَّهْبُ هُوَ أَخْذُ مَالِ الْغَيْرِ جِهَارًا بِغَيْرِ حَقٍّ أَىْ فِى الْعَلَنِ أَمَّا الْغَصْبُ فَهُوَ الِاسْتِيلاءُ عَلَى حَقِّ الْغَيْرِ ظُلْمًا اعْتِمَادًا عَلَى الْقُوَّةِ وَهُمَا مِنَ الْكَبَائِرِ لِقَوْلِهِ ﷺ مَنْ ظَلَمَ قِيدَ شِبْرٍ مِنْ أَرْضٍ طُوِّقَهُ مِنْ سَبْعِ أَرَضِينَ يَوْمَ الْقِيَامَةِ رَوَاهُ الْبُخَارِىُّ، مَعْنَاهُ مَنْ ظَلَمَ بِغَصْبِهِ وَلَوْ قَدْرَ شِبْرٍ مِنْ أَرْضِ غَيْرِهِ تُخْسَفُ بِهِ الأَرْضُ يَوْمَ الْقِيَامَةِ فَتَكُونُ تِلْكَ الْبُقْعَةُ فِى عُنُقِهِ كَالطَّوْقِ مُجَازَاةً لَهُ عَلَى مَعْصِيَتِهِ وَفَضِيحَةً لَهُ يَوْمَ الْقِيَامَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(570) مَا هُوَ الْغُلُولُ.</p><p class=\"answer\">الْغُلُولُ هُوَ الأَخْذُ مِنَ الْغَنِيمَةِ قَبْلَ الْقِسْمَةِ الشَّرْعِيَّةِ وَهُوَ مِنَ الْكَبَائِرِ قَالَ رَسُولُ اللَّهِ ﷺ لا تَغُلُّوا فَإِنَّ الْغُلُولَ نَارٌ وَعَارٌ عَلَى أَصْحَابِهِ فِى الدُّنْيَا وَالآخِرَةِ رَوَاهُ الإِمَامُ أَحْمَدُ وَقَالَ عَلَيْهِ الصَّلاةُ وَالسَّلامُ فِى رَجُلٍ مَاتَ فِى غَزْوَةٍ وَقَدْ غَلَّ إِنَّهُ فِى النَّارِ رَوَاهُ الْبُخَارِىُّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(571) مَا حُكْمُ الْمَكْسِ.</p><p class=\"answer\">الْمَكْسُ مِنَ الْكَبَائِرِ وَهُوَ الضَّرَائِبُ الَّتِى تُؤْخَذُ مِنَ الْمُسْلِمِينَ بِغَيْرِ حَقٍّ قَالَ رَسُولُ اللَّهِ ﷺ لا يَدْخُلُ الْجَنَّةَ صَاحِبُ مَكْسٍ، أَىْ لا يَدْخُلُهَا مَعَ الأَوَّلِينَ إِنَّمَا يَدْخُلُهَا بَعْدَ سَبْقِ عَذَابٍ إِنْ لَمْ يَعْفُ اللَّهُ عَنْهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(572) مَا حُكْمُ قَتْلِ الْمُسْلِمِ عَمْدًا.</p><p class=\"answer\">قَتْلُ الْمُسْلِمِ عَمْدًا بِغَيْرِ حَقٍّ ذَنْبٌ كَبِيرٌ وَهُوَ أَعْظَمُ الذُّنُوبِ بَعْدَ الْكُفْرِ وَيَدُلُّ عَلَى ذَلِكَ مَا رَوَاهُ الْبُخَارِىُّ أَنَّهُ قِيلَ لِرَسُولِ اللَّهِ ﷺ أَىُّ الذَّنْبِ أَشَدُّ قَالَ أَنْ تَجْعَلَ لِلَّهِ نِدًّا وَهُوَ خَلَقَكَ (أَىْ أَنْ تُشْرِكَ بِاللَّهِ) قِيلَ ثُمَّ أَىُّ قَالَ أَنْ تَقْتُلَ وَلَدَكَ مَخَافَةَ الْفَقْرِ قِيلَ ثُمَّ أَىُّ قَالَ أَنْ تُزَانِىَ حَلِيلَةَ جَارِكَ. وَفِى الْقَتْلِ الْعَمْدِ الْقِصَاصُ أَىِ الْقَتْلُ إِلَّا إِذَا عَفَا عَنْهُ الْوَرَثَةُ لِلْقَتِيلِ عَلَى أَنْ يَدْفَعَ الدِّيَةَ أَوْ مَجَّانًا فَلا يُقْتَلُ حِينَئِذٍ. وَالدِّيَةُ هِىَ مِائَةٌ مِنَ الإِبِلِ فِى الذَّكَرِ الْحُرِّ الْمُسْلِمِ وَنِصْفُهَا فِى الأُنْثَى الْحُرَّةِ الْمُسْلِمَةِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(573) مَا حُكْمُ الِانْتِحَارِ.</p><p class=\"answer\">الِانْتِحَارُ ذَنْبٌ كَبِيرٌ فَلا يَجُوزُ لِلإِنْسَانِ أَنْ يَقْتُلَ نَفْسَهُ لِقَوْلِهِ تَعَالَى ﴿وَلا تَقْتُلُوا أَنْفُسَكُمْ﴾ وَقَوْلِهِ ﷺ مَنْ قَتَلَ نَفْسَهُ بِشَىْءٍ عُذِّبَ بِهِ فِى نَارِ جَهَنَّمَ رَوَاهُ الْبُخَارِىُّ. وَلا يُكَفَّرُ مَنْ قَتَلَ نَفْسَهُ إِنْ لَمْ يَعْتَقِدْ أَنَّ ذَلِكَ جَائِزٌ وَهَذَا مَا عَلَيْهِ أَهْلُ السُّنَّةِ وَالْجَمَاعَةِ قَالَ الإِمَامُ أَبُو جَعْفَرٍ الطَّحَاوِىُّ فِى عَقِيدَتِهِ وَلا نُكَفِّرُ أَحَدًا مِنْ أَهْلِ الْقِبْلَةِ بِذَنْبٍ مَا لَمْ يَسْتَحِلَّهُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(574) مَا حُكْمُ ضَرْبِ الْمُسْلِمِ بِغَيْرِ حَقٍّ.</p><p class=\"answer\">يَحْرُمُ ضَرْبُ الْمُسْلِمِ بِغَيْرِ حَقٍّ وَهُوَ مِنَ الْكَبَائِرِ لِقَوْلِهِ ﷺ إِنَّ اللَّهَ يُعَذِّبُ الَّذِينَ يُعَذِّبُونَ النَّاسَ فِى الدُّنْيَا رَوَاهُ مُسْلِمٌ. وَيَحْرُمُ ضَرْبُ الْمُسْلِمِ عَلَى وَجْهِهِ وَتَرْوِيعُهُ وَالإِشَارَةُ إِلَيْهِ بِنَحْوِ سِلاحٍ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(575) مَا حُكْمُ أَخْذِ الرِّشْوَةِ وَإِعْطَائِهَا.</p><p class=\"answer\">يَحْرُمُ أَخْذُ الرِّشْوَةِ وَإِعْطَاؤُهَا وَهُوَ مِنَ الْكَبَائِرِ. وَالرِّشْوَةُ هِىَ مَا يُعْطَى لِإِبْطَالِ حَقٍّ أَوْ لِإِحْقَاقِ بَاطِلٍ أَىْ لِمَنْعِ صَاحِبِ الْحَقِّ مِنْ تَحْصِيلِ حَقِّهِ أَوْ لِلتَّوَصُّلِ إِلَى كَسْبِ وَتَحْصِيلِ مَا لا يَسْتَحِقُّهُ. وَيَجُوزُ دَفْعُ الرِّشْوَةِ لِدَفْعِ الظُّلْمِ عَنْ نَفْسِهِ أَوْ لِتَحْصِيلِ حَقِّهِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(576) مَا حُكْمُ إِحْرَاقِ الْحَيَوَانِ بِالنَّارِ.</p><p class=\"answer\">إِحْرَاقُ الْحَيَوَانِ بِالنَّارِ وَهُوَ حَىٌّ مِنَ الْكَبَائِرِ أَمَّا إِذَا ءَاذَى وَلا يَسْتَطِيعُ الإِنْسَانُ التَّخَلُّصَ مِنْ أَذَاهُ إِلَّا بِالْحَرْقِ فَيَجُوزُ حِينَئِذٍ قَالَ رَسُولُ اللَّهِ ﷺ لا يُعَذِّبُ بِالنَّارِ إِلَّا رَبُّهَا رَوَاهُ أَبُو دَاوُدَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(577) مَا حُكْمُ الْمُثْلَةِ بِالْحَيَوَانِ.</p><p class=\"answer\">يَحْرُمُ الْمُثْلَةُ بِالْحَيَوَانِ أَىْ تَقْطِيعُ أَجْزَائهِ كَأَنْفِهِ أَوْ أُذُنِهِ وَهُوَ حَىٌّ لِأَنَّ فِى ذَلِكَ تَعْذِيبًا لَهُ. وَيَحْرُمُ غَرْزُ الدُّودَةِ وَهِىَ حَيَّةٌ بِنَحْوِ إِبْرَةٍ لِيُصَادَ بِهَا السَّمَكُ وَصَعْقُ الدَّجَاجِ بِالْكَهْرُبَاءِ قَبْلَ ذَبْحِهِ لِأَنَّ فِى ذَلِكَ تَعْذِيبًا لَهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(578) مَا حُكْمُ اللَّعِبِ بِالنَّرْدِ وَالشِّطْرَنْجِ.</p><p class=\"answer\">يَحْرُمُ اللَّعِبُ بِالنَّرْدِ وَيَجُوزُ اللَّعِبُ بِالشِّطْرَنْجِ. أَمَّا اللَّعِبُ بِالأَوْرَاقِ الْمُزَوَّقَةِ الْمَعْرُوفَةِ فِى بَعْضِ الْبِلادِ بِوَرَقِ الشَّدَّةِ فَحَرَامٌ وَكَذَا كُلُّ لُعْبَةٍ كَانَ الِاعْتِمَادُ فِى لَعِبِهَا عَلَى الْحَزْرِ وَالتَّخْمِينِ لا عَلَى الْفِكْرِ وَالْحِسَابِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(579) مَا حُكْمُ اللَّعِبِ بِمَا فِيهِ قِمَارٌ.</p><p class=\"answer\">يَحْرُمُ اللَّعِبُ بِكُلِّ مَا فِيهِ قِمَارٌ وَهُوَ كَأَنْ يَتَّفِقَ اثْنَانِ عَلَى أَنْ يُخْرِجَ كُلٌّ مِنْهُمَا مَبْلَغًا مِنَ الْمَالِ يَأْخُذُهُ الرَّابِحُ مِنْهُمَا. وَالْقِمَارُ مِنَ الْكَبَائِرِ قَالَ اللَّهُ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا إِنَّمَا الْخَمْرُ وَالْمَيْسِرُ وَالأَنْصَابُ وَالأَزْلامُ رِجْسٌ مِّنْ عَمَلِ الشَّيْطَانِ فَاجْتَنِبُوهُ﴾ وَالْمَيْسِرُ هُوَ الْقِمَارُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(580) مَا حُكْمُ اللَّعِبِ بِآلاتِ اللَّهْوِ الْمُحَرَّمَةِ.</p><p class=\"answer\">يَحْرُمُ اللَّعِبُ بِآلاتِ اللَّهْوِ الْمُحَرَّمَةِ كَالْكَمَنْجَةِ وَالطُّنْبُورِ وَالْمِزْمَارِ لِحَدِيثِ لَيَكُونَنَّ فِى أُمَّتِى أُنَاسٌ يَسْتَحِلُّونَ الْحِرَ وَالْحَرِيرَ وَالْخَمْرَ وَالْمَعَازِفَ رَوَاهُ الْبُخَارِىُّ. وَالْمَعَازِفُ هِىَ ءَالاتُ اللَّهْوِ الَّتِى يُعْزَفُ عَلَيْهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(581) مَا حُكْمُ لَمْسِ الرَّجُلِ لِلْمَرْأَةِ الأَجْنَبِيَّةِ.</p><p class=\"answer\">يَحْرُمُ عَلَى الرَّجُلِ بِالإِجْمَاعِ لَمْسُ الْمَرْأَةِ الأَجْنَبِيَّةِ عَمْدًا بِغَيْرِ حَائِلٍ وَلَوْ بِلا شَهْوَةٍ قَالَ رَسُولُ اللَّهِ ﷺ لَأَنْ يُطْعَنَ أَحَدُكُمْ بِحَدِيدَةٍ فِى رَأْسِهِ خَيْرٌ لَهُ مِنْ أَنْ يَمَسَّ امْرَأَةً لا تَحِلُّ لَهُ رَوَاهُ الطَّبَرَانِىُّ وَقَالَ ﷺ إِنِّى لا أُصَافِحُ النِّسَاءَ رَوَاهُ الْبَيْهَقِىُّ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(582) مَا حُكْمُ مُصَافَحَةِ الرَّجُلِ الأَجْنَبِىِّ لِلْمُرَاهِقَةِ وَالصَّبِيَّةِ بِلا حَائِلٍ.</p><p class=\"answer\">يَحْرُمُ عَلَى الرَّجُلِ الأَجْنَبِىِّ مُصَافَحَةُ الْمُرَاهِقَةِ بِلا حَائِلٍ وَيَحْرُمُ عَلَيْهِ مُصَافَحَةُ الصَّبِيَّةِ إِنْ كَانَتْ تُشْتَهَى. وَالْمُرَاهِقَةُ هِىَ الَّتِى قَارَبَتِ الْبُلُوغَ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(583) مَا حُكْمُ مُصَافَحَةِ الْمَرْأَةِ الأَجْنَبِيَّةِ لِلْمُرَاهِقِ وَالصَّبِىِّ بِلا حَائِلٍ.</p><p class=\"answer\">يَحْرُمُ عَلَى الأَجْنَبِيَّةِ مُصَافَحَةُ الْمُرَاهِقِ وَالصَّبِىِّ الَّذِى بَلَغَ حَدًّا يُشْتَهَى فِيهِ بِالنِّسْبَةِ لِأَهْلِ الطِّبَاعِ السَّلِيمَةِ. وَالْمُرَاهِقُ هُوَ مَنْ قَارَبَ الْبُلُوغَ كَابْنِ ثَلاثَ عَشْرَةَ سَنَةً.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(584) مَا حُكْمُ تَصْوِيرِ ذِى رُوحٍ.</p><p class=\"answer\">يَحْرُمُ تَصْوِيرُ ذِى رُوحٍ وَلَوْ بِهَيْئَةٍ لا يَعِيشُ بِهَا الْحَيَوَانُ كَصُنْعِ تِمْثَالٍ لِإِنْسَانٍ أَوْ بَهِيمَةٍ فَقَدْ وَرَدَ فِى الْحَدِيثِ أَنَّ رَسُولَ اللَّهِ ﷺ لَعَنَ الْمُصَوِّرِينَ رَوَاهُ الْبُخَارِىُّ. فَمَنْ صَنَعَ تِمْثَالًا لِإِنْسَانٍ أَوْ بَهِيمَةٍ لِيَتَّخِذَهُ النَّاسُ صَنَمًا يَعْبُدُونَهُ مِنْ دُونِ اللَّهِ فَهُوَ كَافِرٌ لِأَنَّ الإِعَانَةَ عَلَى الْكُفْرِ كُفْرٌ أَمَّا لَوْ صَنَعَ تِمْثَالًا لا لِلْعِبَادَةِ فَعَلَيْهِ ذَنْبٌ كَبِيرٌ. وَيَحْرُمُ اسْتِبْقَاءُ صُورَةِ الْحَيَوَانِ إِنْ كَانَتْ بِهَيْئَةٍ يَعِيشُ بِهَا الْحَيَوَانُ وَوُجُودُهَا فِى الْبَيْتِ يَمْنَعُ دُخُولَ مَلائِكَةِ الرَّحْمَةِ الَّذِينَ يَأْتُونَ بِالنَّفَحَاتِ لِعِبَادِ اللَّهِ لِيَنْفَعُوهُمْ بِأَشْيَاءَ بِإِذْنِ اللَّهِ. أَمَّا اقْتِنَاءُ الصُّورَةِ الَّتِى لَيْسَتْ بِهَيْئَةٍ يَعِيشُ بِهَا الْحَيَوَانُ فَيَجُوزُ. وَمَعَ كَوْنِ اتِّخَاذِهَا جَائِزًا لا يَجُوزُ لِلشَّخْصِ أَنْ يَبِيعَ وَيَشْتَرِىَ الصُّوَرَ أَىْ صُوَرَ بَنِى ءَادَمَ وَالْبَهَائِمِ وَلَوْ كَانَتْ بِهَيْئَةٍ لا يَعِيشُ عَلَيْهَا الْحَيَوَانُ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(585) مَا حُكْمُ مَنْعِ الزَّكَاةِ بَعْدَ وُجُوبِهَا.</p><p class=\"answer\">مَنْعُ الزَّكَاةِ بَعْدَ وُجُوبِهَا وَكَذَا تَأْخِيرُ دَفْعِهَا بَعْدَ وَقْتِ الْوُجُوبِ وَالتَّمَكُّنِ وَإِعْطَاؤُهَا مَنْ لا يَسْتَحِقُّهَا حَرَامٌ مِنَ الْكَبَائِرِ. فَمَنْ وَجَبَتْ عَلَيْهِ الزَّكَاةُ وَتَمَكَّنَ مِنْ إِخْرَاجِهَا لا يَجُوزُ لَهُ أَنْ يُؤَخِّرَ دَفْعَ الزَّكَاةِ إِلَّا لِعُذْرٍ كَأَنْ كَانَ يَنْتَظِرُ الأَقْرَبَ نَسَبًا أَوِ الأَشَدَّ فَقْرًا أَوِ الأَتْقَى. وَلا يَجُوزُ إِعْطَاءُ مَالِ الزَّكَاةِ لِمَنْ لا يَسْتَحِقُّهَا كَغَنِىٍّ أَوْ مَنْسُوبٍ لِلرَّسُولِ ﷺ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(586) مَا حُكْمُ مَنْعِ الأَجِيرِ أُجْرَتَهُ.</p><p class=\"answer\">مَنِ اسْتَأْجَرَ أَجِيرًا فَمَنَعَهُ أُجْرَتَهُ وَقَعَ فِى ذَنْبٍ كَبِيرٍ قَالَ رَسُولُ اللَّهِ ﷺ أَعْطُوا الأَجِيرَ أَجْرَهُ قَبْلَ أَنْ يَجِفَّ عَرَقُهُ رَوَاهُ ابْنُ مَاجَهْ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(587) بَيِّنْ مَا يَحْرُمُ كِتَابَتُهُ.</p><p class=\"answer\">يَحْرُمُ كِتَابَةُ مَا يَحْرُمُ النُّطْقُ بِهِ مِنْ غِيبَةٍ وَغَيْرِهَا قَالَ الْغَزَالِىُّ لِأَنَّ الْقَلَمَ أَحَدُ اللِّسَانَيْنِ فَاحْفَظْهُ عَمَّا يَجِبُ حِفْظُ اللِّسَانِ مِنْهُ مِنْ غِيبَةٍ وَغَيْرِهَا فَلا يُكْتَبُ بِهِ مَا يَحْرُمُ النُّطْقُ بِهِ. وَمِثْلُ الْقَلَمِ فِى ذَلِكَ سَائِرُ أَدَوَاتِ الْكِتَابَةِ مِنْ ءَالاتِ طِبَاعَةٍ وَحَاسُوبٍ وَنَحْوِهَا.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(588) مَا هِىَ الْخِيَانَةُ.</p><p class=\"answer\">الْخِيَانَةُ ضِدُّ النَّصِيحَةِ وَقَدْ تَكُونُ بِالْفِعْلِ كَأَكْلِ الأَمَانَةِ أَوْ بِالْقَوْلِ كَجَحْدِ الأَمَانَةِ أَوْ بِالْحَالِ كَمَنْ يُوهِمُ النَّاسَ أَنَّهُ مِنْ أَهْلِ الأَمَانَةِ وَهُوَ لَيْسَ كَذَلِكَ. وَالأَمَانَةُ فِى الْعِلْمِ أَىْ عِلْمِ الدِّينِ أَهَمُّ مِنَ الأَمَانَةِ فِى الْمَالِ لِأَنَّ الْعِلْمَ أَهَمُّ مِنَ الْمَالِ وَضَرَرَ الْخِيَانَةِ فِى الْعِلْمِ أَعْظَمُ مِنْ ضَرَرِ الْخِيَانَةِ فِى الْمَالِ فَيَنْبَغِى لِلإِنْسَانِ أَنْ لا يَتَسَرَّعَ فِى الإِجَابَةِ وَأَنْ لا يُفْتِىَ بِغَيْرِ عِلْمٍ فَالإِفْتَاءُ بِغَيْرِ عِلْمٍ حَرَامٌ مِنَ الْكَبَائِرِ.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(589) مَا حُكْمُ مَنْعِ الْمُضْطَرِّ مَا يَسُدُّهُ.</p><p class=\"answer\">يَحْرُمُ مَنْعُ الْمُضْطَرِّ مَا يَسُدُّ حَاجَتَهُ بِلا عُذْرٍ وَهُوَ مِنَ الْكَبَائِرِ وَالْمُرَادُ بِالْمُضْطَرِّ مَنِ اضْطُرَّ لِطَعَامٍ أَوْ شَرَابٍ أَوْ كِسْوَةٍ يَدْفَعُ بِهَا الْهَلاكَ عَنْ نَفْسِهِ.</p></div>", "wordCount": 1255, "paraCount": 47}, {"id": "maasi_farj", "title": "فصل في معاصي الفرج", "icon": "fa-ban", "desc": "معاصي الفرج من الزنا واللواط والاستمناء", "content": "<p>فَصْلٌ فِى مَعَاصِى الْفَرْجِ</p>\n<div class=\"qa-item\"><p class=\"question\">(590) مَا هُوَ الزِّنَى وَمَا حُكْمُهُ.</p><p class=\"answer\">الزِّنَى مِنْ مَعَاصِى الْفَرْجِ لِقَوْلِهِ تَعَالَى ﴿وَلا تَقْرَبُوا الزِّنَى إِنَّهُ كَانَ فَاحِشَةً وَسَاءَ سَبِيلًا﴾ وَهُوَ إِدْخَالُ الْحَشَفَةِ أَىْ رَأْسِ الذَّكَرِ فِى فَرْجِ امْرَأَةٍ لا تَحِلُّ لَهُ. وَالزِّنَى مِنْ أَكْبَرِ الْكَبَائِرِ وَهُوَ بَعْدَ الْكُفْرِ وَقَتْلِ النَّفْسِ الْمُؤْمِنَةِ الَّتِى حَرَّمَ اللَّهُ. وَيُحَدُّ أَىْ يُعَاقَبُ الْحُرُّ الْمُكَلَّفُ الْمُحْصَنُ أَىِ الَّذِى جَامَعَ فِى نِكَاحٍ صَحِيحٍ ذَكَرًا كَانَ أَوْ أُنْثَى إِذَا زَنَى بِالرَّجْمِ بِالْحِجَارَةِ الْمُعْتَدِلَةِ حَتَّى يَمُوتَ وَيُحَدُّ غَيْرُ الْمُحْصَنِ بِمِائَةِ جَلْدَةٍ بِالسَّوْطِ الْمُعْتَدِلِ وَتَغْرِيبِ عَامٍ إِلَى مَسَافَةِ قَصْرٍ مِنْ مَحَلِّ الزِّنَى.</p></div>\n<div class=\"qa-item\"><p class=\"question\">(591) مَا حُكْمُ اللِّوَاطِ.</p><p class=\"answer\">اللِّوَاطُ مِنَ الْكَبَائِرِ لِقَوْلِهِ ﷺ لَعَنَ اللَّهُ مَنْ أَتَى امْرَأَةً فِى دُبُرِهَا رَوَاهُ الإِمَامُ أَحْمَدُ. أَمَّا جِمَاعُ الزَّوْجَةِ فِى دُبُرِهَا فَهُوَ حَرَامٌ ل
